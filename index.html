<!doctype html>
<html lang="ru">
<head>

  <script>
    window.appInitializationStartedAt = performance.now();
    document.documentElement.classList.add('preloading');

  <script src="theme.js?v=1"></script>
  <link rel="stylesheet" href="styles.css?v=12">

<body>
  <div class="preloader" id="preloader" role="status" aria-live="polite" aria-busy="true">

    <span class="preloader-label" id="preloaderLabel">Загружаем энциклопедию…</span>

      <h1>Не удалось загрузить энциклопедию</h1>
      <p>Проверьте подключение к интернету и попробуйте ещё раз.</p>
      <button id="preloaderRetry" type="button">Повторить загрузку</button>
    </div>
  </div>
  <noscript><p class="empty">Для загрузки энциклопедии включите JavaScript в браузере.</p></noscript>
  <div id="siteContent">
  <header class="site-header">
    <a class="brand" href="#/" aria-label="На главную">

      <span>Энциклопедия сущностей</span>
    </a>
    <nav class="header-nav" aria-label="Основная навигация">
      <a href="#/about">О проекте</a>
      <button class="theme-button" id="themeToggle" type="button" aria-label="Тёмная тема" aria-pressed="false" title="Тёмная тема" hidden>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>

      <button class="search-button" id="searchToggle" type="button" aria-label="Открыть поиск">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </button>
      <button class="menu-button" id="menuToggle" type="button" aria-label="Открыть разделы" aria-expanded="false"><span></span><span></span><span></span></button>
    </nav>
  </header>

  <div class="search-panel" id="searchPanel" hidden>
    <label for="searchInput">Поиск по энциклопедии</label>
    <div class="search-row"><input id="searchInput" type="search" placeholder="Название сущности или произведения…" autocomplete="off"><button id="searchClose" type="button" aria-label="Закрыть поиск">×</button></div>
  </div>

  <main class="page" id="app" tabindex="-1"></main>

  <div class="menu-backdrop" id="menuBackdrop" hidden></div>
  <aside class="section-menu" id="sectionMenu" aria-labelledby="sectionMenuTitle" aria-hidden="true">

  <footer class="site-footer">
