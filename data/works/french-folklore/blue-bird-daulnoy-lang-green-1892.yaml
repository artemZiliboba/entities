id: blue-bird-daulnoy-lang-green-1892
title: "Синяя птица"
original_title: "The Blue Bird (L’Oiseau bleu)"
kind: folktale
tradition:
  - french-folklore
collection: "The Green Fairy Book"
author: "Мари-Катрин д’Онуа; английская адаптация в сборнике Эндрю Лэнга (1892)"
source:
  title: "The Green Fairy Book (1892), The Blue Bird, pp. 1–26, after Madame d’Aulnoy"
  url: "https://en.wikisource.org/wiki/The_Green_Fairy_Book/The_Blue_Bird"
  note: "Прочитан полный текст сказки в английской адаптации сборника Лэнга, страницы 1–26. Не смешивались более длинные французские редакции L’Oiseau bleu и иные переводы."
entities:
  - id: fairy-mazilla
    name: "Фея Мазилла"
    type: character
    description: >-
      Крёстная Туррителлы, могущественная фея, которая обездвиживает короля Шармана и превращает его на семь лет в синюю птицу за отказ жениться на её подопечной. Позже жезлом временно возвращает ему человеческий облик и угрожает вновь наложить чары.
  - id: king-charming-blue-bird
    name: "Король Шарман — Синяя птица"
    type: character
    description: >-
      Король, превращённый феей Мазиллой в синюю птицу на семь лет. Сохраняет человеческую речь и память, летает к окну заключённой Фьорделизы и приносит ей драгоценности. После ранения его лечит друг-чародей, а впоследствии Мазилла возвращает ему человеческий вид.
  - id: friendly-enchanter
    name: "Чародей — друг короля Шармана"
    type: character
    description: >-
      Волшебник, владеющий колесницей с летающими лягушками, способный восемь раз облететь мир в поисках короля. Исцеляет раненую Синюю птицу травами и заклинаниями, договаривается с Мазиллой о временном снятии превращения, а в финале вместе с доброй феей превращает Туррителлу в сову.
  - id: helpful-fairy
    name: "Добрая фея — сестра Мазиллы"
    type: character
    description: >-
      Фея, которая встречает Фьорделизу под видом старушки, затем становится высокой молодой женщиной. Сообщает ей о судьбе короля и дарит четыре яйца, каждое из которых открывает средство помощи. В финале соединяет силы с чародеем, лишая Мазиллу возможности снова заколдовать Шармана.
  - id: flying-frog-chariot
    name: "Колесница с летающими лягушками"
    type: artifact
    description: >-
      Колесница, принадлежащая другу-чародею короля и запряжённая летающими лягушками. Лягушки знают карту всего мира и быстро доставляют Шармана с Туррителлой в замок Мазиллы. Волшебный транспорт рассматривается как единый комплекс.
  - id: blue-bird-transformation
    name: "Семилетнее превращение в Синюю птицу"
    type: spell
    description: >-
      Заклятие Мазиллы, меняющее тело короля Шармана на птицу с синими перьями, сохраняя его человеческую речь и сознание. Изначально срок составляет семь лет; позже фея снимает чары условно, угрожая восстановить их, если король не женится на Туррителле.
  - id: healing-herbs
    name: "Целебные травы чародея"
    type: plant
    description: >-
      Магические травы, собранные другом короля в лесу после того, как Синяя птица тяжело поранилась о развешанные на дереве ножи. Вместе с произнесёнными чародеем заклинаниями они быстро исцеляют раненого короля; действие трав отдельно от заклинаний не уточняется.
  - id: four-magic-eggs
    name: "Четыре волшебных яйца"
    type: artifact
    description: >-
      Четыре яйца, подаренные доброй феей Фьорделизе. Каждое раскрывается в момент затруднения: из первого появляются золотые крючки для подъёма, из второго — голубиная колесница, из третьего — миниатюрный экипаж с мышами, из четвёртого — пирог с живыми говорящими птицами. Моделируются как единый комплект даров.
  - id: enchanted-valley-mirror
    name: "Волшебное зеркало долины"
    type: artifact
    description: >-
      Огромная зеркальная поверхность, покрывающая склон и долину у горы из полированной слоновой кости. Каждый смотрящий видит себя не таким, каков он есть, а таким, каким желает выглядеть; сюда приходят люди со всех сторон света.
  - id: dove-chariot
    name: "Колесница с двумя белыми голубками"
    type: artifact
    description: >-
      Чудесная колесница, возникшая из второго подаренного феей яйца. Её несут две белые голубки; экипаж переносит Фьорделизу через непроходимый зеркальный склон к воротам королевства Шармана за день и ночь.
  - id: mouse-miniature-carriage
    name: "Миниатюрная колесница с мышами"
    type: artifact
    description: >-
      Маленькая стальная карета с золотыми украшениями, появившаяся из третьего яйца. Её тянут шесть зелёных мышей, розовая крыса служит кучером, серая — форейтором, а внутри едут крошечные танцующие фигурки. Фьорделиза отдаёт чудесный экипаж Туррителле за ночь в Палате эха.
  - id: living-bird-pie
    name: "Пирог с шестью живыми птицами"
    type: artifact
    description: >-
      Пирог, возникший из четвёртого яйца. Шесть птиц в нём приготовлены, но остаются живыми: поют, разговаривают, отвечают на вопросы и предсказывают судьбу. Фьорделиза обменивает его на последнюю ночь в Палате эха.
  - id: turritella-owl-curse
    name: "Превращение Туррителлы в сову"
    type: spell
    description: >-
      В финале сказки друг-чародей Шармана и добрая фея совместно превращают Туррителлу в большую бурую сову, когда та пытается помешать воссоединению влюблённых. Сова вылетает из окна дворца; дальнейшая судьба не описана.
  - id: flying-dragon
    name: "Летающий дракон Мазиллы"
    type: creature
    description: >-
      Дракон, на котором фея Мазилла вместе с Туррителлой летит в королевский дворец, чтобы закрепить договор о женитьбе. Сказка подтверждает его способность к полёту, но не описывает огненного дыхания или других способностей.
