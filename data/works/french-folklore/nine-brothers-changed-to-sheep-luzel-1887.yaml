id: nine-brothers-changed-to-sheep-luzel-1887
title: "Девять братьев, превращённых в овец, и их сестра"
original_title: "The Nine Brothers, Who Were Changed to Sheep, and Their Sister"
kind: folktale
tradition:
  - french-folklore
author: "Франсуа-Мари Люзель (François-Marie Luzel), запись со слов Le Noac'h"
collection: "Fairy Legends of the French Provinces (Martha Ward Carey, trans., 1887), pages 117–126"
source:
  title: "The Nine Brothers, Who Were Changed to Sheep, and Their Sister — Fairy Legends of the French Provinces"
  url: "https://www.gutenberg.org/cache/epub/79327/pg79327-images.html"
  note: >-
    Полный текст бретонской сказки, страницы 117–126, в переводе
    Марты Уорд Кэри (1887). В конце указано: рассказано Le Noac'h
    из Gourin в Merville, близ Lorient, 10 марта 1874 года;
    записано Ф.-М. Люзелем. Выбрана именно эта версия о девяти
    братьях и их сестре Lévénez. Сходные сказки о братьях,
    превращённых в животных, и другие варианты не смешивались.
entities:
  - id: old-sorceress-nine-sheep
    name: "Старая колдунья"
    type: character
    description: >-
      Старуха, живущая в лесной хижине и обладающая силой
      разрушать здания и превращать людей в животных.
      Она пытается принудить старшего из девяти братьев,
      Гульвена, жениться на ней. Получив отказ, направляет
      волшебный жезл на замок, разрушает его и превращает
      всех девятерых братьев в белых овец. Позднее выясняется,
      что она также мать служанки, которая пытается погубить
      Левенез.
    tags:
      - sorceress
      - transformation
      - curse
  - id: sorceress-magic-wand
    name: "Волшебный жезл колдуньи"
    type: artifact
    description: >-
      Жезл, с помощью которого старая колдунья творит
      разрушительные чары. Направив его на замок, она
      мгновенно уничтожает здание и превращает окружающие
      сады и лес в пустынную равнину; затем произносит
      магическую формулу и превращает девять братьев
      в белых овец. Отдельные свойства жезла не описаны,
      но он служит непосредственным орудием обоих
      превращений и разрушения.
    tags:
      - wand
      - transformation
      - destruction
  - id: nine-white-sheep-brothers
    name: "Девять белых овец — братья Леvenез"
    type: animal
    description: >-
      Девять братьев, превращённых колдуньей в белых овец
      после отказа старшего брата Гульвена жениться на ней.
      Они сохраняют человеческое понимание и привязанность
      к сестре, слушают её песни и молитвы. После того как
      Гульвен освобождается от чар во время крещения сына
      Леvenез, священник кладёт на каждую овцу свою епитрахиль,
      произносит молитву, и братья возвращаются к человеческому
      облику.
    tags:
      - transformed-humans
      - enchanted-animals
      - transformation
