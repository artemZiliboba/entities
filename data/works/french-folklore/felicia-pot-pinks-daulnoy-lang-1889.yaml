id: felicia-pot-pinks-daulnoy-lang-1889
title: "Фелисия и горшок с гвоздиками"
original_title: "Felicia and the Pot of Pinks"
kind: folktale
tradition:
  - french-folklore
author: "Мари-Катрин д’Онуа"
collection: "The Blue Fairy Book (edited by Andrew Lang, 1889)"
source:
  title: "Felicia and the Pot of Pinks, The Blue Fairy Book (1889), Project Gutenberg #503"
  url: "https://www.gutenberg.org/files/503/503-h/503-h.htm"
  note: "Прочитан полный самостоятельный текст FELICIA AND THE POT OF PINKS, строки 1592–1706 в HTML Project Gutenberg №503, редакция The Blue Fairy Book (1889), редактор Эндрю Лэнг. В конце указан источник Fortunée мадам д’Онуа. Другие редакции не смешивались."
entities:
  - id: queen-of-the-woods
    name: "Королева лесов — фея, покровительница Фелисии"
    type: character
    description: >
      Сестра матери Фелисии и мать принца Гвоздики. Является девушке у источника, превращает её кувшин в золотой, инкрустированный камнями, и дарит ароматную воду. Ранее превратила няню Фелисии в курицу, а двадцать пять королевских стражников — в кочаны капусты. В конце снимает эти чары, превращает хижину в дворец и меняет нрав Бруно прикосновением волшебной палочки.
    tags:
      - fairy
      - transformation
  - id: hostile-fairy
    name: "Враждебная фея, заколдовавшая принца Гвоздику"
    type: character
    description: >
      Соперница Королевы лесов, превратившая её сына в цветок гвоздики, пока зефиры оставили ребёнка в цветнике. Позднее посылает полчище крыс, чтобы помешать Фелисии вернуть горшок с гвоздиками и разрушить чары. В конце её замысел не удаётся.
    tags:
      - fairy
      - curse
  - id: enchanted-prince-pink
    name: "Заколдованный принц Гвоздика"
    type: character
    description: >
      Сын Королевы лесов, превращённый в цветок гвоздики другой феей. В цветочном облике остаётся в горшке у Фелисии и, когда чары ослабевают, обращается к ней голосом из листьев. Забота девушки о цветах и её поступки приводят к освобождению принца, который возвращает человеческий облик.
    tags:
      - enchanted-person
      - plant-transformation
  - id: enchanted-nurse-hen
    name: "Заколдованная няня-курица"
    type: animal
    description: >
      Жена воспитавшего Фелисию работника, превращённая Королевой лесов в курицу за разглашение тайны происхождения девочки. На время действия чар живёт при доме Бруно. Получив способность говорить, раскрывает Фелисии её происхождение и рассказывает о других превращениях. В финале фея возвращает ей человеческий облик.
    tags:
      - enchanted-person
      - animal-transformation
  - id: enchanted-royal-guards-cabbages
    name: "Двадцать пять стражников, превращённых в капусту"
    type: creature
    description: >
      Королевские стражники, посланные разыскать младенца Фелисию, превращены Королевой лесов в двадцать пять кочанов капусты. Один из них, подменённый Бруно вместо горшка с гвоздиками, разговаривает с Фелисией и сообщает, где спрятаны цветы. В финале фея возвращает всем человеческий облик.
    tags:
      - enchanted-persons
      - plant-transformation
  - id: zephyr-messengers
    name: "Зефиры, переносившие младенца-принца"
    type: creature
    description: >
      Воздушные духи, которым Королева лесов поручила доставить своего сына к заточённой в башне королеве для обмена детьми. По дороге они оставили младенца в цветнике и улетели сообщить о прибытии, чем воспользовалась враждебная фея, превратившая ребёнка в гвоздику.
    tags:
      - wind-spirits
      - messengers
