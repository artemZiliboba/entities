id: little-soldier-deulin-crane-1892
title: "Маленький солдат"
original_title: "The Little Soldier"
kind: folktale
tradition:
  - french-folklore
author: "Шарль Дёлен (Charles Deulin)"
collection: "The Green Fairy Book (edited by Andrew Lang, 1892), pages 157–174"
source:
  title: "The Little Soldier — The Green Fairy Book, Wikisource transcription"
  url: "https://en.wikisource.org/wiki/The_Green_Fairy_Book/The_Little_Soldier"
  note: >-
    Полный текст рассказа Шарля Дёлена «The Little Soldier»,
    страницы 157–174 из The Green Fairy Book под редакцией
    Эндрю Лэнга (1892), прочитан по транскрипции Wikisource.
    Источник обозначает автора в конце текста; это французская
    сказочная история в английском переводе/редакции сборника.
    Учтён только данный рассказ, без смешения с другими
    сказками Дёлена и соседними главами сборника.
entities:
  - id: ludovine-serpent-princess
    name: "Людовина — принцесса-змея"
    type: character
    description: >-
      Дочь короля Нижних Земель, превращённая в огромную змею
      с женской головой. Проклятие связано с её и отцовской
      нечестностью; снять его может маленький солдат, который
      должен добыть для неё три части одежды из комнат,
      охраняемых сверхъестественными стражами. После
      освобождения Людовина вновь становится женщиной,
      но продолжает использовать магические средства,
      чтобы усыплять солдата и обманывать его.
    tags:
      - transformation
      - cursed-princess
      - serpent
  - id: invisible-hands-castle-guardians
    name: "Восемь невидимых рук"
    type: creature
    description: >-
      Восемь рук без видимых тел, которые охраняют первую
      комнату замка Людовины. Они угрожают солдату и наносят
      ему удары, пока он пробирается к шкафу за туникой.
      Их присутствие сверхъестественно: руки видны и действуют,
      но тел, которым они могли бы принадлежать, обнаружить
      невозможно.
    tags:
      - supernatural-guardians
      - disembodied-hands
  - id: club-wielding-invisible-arms
    name: "Восемь невидимых рук с дубинами"
    type: creature
    description: >-
      Восемь отдельных рук, каждая из которых держит огромную
      палку. Они нападают на маленького солдата во второй
      комнате замка, когда тот отправляется за юбкой Людовины.
      Солдат отбивается от них мечом и возвращается с одеждой.
    tags:
      - supernatural-guardians
      - disembodied-arms
  - id: castle-goblins
    name: "Восемь гоблинов замка"
    type: creature
    description: >-
      Восемь вооружённых молотами гоблинов с пламенем,
      исходящим из глаз. Они охраняют последнюю комнату,
      где хранятся туфли и чулки Людовины. Солдат побеждает
      их, сорвав с петель тяжёлую дубовую дверь и обрушив
      её на стражей.
    tags:
      - goblins
      - supernatural-guardians
  - id: teleporting-red-mantle
    name: "Красный плащ мгновенного перемещения"
    type: artifact
    description: >-
      Красный плащ, найденный рыбачкой в запаянном медном
      сосуде. Обладатель может мгновенно переноситься туда,
      куда пожелает, достаточно завернуться в плащ и
      произнести желание. Маленький солдат использует его,
      чтобы переместиться в столицу Нижних Земель, попасть
      в покои Людовины и позднее похитить её из дворца.
    tags:
      - teleportation
      - magical-cloak
  - id: inexhaustible-purse-little-soldier
    name: "Неиссякаемый кошелёк маленького солдата"
    type: artifact
    description: >-
      Кошелёк, найденный вместе с красным плащом в медном
      сосуде. Сколько бы денег из него ни доставали, внутри
      вновь оказывается та же сумма — пятьдесят крон.
      Благодаря этому свойству солдат может тратить деньги
      и проигрывать их королю, не теряя содержимого кошелька.
    tags:
      - inexhaustible
      - magical-purse
  - id: sleep-inducing-gifts-of-ludovine
    name: "Усыпляющие дары Людовины"
    type: artifact
    description: >-
      Три подарка Людовины маленькому солдату: бокал вина,
      букет бессмертников и душистый шарф. Каждый из них
      обладает силой погружать человека в сон, похожий
      на смерть. Людовина использует их по очереди, чтобы
      солдат проспал три назначенные встречи и не смог
      вовремя уехать с ней.
    tags:
      - enchanted-gifts
      - sleep-inducing
  - id: horn-growing-yellow-plums
    name: "Жёлтые сливы, отращивающие рога"
    type: substance
    description: >-
      Плоды дерева, под которым солдат просыпается после
      того, как Людовина похищает его плащ и кошелёк.
      Две съеденные жёлтые сливы вызывают появление рогов
      на лбу. Позднее солдат продаёт такие плоды Людовине,
      и у неё вырастают такие же рога.
    tags:
      - magical-fruit
      - transformation
  - id: horn-removing-green-plums
    name: "Зелёные сливы, удаляющие рога"
    type: substance
    description: >-
      Плоды другого дерева, растущего рядом с деревом
      жёлтых слив. После того как солдат съедает две зелёные
      сливы, выросшие у него рога исчезают. Позднее он
      выжимает сок этих слив во флакон и использует его
      как лекарство для Людовины: действие сока постепенно
      снимает рога, пока она не возвращает украденные
      кошелёк и плащ.
    tags:
      - magical-fruit
      - healing
      - transformation
