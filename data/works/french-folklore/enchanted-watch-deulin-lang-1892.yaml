id: enchanted-watch-deulin-lang-1892
title: "Заколдованные часы"
original_title: "The Enchanted Watch"
kind: folktale
tradition:
  - french-folklore
collection: "The Green Fairy Book (edited by Andrew Lang, 1892)"
source:
  title: "The Enchanted Watch, The Green Fairy Book, Project Gutenberg #7277"
  url: "https://www.gutenberg.org/files/7277/7277-h/7277-h.htm"
  note: "Полный самостоятельный текст THE ENCHANTED WATCH, строки 607–650 онлайн-издания Project Gutenberg № 7277. Сборник The Green Fairy Book, редакция Эндрю Лэнга (1892); после сказки указано Deulin. Из других вариантов сюжета сведения не заимствованы."
entities:
  - id: wish-granting-watch
    name: "Часы, исполняющие желания"
    type: artifact
    description: >
      Волшебные часы, полученные Йеником от змеиного короля по совету спасённой змеи. Если потереть часы и пожелать чего-либо, желание немедленно исполняется: появляются еда, дом, дворец, дорога и мост через море. Часы работают также в руках принцессы, похитившей их; вернув их, Йеник заставляет морской дворец исчезнуть под водой.
    tags:
      - wish-granting
      - talisman
  - id: speaking-serpent
    name: "Говорящая спасённая змея"
    type: animal
    description: >
      Змея, которую Йеник спасает от гибели, разговаривает с ним и ведёт его к царю всех змей. Она заранее сообщает, какие часы следует попросить у царя в награду, и объясняет, что их нужно потереть для исполнения желания.
    tags:
      - talking-animal
      - helper
  - id: speaking-cat
    name: "Говорящий кот Йеника"
    type: animal
    description: >
      Кот, спасённый Йеником, разговаривает с псом и рыбой. Он пробирается в морской дворец, похищает волшебные часы из запертого ящика и, выронив их в море, договаривается с говорящей рыбой об их возвращении.
    tags:
      - talking-animal
      - helper
  - id: speaking-dog
    name: "Говорящий пёс Йеника"
    type: animal
    description: >
      Пёс, спасённый Йеником, умеет разговаривать с котом. Он переплывает море, неся кота на спине, чтобы вернуть украденные волшебные часы, но его вопросы во время возвращения приводят к тому, что кот роняет часы в воду.
    tags:
      - talking-animal
      - helper
  - id: speaking-fish
    name: "Говорящая рыба с девятью детьми"
    type: animal
    description: >
      Рыба, пойманная котом на морском берегу, просит пощады человеческой речью, ссылаясь на девятерых детей. В обмен на свободу находит и возвращает часы, упавшие в море.
    tags:
      - talking-animal
      - helper
  - id: conversing-crows
    name: "Разговаривающие вороны-путники"
    type: animal
    description: >
      Группа воронов, летящих на зимовку. Один из отставших рассказывает остальным о необыкновенном дворце посреди моря. Йеник слышит их беседу и по этому сообщению узнаёт, где искать свою жену и похищенные часы.
    tags:
      - talking-animals
      - messengers
