id: drakestail-marelles-lang-1890
title: "Утиный Хвостик"
original_title: "Drakestail"
kind: folktale
tradition:
  - french-folklore
author: "Шарль Марель (Charles Marelles); английское издание под редакцией Эндрю Лэнга"
collection: "The Red Fairy Book (Andrew Lang, 1890), страницы 202–207"
source:
  title: "Drakestail — The Red Fairy Book (1890); по Contes de Ch. Marelles"
  url: "https://en.wikisource.org/wiki/The_Red_Fairy_Book/Drakestail"
  note: >-
    Прочитан полный текст «Drakestail» в английской редакции
    The Red Fairy Book (1890), от займа королю до воцарения селезня.
    Сборник называет французский источник Contes de Ch. Marelles;
    предисловие подтверждает, что Марель разрешил воспроизвести
    свой французский вариант. Не смешивается с другими версиями
    сказок об утке-кредиторе или говорящих животных.
entities:
  - id: drakestail
    name: "Утиный Хвостик"
    type: animal
    description: >-
      Маленький говорящий селезень, который одалживает королю
      сто крон, а затем отправляется взыскивать долг.
      По пути он предлагает лису, лестнице, реке и осиному
      гнезду уменьшиться и спрятаться в его зобе. Каждый
      из четырёх спутников помещается внутри него, а в
      нужный момент выходит по призыву. Благодаря этому
      необычайному свойству селезень преодолевает ловушки
      короля и в конце становится новым правителем.
    tags:
      - talking-animal
      - magical-capacity
      - folklore-hero
  - id: reynard-fox
    name: "Лис Рейнард"
    type: animal
    description: >-
      Говорящий лис, встреченный Утиным Хвостиком по дороге
      во дворец. По просьбе селезня он уменьшается и
      помещается в его зобе. Когда король приказывает
      запереть селезня среди домашней птицы, лис выходит
      по условному зову и расправляется с индейками
      и курами, напавшими на путешественника.
    tags:
      - talking-animal
      - size-changing
      - magical-helper
  - id: living-ladder
    name: "Живая лестница"
    type: artifact
    description: >-
      Лестница, изображённая как говорящая знакомая
      Утиного Хвостика. Она сама просится в путь,
      уменьшается и скрывается в его зобе вместе с
      другими спутниками. Когда селезня бросают в
      глубокий колодец, лестница выходит по зову,
      упирается в край колодца и позволяет ему выбраться.
    tags:
      - animated-object
      - size-changing
      - magical-helper
  - id: living-river
    name: "Живая река"
    type: phenomenon
    description: >-
      Олицетворённая река, которая разговаривает
      с Утиным Хвостиком, уменьшается и отправляется
      в путь внутри его зоба. Когда селезня бросают
      в раскалённую печь, река выходит по зову,
      затапливает печь, тушит огонь, а затем разливается
      по королевскому дворцу. Селезень свободно
      плавает в поднявшейся воде.
    tags:
      - animated-nature
      - size-changing
      - magical-helper
  - id: living-wasp-nest
    name: "Живое осиное гнездо"
    type: creature
    description: >-
      Говорящее осиное гнездо, которое ведёт за собой
      множество ос, названных его войском. Оно уменьшается
      и прячется в зобе Утиного Хвостика. Когда селезню
      грозит расправа в тронном зале, гнездо выпускает
      ос, которые жалят короля и его министров.
      Спасаясь от ос, те выпрыгивают из окна и гибнут.
    tags:
      - animated-object
      - swarm
      - size-changing
      - magical-helper
