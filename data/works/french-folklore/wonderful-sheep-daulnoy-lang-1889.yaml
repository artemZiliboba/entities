id: wonderful-sheep-daulnoy-lang-1889
title: "Чудесный баран"
original_title: "The Wonderful Sheep"
kind: folktale
tradition:
  - french-folklore
author: "Мари-Катрин д’Онуа; английский перевод Минни Райт"
collection: "The Blue Fairy Book (edited by Andrew Lang, 1889)"
source:
  title: "The Wonderful Sheep, The Blue Fairy Book (1889), Wikisource"
  url: "https://en.wikisource.org/wiki/The_Blue_Fairy_Book/The_Wonderful_Sheep"
  note: "Полный текст The Wonderful Sheep (строки 125–325 Wikisource), перевод Минни Райт для The Blue Fairy Book, редактор Эндрю Лэнг, 1889. Использована именно эта редакция, без смешения с другими версиями д’Онуа."
entities:
  - id: fairy-ragotte
    name: "Фея Раготта"
    type: character
    description: >
      Могущественная мстительная фея, отвергнутая королём. Заманивает его в огненную пропасть, обездвиживает колдовством и прикосновением палочки превращает в говорящего барана на пять лет. Превращает других провинившихся принцев в овец и держит своих противников в виде бесплотных теней.
    tags:
      - fairy
      - curse
  - id: enchanted-sheep-king
    name: "Заколдованный король-баран"
    type: character
    description: >
      Прежде был человеческим королём, но Раготта превратила его в белого барана с золотыми рогами на пять лет. Он сохраняет разум и речь, правит другими заколдованными овцами, открывает проход в подземное владение и приказывает привести тени погибших спутников Миранды. Умирает, не дождавшись её возвращения.
    tags:
      - transformation
      - enchanted-ruler
  - id: enchanted-princes-flock
    name: "Стадо заколдованных принцев"
    type: creature
    description: >
      Почти сотня говорящих овец, которые пьют напитки, играют и устраивают праздники. По словам их короля, все они прежде были принцами, которых Раготта обратила в овец за разные проступки на определённые сроки; иногда они возвращают человеческий облик.
    tags:
      - transformation
      - talking-animals
  - id: intangible-captive-sprites
    name: "Бесплотные пленники Раготты"
    type: creature
    description: >
      Тени соперников и врагов феи Раготты, удерживаемые ею в подземном царстве на долгие сроки. Они выглядят как прекрасные феи и люди, предлагают Миранде плоды, участвуют в празднествах, но прикоснуться к ним невозможно. Среди них — девушка, которую фея поразила взглядом.
    tags:
      - intangible
      - enchanted-prisoners
  - id: speaking-monkey-grabugeon
    name: "Говорящая обезьянка Грабюжон"
    type: animal
    description: >
      Домашняя обезьянка принцессы Миранды, которой фея даровала способность говорить. Предлагает пожертвовать жизнью ради хозяйки и погибает, бросившись с дерева. Позднее её тень появляется в подземном владении барана.
    tags:
      - talking-animal
      - fairy-gift
  - id: speaking-dog-tintin
    name: "Говорящий пёс Тинтен"
    type: animal
    description: >
      Маленький пёс Миранды, наделённый феей человеческой речью. Он также предлагает умереть ради принцессы; Миранда позднее хоронит его рядом с другими спутниками. Его бесплотный образ по приказу короля-барана появляется перед хозяйкой.
    tags:
      - talking-animal
      - fairy-gift
  - id: enchanted-underground-domain
    name: "Волшебное подземное владение барана"
    type: location
    description: >
      Скрытый за камнем в пещере подземный край, где протекает река апельсиновой воды, бьют фонтаны вина, на деревьях растёт готовая жареная дичь и с неба падают кушанья, монеты и драгоценности. Там живут превращённые в овец принцы и бесплотные пленники феи Раготты.
    tags:
      - enchanted-realm
      - supernatural-abundance
  - id: griffin-carriage-team
    name: "Шестёрка грифонов из свиты Миранды"
    type: creature
    description: >
      Шесть грифонов, привезённых с другого края света, запряжены в перламутровую карету, на которой Миранда дважды отправляется из владения барана на свадьбы сестёр. Сказка не описывает их полёт или иные отдельные способности.
    tags:
      - griffins
      - mythical-beasts
