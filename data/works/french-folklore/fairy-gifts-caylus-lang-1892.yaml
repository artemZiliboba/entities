id: fairy-gifts-caylus-lang-1892
title: "Дары феи"
original_title: "Fairy Gifts"
kind: folktale
tradition:
  - french-folklore
author: "Граф де Келюс (Comte de Caylus)"
collection: "The Green Fairy Book (edited by Andrew Lang, 1892)"
source:
  title: "Fairy Gifts, The Green Fairy Book, Wikisource"
  url: "https://en.wikisource.org/wiki/The_Green_Fairy_Book/Fairy_Gifts"
  note: "Прочитан полный самостоятельный текст Fairy Gifts на Wikisource, строки 119–159; The Green Fairy Book (1892), редактор Эндрю Лэнг, в конце атрибуция Comte de Caylus. Иные версии не смешивались."
entities:
  - id: flower-fairy
    name: "Цветочная фея"
    type: character
    description: >
      Добрая фея воспитывает юных принцев и принцесс в своём дворце и при расставании одаряет каждого единственным даром по выбору. Она даровала Ирис красоту, Дафне красноречие, Синтии умение нравиться, Филлиде остроумие, а Сильвии — спокойный дух. Фея прямо говорит, что не может даровать один и тот же дар повторно.
    tags:
      - fairy
      - gift-giving
  - id: gift-of-beauty
    name: "Дар красоты принцессы Ирис"
    type: spell
    description: >
      Полученный от Цветочной феи дар делает принцессу Ирис необычайно красивой. После тяжёлой болезни красота исчезает, и фея не может восстановить её, потому что её дары выдаются только однажды.
    tags:
      - beauty
      - fairy-gift
  - id: gift-of-eloquence
    name: "Дар красноречия принцессы Дафны"
    type: spell
    description: >
      Дар Цветочной феи позволяет Дафне превосходно говорить и подбирать выражения. Однако принцесса не умеет остановиться и утомляет собеседников бесконечными речами.
    tags:
      - eloquence
      - fairy-gift
  - id: gift-of-pleasing
    name: "Дар очаровывать окружающих принцессы Синтии"
    type: spell
    description: >
      Фея даровала Синтии способность нравиться окружающим. Множество поклонников стремится угодить ей, но желание нравиться каждому лишает принцессу искренности, и со временем поклонники теряют к ней интерес.
    tags:
      - charm
      - fairy-gift
  - id: gift-of-wit
    name: "Дар остроумия принцессы Филлиды"
    type: spell
    description: >
      Цветочная фея наделяет Филлиду блестящим остроумием. Её общество поначалу увлекает Сильвию, но постоянное стремление к остроумной шутке нередко делает речи Филлиды недобрыми.
    tags:
      - wit
      - fairy-gift
  - id: gift-of-tranquil-spirit
    name: "Дар спокойного духа принцессы Сильвии"
    type: spell
    description: >
      В отличие от остальных принцесс, Сильвия просит у Цветочной феи спокойный дух и получает его. Этот дар приносит счастье самой Сильвии и радость людям, находящимся рядом с ней; действие описано как устойчивое душевное равновесие.
    tags:
      - tranquillity
      - fairy-gift
