id: king-bean-bernoni-crane-1885
title: "Король Боб"
original_title: "King Bean"
kind: folktale
tradition:
  - italian-folklore
collection: "Italian Popular Tales (Thomas Frederick Crane, 1885), сказка III"
source:
  title: "King Bean — Italian Popular Tales, III; венецианский вариант Bernoni, XVII"
  url: "https://en.wikisource.org/wiki/Italian_Popular_Tales/Chapter_1"
  note: >-
    Полностью прочитана сказка III «King Bean» в английском пересказе
    Томаса Фредерика Крейна из Italian Popular Tales (1885).
    Крейн непосредственно указывает венецианский источник:
    Бернони (Bernoni), XVII. Учтён только этот опубликованный
    вариант, от начала рассказа до свадьбы героев; соседние
    варианты «The King of Love», «The Enchanted Snake» и примечания
    о других супругах-оборотнях не смешивались.
entities:
  - id: king-bean
    name: "Король Боб"
    type: character
    description: >-
      Загадочный король, способный прилетать к своей возлюбленной
      в неуточнённом летающем облике и после купания в трёх сосудах
      с водой и молоком, молоком и розовой водой становиться
      прекрасным юношей. Каждый раз его призывают, открывая
      особый боб. Когда завистливые сёстры подмешивают в сосуды
      битое стекло, король получает смертельные раны. Позднее
      девушка лечит его по подсказке ведьм.
    tags:
      - shapeshifting
      - supernatural-husband
  - id: summoning-bean
    name: "Боб для призыва короля"
    type: artifact
    description: >-
      Боб, который Король Боб передаёт отцу девушки перед
      началом ухаживания. Когда девушка выходит на балкон
      и раскрывает его, король прилетает издалека и входит
      в приготовленные для купания сосуды. Этот способ
      призыва используется неоднократно, в том числе после
      исцеления короля.
    tags:
      - summoning
      - magical-token
  - id: forest-witches
    name: "Ведьмы лесного сборища"
    type: character
    description: >-
      Собирающиеся в лесу ведьмы, которых опасается отшельник.
      Одна из них, хромая ведьма, трясёт дерево, где спряталась
      девушка, а затем рассказывает остальным о смертельных
      ранах Короля Боба и о составе средства, способного
      его вылечить. Девушка подслушивает разговор и
      использует полученные сведения.
    tags:
      - witch
      - coven
  - id: witch-and-dove-blood-remedy
    name: "Лечебная смесь крови ведьмы и голубя"
    type: substance
    description: >-
      Состав для первого этапа спасения Короля Боба:
      смешанные и нагретые в котле кровь одной из ведьм
      и кровь голубя. Девушка смазывает им всё тело
      умирающего короля, после чего применяет особую воду.
      В сказке оба действия вместе завершаются его
      выздоровлением; отдельного исцеления одной
      кровяной смесью не показано.
    tags:
      - healing
      - magical-remedy
  - id: glass-expelling-water
    name: "Вода, извлекающая осколки стекла"
    type: substance
    description: >-
      Вода из фляги, спрятанной под камнем в лесу.
      Хромая ведьма сообщает, что этой водой нужно
      облить Короля Боба после обработки кровяной
      смесью. Девушка применяет её в указанном порядке,
      и осколки стекла выходят из тела короля;
      через несколько минут он полностью выздоравливает.
    tags:
      - healing
      - magical-water
