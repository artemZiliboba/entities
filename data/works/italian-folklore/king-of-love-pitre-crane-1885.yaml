id: king-of-love-pitre-crane-1885
title: "Король Любви"
original_title: "Lu Re d'Amuri (The King of Love)"
kind: folktale
tradition:
  - italian-folklore
collection: "Italian Popular Tales (Thomas Frederick Crane, 1885), сказка I"
source:
  title: "The King of Love — Italian Popular Tales, сказка I; сицилийский вариант Giuseppe Pitrè, № 18"
  url: "https://www.gutenberg.org/cache/epub/23634/pg23634-images.html"
  note: >-
    Полный текст сказки I «The King of Love», страницы 1–6 из Italian
    Popular Tales Томаса Фредерика Крейна (1885); редактор указывает
    сицилийский источник Джузеппе Питре, № 18, «Lu Re d'Amuri».
    Учтена только эта опубликованная Крейном версия: варианты «The
    Crystal King» (Питре № 281) и другие приведённые после сказки
    параллели не смешивались с её сюжетом.
entities:
  - id: king-of-love
    name: "Король Любви"
    type: character
    description: >-
      Сверхъестественный супруг Розеллы, который прилетает зелёной
      птицей, купается в молоке и становится юношей. Когда Розелла
      настойчиво требует назвать его имя, он исчезает вместе с
      дворцом; позднее является ей во время странствий, объясняет,
      как пройти опасный путь и достать ларец, заставляет
      выбежавших из него кукол вернуться и призывает Короля птиц,
      помогающего выполнить задание с перьями.
    tags:
      - shapeshifting
      - supernatural-husband
      - magical-helper
  - id: seven-ogress-aunts
    name: "Семь тёток-людоедок"
    type: creature
    description: >-
      Семь сестёр-людоедок, из которых Розелла встречает шестерых
      во время поисков супруга. Первая называет Короля Любви своим
      племянником и говорит, что всего их семь сестёр.
      Встретившиеся Розелле людоедки сначала угрожают ей, но затем
      предоставляют кров и пищу. Мать Короля Любви не входит
      в эту группу семи сестёр.
    tags:
      - ogress
      - supernatural-kin
  - id: king-of-love-sisters
    name: "Сёстры Короля Любви"
    type: character
    description: >-
      Дочери людоедки и сёстры Короля Любви, которые защищают
      Розеллу от собственной матери. Одна из сестёр опускает
      длинные косы и поднимает к себе героиню, даёт ей еду
      и советует, как добиться от матери пощады. В конце сёстры
      остаются жить с Розеллой и братом. Их самостоятельные
      волшебные способности прямо не раскрываются.
    tags:
      - supernatural-family
      - helper
  - id: king-of-love-mother
    name: "Мать Короля Любви — людоедка"
    type: creature
    description: >-
      Людоедка, мать Короля Любви и его сестёр, препятствующая
      союзу сына с Розеллой. Она заставляет Розеллу отнести письмо
      своей подруге, затем требует наполнить шесть тюфяков птичьими
      перьями и устраивает сыну другую свадьбу. Сложив руки над
      головой, она объявляет, что ребёнок Розеллы не сможет
      родиться, пока она не разомкнёт их; роды начинаются,
      когда людоедка разжимает руки, поверив вести о смерти сына.
    tags:
      - ogress
      - curse
      - antagonist
  - id: mother-ogress-friend
    name: "Подруга людоедки"
    type: creature
    description: >-
      Людоедка, которой Розелла должна доставить письмо матери
      Короля Любви. Когда девушка уносит из её дома ларец,
      хозяйка приказывает бритве, ножницам, ножу и другим
      обитателям опасного пути расправиться с беглянкой, но те
      отказываются, помня её добрые поступки.
    tags:
      - ogress
      - antagonist
  - id: sentient-razor-scissors-knife
    name: "Говорящие бритва, ножницы и нож"
    type: artifact
    description: >-
      Три режущих предмета в доме подруги людоедки. По приказу
      хозяйки они должны изрезать Розеллу, но отвечают ей
      человеческой речью и отказываются: девушка, в отличие от
      хозяйки, начистила их. В сказке выступают одной группой
      оживших предметов.
    tags:
      - animate-objects
      - talking-artifacts
  - id: sentient-passages-and-hazards
    name: "Ожившие преграды на пути Розеллы"
    type: phenomenon
    description: >-
      Лестница, вход, печь, плодовое дерево и две реки
      откликаются на обращённые к ним приказы людоедки:
      проглотить, похоронить, сжечь, раздавить или утопить
      беглянку. Все отказываются причинять Розелле вред,
      помня её поступки и добрые слова. В повествовании
      лестница прямо отвечает хозяйке человеческой речью;
      остальные преграды описаны как сознательно отказавшиеся
      подчиняться. Объединены как повторяющееся явление.
    tags:
      - animate-environment
      - talking-objects
  - id: two-guardian-dogs
    name: "Два пса-стража"
    type: animal
    description: >-
      Два голодных пса охраняют вход к жилищу подруги людоедки.
      В отличие от обычных сторожевых собак, они понимают приказ
      хозяйки пожрать Розеллу и сознательно отказываются
      напасть на неё, потому что она накормила их хлебом.
    tags:
      - supernatural-guardian
      - grateful-animal
  - id: two-giant-guards
    name: "Два великана"
    type: creature
    description: >-
      Два великана на лестнице по пути к подруге людоедки.
      После того как Розелла очищает их пищу, они отказываются
      выполнить приказ хозяйки раздавить девушку.
    tags:
      - giant
      - supernatural-guardian
  - id: puppet-box
    name: "Ларец с оживающими куколками"
    type: artifact
    description: >-
      Небольшой ларец, который Розелла похищает из дома подруги
      людоедки по совету Короля Любви. Когда она его открывает,
      изнутри выходят маленькие фигурки: одни танцуют, другие
      поют и играют на инструментах. Они не желают возвращаться
      в ларец, пока Король Любви не приказывает им это сделать.
    tags:
      - magical-container
      - animated-puppets
  - id: earth-swallowing-bride
    name: "Расступившаяся земля под невестой"
    type: phenomenon
    description: >-
      Во время навязанной Королю Любви свадьбы с дочерью
      короля Португалии Розеллу заставляют держать факелы.
      Когда новая невеста сменяет её, земля внезапно
      разверзается и поглощает женщину. Причина этого
      сверхъестественного события в сказке не названа.
    tags:
      - supernatural-punishment
      - earth-opening
  - id: king-of-birds
    name: "Король птиц"
    type: creature
    description: >-
      Владыка птиц, появляющийся на свист Короля Любви.
      Он приказывает птицам собрать перья для шести тюфяков
      и доставить наполненные тюфяки матери Короля Любви,
      помогая Розелле выполнить непосильное задание.
    tags:
      - bird-ruler
      - magical-helper
