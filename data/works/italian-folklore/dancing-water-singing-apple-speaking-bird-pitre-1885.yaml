id: dancing-water-singing-apple-speaking-bird-pitre-1885
title: "Танцующая вода, Поющее яблоко и Говорящая птица"
original_title: "The Dancing Water, the Singing Apple, and the Speaking Bird"
kind: folktale
tradition:
  - italian-folklore
collection: "Italian Popular Tales (Thomas Frederick Crane, 1885), сказка IV"
source:
  title: "The Dancing Water, the Singing Apple, and the Speaking Bird — Italian Popular Tales, IV; Pitrè, No. 36"
  url: "https://en.wikisource.org/wiki/Italian_Popular_Tales/Chapter_1"
  note: >-
    Полный текст сказки IV, страницы 17–25, в английском переводе
    и слегка сокращённой редакции Томаса Фредерика Крейна,
    Italian Popular Tales (1885). Крейн указывает сицилийский
    источник Джузеппе Питре, № 36, Li Figghi di lu Cavuliciddaru.
    Учтена только эта версия; другие сказки о чудесных предметах,
    волшебных птицах и подменённых детях из сборника не смешивались.
entities:
  - id: three-fairies
    name: "Три феи-покровительницы"
    type: creature
    description: >-
      Три феи, встречающие оставленных без присмотра младенцев.
      Они дарят детям оленя, который будет их выкармливать,
      кошелёк, в котором всегда есть деньги, и кольцо,
      меняющее цвет при несчастье одного из детей. В конце
      сказки выясняется, что три старых отшельника, помогавших
      братьям и сестре, и были этими феями.
    tags:
      - fairies
      - magical-gifts
      - helpers
  - id: magical-nursing-deer
    name: "Чудесный олень-кормилец"
    type: animal
    description: >-
      Олень, подаренный феей трём оставленным детям. Он кормит
      и растит их, пока они не становятся взрослыми, а затем
      советует им поселиться напротив королевского дворца.
      Его забота и способность давать человеческие советы
      отличают его от обычного дикого животного.
    tags:
      - magical-animal
      - nurturer
      - talking-animal
  - id: inexhaustible-purse
    name: "Неиссякаемый кошелёк"
    type: artifact
    description: >-
      Волшебный кошелёк, подаренный детям одной из фей.
      В нём всегда находятся деньги, благодаря чему брат
      и сестра могут содержать богатый дом и жить как
      знатные люди.
    tags:
      - inexhaustible
      - magical-gift
  - id: misfortune-ring
    name: "Кольцо, меняющее цвет"
    type: artifact
    description: >-
      Кольцо, подаренное детям одной из фей. Его камень меняет
      цвет, когда с кем-либо из троих случается несчастье.
      По цвету камня сестра узнаёт, что сначала один, а затем
      оба брата попали в беду во дворце Говорящей птицы.
    tags:
      - warning
      - magical-ring
  - id: dancing-water
    name: "Танцующая вода"
    type: substance
    description: >-
      Чудесная вода, которую младший из братьев добывает
      в опасном дворце на вершине горы. Налитая в два
      золотых таза, она сама переливается и прыгает
      из одного таза в другой, словно танцуя.
    tags:
      - magical-water
      - dancing
  - id: singing-apple
    name: "Поющее яблоко"
    type: artifact
    description: >-
      Яблоко с необыкновенного дерева в дворце на вершине
      горы. Когда младший брат срывает его и несёт домой,
      оно непрерывно издаёт мелодичный звук. Вместе
      с Танцующей водой становится одним из чудес,
      которыми любуются при королевском дворе.
    tags:
      - magical-fruit
      - singing
  - id: speaking-bird
    name: "Говорящая птица"
    type: creature
    description: >-
      Чудесная птица, сидящая у фонтана в саду дворца,
      полного оживших статуй. Она обращается к каждому,
      кто приходит за ней, рассказывает о несчастьях его
      семьи и провоцирует ответить. Тот, кто отвечает ей,
      превращается в статую. Девушка выдерживает испытание,
      ловит птицу и использует её перо, чтобы вернуть
      братьев и других статуй к жизни. Позднее птица
      рассказывает королю правду о судьбе его жены и детей.
    tags:
      - talking-bird
      - transformation
      - magical-helper
  - id: enchanted-statue-guardians
    name: "Ожившие статуи и стражи дворца"
    type: creature
    description: >-
      Статуи, а также четверо великанов и четверо львов,
      охраняющих чудесный дворец с Говорящей птицей.
      После того как девушка смачивает пером птицы их ноздри,
      они оживают. В повествовании они составляют группу
      заколдованных обитателей дворца, освобождённых
      одним и тем же действием.
    tags:
      - animated-statues
      - enchanted-guardians
      - transformation
