id: enchanted-snake-basile-lang-1892
title: "Заколдованная змея"
original_title: "The Enchanted Snake"
kind: folktale
tradition:
  - italian-folklore
author: "Джамбаттиста Базиле (литературная обработка)"
collection: "The Green Fairy Book (edited by Andrew Lang, 1892)"
source:
  title: "The Enchanted Snake, The Green Fairy Book, Project Gutenberg #7277"
  url: "https://www.gutenberg.org/files/7277/7277-h/7277-h.htm"
  note: "Полный раздел THE ENCHANTED SNAKE, строки 1853–1919 электронной версии Project Gutenberg № 7277, в сборнике The Green Fairy Book под редакцией Эндрю Лэнга (1892). Сюжет восходит к сказке Базиле; описания основаны только на данной английской редакции и не смешаны с другими вариантами."
entities:
  - id: enchanted-snake-prince
    name: "Заколдованный принц-змей"
    type: character
    description: >
      Сын короля Валлоне-Гроссо, которого злая колдунья превратила в змея на семь лет. Он говорит человеческим голосом и знает, как совершить три чудесных превращения королевского дворца и сада с помощью трав, черепков и плодовых косточек. Сбросив змеиную кожу, предстаёт человеком; после её сожжения превращается в голубя и улетает.
    tags:
      - enchanted-prince
      - transformation
  - id: snake-prince-enchantress
    name: "Колдунья, заколдовавшая принца"
    type: character
    description: >
      Злая волшебница, наложившая на королевского сына семилетнее заклятие, из-за которого тот вынужден жить в облике змея. О ней известно из пересказанного лисом разговора птиц; имя и другие способности не сообщаются.
    tags:
      - witch
      - curse
  - id: talking-fox-guide
    name: "Говорящий лис-проводник"
    type: animal
    description: >
      Лис предлагает принцессе Граннонии сопровождать её, разговаривает с ней и понимает язык птиц. Он пересказывает услышанное о происхождении и болезни заколдованного принца и добывает кровь птиц для лечения, а затем требует добавить собственную кровь.
    tags:
      - talking-animal
      - animal-language
  - id: bird-and-fox-blood-remedy
    name: "Целебная смесь крови птиц и лиса"
    type: substance
    description: >
      Смесь крови птиц, знающих историю превращённого принца, и крови лиса, который понял их разговор. Граннония наносит её на раны головы принца, полученные после превращения в голубя, и мгновенно исцеляет его от смертельного недуга. Кровь птиц отдельно без крови лиса, согласно его словам, не действует.
    tags:
      - healing
      - magical-remedy
