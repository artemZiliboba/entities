id: maui-snaring-the-sun-hawaiian-westervelt-1910
title: "Как Мауи поймал Солнце"
original_title: "Maui Snaring the Sun"
kind: myth
tradition:
  - hawaiian-mythology
collection: "Legends of Ma-ui, a Demi God of Polynesia, and of His Mother Hina"
author: "Уильям Дрейк Вестервельт (собиратель и пересказчик)"
source:
  title: "W. D. Westervelt, Legends of Ma-ui (1910), chapter IV, Maui Snaring the Sun, Hawaiian version, pp. 44–47"
  url: "https://www.gutenberg.org/cache/epub/32601/pg32601-images.html"
  note: "Только гавайский эпизод главы IV, с. 44–47: мать Хина, бабушка у дерева виливили, шестнадцать солнечных ног и каменный топор. В той же главе автор сопоставляет иные варианты Новой Зеландии, островов Общества, Кука, Самоа и др.; эти параллели не включены."
entities:
  - id: maui
    name: "Мауи"
    type: character
    description: >-
      Полубог и культурный герой, решивший замедлить
      движение Солнца, чтобы мать Хина успевала
      высушивать ткань капа. По совету бабушки
      скрывается у дерева виливили на горе
      Халеакала, захватывает верёвками все
      шестнадцать лучей-ног Солнца и бьёт
      его волшебным каменным топором,
      добиваясь обещания удлинить дни.
    tags:
      - demigod
      - culture-hero
  - id: living-sun
    name: "Живое Солнце"
    type: creature
    description: >-
      Одушевлённое Солнце, которое в гавайском
      рассказе быстро пересекает небосвод
      и имеет шестнадцать длинных ног-лучей.
      Попав в верёвочные петли Мауи,
      пытается уйти обратно к морю,
      затем просит пощады и соглашается
      двигаться медленнее летом и быстрее зимой.
    tags:
      - personified-sun
      - cosmic-being
  - id: hina-mother-of-maui
    name: "Хина"
    type: character
    description: >-
      Мать Мауи, чья работа по изготовлению
      и сушке ткани капа страдает из-за
      слишком коротких дней. Даёт сыну
      пятнадцать скрученных верёвок
      и направляет к его бабушке,
      живущей в кратере Халеакала.
      В этой версии самостоятельного
      колдовства Хины не описано.
    tags:
      - mythic-mother
  - id: maui-grandmother-haleakala
    name: "Бабушка Мауи на Халеакала"
    type: character
    description: >-
      Почти слепая старуха, живущая
      у дерева виливили на Халеакала
      и готовящая бананы для Солнца.
      Узнаёт Мауи по запаху, когда
      тот похищает бананы, и даёт
      ему шестнадцатую верёвку,
      волшебный камень-топор
      и подробные указания, как
      пленить Солнце.
    tags:
      - supernatural-helper
  - id: maui-magic-stone-axe
    name: "Волшебный каменный топор Мауи"
    type: artifact
    description: >-
      Волшебный камень, подаренный
      бабушкой Мауи в качестве
      боевого топора или палицы.
      Мауи наносит им удары
      пленённому Солнцу, вынуждая
      его просить пощады.
      Иных способностей камня
      выбранный рассказ не сообщает.
    tags:
      - magic-weapon
      - stone-axe
