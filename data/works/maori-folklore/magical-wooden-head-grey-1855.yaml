id: magical-wooden-head-grey-1855
title: "Волшебная деревянная голова"
original_title: "The Magical Wooden Head (Ko Nga Puhi a Puarata Raua Ko Tautohito)"
kind: legend
tradition:
  - maori-folklore
collection: "Polynesian Mythology and Ancient Traditional History of the New Zealand Race"
author: "Джордж Грей (собиратель и переводчик, 1855)"
source:
  title: "George Grey, Polynesian Mythology (London: John Murray, 1855), The Magical Wooden Head, pp. 204–208"
  url: "https://www.sacred-texts.com/pac/grey/grey20.htm"
  note: "Полностью прочитан самостоятельный рассказ The Magical Wooden Head, страницы 204–208 английского издания Грея 1855 года. Соседние истории и позднейшие варианты не смешивались."
entities:
  - id: puarata
    name: "Пуарата"
    type: character
    description: >-
      Старый колдун, владеющий вместе с Таутoхито резной волшебной головой в крепости на Священной горе. Призывает духов, охраняющих голову и крепость; при появлении Хакавау обращается к голове с заклинательными просьбами, но та уже лишилась силы после поражения духов.
  - id: tautohito
    name: "Таутoхито"
    type: character
    description: >-
      Второй старый колдун, живущий с Пуаратой в крепости на Священной горе и совместно владеющий смертоносной резной головой. Самостоятельные заклинания Таутoхито в рассказе не приведены; магический статус связан с его прямым обозначением как одного из двух колдунов.
  - id: hakawau
    name: "Хакавау"
    type: character
    description: >-
      Могущественный колдун, который вызывает подвластных добрых духов, погружается в вещий сон, чтобы узнать исход похода, и заклинаниями защищает себя и спутника от злых духов Пуараты. Посылает духов в обходной манёвр, уничтожает защитников волшебной головы, а уходя из крепости, хлопает по порогу, после чего все находившиеся внутри умирают.
  - id: wooden-head
    name: "Волшебная резная голова"
    type: artifact
    description: >-
      Деревянная резная голова, которой владеют колдуны Пуарата и Таутoхито. Её громкий крик убивает путников и целые отряды, проходящие у Священной горы. После уничтожения духов-охранителей Хакавау голова способна лишь тихо стонать и уже не причиняет вреда пришельцам.
  - id: puarata-evil-spirits
    name: "Злые духи Пуараты"
    type: creature
    description: >-
      Многочисленные духи, охраняющие крепость и волшебную голову Пуараты и нападающие на пришельцев. По приказу колдуна они выступают против духов Хакавау, увлекаются ложным отступлением противника и затем полностью уничтожаются.
  - id: hakawau-good-spirits
    name: "Добрые духи Хакавау"
    type: creature
    description: >-
      Подвластные Хакавау благосклонные духи, призванные его заклинаниями. Одни отвлекают охранителей Пуараты притворным бегством, другие обходят крепость и уничтожают злых духов; во сне один из могучих духов Хакавау представляется великаном, чья голова достигает неба.
  - id: whangai-incantation
    name: "Заклинание вангай"
    type: spell
    description: >-
      Заклинание, названное в английском тексте Whangai, посредством которого Хакавау направляет своих духов в бой против защитников крепости Пуараты. Духи исполняют приказ о притворном отступлении и обходном нападении, что лишает волшебную голову её смертоносной силы.
