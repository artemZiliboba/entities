id: odyssey-book-xvii-butler-1900
title: "Одиссея. Песнь XVII: Одиссей возвращается во дворец"
original_title: "Odyssey, Book XVII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XVII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полная песнь XVII в английском прозаическом переводе Сэмюэла Батлера (1900). Рассказ Телемаха о словах Менелая, предсказание Феоклимена и вымышленная биография нищего отделены от непосредственно показанных событий; другие песни и версии не смешивались."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня наделяет Телемаха необыкновенной красотой и величием, так что окружающие дивятся его виду. Позднее побуждает переодетого Одиссея просить пищу у каждого жениха, чтобы испытать их характер. Само переодевание Одиссея в этой песне не происходит: его облик был изменён Афиной раньше.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, к которому обращаются с молитвами о возвращении Одиссея и возмездии женихам. Нимфы у городского источника названы его дочерьми. В вымышленной истории Одиссея о Египте Зевсу приписано внушение страха войску; это не подтверждённое событие его странствий.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Бог, к которому Пенелопа обращает пожелание поразить жестокого Антиноя; пастух Меланфий также упоминает возможность гибели Телемаха от Аполлона. В этой песне бог не является и не поражает никого: речь идёт о пожеланиях и угрозах.
  - id: calypso
    name: "Калипсо"
    type: character
    description: >-
      Божественная нимфа, в чьём жилище на острове Одиссей долго находился в плену. В песне XVII о ней рассказывает Телемах, пересказывая сообщение Менелая и морского старца. Калипсо не появляется в текущих событиях.
  - id: fountain-nymphs
    name: "Нимфы городского источника"
    type: character
    description: >-
      Божественные дочери Зевса, которым посвящены источник и алтарь у дороги к городу. Евмей молит их о возвращении Одиссея, напоминая о прежних жертвоприношениях. Нимфы в песне не появляются и не дают слышимого ответа.
  - id: theoclymenus
    name: "Феоклимен"
    type: character
    description: >-
      Прорицатель, которого Телемах привёл из Пилоса. Он говорит Пенелопе, что Одиссей уже находится на Итаке и готовит возмездие женихам, ссылаясь на птичье знамение, увиденное во время плавания. Само знамение произошло в предыдущей песне XV и здесь лишь пересказывается.
  - id: telemachus-sneeze-omen
    name: "Знамение чихания Телемаха"
    type: phenomenon
    description: >-
      В момент, когда Пенелопа говорит о будущем возвращении Одиссея и расправе над женихами, Телемах громко чихает. Пенелопа истолковывает совпадение как подтверждение того, что все женихи погибнут. Это зафиксированное в песне толкование приметы, а не утверждение о сверхъестественных свойствах самого чихания.
