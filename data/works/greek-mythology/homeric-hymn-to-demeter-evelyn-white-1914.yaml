id: homeric-hymn-to-demeter-evelyn-white-1914
title: "Гомеров гимн к Деметре"
original_title: "Homeric Hymn 2: To Demeter"
kind: poem
tradition:
  - greek-mythology
collection: "Homeric Hymns"
author: "Анонимный древнегреческий поэт; Хью Джерард Эвелин-Уайт (перевод, 1914)"
source:
  title: "Homeric Hymn 2 to Demeter, lines 1–495, translated by H. G. Evelyn-White (1914)"
  url: "https://people.uncw.edu/deagona/lit/HH-Demeter.pdf"
  note: "Полный текст второго (длинного) Гомерова гимна, 1–495, перевод Эвелин-Уайта 1914 года, перепечатанный в учебном PDF Университета Северной Каролины. Не путать с коротким гимном XIII к Деметре; другие античные версии не привлекались."
entities:
  - id: demeter
    name: "Деметра"
    type: character
    description: >-
      Богиня плодородия, которая ищет похищенную
      дочь Персефону. Принимает облик старухи,
      пытается сделать царевича Демофонта
      бессмертным с помощью амброзии и огня.
      Из-за горя останавливает прорастание
      семян во всём мире и возобновляет
      плодородие после возвращения дочери.
    aliases:
      - "Део"
      - "Досо"
    tags:
      - fertility-goddess
      - shapeshifting
  - id: persephone
    name: "Персефона"
    type: character
    description: >-
      Божественная дочь Деметры и Зевса,
      похищенная Аидом в подземное царство.
      Из-за съеденного там зёрнышка граната
      вынуждена проводить треть года
      в царстве мёртвых, а остальные
      две трети — с матерью и богами.
    tags:
      - underworld-queen
      - seasonal-return
  - id: hades
    name: "Аид"
    type: character
    description: >-
      Бог и владыка подземного царства,
      похитивший Персефону с согласия Зевса.
      Выезжает из разверзшейся земли
      на колеснице с бессмертными конями.
      Перед освобождением Персефоны
      тайно заставляет её съесть
      гранатовое зёрнышко, чтобы
      обеспечить возвращение к нему.
    aliases:
      - "Аидоней"
    tags:
      - underworld-god
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Владыка богов, разрешивший Аиду
      похищение Персефоны. Когда Деметра
      лишает землю урожая, посылает
      к ней Ириду, других богов,
      а затем Гермеса в подземное царство.
      Устанавливает разделение года
      между матерью и супругом Персефоны.
    tags:
      - sky-god
      - divine-ruler
  - id: hecate
    name: "Геката"
    type: character
    description: >-
      Богиня, услышавшая крик
      похищенной Персефоны, но
      не увидевшая похитителя.
      С факелом сопровождает Деметру
      к всевидящему Гелиосу;
      после возвращения Персефоны
      становится её спутницей.
    tags:
      - goddess
      - torchbearer
  - id: helios
    name: "Гелиос"
    type: character
    description: >-
      Всевидящий бог Солнца,
      наблюдающий землю и море.
      Сообщает Деметре, что
      похищение Персефоны совершил
      Аид с разрешения Зевса.
      Ездит на колеснице с
      быстрыми небесными конями.
    tags:
      - sun-god
      - divine-witness
  - id: gaia
    name: "Гея — Земля"
    type: character
    description: >-
      Олицетворённая Земля, которая
      по воле Зевса выращивает
      необыкновенный нарцисс
      с сотней цветков, чтобы
      заманить Персефону.
      Затем земля разверзается
      и пропускает колесницу Аида.
    tags:
      - earth-goddess
      - divine-trap
  - id: hermes
    name: "Гермес"
    type: character
    description: >-
      Божественный посланник Зевса
      с золотым жезлом, способный
      спускаться в подземное царство.
      Убеждает Аида отпустить
      Персефону и выводит её
      на поверхность земли,
      управляя колесницей.
    tags:
      - messenger-god
      - psychopomp
  - id: iris
    name: "Ирида"
    type: character
    description: >-
      Златокрылая посланница Зевса,
      быстро преодолевающая
      пространство между Олимпом
      и Элевсином. Передаёт Деметре
      повеление вернуться к богам,
      но та отказывается,
      пока не увидит дочь.
    tags:
      - divine-messenger
      - golden-wings
  - id: rhea
    name: "Рея"
    type: character
    description: >-
      Мать Деметры, посланная Зевсом
      после возвращения Персефоны.
      Сходит с Олимпа на равнину
      Рарий и передаёт Деметре
      соглашение о разделении года,
      убеждая восстановить плодородие.
    tags:
      - titan-goddess
      - divine-messenger
  - id: ploutos
    name: "Плутос"
    type: character
    description: >-
      Олицетворённое божество богатства,
      которого Деметра и Персефона
      посылают в дом смертного,
      пользующегося их благоволением.
      Его присутствие приносит
      человеку достаток.
    aliases:
      - "Плут"
    tags:
      - wealth-god
      - prosperity
  - id: enchanted-narcissus
    name: "Чудесный нарцисс-ловушка"
    type: plant
    description: >-
      Необыкновенный цветок,
      выращенный Землёй по воле Зевса
      для похищения Персефоны.
      Из единого корня распускается
      сто соцветий; его вид
      и благоухание изумляют
      богов и смертных. Когда
      Персефона тянется сорвать
      цветок, земля разверзается.
    tags:
      - divine-plant
      - enchanted-lure
  - id: demeter-immortalizing-rite
    name: "Обряд обессмерчивания Демофонта"
    type: spell
    description: >-
      Незавершённый божественный обряд:
      Деметра днём натирает
      младенца Демофонта амброзией
      и дышит на него, а ночью
      помещает в огонь, словно
      головню. Это должно было
      сделать ребёнка бессмертным
      и нестареющим, но мать
      младенца прерывает обряд.
    tags:
      - immortality
      - divine-ritual
  - id: demeter-crop-curse
    name: "Бесплодие земли по воле Деметры"
    type: phenomenon
    description: >-
      Мировой неурожай, вызванный
      разгневанной Деметрой:
      богиня удерживает семена
      в земле, и они не всходят,
      несмотря на пахоту и посев.
      После примирения с Зевсом
      она снимает запрет,
      возвращая рост растений.
    tags:
      - divine-famine
      - fertility-control
  - id: persephone-pomegranate-binding
    name: "Связующее гранатовое зёрнышко"
    type: phenomenon
    description: >-
      Мифологическое условие
      пребывания Персефоны
      в подземном царстве:
      после того как Аид
      принуждает её проглотить
      гранатовое зёрнышко,
      она должна проводить
      треть года внизу.
      Само зерно не проявляет
      отдельной активной магии.
    tags:
      - underworld-food
      - seasonal-cycle
  - id: eleusinian-mysteries
    name: "Элевсинские мистерии Деметры"
    type: spell
    description: >-
      Священные обряды, которые
      Деметра открывает избранным
      элевсинским правителям,
      включая Триптолема,
      Диокла и Эвмолпа.
      Их содержание запрещено
      разглашать; посвящённым
      обещана лучшая доля
      после смерти, чем тем,
      кто обрядов не знает.
    tags:
      - secret-rites
      - afterlife
