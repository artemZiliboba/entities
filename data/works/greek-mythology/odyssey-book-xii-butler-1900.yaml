id: odyssey-book-xii-butler-1900
title: "Одиссея. Песнь XII: сирены, Сцилла, Харибда и стада Солнца"
original_title: "Odyssey, Book XII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полностью прочитана песнь XII в прозаическом английском переводе Сэмюэла Батлера 1900 года, от погребения Эльпенора до прибытия Одиссея на Огигию. Песнь X о Кирке уже внесена отдельно; из неё не перенесены сущности, лишь упомянутые вновь в XII. Не использованы позднейшие изображения сирен и иные варианты."
entities:
  - id: sirens
    name: "Сирены"
    type: creature
    description: >-
      Две сверхъестественные певицы, живущие среди останков погибших мореходов. Их сладостное пение завораживает тех, кто проплывает мимо, и заставляет отказаться от возвращения домой; они обещают знание о Троянской войне и событиях мира. Одиссей слышит песню, будучи привязанным к мачте, и требует освободить его, но спутники затягивают путы. Внешность сирен в этой песни не описана.
  - id: wandering-rocks
    name: "Блуждающие скалы"
    type: location
    description: >-
      Смертоносные скалы, о которых Кирка рассказывает Одиссею как об одном из двух возможных путей. Ни птицы, несущие Зевсу амброзию, ни корабли обычно не проходят между ними невредимыми; лишь Арго избежал гибели благодаря помощи Геры. Скалы не показаны как одушевлённые существа.
  - id: scylla
    name: "Сцилла"
    type: creature
    description: >-
      Бессмертное и неодолимое морское чудовище, живущее в пещере высокой скалы. У неё двенадцать уродливых ног, шесть длинных шей и шесть голов с тремя рядами зубов. Она одновременно хватает шестерых спутников Одиссея и съедает их; Кирка советует не вступать с ней в бой, а скорее проплыть мимо.
  - id: charybdis
    name: "Харибда"
    type: creature
    description: >-
      Чудовищная морская сила у подножия второй скалы: трижды в день она поглощает морскую воду и трижды извергает её, создавая губительный водоворот. После гибели корабля Одиссей спасается от её воронки, ухватившись за смоковницу над водой, и дожидается, когда Харибда выбросит обратно обломки судна. В этой песни не описан человекоподобный облик Харибды.
  - id: cratais
    name: "Кратеида"
    type: character
    description: >-
      Мать Сциллы, к которой Кирка велит громко обратиться, чтобы остановить второе нападение чудовища. В самой песне Кратеида не появляется и не действует непосредственно; её влияние известно только из совета Кирки.
  - id: helios
    name: "Гелиос — бог Солнца"
    type: character
    description: >-
      Божество, которому принадлежат священные стада на острове Тринакия. Узнав от дочери Лампетии, что спутники Одиссея убили его коров, Гелиос требует возмездия от Зевса и грозит уйти светить мёртвым в подземный мир, если его не услышат.
  - id: phaethusa
    name: "Фаэтуса"
    type: character
    description: >-
      Дочь Гелиоса и Неэры, одна из двух богинь-пастушек, которым поручено стеречь священные стада отца на Тринакии. В песне не показано её самостоятельных сверхъестественных действий.
  - id: lampetie
    name: "Лампетия"
    type: character
    description: >-
      Дочь Гелиоса и Неэры, богиня-пастушка на острове Тринакия. Когда люди Одиссея убивают священных коров, она немедленно сообщает об этом отцу, вызывая его требование наказать виновных.
  - id: helios-sacred-herds
    name: "Священные стада Гелиоса"
    type: animal
    description: >-
      Семь стад коров и семь отар овец по пятьдесят голов, принадлежащих богу Солнца; животные не размножаются и не убывают числом. После того как спутники Одиссея убивают часть коров, шкуры убитых ползают, а мясо на вертелах издаёт коровье мычание. Нарушение запрета приводит к божественному наказанию.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, к которому Гелиос обращается с требованием отомстить за священных коров. Зевс обещает разбить корабль Одиссея молнией и исполняет угрозу в море; спутники гибнут, а Одиссей остаётся единственным выжившим.
  - id: hera
    name: "Гера"
    type: character
    description: >-
      Богиня, которая, по рассказу Кирки, провела корабль Арго через Блуждающие скалы, спасая Ясона. В событиях самого путешествия Одиссея она не появляется.
  - id: sea-nymphs-thrinacia
    name: "Морские нимфы у Тринакии"
    type: creature
    description: >-
      Сверхъестественные обитательницы пещеры на острове Тринакия, где они устраивают собрания и танцы. Одиссей и его спутники укрывают корабль в этой пещере во время непогоды. Иных действий нимф в песне не описано.
