id: odyssey-book-xxiii-butler-1900
title: "Одиссея. Песнь XXIII: Узнавание Одиссея Пенелопой"
original_title: "Odyssey, Book XXIII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XXIII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Песнь XXIII полностью, перевод Батлера (1900). Отделены непосредственные действия богов от пересказа Одиссеем более ранних странствий; сведения из других песен и вариантов не добавлены."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня преображает внешность Одиссея после омовения, делая его выше, сильнее и красивее. Затем задерживает наступление рассвета, чтобы супруги могли дольше оставаться вместе, а утром скрывает Одиссея и его спутников во тьме при выходе из города.
  - id: eos
    name: "Эос (Заря)"
    type: character
    description: >-
      Божественная Заря, которую Афина удерживает у Океана, не позволяя запрячь коней Лампа и Фаэтона и принести утро. Позднее Афина разрешает ей взойти; самостоятельного решения Эос в этой песне не показано.
  - id: lampus-and-phaethon
    name: "Ламп и Фаэтон"
    type: creature
    description: >-
      Два коня, которых Заря запрягает, чтобы нести дневной свет людям. Афина задерживает их выезд, продлевая ночь Одиссея и Пенелопы. В этой песне они названы как часть небесного движения Зари.
  - id: night-prolongation
    name: "Продление ночи Афиной"
    type: phenomenon
    description: >-
      Афина останавливает приближение утра, удерживая Зарю у Океана и препятствуя её обычному пути. Благодаря вмешательству богини встреча Одиссея и Пенелопы продолжается дольше естественного срока.
  - id: tiresias-shade
    name: "Тень Тиресия"
    type: character
    description: >-
      Умерший фиванский прорицатель, с которым Одиссей прежде говорил в подземном мире. Герой пересказывает Пенелопе его пророчество: необходимо нести весло в страну, не знающую моря, принести жертву Посейдону и лишь затем вернуться домой; предсказана также мирная старость.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Бог моря, которому Одиссей должен принести жертву в далёкой стране согласно предсказанию Тиресия. В рассказе о прошлых странствиях Одиссея он связан с морской бурей и кораблекрушением; в событиях возвращения супругов лично не появляется.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Вспоминается как бог, поразивший молнией корабль Одиссея после того, как спутники съели священных коров бога Солнца. Это краткий пересказ предыдущих странствий, а не новое действие Зевса в настоящем песни.
  - id: helios
    name: "Гелиос"
    type: character
    description: >-
      Бог Солнца, чьи священные стада съели спутники Одиссея. Герой вспоминает об этом проступке в рассказе Пенелопе, связывая его с гибелью команды; сам бог в событиях песни не появляется.
  - id: polyphemus
    name: "Полифем"
    type: creature
    description: >-
      Циклоп, которого Одиссей вспоминает, рассказывая Пенелопе о пережитых странствиях и расправе за гибель товарищей. В песне XXIII он не действует, а фигурирует в кратком пересказе более раннего приключения.
  - id: aeolus
    name: "Эол"
    type: character
    description: >-
      Властитель ветров, которого Одиссей вспоминает как гостеприимного помощника во время плавания. Несмотря на помощь Эола, буря снова унесла корабль от родины. Подробности чудесного дара ветров в этой песне не повторяются.
  - id: laestrygonians
    name: "Лестригоны"
    type: creature
    description: >-
      Чудовищный народ, который, по рассказу Одиссея Пенелопе, уничтожил почти все его корабли и команды в городе Телепиле. Эпизод лишь пересказывается; новых свойств лестригонов песнь не сообщает.
  - id: circe
    name: "Кирка"
    type: character
    description: >-
      Волшебница, о хитрости и чарах которой Одиссей рассказывает Пенелопе, вспоминая свои прежние странствия. В событиях самой песни Кирка не появляется, и отдельное заклинание здесь не описывается.
  - id: sirens
    name: "Сирены"
    type: creature
    description: >-
      Сверхъестественные певицы, чьё необыкновенное пение Одиссей вспоминает в рассказе Пенелопе. Их встреча принадлежит предыдущему путешествию; в этой песне они лишь названы.
  - id: scylla
    name: "Скилла"
    type: creature
    description: >-
      Опасное морское чудовище, которого Одиссей упоминает в перечне пройденных испытаний. Он подчёркивает, что прежде никто не проходил мимо неё невредимым; нового столкновения в этой песне нет.
  - id: charybdis
    name: "Харибда"
    type: creature
    description: >-
      Смертоносная морская опасность, названная Одиссеем среди пережитых им испытаний наряду со Скиллой и блуждающими скалами. В песне XXIII о ней только вспоминают.
  - id: calypso
    name: "Калипсо"
    type: character
    description: >-
      Нимфа, державшая Одиссея в пещере на острове Огигия. По его рассказу Пенелопе, она предлагала ему бессмертие и вечную молодость в обмен на брак, но он отказался. В текущих событиях песни Калипсо не участвует.
