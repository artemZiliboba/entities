id: odyssey-book-ix-butler-1900
title: "Одиссея. Песнь IX: циклоп Полифем"
original_title: "Odyssey, Book IX"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book IX, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Только полный текст песни IX в английском прозаическом переводе Сэмюэла Батлера (1900), от рассказа Одиссея феакам до бегства с острова циклопов. Песни X и XII уже описаны отдельно. Другие варианты истории Полифема не смешивались."
entities:
  - id: polyphemus
    name: "Полифем"
    type: creature
    description: >-
      Одноглазый циклоп, сын Посейдона и нимфы Фоосы, живущий в пещере и пасущий овец и коз. Огромный и необычайно сильный, он заваливает вход громадным камнем, убивает и пожирает нескольких спутников Одиссея. Одиссей опьяняет его вином, выжигает единственный глаз заострённым колом и спасается, привязав людей под брюхом баранов. Ослеплённый Полифем молит Посейдона помешать возвращению Одиссея.
  - id: cyclopes
    name: "Циклопы"
    type: creature
    description: >-
      Племя великанов, живущих обособленно на острове без общих законов и собраний. Каждый правит собственным домом и семьёй. Услышав крики ослеплённого Полифема, соседние циклопы спрашивают, кто причиняет ему вред, но уходят, когда он отвечает, что его мучает «Никто», считая болезнь посланной Зевсом.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Бог моря, отец циклопа Полифема. После ослепления сына Полифем призывает Посейдона задержать Одиссея и сделать его возвращение домой мучительным; в пределах песни IX сам Посейдон не появляется и не совершает непосредственно описанного действия.
  - id: thoosa
    name: "Фооса"
    type: character
    description: >-
      Морская нимфа, дочь Форкиса, названная матерью Полифема от Посейдона. В действии песни IX она не появляется; её происхождение и родство сообщаются при объяснении того, почему Посейдон покровительствует циклопу.
  - id: phorcys
    name: "Форкис"
    type: character
    description: >-
      Морское божество, отец нимфы Фоосы и дед Полифема по материнской линии. В песне IX он упоминается лишь в родословной циклопа; самостоятельных действий и способностей текст здесь не описывает.
  - id: lotus-eaters
    name: "Лотофаги"
    type: character
    description: >-
      Жители страны лотоса, угощающие спутников Одиссея растением, после вкушения которого те забывают о возвращении домой и желают остаться среди лотофагов. Сами лотофаги не названы богами или чудовищами; их включение отражает устойчивую связь этого народа с необычайным воздействием лотоса.
  - id: forgetful-lotus
    name: "Лотос забвения"
    type: plant
    description: >-
      Растение, которым лотофаги кормят пришельцев. Попробовавшие его спутники Одиссея теряют желание сообщить новости и возвращаться на родину, предпочитая навсегда остаться среди лотофагов. Одиссей силой уводит их обратно на корабли и привязывает к скамьям.
