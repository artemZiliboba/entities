id: odyssey-book-iii-butler-1900
title: "Одиссея. Песнь III: Телемах у Нестора в Пилосе"
original_title: "Odyssey, Book III"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book III, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полная песнь III, перевод Сэмюэла Батлера (1900), от прибытия Телемаха в Пилос до дороги в Спарту. Воспоминания Нестора о событиях после Трои отделены от непосредственного действия в Пилосе; другие варианты не смешаны."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Сопровождает Телемаха в Пилос под обликом Ментора, придаёт ему смелости говорить с Нестором и молится Посейдону во время жертвенного пира. Вечером улетает в облике орла, открывая Нестору свою божественную природу. На следующий день лично принимает посвящённую ей жертву; Нестор также вспоминает её гнев на ахейцев после взятия Трои.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Бог моря и землетрясений, в честь которого жители Пилоса приносят жертву из чёрных быков. Афина под видом Ментора обращается к нему с молитвой о благополучии Нестора, его сыновей и Телемаха. В рассказе Нестора морскому богу также приписывается помощь во время возвращения из-под Трои; лично он не появляется.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      В рассказе Нестора о возвращении ахейцев после падения Трои Зевс препятствует их отплытию, разжигает раздоры и насылает бурю на корабли Менелая. Эти действия относятся к прошлому, а не к путешествию Телемаха в Пилос.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Нестор рассказывает, что Аполлон убил кормчего Менелая Фронтиса своими безболезненными стрелами у мыса Суний. Гибель кормчего заставила Менелая задержаться для погребения. Сам бог в настоящем действии песни не появляется.
