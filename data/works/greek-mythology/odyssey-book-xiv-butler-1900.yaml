id: odyssey-book-xiv-butler-1900
title: "Одиссея. Песнь XIV: Одиссей в хижине Евмея"
original_title: "Odyssey, Book XIV"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XIV, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полная песнь XIV в переводе Сэмюэла Батлера (1900). Рассказ Одиссея о критянине является вымышленной биографией, сообщённой Евмею, а не подтверждёнными событиями; соседние песни и другие версии не смешаны."
entities:
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, к которому Евмей и Одиссей обращаются в молитвах и клятвах; Евмей называет его покровителем гостей и странников. В вымышленной истории, рассказанной Одиссеем под видом критянина, Зевс наводит страх на воинов в Египте и поражает корабль молнией. Эти события принадлежат обманному рассказу, а не подтверждённой биографии героя.
  - id: ares
    name: "Арес"
    type: character
    description: >-
      Бог войны, упомянутый Одиссеем в придуманной истории о своём критском происхождении: рассказчик приписывает Аресу и Афине свою боевую отвагу. Сам бог в действии песни не появляется.
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня, направившая Одиссея к верному свинопасу Евмею ещё в конце предыдущей песни. В песне XIV её имя звучит в вымышленном рассказе Одиссея, где он приписывает Афине и Аресу свою воинскую доблесть; нового явления богини здесь нет.
  - id: hermes
    name: "Гермес"
    type: character
    description: >-
      Божественный вестник, сын Майи, которому Евмей посвящает одну из семи долей жертвенной трапезы вместе с нимфами. Песнь не описывает его непосредственного появления или вмешательства.
  - id: nymphs
    name: "Нимфы"
    type: character
    description: >-
      Божественные существа, которым Евмей вместе с Гермесом выделяет жертвенную долю во время ужина с неузнанным Одиссеем. Их индивидуальные имена и действия в этой песне не названы.
  - id: dodona-zeus-oracular-oak
    name: "Прорицательный дуб Зевса в Додоне"
    type: location
    description: >-
      Священный дуб в Додоне, от которого, согласно вымышленному рассказу Одиссея, герой якобы собирался узнать волю Зевса и решить, возвращаться ли на Итаку открыто или тайно. Это упоминание о прорицалище внутри заведомо ложной истории; фактическое посещение Додоны не подтверждается.
