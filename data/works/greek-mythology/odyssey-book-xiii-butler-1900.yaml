id: odyssey-book-xiii-butler-1900
title: "Одиссея. Песнь XIII: возвращение на Итаку"
original_title: "Odyssey, Book XIII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XIII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полная песнь XIII в переводе Сэмюэла Батлера (1900): возвращение феаков, наказание Посейдона, узнавание Итаки и преображение Одиссея Афиной. Не смешано с соседними песнями и другими переводами."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня покровительствует возвращению Одиссея: внушает феакам щедрость, окутывает Итаку туманом, чтобы скрыть его прибытие, и появляется перед ним сначала юным пастухом, затем женщиной. Развеивает туман, помогает спрятать дары и прикосновением жезла превращает героя на вид в дряхлого, неприметного старика, чтобы его не узнали женихи и близкие.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Морской бог, разгневанный тем, что феаки доставили Одиссея на родину. С согласия Зевса обращает возвращающийся корабль феаков в камень и утверждает его у берега. Намерение завалить город феаков горой обсуждается, но само обрушение в песне не происходит.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, к которому Посейдон обращается с жалобой на феаков. Разрешает ему наказать перевозчиков Одиссея и советует превратить их корабль в камень на глазах у жителей; сам превращения не совершает.
  - id: naiad-nymphs
    name: "Наяды"
    type: character
    description: >-
      Нимфы, которым посвящена прибрежная пещера на Итаке. В пещере стоят каменные сосуды и ткацкие станки, на которых наяды ткут пурпурные одежды. Одиссей узнаёт святилище и обращается к ним с молитвой, обещая вновь приносить дары.
  - id: phorcys
    name: "Форкий"
    type: character
    description: >-
      Древнее морское божество, имя которого носит гавань на Итаке, куда феаки привозят спящего Одиссея. В этой песне Форкий не действует и не проявляет отдельных сил.
  - id: phaeacian-ship-petrification
    name: "Окаменение корабля феаков"
    type: phenomenon
    description: >-
      Наказание, совершённое Посейдоном: возвращающееся судно феаков, уже видное из города, внезапно превращается в камень, а морской бог закрепляет его у берега. Жители потрясены и вспоминают старое предсказание. Это превращение, а не отдельный волшебный корабль.
  - id: naiad-cave-ithaca
    name: "Пещера наяд на Итаке"
    type: location
    description: >-
      Священная пещера у гавани Форкия, с постоянной водой, каменными сосудами и станками наяд. В неё ведут два входа: северный доступен смертным, южный предназначен только для богов и недоступен людям. Здесь Афина и Одиссей прячут привезённые феаками дары.
  - id: athena-disguise-wand
    name: "Жезл Афины для преображения Одиссея"
    type: artifact
    description: >-
      Жезл, которым Афина касается Одиссея, немедленно изменяя его вид: покрывает кожу морщинами, лишает волос, иссушает тело и тускнит глаза. В этом эпизоде жезл выступает непосредственным орудием божественного преображения; обычные посох и сумка нищего, данные вслед за ним, не наделены чудесными свойствами.
