id: odyssey-book-v-butler-1900
title: "Одиссея. Песнь V: остров Калипсо и спасение Одиссея"
original_title: "Odyssey, Book V"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book V, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Прочитана вся песнь V в прозаическом переводе Сэмюэла Батлера 1900 года, от совета богов до сна Одиссея на берегу Схерии. Иные песни и позднейшие мифографические варианты не смешивались."
entities:
  - id: calypso
    name: "Калипсо"
    type: character
    description: >-
      Бессмертная нимфа и богиня, удерживающая Одиссея на своём острове. Она предлагает сделать его бессмертным и нестареющим, но после приказа Зевса через Гермеса отпускает героя, снабжает провизией и посылает попутный ветер. Предложенное превращение Одиссея в бессмертного не происходит.
  - id: hermes
    name: "Гермес"
    type: character
    description: >-
      Божественный вестник, который по приказу Зевса перелетает море и сообщает Калипсо решение отпустить Одиссея. При полёте пользуется волшебными сандалиями и держит жезл, способный усыплять и пробуждать людей.
  - id: hermes-winged-sandals
    name: "Летучие сандалии Гермеса"
    type: artifact
    description: >-
      Сверкающие золотые сандалии божественного вестника, позволяющие ему летать над сушей и морем с быстротой ветра. Гермес надевает их перед путешествием на остров Калипсо.
  - id: hermes-sleep-wand
    name: "Жезл Гермеса, навевающий сон"
    type: artifact
    description: >-
      Жезл, которым Гермес может по собственной воле погружать людей в сон и пробуждать их. В песне V он несёт жезл во время полёта, но не применяет его к Одиссею или Калипсо.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, решающий на совете бессмертных, что Одиссей должен вернуться домой. Посылает Гермеса с приказом к Калипсо и определяет, что герой доберётся до феаков после тяжёлого плавания на плоту.
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня, заступающаяся за Одиссея перед Зевсом. После того как Посейдон разбивает плот героя бурей, Афина останавливает остальные ветры, направляет спасительный северный ветер, помогает Одиссею выбраться из прибоя и в конце навевает ему сон.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Бог моря, разгневанный на Одиссея. Увидев его на плоту, Посейдон вздымает море трезубцем, собирает грозовые тучи и вызывает бурю, разбивающую плот. После этого возвращается в свой дворец в Эгах.
  - id: ino-leucothea
    name: "Ино — Левкотея"
    type: character
    description: >-
      Дочь Кадма, прежде смертная женщина, а затем морская богиня Левкотея. Поднимается из волн подобно чайке, жалеет Одиссея и даёт ему зачарованное покрывало, защищающее во время плавания. После спасения героя принимает покрывало обратно из моря.
  - id: leucothea-enchanted-veil
    name: "Зачарованное покрывало Левкотеи"
    type: artifact
    description: >-
      Волшебная ткань, которую морская богиня велит Одиссею обвязать вокруг груди перед тем, как броситься в воду. По словам Левкотеи, покрывало защитит его от вреда в море; достигнув берега, Одиссей возвращает его в волны.
  - id: river-god-scheria
    name: "Речной бог у берегов Схерии"
    type: character
    description: >-
      Неназванное божество реки, к устью которой после кораблекрушения приплывает Одиссей. Герой обращается к нему с мольбой, и бог останавливает течение и усмиряет волны, позволяя путнику добраться до берега.
  - id: ogygia
    name: "Огигия — остров Калипсо"
    type: location
    description: >-
      Уединённый остров посреди моря, где живёт бессмертная Калипсо и долго удерживает Одиссея. Её пещеру окружают деревья, виноградная лоза и четыре ручья. В песне остров служит обителью богини, но не проявляет самостоятельных магических свойств.
  - id: divine-ambrosia-and-nectar
    name: "Амброзия и нектар богов"
    type: substance
    description: >-
      Пища и напиток бессмертных, которыми Калипсо угощает Гермеса и которыми питается сама. Одиссею при этом подают обычную человеческую еду. Песнь не описывает отдельного превращающего или исцеляющего действия этих веществ.
