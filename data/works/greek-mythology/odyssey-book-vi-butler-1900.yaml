id: odyssey-book-vi-butler-1900
title: "Одиссея. Песнь VI: Навсикая и Одиссей"
original_title: "Odyssey, Book VI"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book VI, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полностью прочитана песнь VI в английском прозаическом переводе Сэмюэла Батлера 1900 года: от явления Афины во сне Навсикае до молитвы Одиссея в священной роще. Не смешивались другие песни и позднейшие мифологические варианты."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня, которая приходит к спящей Навсикае в облике её подруги, дочери Диманта, и убеждает отправиться стирать одежду. Затем она устраивает пробуждение Одиссея, вселяет в Навсикаю мужество и устраняет её страх перед незнакомцем. После омовения героя Афина делает его выше и красивее, придавая волосам пышность. В конце песни слышит молитву Одиссея, но не показывается ему из-за гнева Посейдона.
  - id: olympus
    name: "Олимп — обитель бессмертных"
    type: location
    description: >-
      Вечное жилище богов, куда Афина возвращается после посещения Навсикаи. В описании песни VI здесь не бывает ни дождя, ни снега, ни сильного ветра: место постоянно озарено ясным светом и пребывает в покое.
  - id: athena-dream-visitation
    name: "Сновидение Навсикаи, посланное Афиной"
    type: phenomenon
    description: >-
      Божественное явление во сне, во время которого Афина принимает облик знакомой девушки и разговаривает со спящей Навсикаей. Проснувшись, царевна помнит сон и просит отца дать повозку для поездки к реке. Это действие самой Афины, а не самостоятельное существо.
  - id: athena-beautification
    name: "Преображение внешности Одиссея Афиной"
    type: phenomenon
    description: >-
      После омовения Одиссея Афина делает его на вид выше и крепче, придаёт волосам густоту и красивые локоны, а его облику — сияющую привлекательность. Навсикая замечает перемену. В песне это прямое действие богини, а не свойство воды или масла.
