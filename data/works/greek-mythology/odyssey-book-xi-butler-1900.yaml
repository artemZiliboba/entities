id: odyssey-book-xi-butler-1900
title: "Одиссея. Песнь XI: путешествие к душам умерших"
original_title: "Odyssey, Book XI"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XI, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полный текст песни XI в английском прозаическом переводе Сэмюэла Батлера (1900): от прибытия к киммерийцам до отплытия после встречи с душами. Только описанные в этой песни сущности; не добавлялись детали позднейших мифов."
entities:
  - id: underworld-entrance
    name: "Вход в царство мёртвых у киммерийцев"
    type: location
    description: >-
      Мрачная область у края Океана, где живут киммерийцы и куда не проникает свет Солнца. Здесь Одиссей выкапывает яму для жертвенных возлияний, и к крови стекаются души умерших из подземного мира. Текст не утверждает, что киммерийцы сами являются духами.
  - id: souls-of-the-dead
    name: "Души умерших"
    type: creature
    description: >-
      Бестелесные тени покойных, собирающиеся вокруг жертвенной крови в царстве мёртвых. Среди них женщины, воины, старики и дети; некоторые обретают возможность связно говорить с Одиссеем после того, как пьют кровь. Они не способны обнять живого человека как прежде, поскольку тело после смерти утрачено.
  - id: tiresias-shade
    name: "Тень Тиресия"
    type: character
    description: >-
      Душа слепого фиванского прорицателя, сохранившая после смерти разум и дар предвидения по воле Персефоны. Выпив жертвенной крови, Тиресий предсказывает Одиссею опасность со стадами Гелиоса, трудное возвращение, будущую месть женихам и путешествие с веслом в страну, где не знают моря.
  - id: persephone
    name: "Персефона"
    type: character
    description: >-
      Владычица подземного мира, которая, согласно объяснению Кирки, оставила Тиресию способность мыслить после смерти, тогда как другие души подобны теням. В рассказе Одиссея она также направляет к нему души умерших женщин и, как он опасается, может послать страшное чудовище.
  - id: hades
    name: "Аид"
    type: character
    description: >-
      Владыка царства мёртвых, упоминаемый как правитель обители умерших. В песне XI он не выступает лично и не разговаривает с Одиссеем; сведения о нём ограничены принадлежностью подземного царства.
  - id: anticleia-shade
    name: "Тень Антиклеи"
    type: character
    description: >-
      Душа матери Одиссея, умершей от тоски по сыну. После вкушения жертвенной крови узнаёт Одиссея и рассказывает о положении его семьи на Итаке. Трижды Одиссей пытается обнять её, но тень каждый раз ускользает из его рук.
  - id: elpenor-shade
    name: "Тень Эльпенора"
    type: character
    description: >-
      Душа спутника Одиссея, погибшего при падении с крыши дома Кирки. Он приходит к жертвенной яме ещё до погребения тела, говорит с Одиссеем и просит устроить ему похороны и поставить весло на могиле.
  - id: agamemnon-shade
    name: "Тень Агамемнона"
    type: character
    description: >-
      Душа убитого царя, которая после жертвенной крови рассказывает Одиссею о собственном убийстве Эгисфом и Клитемнестрой. Предостерегает героя от беспечной доверчивости при возвращении домой.
  - id: achilles-shade
    name: "Тень Ахилла"
    type: character
    description: >-
      Душа прославленного героя Троянской войны, говорящая с Одиссеем в подземном мире. Отвергает утешение о власти над мёртвыми, предпочитая даже тяжёлую жизнь простого работника участи покойного; радуется известиям о доблести сына Неоптолема.
  - id: ajax-shade
    name: "Тень Аякса"
    type: character
    description: >-
      Душа Аякса Теламонида, продолжающая сердиться на Одиссея из-за спора за доспехи Ахилла. Она не отвечает на попытки Одиссея примириться и удаляется к другим мертвецам.
  - id: minos-shade
    name: "Минос — судья умерших"
    type: character
    description: >-
      Умерший царь Минос, сын Зевса, которого Одиссей видит в царстве мёртвых с золотым скипетром. Минос разбирает споры среди теней, сидящих и стоящих вокруг него.
  - id: orion-shade
    name: "Тень Ориона"
    type: character
    description: >-
      Душа великого охотника, которую Одиссей видит в подземном мире. Орион продолжает преследовать по асфоделевому лугу призрачных зверей, убитых им при жизни, держа в руках бронзовую палицу.
  - id: tityos
    name: "Титий"
    type: character
    description: >-
      Гигант, сын Геи, лежащий в царстве мёртвых на земле и занимающий девять плетров. Два стервятника непрерывно терзают его печень в наказание за нападение на Лето.
  - id: tantalus
    name: "Тантал"
    type: character
    description: >-
      Наказанный мертвец, стоящий по горло в воде, которая отступает при попытке напиться. Над ним висят ветви с плодами, но ветер отводит их всякий раз, когда он протягивает руку.
  - id: sisyphus
    name: "Сизиф"
    type: character
    description: >-
      Наказанный мертвец, вынужденный толкать огромный камень на вершину холма. Каждый раз, когда он почти достигает цели, валун скатывается вниз и труд начинается снова.
  - id: heracles-phantom
    name: "Тень Геракла"
    type: character
    description: >-
      Призрачный образ Геракла, которого Одиссей встречает среди умерших. В самой песне уточняется, что настоящий Геракл находится среди бессмертных богов, а здесь пребывает лишь его образ. Тень вспоминает собственные страдания и поход за псом Аида.
  - id: gorgon-head-threat
    name: "Угроза головы Горгоны"
    type: creature
    description: >-
      Чудовищная голова Горгоны, которую, как опасается Одиссей, Персефона может прислать ему из подземного мира. Само чудовище в песне XI не появляется: Одиссей поспешно уходит, опасаясь возможного нападения.
