id: terrible-head-lang-blue-1889
title: "Ужасная голова"
original_title: "The Terrible Head"
kind: folktale
tradition:
  - greek-mythology
author: "Эндрю Лэнг (пересказ на основе античных источников)"
collection: "The Blue Fairy Book (1889)"
source:
  title: "The Terrible Head, The Blue Fairy Book (1889), Wikisource"
  url: "https://en.wikisource.org/wiki/The_Blue_Fairy_Book/The_Terrible_Head"
  note: "Полный текст The Terrible Head, строки 123–230 на Wikisource. Это пересказ Эндрю Лэнга по Аполлодору, Симониду и Пиндару; имена героев и богов в данном пересказе опущены. Детали других версий мифа о Персее и Медузе не добавлялись."
entities:
  - id: mysterious-winged-shoe-giver
    name: "Таинственный юноша — даритель летучих башмаков"
    type: character
    description: >
      Высокий юноша с крылатым посохом и крылатой шапкой даёт герою свои чудесные башмаки и объясняет путь к Серым сёстрам. Затем исчезает вместе со своей спутницей. В этой редакции его имя не названо.
  - id: mysterious-female-guide
    name: "Таинственная наставница героя"
    type: character
    description: >
      Высокая женщина со сверкающими глазами советует герою добыть шапку невидимости, острый меч и летучие башмаки, а затем немедленно отправляться в путь. Она исчезает вместе со спутником; имя и божественный статус в тексте прямо не сообщаются.
  - id: three-grey-sisters
    name: "Три Серые сестры с общим глазом"
    type: creature
    description: >
      Три древнейшие обитательницы ледяной пещеры делят между собой единственный глаз и зуб. Герой перехватывает глаз и вынуждает сестёр указать дорогу к феям сада. Их слёзы замерзают, падая на пол пещеры.
  - id: three-garden-fairies
    name: "Три феи золотого сада"
    type: creature
    description: >
      Три феи в зелёном, белом и красном одеяниях вечно танцуют вокруг зачарованной яблони с золотыми плодами. Они дают герою шапку невидимости, острый меч, сумку и щит, а также указывают дальнейший путь.
  - id: enchanted-golden-apple-tree
    name: "Зачарованная яблоня с золотыми плодами"
    type: plant
    description: >
      Зачарованное дерево с золотыми яблоками в саду трёх фей. Феи стерегут его, непрерывно водя хоровод, до наступления новых времён или конца мира. По их песне плоды пока никому нельзя вкушать; конкретное действие яблок не раскрывается.
  - id: youngest-terrible-sister
    name: "Младшая из трёх Ужасных сестёр"
    type: creature
    description: >
      Младшая крылатая сестра со змеями вместо волос и медными когтями обращает в камень каждого, кто взглянет на неё. В отличие от двух старших сестёр смертна; герой отрубает ей голову, глядя на отражение в щите.
  - id: two-immortal-terrible-sisters
    name: "Две бессмертные Ужасные сестры"
    type: creature
    description: >
      Две старшие крылатые сестры со змеями вместо волос, золотыми крыльями и медными когтями. Взгляд на них обращает в камень, а убить их невозможно. После гибели младшей преследуют героя по запаху, не видя его из-за шапки.
  - id: petrifying-terrible-head
    name: "Окаменяющая Ужасная голова"
    type: artifact
    description: >
      Отрубленная голова младшей Ужасной сестры сохраняет способность обращать увидевших её в камень. Герой держит её в сумке и показывает морскому чудовищу и злому королю, превращая обоих в камень.
  - id: cap-of-darkness
    name: "Шапка тьмы"
    type: artifact
    description: >
      Волшебная шапка, которую дарят герою три феи сада. Надевший её становится невидим даже для фей и Ужасных сестёр; сняв шапку, герой вновь виден людям.
  - id: sword-of-sharpness
    name: "Меч остроты"
    type: artifact
    description: >
      Чудесный меч с алмазным клинком, способный одним ударом рассечь железо. Им герой отрубает голову младшей Ужасной сестре и разрубает железную цепь, приковавшую девушку к морскому берегу.
  - id: shoes-of-swiftness
    name: "Башмаки быстроты"
    type: artifact
    description: >
      Крылатые волшебные башмаки, позволяющие летать быстрее ветра над сушей и морем. Они сами знают дорогу к Серым сёстрам, но не знают путей за пределами мира. Помогают герою уйти от преследования крылатых чудовищ.
  - id: girl-devouring-sea-monster
    name: "Морское чудовище — пожиратель девушек"
    type: creature
    description: >
      Жестокое морское существо с длинной головой ежедневно пожирает девушку, оставленную на берегу. Когда оно нападает на принцессу, герой показывает ему отрубленную Ужасную голову, и чудовище превращается в камень.
