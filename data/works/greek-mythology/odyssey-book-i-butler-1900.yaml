id: odyssey-book-i-butler-1900
title: "Одиссея. Песнь I: Совет богов и Афина на Итаке"
original_title: "Odyssey, Book I"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book I, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полный текст песни I (от обращения к Музе до решения Телемаха отправиться в путь), перевод Батлера (1900). Упоминания предшествующих событий не приравниваются к новым действиям в этой песне."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня просит Зевса помочь возвращению Одиссея и отправляется на Итаку, приняв облик тафийского царя Ментеса. Она внушает Телемаху решимость отправиться за вестями об отце, затем улетает подобно птице и насылает сон на Пенелопу. В переводе Батлера именуется Минервой.
  - id: athena-flying-sandals
    name: "Летучие сандалии Афины"
    type: artifact
    description: >-
      Нетленные золотые сандалии богини, позволяющие ей лететь с быстротой ветра над сушей и морем. Афина надевает их перед отправлением с Олимпа на Итаку.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Владыка богов обсуждает с Афиной судьбу Одиссея и объясняет, что Посейдон мешает его возвращению из-за ослепления Полифема. Он вспоминает, как отправлял Гермеса предупредить Эгисфа о грозящей мести Ореста. В переводе Батлера назван Юпитером.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Бог моря, который продолжает преследовать Одиссея за ослепление циклопа Полифема, своего сына. Пока остальные боги совещаются, Посейдон находится на пиру у эфиопов. В переводе Батлера именуется Нептуном.
  - id: calypso
    name: "Калипсо"
    type: character
    description: >-
      Бессмертная богиня, дочь Атланта, удерживающая Одиссея на своём острове в пещере и желающая сделать его супругом. Афина говорит, что Калипсо уговорами старается заставить героя забыть родину; сама Калипсо в этой песне не появляется.
  - id: atlas
    name: "Атлант"
    type: character
    description: >-
      Отец Калипсо, названный волшебником, ведающим морскими глубинами. Он поддерживает огромные столпы, разделяющие землю и небо; его действия упомянуты Афиной при описании острова Калипсо.
  - id: polyphemus
    name: "Полифем"
    type: creature
    description: >-
      Циклоп, сын Посейдона и морской нимфы Фоосы. Зевс напоминает, что Одиссей ослепил Полифема, и именно за это Посейдон препятствует возвращению героя. В событиях песни циклоп не появляется.
  - id: thoosa
    name: "Фооса"
    type: character
    description: >-
      Морская нимфа, мать циклопа Полифема от Посейдона и дочь морского владыки Форкия. Упоминается в объяснении Зевса о происхождении вражды Посейдона к Одиссею.
  - id: phorcys
    name: "Форкий"
    type: character
    description: >-
      Морской владыка и отец нимфы Фоосы, через неё дед Полифема. В песне упомянут только в родословной циклопа; самостоятельных действий не совершает.
  - id: hermes
    name: "Гермес"
    type: character
    description: >-
      Посланник богов, которого Зевс ранее отправил предупредить Эгисфа о возмездии Ореста. Афина предлагает вновь послать его к Калипсо с приказом отпустить Одиссея; в этой песне новое поручение только обсуждается. В переводе Батлера именуется Меркурием.
  - id: helios
    name: "Гелиос-Гиперион"
    type: character
    description: >-
      Солнечный бог, чьих священных быков съели спутники Одиссея. Вступление связывает этот проступок с их гибелью и невозможностью вернуться домой; сам бог в событиях Итаки не появляется.
