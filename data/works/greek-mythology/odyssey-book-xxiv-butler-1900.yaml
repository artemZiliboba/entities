id: odyssey-book-xxiv-butler-1900
title: "Одиссея. Песнь XXIV: Души женихов и примирение"
original_title: "Odyssey, Book XXIV"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XXIV, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полный текст песни XXIV в переводе Батлера (1900). Разделены события в царстве мёртвых, воспоминание о похоронах Ахилла и заключительное примирение на Итаке; другие варианты не смешаны."
entities:
  - id: hermes
    name: "Гермес"
    type: character
    description: >-
      Бог-проводник мёртвых собирает души женихов, убитых Одиссеем, и ведёт их в подземный мир. В руках он держит золотой жезл, которым способен усыплять и пробуждать людей. В переводе Батлера именуется Меркурием.
  - id: hermes-golden-wand
    name: "Золотой жезл Гермеса"
    type: artifact
    description: >-
      Жезл бога Гермеса, которым он по своему желанию смыкает людям глаза сном и вновь пробуждает их. С ним Гермес созывает и сопровождает души погибших женихов.
  - id: suitors-shades
    name: "Тени погибших женихов"
    type: character
    description: >-
      Души женихов, убитых Одиссеем, которых Гермес собирает и ведёт в царство мёртвых. Они сохраняют память о гибели и рассказывают там о событиях на Итаке; Амфимедонт беседует с тенью Агамемнона.
  - id: hades-realm
    name: "Царство Аида"
    type: location
    description: >-
      Подземная область умерших, куда Гермес приводит души женихов. Путь проходит мимо вод Океана, скалы Левкады, солнечных врат и страны сновидений к асфоделевому лугу, где обитают тени умерших героев.
  - id: asphodel-meadow
    name: "Асфоделевый луг"
    type: location
    description: >-
      Луг в мире мёртвых, где пребывают души умерших. Здесь тени Ахилла, Агамемнона и других героев встречают приведённых Гермесом женихов и расспрашивают об их гибели.
  - id: achilles-shade
    name: "Тень Ахилла"
    type: character
    description: >-
      Душа павшего под Троей героя, находящаяся в мире мёртвых. Она беседует с тенью Агамемнона о гибели и погребении; Ахилл вспоминается также как сын морской богини Фетиды.
  - id: agamemnon-shade
    name: "Тень Агамемнона"
    type: character
    description: >-
      Душа убитого после возвращения из Трои царя. В подземном мире беседует с Ахиллом, затем узнаёт тень жениха Амфимедонта и расспрашивает её о гибели женихов. Хвалит верность Пенелопы.
  - id: patroclus-antilochus-ajax-shades
    name: "Тени Патрокла, Антилоха и Аякса"
    type: character
    description: >-
      Души погибших участников Троянской войны, пребывающие вместе с тенью Ахилла на асфоделевом лугу. Они названы как умершие герои, но не произносят самостоятельных речей в этой песне.
  - id: thetis
    name: "Фетида"
    type: character
    description: >-
      Бессмертная морская мать Ахилла. В рассказе Агамемнона о погребении сына она выходит из моря вместе с нимфами, приносит погребальные одежды и сосуд для останков, а затем учреждает состязания в его честь.
  - id: nereids
    name: "Морские нимфы, дочери морского старца"
    type: creature
    description: >-
      Бессмертные морские спутницы Фетиды, поднявшиеся из моря, чтобы оплакать Ахилла. Они облачают тело погибшего в бессмертные одежды; их появление пугает ахейское войско.
  - id: muses
    name: "Девять муз"
    type: character
    description: >-
      Девять божественных певиц, которые в рассказе Агамемнона поют погребальный плач по Ахиллу. Их песня заставляет всё ахейское войско рыдать; сами музы не участвуют в событиях на Итаке.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Владыка богов, который в рассказе о погребении Ахилла останавливает битву ураганом. В настоящем песни он обсуждает с Афиной примирение жителей Итаки и посылает огненную молнию, после которой Одиссей прекращает бой.
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня придаёт старому Лаэрту более внушительный облик и затем вливает в него новую силу. В образе Ментора побуждает его метнуть копьё, останавливает схватку и заключает мир между Одиссеем и его противниками.
  - id: laertes-divine-renewal
    name: "Божественное обновление Лаэрта"
    type: phenomenon
    description: >-
      Афина изменяет облик престарелого Лаэрта, делая его выше и крепче, а во время последней схватки вливает в него новые силы. Оба проявления связаны с одним адресным вмешательством богини.
  - id: zeus-thunderbolt-peace
    name: "Молния Зевса при прекращении распри"
    type: phenomenon
    description: >-
      Когда Одиссей собирается продолжать преследование противников, Зевс бросает огненную молнию перед Афиной. Богиня истолковывает знак как требование остановить войну, и Одиссей подчиняется.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Бог, к которому Лаэрт обращается в молитвенном пожелании вернуть ему былую силу, называя его вместе с Зевсом и Афиной. Сам Аполлон в событиях песни не появляется.
  - id: dionysus
    name: "Дионис"
    type: character
    description: >-
      Бог, названный дарителем золотого сосуда для останков Ахилла в рассказе Агамемнона. В переводе Батлера фигурирует под римским именем Вакх; никаких дополнительных свойств сосуда не утверждается.
  - id: hephaestus
    name: "Гефест"
    type: character
    description: >-
      Божественный кузнец, изготовивший золотой сосуд для праха Ахилла, о котором рассказывает Агамемнон. В переводе Батлера именуется Вулканом; само изделие не проявляет магических свойств.
