id: odyssey-book-xx-butler-1900
title: "Одиссея. Песнь XX: Знамения перед расправой"
original_title: "Odyssey, Book XX"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XX, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Песня XX целиком в английском прозаическом переводе Сэмюэла Батлера (1900). Рассказ Пенелопы о дочерях Пандарея отделён от происходящих в дворце событий; другие песни и версии не смешаны."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня является бодрствующему Одиссею в облике женщины, зависает над ним и обещает поддержку против женихов, после чего погружает его в сон. В рассказе Пенелопы Афина некогда одарила дочерей Пандарея разными умениями. Во время пира она не даёт женихам прекратить оскорбления, затем заставляет их смеяться против воли и лишает ясности рассудка.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог слышит просьбу Одиссея о двух знамениях и немедленно гремит громом с ясного неба. Одиссей воспринимает этот знак вместе со словами служанки как обещание близкого возмездия. В рассказе Пенелопы Зевс также назван богом, знающим судьбы людей.
  - id: artemis
    name: "Артемида"
    type: character
    description: >-
      Богиня, к которой измученная Пенелопа обращается с мольбой поразить её стрелой и избавить от страданий. В её рассказе Артемида даровала дочерям Пандарея внушительный облик. Просьба Пенелопы о смерти в этой песне не исполняется.
  - id: aphrodite
    name: "Афродита"
    type: character
    description: >-
      В рассказе Пенелопы богиня заботилась об осиротевших дочерях Пандарея, кормила их и отправилась к Зевсу устраивать их замужество. Пока Афродита отсутствовала, вихри похитили девушек и передали Эриниям. В событиях дворца богиня не появляется.
  - id: hera
    name: "Гера"
    type: character
    description: >-
      В мифологическом рассказе Пенелопы богиня наделила дочерей Пандарея красотой и разумом. Она не является и не действует в непосредственных событиях песни.
  - id: erinyes
    name: "Эринии"
    type: character
    description: >-
      Грозные сверхъестественные существа, служанками которых стали похищенные вихрями дочери Пандарея. Они упоминаются в рассказе Пенелопы о судьбе девушек и не появляются в дворце.
  - id: pandareus-daughters
    name: "Дочери Пандарея"
    type: character
    description: >-
      Осиротевшие девушки из рассказа Пенелопы, которых воспитывали богини. Афродита кормила их, Гера даровала красоту и ум, Артемида — величавость, а Афина — искусные умения. Затем вихри унесли их на служение Эриниям. Их необычная судьба передаётся как отдельный мифологический эпизод.
  - id: theoclymenus
    name: "Феоклимен"
    type: character
    description: >-
      Прорицатель видит над женихами покров тьмы, слёзы на их лицах, кровь на стенах и балках, призраков у входа и померкшее солнце. Он предсказывает гибель женихов и покидает дом, несмотря на их насмешки.
  - id: zeus-thunder-omen
    name: "Гром Зевса с ясного неба"
    type: phenomenon
    description: >-
      По молитве Одиссея Зевс громыхает с неба, на котором нет облаков. Это первое из двух знамений, о которых просил герой; он принимает гром как знак скорой расправы над женихами.
  - id: miller-woman-omen
    name: "Знамение слов мельничной служанки"
    type: phenomenon
    description: >-
      Услышав гром Зевса, служанка у мельницы просит, чтобы женихи в последний раз пировали в доме Одиссея. Её слова становятся вторым знамением, запрошенным Одиссеем, и подтверждают для него надежду на возмездие.
  - id: eagle-dove-omen
    name: "Знамение орла с голубем"
    type: phenomenon
    description: >-
      Орёл с голубем в когтях пролетает слева от женихов, когда они замышляют убийство Телемаха. Амфином истолковывает птицу как предостережение о неудаче заговора, после чего женихи отказываются от плана и идут пировать.
  - id: theoclymenus-doom-vision
    name: "Видение Феоклимена о гибели женихов"
    type: phenomenon
    description: >-
      Прорицатель воспринимает зловещие образы: тьму вокруг женихов, кровь на стенах, призраков, уходящих в подземный мир, и исчезновение солнечного света. Видение сопровождает его предупреждение о неизбежной гибели женихов; другие участники пира не разделяют его восприятия.
