id: odyssey-book-xxii-butler-1900
title: "Одиссея. Песнь XXII: Избиение женихов"
original_title: "Odyssey, Book XXII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XXII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Вся песнь XXII в английском прозаическом переводе Сэмюэла Батлера (1900), от убийства Антиноя до очищения дворца. Сцены и свойства из других песен или переводов не добавлялись."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня появляется во дворце в облике и с голосом Ментора, ободряет Одиссея и испытывает его стойкость. Затем принимает вид ласточки и садится на стропило. Она делает бесплодными метания копий женихов и поднимает свою грозную эгиду, внушая им ужас и обращая в бегство. В переводе Батлера названа Минервой.
  - id: athena-aegis
    name: "Эгида Афины"
    type: artifact
    description: >-
      Грозный божественный предмет, который Афина поднимает со стропила во время последней схватки. При его появлении женихи испытывают ужас и бегут к дальнему краю двора, после чего Одиссей и его союзники завершают разгром.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, названный отцом Афины и упомянутый в речах героев. Во дворе находится посвящённый ему алтарь, у которого ищут защиты певец Фемий и глашатай Медонт. В событиях песни Зевс лично не является и отдельного знамения не посылает.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Бог, к которому Одиссей обращается перед выстрелом в Антиноя, надеясь, что тот позволит поразить новую цель. В этой песне Аполлон непосредственно не появляется; попадание стрелы не названо отдельным чудом бога.
