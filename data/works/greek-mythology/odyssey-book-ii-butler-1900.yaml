id: odyssey-book-ii-butler-1900
title: "Одиссея. Песнь II: Собрание на Итаке и отплытие Телемаха"
original_title: "Odyssey, Book II"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book II, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полная песнь II, перевод Сэмюэла Батлера (1900): от созыва собрания до ночного отплытия Телемаха. Имена и события из других песен не подставлялись вместо формулировок этой."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня придаёт Телемаху необычайное величие перед собранием. Затем является ему в облике и с голосом Ментора, принимает облик самого Телемаха, чтобы собрать команду, погружает женихов в сон и посылает кораблю попутный западный ветер. В переводе Батлера названа Минервой.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Владыка богов посылает двух орлов над собранием итакийцев, когда Телемах осуждает женихов. Прорицатель Галитерс истолковывает их поведение как знак близкого возвращения Одиссея и гибели женихов; сами женихи спорят с этим толкованием.
  - id: zeus-eagle-omen
    name: "Знамение двух орлов Зевса"
    type: phenomenon
    description: >-
      Два орла, посланные Зевсом, кружат над собранием жителей Итаки, дерутся и улетают направо. Галитерс видит в этом предвестие возвращения Одиссея и бедствия для женихов. Знамение имеет отдельную сюжетную роль в споре о будущем дома Одиссея.
  - id: erinyes
    name: "Эринии"
    type: creature
    description: >-
      Божественные мстительницы, которых, по словам Телемаха, Пенелопа могла бы призвать на него, если бы он насильно выгнал мать из дома. В песне они лишь упомянуты как возможные исполнительницы материнского проклятия и не появляются.
  - id: cyclops
    name: "Циклоп"
    type: creature
    description: >-
      Свирепый одноглазый великан, о котором Эгиптий говорит как об убийце его сына Антифа: циклоп запер спутников Одиссея в пещере и съел юношу. Здесь он существует только в воспоминании о прежнем путешествии; имя Полифема в этой песне не произнесено.
  - id: themis
    name: "Фемида"
    type: character
    description: >-
      Богиня, которую Телемах призывает вместе с Зевсом во время народного собрания, называя покровительницей его созыва и завершения. Непосредственного вмешательства Фемиды в события песни не показано.
