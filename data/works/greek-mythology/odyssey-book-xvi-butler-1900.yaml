id: odyssey-book-xvi-butler-1900
title: "Одиссея. Песнь XVI: Одиссей открывается Телемаху"
original_title: "Odyssey, Book XVI"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XVI, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полный текст песни XVI в переводе Сэмюэла Батлера (1900), от прибытия Телемаха к Евмею до ночлега в хижине. Соседние песни и другие варианты не смешивались."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня приходит к хижине Евмея в облике величественной женщины, когда свинопас уходит в город. Она открывается Одиссею, но остаётся невидимой для Телемаха; собаки замечают её и пугаются. Афина велит Одиссею открыться сыну и золотым жезлом возвращает ему молодость и благородный облик. Позднее она усыпляет Пенелопу и вновь превращает Одиссея в старого нищего, чтобы Евмей его не узнал.
  - id: athena-golden-wand
    name: "Золотой жезл Афины"
    type: artifact
    description: >-
      Жезл богини, прикосновением которого она дважды меняет внешность Одиссея. Сначала возвращает ему молодость, здоровый цвет лица, тёмную бороду и красивую одежду, чтобы Телемах узнал отца; затем снова делает его старым и одетым в лохмотья перед возвращением Евмея. Чудесное действие жезла непосредственно описано в этой песне.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, отец Афины, которого Одиссей называет своим возможным союзником в борьбе с женихами. Телемах признаёт, что Зевс и Афина обладают властью над богами и людьми. В песне Зевс не появляется и лично не совершает чуда; его помощь обсуждается как надежда героев.
