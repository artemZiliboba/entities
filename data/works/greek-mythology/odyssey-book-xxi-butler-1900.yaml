id: odyssey-book-xxi-butler-1900
title: "Одиссея. Песнь XXI: Испытание луком"
original_title: "Odyssey, Book XXI"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XXI, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Прочитана вся песнь XXI в английском прозаическом переводе Сэмюэла Батлера (1900), от решения Пенелопы устроить состязание до выстрела Одиссея сквозь двенадцать топоров. Другие песни и варианты не смешаны."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня внушает Пенелопе решение испытать женихов луком Одиссея и двенадцатью топорами, подготавливая их гибель. Позднее она насылает на Пенелопу сладкий сон, когда та возвращается в свои покои. В переводе Батлера названа Минервой.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, в переводе Батлера именуемый Юпитером. Когда Одиссей натягивает свой лук, Зевс громко гремит как знак; герой радуется услышанному предзнаменованию перед началом расправы над женихами.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Бог-лучник, праздник которого отмечают женихи в день испытания луком. Антиной предлагает принести ему жертву, прежде чем возобновить состязание на следующий день; Пенелопа допускает, что Аполлон может даровать незнакомцу славу победителя. Сам бог в песне не является.
  - id: heracles
    name: "Геракл"
    type: character
    description: >-
      Могучий сын Зевса, упомянутый в предыстории лука Одиссея. Рассказчик говорит о его необычайных подвигах и о том, как он убил Ифита, нарушив закон гостеприимства, и присвоил его коней. В текущих событиях песни Геракл не появляется.
  - id: centaurs
    name: "Кентавры"
    type: creature
    description: >-
      Мифические существа, о войне которых с людьми рассказывает Антиной, предостерегая мнимого нищего от пьянства. Кентавр Эвритион, опьянев в доме Пирифоя, совершил бесчинства, за что герои изувечили его; после этого началась вражда между людьми и кентаврами. Эпизод приведён как пример, а не происходит в доме Одиссея.
  - id: zeus-thunder-omen
    name: "Гром Зевса при натягивании лука"
    type: phenomenon
    description: >-
      Зевс посылает гром именно в тот момент, когда Одиссей легко натягивает лук, с которым не справились женихи. Герой распознаёт звук как благоприятное знамение перед выстрелом через двенадцать топоров. Это отдельный эпизод, не тождественный грому с ясного неба в песне XX.
