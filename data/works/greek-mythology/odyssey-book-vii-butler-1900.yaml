id: odyssey-book-vii-butler-1900
title: "Одиссея. Песнь VII: дворец Алкиноя"
original_title: "Odyssey, Book VII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book VII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полный текст песни VII в английском прозаическом переводе Сэмюэла Батлера (1900), от прибытия Навсикаи домой до ночлега Одиссея во дворце Алкиноя. Не смешивались соседние песни и позднейшие варианты."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня скрывает Одиссея густым туманом, чтобы жители города феаков его не заметили, и под видом маленькой девочки с кувшином провожает к дворцу Алкиноя. После этого покидает Схерию и направляется в Афины.
  - id: athena-concealing-mist
    name: "Скрывающий туман Афины"
    type: phenomenon
    description: >-
      Созданное Афиной облако тьмы, внутри которого Одиссей остаётся невидимым для феаков, пока проходит по городу и входит во дворец. Туман исчезает, когда герой припадает к коленям царицы Ареты.
  - id: hephaestus
    name: "Гефест"
    type: character
    description: >-
      Божественный кузнец, который, согласно описанию дворца Алкиноя, изготовил золотых и серебряных сторожевых псов. Эти создания не умирают и не стареют; сам Гефест в событиях песни не появляется.
  - id: immortal-metal-guard-dogs
    name: "Бессмертные металлические псы дворца Алкиноя"
    type: artifact
    description: >-
      Золотые и серебряные изображения сторожевых собак, изготовленные Гефестом для охраны дворца царя Алкиноя. В отличие от обычных статуй, они прямо названы бессмертными и нестареющими. Песня не описывает их передвижения, речи или нападений.
  - id: alcinous-everfruiting-garden
    name: "Вечно плодоносящий сад Алкиноя"
    type: location
    description: >-
      Сад при дворце царя феаков, где груши, яблоки, инжир, маслины и виноград плодоносят без перерыва круглый год: новый урожай поспевает прежде, чем исчезает прежний. Плоды не гниют и не пропадают. Текст связывает изобилие с мягким воздухом и дарами богов, не называя отдельного заклинания.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Морской бог, названный предком царского рода феаков: от Перибеи у него родился Навсифой, дед царицы Ареты. По словам Афины, феаки плавают по морю милостью Посейдона. В действии песни VII бог лично не появляется.
  - id: phaeacian-ships
    name: "Быстроходные корабли феаков"
    type: artifact
    description: >-
      Корабли феаков, о которых Афина говорит, что они скользят по морю быстро, словно мысль или птица. Алкиной рассказывает о плавании до Эвбеи и обратно за один день. Песня VII не утверждает, что суда сами управляют собой или обладают сознанием: это описание необычайной скорости, а не доказательство автономной магии.
