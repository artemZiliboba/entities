id: odyssey-book-viii-butler-1900
title: "Одиссея. Песнь VIII: игры феаков и песнь Демодока"
original_title: "Odyssey, Book VIII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book VIII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Вся песнь VIII в переводе Сэмюэла Батлера (1900), включая рассказ Демодока об Аресе и Афродите и описание кораблей феаков. События внутри песни Демодока отмечены как вложенный рассказ, не как происходящие при Одиссее."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня принимает облик слуги Алкиноя и созывает феаков на собрание, а затем делает Одиссея на вид выше и красивее. Во время состязаний она появляется в облике мужчины и отмечает место, куда упал далеко брошенный Одиссеем диск. В песне Демодока ей также приписывается помощь ахейцам при взятии Трои.
  - id: muse-of-demodocus
    name: "Муза — покровительница Демодока"
    type: character
    description: >-
      Божественная покровительница певца Демодока, одарившая его искусством песнопения, но лишившая зрения. Во время пира вдохновляет его воспеть ссору Одиссея с Ахиллом. Её личное имя в песне не названо.
  - id: hephaestus
    name: "Гефест"
    type: character
    description: >-
      В песне Демодока божественный кузнец узнаёт об измене Афродиты с Аресом и выковывает невидимые неразрывные путы, чтобы поймать их на супружеском ложе. Позднее освобождает пленников, получив обещание Посейдона отвечать за возмещение.
  - id: hephaestus-invisible-chains
    name: "Невидимые путы Гефеста"
    type: artifact
    description: >-
      Выкованные Гефестом чрезвычайно тонкие цепи, которых не может увидеть даже бог и которые нельзя разорвать или развязать. Они удерживают Ареса и Афродиту неподвижно на ложе, пока кузнец не освобождает их. Описаны внутри песни Демодока.
  - id: ares
    name: "Арес"
    type: character
    description: >-
      Бог войны, который в песне Демодока тайно встречается с Афродитой в доме Гефеста. Попадает в невидимую сеть божественного кузнеца и не может пошевелиться, пока Посейдон не добивается его освобождения.
  - id: aphrodite
    name: "Афродита"
    type: character
    description: >-
      Богиня любви, супруга Гефеста в рассказе Демодока. Вместе с Аресом оказывается в неразрывных путях; после освобождения отправляется в своё святилище в Пафосе на Кипре, где Хариты купают и одевают её.
  - id: helios
    name: "Гелиос"
    type: character
    description: >-
      Бог солнца, замечающий тайные встречи Ареса и Афродиты и сообщающий о них Гефесту. Позже он вновь следит за домом кузнеца и извещает его, когда любовники оказываются в ловушке.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      В песне Демодока морской бог выступает поручителем Ареса и убеждает Гефеста отпустить пленников, обещая самому уплатить возмещение, если Арес этого не сделает. В конце песни Алкиной пересказывает предостережение о возможной расправе Посейдона над кораблями феаков.
  - id: hermes
    name: "Гермес"
    type: character
    description: >-
      Божественный вестник присутствует среди богов, пришедших увидеть пленённых Ареса и Афродиту. В шутливом разговоре с Аполлоном признаётся, что согласился бы оказаться в таких же путах рядом с Афродитой.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Бог, который в песне Демодока разговаривает с Гермесом у ложа пленённых богов. В начале песни упомянуто также его прорицание Агамемнону в Пифо о ссоре ахейских вождей.
  - id: graces
    name: "Хариты"
    type: character
    description: >-
      Божественные спутницы Афродиты, которые в рассказе Демодока после её освобождения купают богиню в Пафосе, умащают амброзиальным маслом и одевают в прекрасные одежды.
  - id: phaeacian-self-steering-ships
    name: "Самоуправляющиеся корабли феаков"
    type: artifact
    description: >-
      По словам царя Алкиноя, суда феаков не нуждаются в кормчих и обычных рулях: они сами понимают желания путешественников, знают города и страны и безопасно проходят сквозь туман и облака. Это прямое описание их необыкновенных свойств в песне VIII.
  - id: circe-chest-binding
    name: "Узел для сундука, которому научила Кирка"
    type: artifact
    description: >-
      Особый способ завязать сундук с дарами феаков, которому Кирка ранее научила Одиссея. В песне VIII герой применяет этот узел, чтобы надёжно закрыть крышку. Текст не утверждает, что узел волшебный или делает сундук неуязвимым.
