id: odyssey-book-iv-butler-1900
title: "Одиссея. Песнь IV: Телемах у Менелая и рассказ о Протее"
original_title: "Odyssey, Book IV"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book IV, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полная песнь IV, перевод Сэмюэла Батлера (1900): приём Телемаха в Спарте, рассказ Менелая о Протее и заговор женихов на Итаке. События прошлого и сновидение Пенелопы различаются; соседние песни не смешаны."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      В воспоминании Менелая отводит Елену от деревянного коня у Трои. На Итаке слышит молитву Пенелопы и создаёт для неё утешительное сновидение в облике сестры Ифтимы. В переводе Батлера именуется Минервой.
  - id: penelope-dream-phantom
    name: "Сновидение в облике Ифтимы"
    type: phenomenon
    description: >-
      Созданный Афиной призрак является спящей Пенелопе под видом её сестры Ифтимы, обещает возвращение Телемаха и говорит о покровительстве богини. После разговора видение исчезает, а Пенелопа пробуждается успокоенной.
  - id: proteus
    name: "Протей"
    type: character
    description: >-
      Бессмертный морской старец, слуга Посейдона, знающий морские пути и судьбы людей. Захваченный Менелаем, он превращается в льва, дракона, леопарда, кабана, воду и дерево, но в конце открывает путь домой и рассказывает о судьбах ахейцев.
  - id: eidothea
    name: "Эйдофея"
    type: character
    description: >-
      Морская богиня, дочь Протея, помогает Менелаю захватить отца: указывает время его выхода на берег, добывает тюленьи шкуры для укрытия и приносит амброзию, заглушающую их запах.
  - id: ambrosia-seal-scent
    name: "Амброзия против запаха тюленей"
    type: substance
    description: >-
      Ароматная амброзия, которую Эйдофея помещает под носы Менелаю и трём его спутникам, чтобы заглушить невыносимый запах тюленьих шкур во время засады на Протея.
  - id: helen-nepenthe
    name: "Зелье Елены, избавляющее от печали"
    type: substance
    description: >-
      Сильнодействующее египетское средство, подаренное Елене Полидамной, женой Фона. Подмешанное в вино, оно на целый день лишает выпивших способности плакать даже при самых тяжёлых утратах.
  - id: elysian-plain
    name: "Элизийские поля"
    type: location
    description: >-
      Блаженная область на краю света, куда, по пророчеству Протея, боги перенесут Менелая вместо обычной смерти в Аргосе. Там не бывает снега, дождя и града, а с Океана постоянно веет освежающий западный ветер.
  - id: rhadamanthus
    name: "Радаманф"
    type: character
    description: >-
      Правитель Элизийских полей, названный Протеем при пророчестве о посмертной судьбе Менелая. В событиях песни не появляется.
  - id: calypso
    name: "Калипсо"
    type: character
    description: >-
      Нимфа, удерживающая Одиссея на далёком острове. Протей видит героя в её доме и сообщает Менелаю, что Одиссей не может отплыть из-за отсутствия корабля и команды.
  - id: poseidon
    name: "Посейдон"
    type: character
    description: >-
      Бог моря, повелевающий Протеем. В рассказе морского старца Посейдон сначала спасает Аякса из воды, затем раскалывает трезубцем скалу Гирей, когда тот хвастается независимостью от богов, и Аякс гибнет.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Владыка богов, к которому Менелай должен принести жертвы для возвращения домой. Протей предсказывает особую судьбу Менелая благодаря родству с Зевсом через Елену; Елена называет Зевса подателем добра и зла.
  - id: hera
    name: "Гера"
    type: character
    description: >-
      Богиня, которая, согласно рассказу Протея, оберегает Агамемнона во время его морского возвращения после Троянской войны. В текущих событиях Спарты не появляется.
  - id: aphrodite
    name: "Афродита"
    type: character
    description: >-
      Богиня, которую Елена винит в своём уходе из дома к троянцам. Елена упоминает её воздействие как причину своего прежнего поступка; сама богиня в этой песне не появляется.
  - id: hephaestus
    name: "Гефест"
    type: character
    description: >-
      Божественный кузнец, изготовивший серебряную чашу с золотым ободом, которую Менелай намерен подарить Телемаху. Никаких сверхъестественных свойств чаши текст не сообщает.
  - id: paeon
    name: "Пеон"
    type: character
    description: >-
      Божественный родоначальник египетских врачевателей: повествователь говорит, что жители Египта искусны в лекарствах, поскольку происходят от Пеона. Лично он в сюжете не действует.
