id: odyssey-book-xviii-butler-1900
title: "Одиссея. Песнь XVIII: Схватка Одиссея с Иром"
original_title: "Odyssey, Book XVIII"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XVIII, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Песнь XVIII целиком, английский прозаический перевод Сэмюэла Батлера (1900). Описаны непосредственные действия богини Афины и упоминания иных божеств; события соседних песен и других версий не добавлялись."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня непосредственно вмешивается в события дворца. Перед поединком с Иром она усиливает члены Одиссея, вызывая удивление женихов. Затем предопределяет гибель Амфинома от руки Телемаха, внушает Пенелопе желание показаться женихам, погружает её в сон и чудесно придаёт ей красоту и величественный вид. Позднее Афина побуждает Евримаха оскорблять Одиссея, усиливая негодование героя против женихов.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, к которому женихи обращают благопожелания после победы Одиссея над Иром; Телемах также призывает Зевса вместе с Афиной и Аполлоном покарать женихов. В самой песне Зевс не является и непосредственно не совершает чуда.
  - id: aphrodite
    name: "Афродита"
    type: character
    description: >-
      Богиня красоты, названная в описании преображения Пенелопы. Афина придаёт царице красоту, подобную той, которой Афродита обладает, когда танцует с Харитами. Сама Афродита в действии песни не участвует.
  - id: charites
    name: "Хариты"
    type: character
    description: >-
      Божественные спутницы Афродиты, упомянутые в сравнении при описании чудесно украшенной Афиной Пенелопы: богиня любви танцует вместе с Харитами. В песне Хариты не появляются лично и не действуют.
  - id: artemis
    name: "Артемида"
    type: character
    description: >-
      Богиня, к которой Пенелопа обращает желание умереть во сне без мучений, подобно тому как она только что сладко заснула благодаря Афине. Артемида не появляется, и просьба в этой песне не исполняется.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Бог, к которому Телемах в присутствии Пенелопы обращает пожелание о гибели женихов наряду с Зевсом и Афиной. В песне XVIII Аполлон не появляется и не совершает самостоятельного действия.
