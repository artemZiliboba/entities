id: odyssey-book-xv-butler-1900
title: "Одиссея. Песнь XV: возвращение Телемаха"
original_title: "Odyssey, Book XV"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XV, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Полный текст песни XV в переводе Сэмюэла Батлера (1900): возвращение Телемаха, два птичьих знамения, родословная Феоклимена и рассказ Евмея. Родословные и рассказ Евмея отделены от событий основного действия; другие песни и версии не смешивались."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня приходит к Телемаху в Лакедемон, предупреждает его о засаде женихов и указывает безопасный путь к дому Евмея. После этого возвращается на Олимп. Когда Телемах отплывает из Пилоса, Афина посылает ему попутный ветер.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, к которому обращаются с молитвами о благополучном возвращении Телемаха. В рассказе Евмея Зевс посылает попутный ветер финикийскому кораблю, увозящему мальчика с родного острова. Прямого появления Зевса в песне нет.
  - id: apollo
    name: "Аполлон"
    type: character
    description: >-
      Бог, связанный с прорицанием: в родословной Феоклимена сказано, что он сделал Полифида величайшим прорицателем после смерти Амфиарая. Ястреб, появившийся перед Телемахом на Итаке, назван вестником Аполлона. По рассказу Евмея, Аполлон вместе с Артемидой безболезненно поражает стрелами престарелых жителей острова Сиры.
  - id: artemis
    name: "Артемида"
    type: character
    description: >-
      Богиня, которая в рассказе Евмея вместе с Аполлоном приходит к престарелым жителям Сиры и прекращает их жизнь безболезненными стрелами. В том же рассказе Артемида поражает финикиянку, похитившую маленького Евмея, и та падает замертво на корабле.
  - id: eos
    name: "Эос"
    type: character
    description: >-
      Богиня зари, которая, согласно родословному отступлению о предках Феоклимена, уносит прекрасного Клита, чтобы он жил среди бессмертных. Это событие относится к предыстории рода, а не к путешествию Телемаха.
  - id: erinys
    name: "Эриния"
    type: character
    description: >-
      Грозная божественная сила, упомянутая в истории прорицателя Мелампода: она навлекает на него тяжкое душевное страдание во время заточения у Филака. Песнь не уточняет её индивидуального имени и не описывает отдельного появления.
  - id: theoclymenus
    name: "Феоклимен"
    type: character
    description: >-
      Прорицатель из рода Мелампода, бежавший из Аргоса после убийства родственника. Телемах берёт его на корабль. На Итаке Феоклимен распознаёт в полёте ястреба с голубем божественное знамение и предсказывает сохранение власти за домом Одиссея.
  - id: eagle-with-goose-omen
    name: "Знамение орла с гусем"
    type: phenomenon
    description: >-
      Перед отъездом Телемаха из Лакедемона справа от путников пролетает орёл, несущий белого домашнего гуся. Елена толкует это как предвестие возвращения Одиссея и его мести женихам. Текст передаёт толкование Елены, а не утверждает, что орёл обладает сверхъестественными способностями.
  - id: hawk-with-dove-omen
    name: "Знамение ястреба с голубем"
    type: phenomenon
    description: >-
      После прибытия Телемаха на Итаку справа пролетает ястреб, названный вестником Аполлона, и разрывает пойманного голубя; перья падают между кораблём и Телемахом. Прорицатель Феоклимен видит в этом посланный богом знак будущего могущества рода Одиссея.
