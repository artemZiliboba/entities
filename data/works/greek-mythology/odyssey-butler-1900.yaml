entities:
  - id: athena
    name: "Афина"
    type: character
    description: "Песнь 1: Богиня просит Зевса помочь возвращению Одиссея и отправляется на Итаку, приняв облик тафийского царя Ментеса. Она внушает Телемаху решимость отправиться за вестями об отце, затем улетает подобно птице и насылает сон на Пенелопу. В переводе Батлера именуется Минервой.\n\nПеснь 2: Богиня придаёт Телемаху необычайное величие перед собранием. Затем является ему в облике и с голосом Ментора, принимает облик самого Телемаха, чтобы собрать команду, погружает женихов в сон и посылает кораблю попутный западный ветер. В переводе Батлера названа Минервой.\n\nПеснь 3: Сопровождает Телемаха в Пилос под обликом Ментора, придаёт ему смелости говорить с Нестором и молится Посейдону во время жертвенного пира. Вечером улетает в облике орла, открывая Нестору свою божественную природу. На следующий день лично принимает посвящённую ей жертву; Нестор также вспоминает её гнев на ахейцев после взятия Трои.\n\nПеснь 4: В воспоминании Менелая отводит Елену от деревянного коня у Трои. На Итаке слышит молитву Пенелопы и создаёт для неё утешительное сновидение в облике сестры Ифтимы. В переводе Батлера именуется Минервой.\n\nПеснь 5: Богиня, заступающаяся за Одиссея перед Зевсом. После того как Посейдон разбивает плот героя бурей, Афина останавливает остальные ветры, направляет спасительный северный ветер, помогает Одиссею выбраться из прибоя и в конце навевает ему сон.\n\nПеснь 6: Богиня, которая приходит к спящей Навсикае в облике её подруги, дочери Диманта, и убеждает отправиться стирать одежду. Затем она устраивает пробуждение Одиссея, вселяет в Навсикаю мужество и устраняет её страх перед незнакомцем. После омовения героя Афина делает его выше и красивее, придавая волосам пышность. В конце песни слышит молитву Одиссея, но не показывается ему из-за гнева Посейдона.\n\nПеснь 7: Богиня скрывает Одиссея густым туманом, чтобы жители города феаков его не заметили, и под видом маленькой девочки с кувшином провожает к дворцу Алкиноя. После этого покидает Схерию и направляется в Афины.\n\nПеснь 8: Богиня принимает облик слуги Алкиноя и созывает феаков на собрание, а затем делает Одиссея на вид выше и красивее. Во время состязаний она появляется в облике мужчины и отмечает место, куда упал далеко брошенный Одиссеем диск. В песне Демодока ей также приписывается помощь ахейцам при взятии Трои.\n\nПеснь 13: Богиня покровительствует возвращению Одиссея: внушает феакам щедрость, окутывает Итаку туманом, чтобы скрыть его прибытие, и появляется перед ним сначала юным пастухом, затем женщиной. Развеивает туман, помогает спрятать дары и прикосновением жезла превращает героя на вид в дряхлого, неприметного старика, чтобы его не узнали женихи и близкие.\n\nПеснь 14: Богиня, направившая Одиссея к верному свинопасу Евмею ещё в конце предыдущей песни. В песне XIV её имя звучит в вымышленном рассказе Одиссея, где он приписывает Афине и Аресу свою воинскую доблесть; нового явления богини здесь нет.\n\nПеснь 15: Богиня приходит к Телемаху в Лакедемон, предупреждает его о засаде женихов и указывает безопасный путь к дому Евмея. После этого возвращается на Олимп. Когда Телемах отплывает из Пилоса, Афина посылает ему попутный ветер.\n\nПеснь 16: Богиня приходит к хижине Евмея в облике величественной женщины, когда свинопас уходит в город. Она открывается Одиссею, но остаётся невидимой для Телемаха; собаки замечают её и пугаются. Афина велит Одиссею открыться сыну и золотым жезлом возвращает ему молодость и благородный облик. Позднее она усыпляет Пенелопу и вновь превращает Одиссея в старого нищего, чтобы Евмей его не узнал.\n\nПеснь 17: Богиня наделяет Телемаха необыкновенной красотой и величием, так что окружающие дивятся его виду. Позднее побуждает переодетого Одиссея просить пищу у каждого жениха, чтобы испытать их характер. Само переодевание Одиссея в этой песне не происходит: его облик был изменён Афиной раньше.\n\nПеснь 18: Богиня непосредственно вмешивается в события дворца. Перед поединком с Иром она усиливает члены Одиссея, вызывая удивление женихов. Затем предопределяет гибель Амфинома от руки Телемаха, внушает Пенелопе желание показаться женихам, погружает её в сон и чудесно придаёт ей красоту и величественный вид. Позднее Афина побуждает Евримаха оскорблять Одиссея, усиливая негодование героя против женихов.\n\nПеснь 19: Богиня помогает Одиссею и Телемаху убрать оружие из зала, идя впереди с золотым светильником, озаряющим помещение необычайным сиянием. Позднее она отвлекает внимание Пенелопы, чтобы та не заметила, как Евриклея узнала мужа по шраму, и в конце песни насылает Пенелопе сладкий сон.\n\nПеснь 20: Богиня является бодрствующему Одиссею в облике женщины, зависает над ним и обещает поддержку против женихов, после чего погружает его в сон. В рассказе Пенелопы Афина некогда одарила дочерей Пандарея разными умениями. Во время пира она не даёт женихам прекратить оскорбления, затем заставляет их смеяться против воли и лишает ясности рассудка.\n\nПеснь 21: Богиня внушает Пенелопе решение испытать женихов луком Одиссея и двенадцатью топорами, подготавливая их гибель. Позднее она насылает на Пенелопу сладкий сон, когда та возвращается в свои покои. В переводе Батлера названа Минервой.\n\nПеснь 22: Богиня появляется во дворце в облике и с голосом Ментора, ободряет Одиссея и испытывает его стойкость. Затем принимает вид ласточки и садится на стропило. Она делает бесплодными метания копий женихов и поднимает свою грозную эгиду, внушая им ужас и обращая в бегство. В переводе Батлера названа Минервой.\n\nПеснь 23: Богиня преображает внешность Одиссея после омовения, делая его выше, сильнее и красивее. Затем задерживает наступление рассвета, чтобы супруги могли дольше оставаться вместе, а утром скрывает Одиссея и его спутников во тьме при выходе из города.\n\nПеснь 24: Богиня придаёт старому Лаэрту более внушительный облик и затем вливает в него новую силу. В образе Ментора побуждает его метнуть копьё, останавливает схватку и заключает мир между Одиссеем и его противниками."
  - id: athena-flying-sandals
    name: "Летучие сандалии Афины"
    type: artifact
    description: "Песнь 1: Нетленные золотые сандалии богини, позволяющие ей лететь с быстротой ветра над сушей и морем. Афина надевает их перед отправлением с Олимпа на Итаку."
  - id: zeus
    name: "Зевс"
    type: character
    description: "Песнь 1: Владыка богов обсуждает с Афиной судьбу Одиссея и объясняет, что Посейдон мешает его возвращению из-за ослепления Полифема. Он вспоминает, как отправлял Гермеса предупредить Эгисфа о грозящей мести Ореста. В переводе Батлера назван Юпитером.\n\nПеснь 2: Владыка богов посылает двух орлов над собранием итакийцев, когда Телемах осуждает женихов. Прорицатель Галитерс истолковывает их поведение как знак близкого возвращения Одиссея и гибели женихов; сами женихи спорят с этим толкованием.\n\nПеснь 3: В рассказе Нестора о возвращении ахейцев после падения Трои Зевс препятствует их отплытию, разжигает раздоры и насылает бурю на корабли Менелая. Эти действия относятся к прошлому, а не к путешествию Телемаха в Пилос.\n\nПеснь 4: Владыка богов, к которому Менелай должен принести жертвы для возвращения домой. Протей предсказывает особую судьбу Менелая благодаря родству с Зевсом через Елену; Елена называет Зевса подателем добра и зла.\n\nПеснь 5: Верховный бог, решающий на совете бессмертных, что Одиссей должен вернуться домой. Посылает Гермеса с приказом к Калипсо и определяет, что герой доберётся до феаков после тяжёлого плавания на плоту.\n\nПеснь 12: Верховный бог, к которому Гелиос обращается с требованием отомстить за священных коров. Зевс обещает разбить корабль Одиссея молнией и исполняет угрозу в море; спутники гибнут, а Одиссей остаётся единственным выжившим.\n\nПеснь 13: Верховный бог, к которому Посейдон обращается с жалобой на феаков. Разрешает ему наказать перевозчиков Одиссея и советует превратить их корабль в камень на глазах у жителей; сам превращения не совершает.\n\nПеснь 14: Верховный бог, к которому Евмей и Одиссей обращаются в молитвах и клятвах; Евмей называет его покровителем гостей и странников. В вымышленной истории, рассказанной Одиссеем под видом критянина, Зевс наводит страх на воинов в Египте и поражает корабль молнией. Эти события принадлежат обманному рассказу, а не подтверждённой биографии героя.\n\nПеснь 15: Верховный бог, к которому обращаются с молитвами о благополучном возвращении Телемаха. В рассказе Евмея Зевс посылает попутный ветер финикийскому кораблю, увозящему мальчика с родного острова. Прямого появления Зевса в песне нет.\n\nПеснь 16: Верховный бог, отец Афины, которого Одиссей называет своим возможным союзником в борьбе с женихами. Телемах признаёт, что Зевс и Афина обладают властью над богами и людьми. В песне Зевс не появляется и лично не совершает чуда; его помощь обсуждается как надежда героев.\n\nПеснь 17: Верховный бог, к которому обращаются с молитвами о возвращении Одиссея и возмездии женихам. Нимфы у городского источника названы его дочерьми. В вымышленной истории Одиссея о Египте Зевсу приписано внушение страха войску; это не подтверждённое событие его странствий.\n\nПеснь 18: Верховный бог, к которому женихи обращают благопожелания после победы Одиссея над Иром; Телемах также призывает Зевса вместе с Афиной и Аполлоном покарать женихов. В самой песне Зевс не является и непосредственно не совершает чуда.\n\nПеснь 19: Верховный бог, упоминаемый в молитвах, клятвах и рассказах. В придуманной Одиссеем критской родословной Минос якобы регулярно советовался с Зевсом; этот эпизод принадлежит ложной биографии рассказчика. Одиссей также приписывает Зевсу гибель своих спутников за святотатство, вспоминая историю о стадах бога Солнца.\n\nПеснь 20: Верховный бог слышит просьбу Одиссея о двух знамениях и немедленно гремит громом с ясного неба. Одиссей воспринимает этот знак вместе со словами служанки как обещание близкого возмездия. В рассказе Пенелопы Зевс также назван богом, знающим судьбы людей.\n\nПеснь 21: Верховный бог, в переводе Батлера именуемый Юпитером. Когда Одиссей натягивает свой лук, Зевс громко гремит как знак; герой радуется услышанному предзнаменованию перед началом расправы над женихами.\n\nПеснь 22: Верховный бог, названный отцом Афины и упомянутый в речах героев. Во дворе находится посвящённый ему алтарь, у которого ищут защиты певец Фемий и глашатай Медонт. В событиях песни Зевс лично не является и отдельного знамения не посылает.\n\nПеснь 23: Вспоминается как бог, поразивший молнией корабль Одиссея после того, как спутники съели священных коров бога Солнца. Это краткий пересказ предыдущих странствий, а не новое действие Зевса в настоящем песни.\n\nПеснь 24: Владыка богов, который в рассказе о погребении Ахилла останавливает битву ураганом. В настоящем песни он обсуждает с Афиной примирение жителей Итаки и посылает огненную молнию, после которой Одиссей прекращает бой."
  - id: poseidon
    name: "Посейдон"
    type: character
    description: "Песнь 1: Бог моря, который продолжает преследовать Одиссея за ослепление циклопа Полифема, своего сына. Пока остальные боги совещаются, Посейдон находится на пиру у эфиопов. В переводе Батлера именуется Нептуном.\n\nПеснь 3: Бог моря и землетрясений, в честь которого жители Пилоса приносят жертву из чёрных быков. Афина под видом Ментора обращается к нему с молитвой о благополучии Нестора, его сыновей и Телемаха. В рассказе Нестора морскому богу также приписывается помощь во время возвращения из-под Трои; лично он не появляется.\n\nПеснь 4: Бог моря, повелевающий Протеем. В рассказе морского старца Посейдон сначала спасает Аякса из воды, затем раскалывает трезубцем скалу Гирей, когда тот хвастается независимостью от богов, и Аякс гибнет.\n\nПеснь 5: Бог моря, разгневанный на Одиссея. Увидев его на плоту, Посейдон вздымает море трезубцем, собирает грозовые тучи и вызывает бурю, разбивающую плот. После этого возвращается в свой дворец в Эгах.\n\nПеснь 7: Морской бог, названный предком царского рода феаков: от Перибеи у него родился Навсифой, дед царицы Ареты. По словам Афины, феаки плавают по морю милостью Посейдона. В действии песни VII бог лично не появляется.\n\nПеснь 8: В песне Демодока морской бог выступает поручителем Ареса и убеждает Гефеста отпустить пленников, обещая самому уплатить возмещение, если Арес этого не сделает. В конце песни Алкиной пересказывает предостережение о возможной расправе Посейдона над кораблями феаков.\n\nПеснь 9: Бог моря, отец циклопа Полифема. После ослепления сына Полифем призывает Посейдона задержать Одиссея и сделать его возвращение домой мучительным; в пределах песни IX сам Посейдон не появляется и не совершает непосредственно описанного действия.\n\nПеснь 13: Морской бог, разгневанный тем, что феаки доставили Одиссея на родину. С согласия Зевса обращает возвращающийся корабль феаков в камень и утверждает его у берега. Намерение завалить город феаков горой обсуждается, но само обрушение в песне не происходит.\n\nПеснь 23: Бог моря, которому Одиссей должен принести жертву в далёкой стране согласно предсказанию Тиресия. В рассказе о прошлых странствиях Одиссея он связан с морской бурей и кораблекрушением; в событиях возвращения супругов лично не появляется."
  - id: calypso
    name: "Калипсо"
    type: character
    description: "Песнь 1: Бессмертная богиня, дочь Атланта, удерживающая Одиссея на своём острове в пещере и желающая сделать его супругом. Афина говорит, что Калипсо уговорами старается заставить героя забыть родину; сама Калипсо в этой песне не появляется.\n\nПеснь 4: Нимфа, удерживающая Одиссея на далёком острове. Протей видит героя в её доме и сообщает Менелаю, что Одиссей не может отплыть из-за отсутствия корабля и команды.\n\nПеснь 5: Бессмертная нимфа и богиня, удерживающая Одиссея на своём острове. Она предлагает сделать его бессмертным и нестареющим, но после приказа Зевса через Гермеса отпускает героя, снабжает провизией и посылает попутный ветер. Предложенное превращение Одиссея в бессмертного не происходит.\n\nПеснь 17: Божественная нимфа, в чьём жилище на острове Одиссей долго находился в плену. В песне XVII о ней рассказывает Телемах, пересказывая сообщение Менелая и морского старца. Калипсо не появляется в текущих событиях.\n\nПеснь 23: Нимфа, державшая Одиссея в пещере на острове Огигия. По его рассказу Пенелопе, она предлагала ему бессмертие и вечную молодость в обмен на брак, но он отказался. В текущих событиях песни Калипсо не участвует."
  - id: atlas
    name: "Атлант"
    type: character
    description: "Песнь 1: Отец Калипсо, названный волшебником, ведающим морскими глубинами. Он поддерживает огромные столпы, разделяющие землю и небо; его действия упомянуты Афиной при описании острова Калипсо."
  - id: polyphemus
    name: "Полифем"
    type: creature
    description: "Песнь 1: Циклоп, сын Посейдона и морской нимфы Фоосы. Зевс напоминает, что Одиссей ослепил Полифема, и именно за это Посейдон препятствует возвращению героя. В событиях песни циклоп не появляется.\n\nПеснь 2: Свирепый одноглазый великан, о котором Эгиптий говорит как об убийце его сына Антифа: циклоп запер спутников Одиссея в пещере и съел юношу. Здесь он существует только в воспоминании о прежнем путешествии; имя Полифема в этой песне не произнесено.\n\nПеснь 9: Одноглазый циклоп, сын Посейдона и нимфы Фоосы, живущий в пещере и пасущий овец и коз. Огромный и необычайно сильный, он заваливает вход громадным камнем, убивает и пожирает нескольких спутников Одиссея. Одиссей опьяняет его вином, выжигает единственный глаз заострённым колом и спасается, привязав людей под брюхом баранов. Ослеплённый Полифем молит Посейдона помешать возвращению Одиссея.\n\nПеснь 23: Циклоп, которого Одиссей вспоминает, рассказывая Пенелопе о пережитых странствиях и расправе за гибель товарищей. В песне XXIII он не действует, а фигурирует в кратком пересказе более раннего приключения."
    aliases:
      - "Циклоп"
  - id: thoosa
    name: "Фооса"
    type: character
    description: "Песнь 1: Морская нимфа, мать циклопа Полифема от Посейдона и дочь морского владыки Форкия. Упоминается в объяснении Зевса о происхождении вражды Посейдона к Одиссею.\n\nПеснь 9: Морская нимфа, дочь Форкиса, названная матерью Полифема от Посейдона. В действии песни IX она не появляется; её происхождение и родство сообщаются при объяснении того, почему Посейдон покровительствует циклопу."
  - id: phorcys
    name: "Форкий"
    type: character
    description: "Песнь 1: Морской владыка и отец нимфы Фоосы, через неё дед Полифема. В песне упомянут только в родословной циклопа; самостоятельных действий не совершает.\n\nПеснь 9: Морское божество, отец нимфы Фоосы и дед Полифема по материнской линии. В песне IX он упоминается лишь в родословной циклопа; самостоятельных действий и способностей текст здесь не описывает.\n\nПеснь 13: Древнее морское божество, имя которого носит гавань на Итаке, куда феаки привозят спящего Одиссея. В этой песне Форкий не действует и не проявляет отдельных сил."
    aliases:
      - "Форкис"
  - id: hermes
    name: "Гермес"
    type: character
    description: "Песнь 1: Посланник богов, которого Зевс ранее отправил предупредить Эгисфа о возмездии Ореста. Афина предлагает вновь послать его к Калипсо с приказом отпустить Одиссея; в этой песне новое поручение только обсуждается. В переводе Батлера именуется Меркурием.\n\nПеснь 5: Божественный вестник, который по приказу Зевса перелетает море и сообщает Калипсо решение отпустить Одиссея. При полёте пользуется волшебными сандалиями и держит жезл, способный усыплять и пробуждать людей.\n\nПеснь 8: Божественный вестник присутствует среди богов, пришедших увидеть пленённых Ареса и Афродиту. В шутливом разговоре с Аполлоном признаётся, что согласился бы оказаться в таких же путах рядом с Афродитой.\n\nПеснь 14: Божественный вестник, сын Майи, которому Евмей посвящает одну из семи долей жертвенной трапезы вместе с нимфами. Песнь не описывает его непосредственного появления или вмешательства.\n\nПеснь 19: Бог, в переводе Батлера именуемый Меркурием, наделил Автолика исключительной ловкостью в воровстве и клятвопреступлении, поскольку тот приносил ему жертвы. Об этом рассказывается во вставном воспоминании о детстве Одиссея и происхождении его шрама.\n\nПеснь 24: Бог-проводник мёртвых собирает души женихов, убитых Одиссеем, и ведёт их в подземный мир. В руках он держит золотой жезл, которым способен усыплять и пробуждать людей. В переводе Батлера именуется Меркурием."
  - id: helios
    name: "Гелиос-Гиперион"
    type: character
    description: "Песнь 1: Солнечный бог, чьих священных быков съели спутники Одиссея. Вступление связывает этот проступок с их гибелью и невозможностью вернуться домой; сам бог в событиях Итаки не появляется.\n\nПеснь 8: Бог солнца, замечающий тайные встречи Ареса и Афродиты и сообщающий о них Гефесту. Позже он вновь следит за домом кузнеца и извещает его, когда любовники оказываются в ловушке.\n\nПеснь 12: Божество, которому принадлежат священные стада на острове Тринакия. Узнав от дочери Лампетии, что спутники Одиссея убили его коров, Гелиос требует возмездия от Зевса и грозит уйти светить мёртвым в подземный мир, если его не услышат.\n\nПеснь 19: Бог Солнца, чьих священных коров спутники Одиссея убили на острове Тринакия. Одиссей напоминает Пенелопе об этом преступлении и о гибели команды, хотя излагает историю внутри своего обманного рассказа о странствиях.\n\nПеснь 23: Бог Солнца, чьи священные стада съели спутники Одиссея. Герой вспоминает об этом проступке в рассказе Пенелопе, связывая его с гибелью команды; сам бог в событиях песни не появляется."
    aliases:
      - "Гелиос"
      - "Гелиос — бог Солнца"
  - id: zeus-eagle-omen
    name: "Знамение двух орлов Зевса"
    type: phenomenon
    description: "Песнь 2: Два орла, посланные Зевсом, кружат над собранием жителей Итаки, дерутся и улетают направо. Галитерс видит в этом предвестие возвращения Одиссея и бедствия для женихов. Знамение имеет отдельную сюжетную роль в споре о будущем дома Одиссея."
  - id: erinyes
    name: "Эринии"
    type: character
    description: "Песнь 2: Божественные мстительницы, которых, по словам Телемаха, Пенелопа могла бы призвать на него, если бы он насильно выгнал мать из дома. В песне они лишь упомянуты как возможные исполнительницы материнского проклятия и не появляются.\n\nПеснь 20: Грозные сверхъестественные существа, служанками которых стали похищенные вихрями дочери Пандарея. Они упоминаются в рассказе Пенелопы о судьбе девушек и не появляются в дворце.\n\nПеснь 15: Грозная божественная сила, упомянутая в истории прорицателя Мелампода: она навлекает на него тяжкое душевное страдание во время заточения у Филака. Песнь не уточняет её индивидуального имени и не описывает отдельного появления."
    aliases:
      - "Эриния"
  - id: themis
    name: "Фемида"
    type: character
    description: "Песнь 2: Богиня, которую Телемах призывает вместе с Зевсом во время народного собрания, называя покровительницей его созыва и завершения. Непосредственного вмешательства Фемиды в события песни не показано."
  - id: apollo
    name: "Аполлон"
    type: character
    description: "Песнь 3: Нестор рассказывает, что Аполлон убил кормчего Менелая Фронтиса своими безболезненными стрелами у мыса Суний. Гибель кормчего заставила Менелая задержаться для погребения. Сам бог в настоящем действии песни не появляется.\n\nПеснь 8: Бог, который в песне Демодока разговаривает с Гермесом у ложа пленённых богов. В начале песни упомянуто также его прорицание Агамемнону в Пифо о ссоре ахейских вождей.\n\nПеснь 15: Бог, связанный с прорицанием: в родословной Феоклимена сказано, что он сделал Полифида величайшим прорицателем после смерти Амфиарая. Ястреб, появившийся перед Телемахом на Итаке, назван вестником Аполлона. По рассказу Евмея, Аполлон вместе с Артемидой безболезненно поражает стрелами престарелых жителей острова Сиры.\n\nПеснь 17: Бог, к которому Пенелопа обращает пожелание поразить жестокого Антиноя; пастух Меланфий также упоминает возможность гибели Телемаха от Аполлона. В этой песне бог не является и не поражает никого: речь идёт о пожеланиях и угрозах.\n\nПеснь 18: Бог, к которому Телемах в присутствии Пенелопы обращает пожелание о гибели женихов наряду с Зевсом и Афиной. В песне XVIII Аполлон не появляется и не совершает самостоятельного действия.\n\nПеснь 21: Бог-лучник, праздник которого отмечают женихи в день испытания луком. Антиной предлагает принести ему жертву, прежде чем возобновить состязание на следующий день; Пенелопа допускает, что Аполлон может даровать незнакомцу славу победителя. Сам бог в песне не является.\n\nПеснь 22: Бог, к которому Одиссей обращается перед выстрелом в Антиноя, надеясь, что тот позволит поразить новую цель. В этой песне Аполлон непосредственно не появляется; попадание стрелы не названо отдельным чудом бога.\n\nПеснь 24: Бог, к которому Лаэрт обращается в молитвенном пожелании вернуть ему былую силу, называя его вместе с Зевсом и Афиной. Сам Аполлон в событиях песни не появляется."
  - id: penelope-dream-phantom
    name: "Сновидение в облике Ифтимы"
    type: phenomenon
    description: "Песнь 4: Созданный Афиной призрак является спящей Пенелопе под видом её сестры Ифтимы, обещает возвращение Телемаха и говорит о покровительстве богини. После разговора видение исчезает, а Пенелопа пробуждается успокоенной."
  - id: proteus
    name: "Протей"
    type: character
    description: "Песнь 4: Бессмертный морской старец, слуга Посейдона, знающий морские пути и судьбы людей. Захваченный Менелаем, он превращается в льва, дракона, леопарда, кабана, воду и дерево, но в конце открывает путь домой и рассказывает о судьбах ахейцев."
  - id: eidothea
    name: "Эйдофея"
    type: character
    description: "Песнь 4: Морская богиня, дочь Протея, помогает Менелаю захватить отца: указывает время его выхода на берег, добывает тюленьи шкуры для укрытия и приносит амброзию, заглушающую их запах."
  - id: ambrosia-seal-scent
    name: "Амброзия против запаха тюленей"
    type: substance
    description: "Песнь 4: Ароматная амброзия, которую Эйдофея помещает под носы Менелаю и трём его спутникам, чтобы заглушить невыносимый запах тюленьих шкур во время засады на Протея."
  - id: helen-nepenthe
    name: "Зелье Елены, избавляющее от печали"
    type: substance
    description: "Песнь 4: Сильнодействующее египетское средство, подаренное Елене Полидамной, женой Фона. Подмешанное в вино, оно на целый день лишает выпивших способности плакать даже при самых тяжёлых утратах."
  - id: elysian-plain
    name: "Элизийские поля"
    type: location
    description: "Песнь 4: Блаженная область на краю света, куда, по пророчеству Протея, боги перенесут Менелая вместо обычной смерти в Аргосе. Там не бывает снега, дождя и града, а с Океана постоянно веет освежающий западный ветер."
  - id: rhadamanthus
    name: "Радаманф"
    type: character
    description: "Песнь 4: Правитель Элизийских полей, названный Протеем при пророчестве о посмертной судьбе Менелая. В событиях песни не появляется."
  - id: hera
    name: "Гера"
    type: character
    description: "Песнь 4: Богиня, которая, согласно рассказу Протея, оберегает Агамемнона во время его морского возвращения после Троянской войны. В текущих событиях Спарты не появляется.\n\nПеснь 12: Богиня, которая, по рассказу Кирки, провела корабль Арго через Блуждающие скалы, спасая Ясона. В событиях самого путешествия Одиссея она не появляется.\n\nПеснь 20: В мифологическом рассказе Пенелопы богиня наделила дочерей Пандарея красотой и разумом. Она не является и не действует в непосредственных событиях песни."
  - id: aphrodite
    name: "Афродита"
    type: character
    description: "Песнь 4: Богиня, которую Елена винит в своём уходе из дома к троянцам. Елена упоминает её воздействие как причину своего прежнего поступка; сама богиня в этой песне не появляется.\n\nПеснь 8: Богиня любви, супруга Гефеста в рассказе Демодока. Вместе с Аресом оказывается в неразрывных путях; после освобождения отправляется в своё святилище в Пафосе на Кипре, где Хариты купают и одевают её.\n\nПеснь 18: Богиня красоты, названная в описании преображения Пенелопы. Афина придаёт царице красоту, подобную той, которой Афродита обладает, когда танцует с Харитами. Сама Афродита в действии песни не участвует.\n\nПеснь 20: В рассказе Пенелопы богиня заботилась об осиротевших дочерях Пандарея, кормила их и отправилась к Зевсу устраивать их замужество. Пока Афродита отсутствовала, вихри похитили девушек и передали Эриниям. В событиях дворца богиня не появляется."
  - id: hephaestus
    name: "Гефест"
    type: character
    description: "Песнь 4: Божественный кузнец, изготовивший серебряную чашу с золотым ободом, которую Менелай намерен подарить Телемаху. Никаких сверхъестественных свойств чаши текст не сообщает.\n\nПеснь 7: Божественный кузнец, который, согласно описанию дворца Алкиноя, изготовил золотых и серебряных сторожевых псов. Эти создания не умирают и не стареют; сам Гефест в событиях песни не появляется.\n\nПеснь 8: В песне Демодока божественный кузнец узнаёт об измене Афродиты с Аресом и выковывает невидимые неразрывные путы, чтобы поймать их на супружеском ложе. Позднее освобождает пленников, получив обещание Посейдона отвечать за возмещение.\n\nПеснь 24: Божественный кузнец, изготовивший золотой сосуд для праха Ахилла, о котором рассказывает Агамемнон. В переводе Батлера именуется Вулканом; само изделие не проявляет магических свойств."
  - id: paeon
    name: "Пеон"
    type: character
    description: "Песнь 4: Божественный родоначальник египетских врачевателей: повествователь говорит, что жители Египта искусны в лекарствах, поскольку происходят от Пеона. Лично он в сюжете не действует."
  - id: hermes-winged-sandals
    name: "Летучие сандалии Гермеса"
    type: artifact
    description: "Песнь 5: Сверкающие золотые сандалии божественного вестника, позволяющие ему летать над сушей и морем с быстротой ветра. Гермес надевает их перед путешествием на остров Калипсо."
  - id: hermes-sleep-wand
    name: "Жезл Гермеса, навевающий сон"
    type: artifact
    description: "Песнь 5: Жезл, которым Гермес может по собственной воле погружать людей в сон и пробуждать их. В песне V он несёт жезл во время полёта, но не применяет его к Одиссею или Калипсо.\n\nПеснь 24: Жезл бога Гермеса, которым он по своему желанию смыкает людям глаза сном и вновь пробуждает их. С ним Гермес созывает и сопровождает души погибших женихов."
    aliases:
      - "Золотой жезл Гермеса"
  - id: ino-leucothea
    name: "Ино — Левкотея"
    type: character
    description: "Песнь 5: Дочь Кадма, прежде смертная женщина, а затем морская богиня Левкотея. Поднимается из волн подобно чайке, жалеет Одиссея и даёт ему зачарованное покрывало, защищающее во время плавания. После спасения героя принимает покрывало обратно из моря."
  - id: leucothea-enchanted-veil
    name: "Зачарованное покрывало Левкотеи"
    type: artifact
    description: "Песнь 5: Волшебная ткань, которую морская богиня велит Одиссею обвязать вокруг груди перед тем, как броситься в воду. По словам Левкотеи, покрывало защитит его от вреда в море; достигнув берега, Одиссей возвращает его в волны."
  - id: river-god-scheria
    name: "Речной бог у берегов Схерии"
    type: character
    description: "Песнь 5: Неназванное божество реки, к устью которой после кораблекрушения приплывает Одиссей. Герой обращается к нему с мольбой, и бог останавливает течение и усмиряет волны, позволяя путнику добраться до берега."
  - id: ogygia
    name: "Огигия — остров Калипсо"
    type: location
    description: "Песнь 5: Уединённый остров посреди моря, где живёт бессмертная Калипсо и долго удерживает Одиссея. Её пещеру окружают деревья, виноградная лоза и четыре ручья. В песне остров служит обителью богини, но не проявляет самостоятельных магических свойств."
  - id: divine-ambrosia-and-nectar
    name: "Амброзия и нектар богов"
    type: substance
    description: "Песнь 5: Пища и напиток бессмертных, которыми Калипсо угощает Гермеса и которыми питается сама. Одиссею при этом подают обычную человеческую еду. Песнь не описывает отдельного превращающего или исцеляющего действия этих веществ."
  - id: olympus
    name: "Олимп — обитель бессмертных"
    type: location
    description: "Песнь 6: Вечное жилище богов, куда Афина возвращается после посещения Навсикаи. В описании песни VI здесь не бывает ни дождя, ни снега, ни сильного ветра: место постоянно озарено ясным светом и пребывает в покое."
  - id: athena-dream-visitation
    name: "Сновидение Навсикаи, посланное Афиной"
    type: phenomenon
    description: "Песнь 6: Божественное явление во сне, во время которого Афина принимает облик знакомой девушки и разговаривает со спящей Навсикаей. Проснувшись, царевна помнит сон и просит отца дать повозку для поездки к реке. Это действие самой Афины, а не самостоятельное существо."
  - id: athena-beautification
    name: "Преображение внешности Одиссея Афиной"
    type: phenomenon
    description: "Песнь 6: После омовения Одиссея Афина делает его на вид выше и крепче, придаёт волосам густоту и красивые локоны, а его облику — сияющую привлекательность. Навсикая замечает перемену. В песне это прямое действие богини, а не свойство воды или масла."
  - id: athena-concealing-mist
    name: "Скрывающий туман Афины"
    type: phenomenon
    description: "Песнь 7: Созданное Афиной облако тьмы, внутри которого Одиссей остаётся невидимым для феаков, пока проходит по городу и входит во дворец. Туман исчезает, когда герой припадает к коленям царицы Ареты."
  - id: immortal-metal-guard-dogs
    name: "Бессмертные металлические псы дворца Алкиноя"
    type: artifact
    description: "Песнь 7: Золотые и серебряные изображения сторожевых собак, изготовленные Гефестом для охраны дворца царя Алкиноя. В отличие от обычных статуй, они прямо названы бессмертными и нестареющими. Песня не описывает их передвижения, речи или нападений."
  - id: alcinous-everfruiting-garden
    name: "Вечно плодоносящий сад Алкиноя"
    type: location
    description: "Песнь 7: Сад при дворце царя феаков, где груши, яблоки, инжир, маслины и виноград плодоносят без перерыва круглый год: новый урожай поспевает прежде, чем исчезает прежний. Плоды не гниют и не пропадают. Текст связывает изобилие с мягким воздухом и дарами богов, не называя отдельного заклинания."
  - id: phaeacian-ships
    name: "Быстроходные корабли феаков"
    type: artifact
    description: "Песнь 7: Корабли феаков, о которых Афина говорит, что они скользят по морю быстро, словно мысль или птица. Алкиной рассказывает о плавании до Эвбеи и обратно за один день. Песня VII не утверждает, что суда сами управляют собой или обладают сознанием: это описание необычайной скорости, а не доказательство автономной магии.\n\nПеснь 8: По словам царя Алкиноя, суда феаков не нуждаются в кормчих и обычных рулях: они сами понимают желания путешественников, знают города и страны и безопасно проходят сквозь туман и облака. Это прямое описание их необыкновенных свойств в песне VIII."
    aliases:
      - "Самоуправляющиеся корабли феаков"
  - id: muse-of-demodocus
    name: "Муза — покровительница Демодока"
    type: character
    description: "Песнь 8: Божественная покровительница певца Демодока, одарившая его искусством песнопения, но лишившая зрения. Во время пира вдохновляет его воспеть ссору Одиссея с Ахиллом. Её личное имя в песне не названо."
  - id: hephaestus-invisible-chains
    name: "Невидимые путы Гефеста"
    type: artifact
    description: "Песнь 8: Выкованные Гефестом чрезвычайно тонкие цепи, которых не может увидеть даже бог и которые нельзя разорвать или развязать. Они удерживают Ареса и Афродиту неподвижно на ложе, пока кузнец не освобождает их. Описаны внутри песни Демодока."
  - id: ares
    name: "Арес"
    type: character
    description: "Песнь 8: Бог войны, который в песне Демодока тайно встречается с Афродитой в доме Гефеста. Попадает в невидимую сеть божественного кузнеца и не может пошевелиться, пока Посейдон не добивается его освобождения.\n\nПеснь 14: Бог войны, упомянутый Одиссеем в придуманной истории о своём критском происхождении: рассказчик приписывает Аресу и Афине свою боевую отвагу. Сам бог в действии песни не появляется."
  - id: graces
    name: "Хариты"
    type: character
    description: "Песнь 8: Божественные спутницы Афродиты, которые в рассказе Демодока после её освобождения купают богиню в Пафосе, умащают амброзиальным маслом и одевают в прекрасные одежды.\n\nПеснь 18: Божественные спутницы Афродиты, упомянутые в сравнении при описании чудесно украшенной Афиной Пенелопы: богиня любви танцует вместе с Харитами. В песне Хариты не появляются лично и не действуют."
  - id: cyclopes
    name: "Циклопы"
    type: creature
    description: "Песнь 9: Племя великанов, живущих обособленно на острове без общих законов и собраний. Каждый правит собственным домом и семьёй. Услышав крики ослеплённого Полифема, соседние циклопы спрашивают, кто причиняет ему вред, но уходят, когда он отвечает, что его мучает «Никто», считая болезнь посланной Зевсом."
  - id: lotus-eaters
    name: "Лотофаги"
    type: character
    description: "Песнь 9: Жители страны лотоса, угощающие спутников Одиссея растением, после вкушения которого те забывают о возвращении домой и желают остаться среди лотофагов. Сами лотофаги не названы богами или чудовищами; их включение отражает устойчивую связь этого народа с необычайным воздействием лотоса."
  - id: forgetful-lotus
    name: "Лотос забвения"
    type: plant
    description: "Песнь 9: Растение, которым лотофаги кормят пришельцев. Попробовавшие его спутники Одиссея теряют желание сообщить новости и возвращаться на родину, предпочитая навсегда остаться среди лотофагов. Одиссей силой уводит их обратно на корабли и привязывает к скамьям."
  - id: circe
    name: "Кирка"
    type: character
    description: "Песнь 10: Богиня и волшебница, живущая на острове Ээя. Она подмешивает чары в пищу спутникам Одиссея и ударом жезла превращает их в свиней, а позднее с помощью противодействующих чар возвращает им человеческий облик.\n\nПеснь 23: Волшебница, о хитрости и чарах которой Одиссей рассказывает Пенелопе, вспоминая свои прежние странствия. В событиях самой песни Кирка не появляется, и отдельное заклинание здесь не описывается."
    tags:
      - "goddess"
      - "witchcraft"
      - "transformation"
  - id: moly
    name: "Моли"
    type: plant
    description: "Песнь 10: Божественная трава с чёрным корнем и белым цветком, которую Гермес даёт Одиссею. Её сила защищает героя от колдовского напитка Кирки; смертным трудно вырвать это растение из земли, тогда как богам это доступно."
    tags:
      - "protection"
      - "anti-magic"
      - "divine-plant"
  - id: circes-wand
    name: "Жезл Кирки"
    type: artifact
    description: "Песнь 10: Волшебный жезл, которым Кирка ударяет выпивших её зелье людей, завершая превращение в животных. В выбранном тексте жезл непосредственно связан как с попыткой превращения Одиссея, так и с чарами над его спутниками."
    tags:
      - "wand"
      - "transformation"
      - "enchanted-object"
  - id: aeolus-bag-of-winds
    name: "Мешок ветров Эола"
    type: artifact
    description: "Песнь 10: Мешок из бычьей шкуры, в который Эол заключает пути ревущих ветров и плотно запечатывает серебряной нитью, оставляя свободным лишь попутный западный ветер. Когда спутники Одиссея развязывают мешок, освобождённые ветры вызывают бурю и уносят корабль назад к острову Эола."
    tags:
      - "wind"
      - "containment"
      - "enchanted-object"
  - id: underworld-entrance
    name: "Вход в царство мёртвых у киммерийцев"
    type: location
    description: "Песнь 11: Мрачная область у края Океана, где живут киммерийцы и куда не проникает свет Солнца. Здесь Одиссей выкапывает яму для жертвенных возлияний, и к крови стекаются души умерших из подземного мира. Текст не утверждает, что киммерийцы сами являются духами."
  - id: souls-of-the-dead
    name: "Души умерших"
    type: creature
    description: "Песнь 11: Бестелесные тени покойных, собирающиеся вокруг жертвенной крови в царстве мёртвых. Среди них женщины, воины, старики и дети; некоторые обретают возможность связно говорить с Одиссеем после того, как пьют кровь. Они не способны обнять живого человека как прежде, поскольку тело после смерти утрачено."
  - id: tiresias-shade
    name: "Тень Тиресия"
    type: character
    description: "Песнь 11: Душа слепого фиванского прорицателя, сохранившая после смерти разум и дар предвидения по воле Персефоны. Выпив жертвенной крови, Тиресий предсказывает Одиссею опасность со стадами Гелиоса, трудное возвращение, будущую месть женихам и путешествие с веслом в страну, где не знают моря.\n\nПеснь 23: Умерший фиванский прорицатель, с которым Одиссей прежде говорил в подземном мире. Герой пересказывает Пенелопе его пророчество: необходимо нести весло в страну, не знающую моря, принести жертву Посейдону и лишь затем вернуться домой; предсказана также мирная старость."
  - id: persephone
    name: "Персефона"
    type: character
    description: "Песнь 11: Владычица подземного мира, которая, согласно объяснению Кирки, оставила Тиресию способность мыслить после смерти, тогда как другие души подобны теням. В рассказе Одиссея она также направляет к нему души умерших женщин и, как он опасается, может послать страшное чудовище."
  - id: hades
    name: "Аид"
    type: character
    description: "Песнь 11: Владыка царства мёртвых, упоминаемый как правитель обители умерших. В песне XI он не выступает лично и не разговаривает с Одиссеем; сведения о нём ограничены принадлежностью подземного царства."
  - id: anticleia-shade
    name: "Тень Антиклеи"
    type: character
    description: "Песнь 11: Душа матери Одиссея, умершей от тоски по сыну. После вкушения жертвенной крови узнаёт Одиссея и рассказывает о положении его семьи на Итаке. Трижды Одиссей пытается обнять её, но тень каждый раз ускользает из его рук."
  - id: elpenor-shade
    name: "Тень Эльпенора"
    type: character
    description: "Песнь 11: Душа спутника Одиссея, погибшего при падении с крыши дома Кирки. Он приходит к жертвенной яме ещё до погребения тела, говорит с Одиссеем и просит устроить ему похороны и поставить весло на могиле."
  - id: agamemnon-shade
    name: "Тень Агамемнона"
    type: character
    description: "Песнь 11: Душа убитого царя, которая после жертвенной крови рассказывает Одиссею о собственном убийстве Эгисфом и Клитемнестрой. Предостерегает героя от беспечной доверчивости при возвращении домой.\n\nПеснь 24: Душа убитого после возвращения из Трои царя. В подземном мире беседует с Ахиллом, затем узнаёт тень жениха Амфимедонта и расспрашивает её о гибели женихов. Хвалит верность Пенелопы."
  - id: achilles-shade
    name: "Тень Ахилла"
    type: character
    description: "Песнь 11: Душа прославленного героя Троянской войны, говорящая с Одиссеем в подземном мире. Отвергает утешение о власти над мёртвыми, предпочитая даже тяжёлую жизнь простого работника участи покойного; радуется известиям о доблести сына Неоптолема.\n\nПеснь 24: Душа павшего под Троей героя, находящаяся в мире мёртвых. Она беседует с тенью Агамемнона о гибели и погребении; Ахилл вспоминается также как сын морской богини Фетиды."
  - id: ajax-shade
    name: "Тень Аякса"
    type: character
    description: "Песнь 11: Душа Аякса Теламонида, продолжающая сердиться на Одиссея из-за спора за доспехи Ахилла. Она не отвечает на попытки Одиссея примириться и удаляется к другим мертвецам."
  - id: minos-shade
    name: "Минос — судья умерших"
    type: character
    description: "Песнь 11: Умерший царь Минос, сын Зевса, которого Одиссей видит в царстве мёртвых с золотым скипетром. Минос разбирает споры среди теней, сидящих и стоящих вокруг него."
  - id: orion-shade
    name: "Тень Ориона"
    type: character
    description: "Песнь 11: Душа великого охотника, которую Одиссей видит в подземном мире. Орион продолжает преследовать по асфоделевому лугу призрачных зверей, убитых им при жизни, держа в руках бронзовую палицу."
  - id: tityos
    name: "Титий"
    type: character
    description: "Песнь 11: Гигант, сын Геи, лежащий в царстве мёртвых на земле и занимающий девять плетров. Два стервятника непрерывно терзают его печень в наказание за нападение на Лето."
  - id: tantalus
    name: "Тантал"
    type: character
    description: "Песнь 11: Наказанный мертвец, стоящий по горло в воде, которая отступает при попытке напиться. Над ним висят ветви с плодами, но ветер отводит их всякий раз, когда он протягивает руку."
  - id: sisyphus
    name: "Сизиф"
    type: character
    description: "Песнь 11: Наказанный мертвец, вынужденный толкать огромный камень на вершину холма. Каждый раз, когда он почти достигает цели, валун скатывается вниз и труд начинается снова."
  - id: gorgon-head-threat
    name: "Угроза головы Горгоны"
    type: creature
    description: "Песнь 11: Чудовищная голова Горгоны, которую, как опасается Одиссей, Персефона может прислать ему из подземного мира. Само чудовище в песне XI не появляется: Одиссей поспешно уходит, опасаясь возможного нападения."
  - id: sirens
    name: "Сирены"
    type: creature
    description: "Песнь 12: Две сверхъестественные певицы, живущие среди останков погибших мореходов. Их сладостное пение завораживает тех, кто проплывает мимо, и заставляет отказаться от возвращения домой; они обещают знание о Троянской войне и событиях мира. Одиссей слышит песню, будучи привязанным к мачте, и требует освободить его, но спутники затягивают путы. Внешность сирен в этой песни не описана.\n\nПеснь 23: Сверхъестественные певицы, чьё необыкновенное пение Одиссей вспоминает в рассказе Пенелопе. Их встреча принадлежит предыдущему путешествию; в этой песне они лишь названы."
  - id: wandering-rocks
    name: "Блуждающие скалы"
    type: location
    description: "Песнь 12: Смертоносные скалы, о которых Кирка рассказывает Одиссею как об одном из двух возможных путей. Ни птицы, несущие Зевсу амброзию, ни корабли обычно не проходят между ними невредимыми; лишь Арго избежал гибели благодаря помощи Геры. Скалы не показаны как одушевлённые существа."
  - id: scylla
    name: "Сцилла"
    type: creature
    description: "Песнь 12: Бессмертное и неодолимое морское чудовище, живущее в пещере высокой скалы. У неё двенадцать уродливых ног, шесть длинных шей и шесть голов с тремя рядами зубов. Она одновременно хватает шестерых спутников Одиссея и съедает их; Кирка советует не вступать с ней в бой, а скорее проплыть мимо.\n\nПеснь 23: Опасное морское чудовище, которого Одиссей упоминает в перечне пройденных испытаний. Он подчёркивает, что прежде никто не проходил мимо неё невредимым; нового столкновения в этой песне нет."
    aliases:
      - "Скилла"
  - id: charybdis
    name: "Харибда"
    type: creature
    description: "Песнь 12: Чудовищная морская сила у подножия второй скалы: трижды в день она поглощает морскую воду и трижды извергает её, создавая губительный водоворот. После гибели корабля Одиссей спасается от её воронки, ухватившись за смоковницу над водой, и дожидается, когда Харибда выбросит обратно обломки судна. В этой песни не описан человекоподобный облик Харибды.\n\nПеснь 23: Смертоносная морская опасность, названная Одиссеем среди пережитых им испытаний наряду со Скиллой и блуждающими скалами. В песне XXIII о ней только вспоминают."
  - id: cratais
    name: "Кратеида"
    type: character
    description: "Песнь 12: Мать Сциллы, к которой Кирка велит громко обратиться, чтобы остановить второе нападение чудовища. В самой песне Кратеида не появляется и не действует непосредственно; её влияние известно только из совета Кирки."
  - id: phaethusa
    name: "Фаэтуса"
    type: character
    description: "Песнь 12: Дочь Гелиоса и Неэры, одна из двух богинь-пастушек, которым поручено стеречь священные стада отца на Тринакии. В песне не показано её самостоятельных сверхъестественных действий."
  - id: lampetie
    name: "Лампетия"
    type: character
    description: "Песнь 12: Дочь Гелиоса и Неэры, богиня-пастушка на острове Тринакия. Когда люди Одиссея убивают священных коров, она немедленно сообщает об этом отцу, вызывая его требование наказать виновных."
  - id: helios-sacred-herds
    name: "Священные стада Гелиоса"
    type: animal
    description: "Песнь 12: Семь стад коров и семь отар овец по пятьдесят голов, принадлежащих богу Солнца; животные не размножаются и не убывают числом. После того как спутники Одиссея убивают часть коров, шкуры убитых ползают, а мясо на вертелах издаёт коровье мычание. Нарушение запрета приводит к божественному наказанию."
  - id: sea-nymphs-thrinacia
    name: "Морские нимфы у Тринакии"
    type: creature
    description: "Песнь 12: Сверхъестественные обитательницы пещеры на острове Тринакия, где они устраивают собрания и танцы. Одиссей и его спутники укрывают корабль в этой пещере во время непогоды. Иных действий нимф в песне не описано."
  - id: naiad-nymphs
    name: "Наяды"
    type: character
    description: "Песнь 13: Нимфы, которым посвящена прибрежная пещера на Итаке. В пещере стоят каменные сосуды и ткацкие станки, на которых наяды ткут пурпурные одежды. Одиссей узнаёт святилище и обращается к ним с молитвой, обещая вновь приносить дары."
  - id: phaeacian-ship-petrification
    name: "Окаменение корабля феаков"
    type: phenomenon
    description: "Песнь 13: Наказание, совершённое Посейдоном: возвращающееся судно феаков, уже видное из города, внезапно превращается в камень, а морской бог закрепляет его у берега. Жители потрясены и вспоминают старое предсказание. Это превращение, а не отдельный волшебный корабль."
  - id: naiad-cave-ithaca
    name: "Пещера наяд на Итаке"
    type: location
    description: "Песнь 13: Священная пещера у гавани Форкия, с постоянной водой, каменными сосудами и станками наяд. В неё ведут два входа: северный доступен смертным, южный предназначен только для богов и недоступен людям. Здесь Афина и Одиссей прячут привезённые феаками дары."
  - id: nymphs
    name: "Нимфы"
    type: character
    description: "Песнь 14: Божественные существа, которым Евмей вместе с Гермесом выделяет жертвенную долю во время ужина с неузнанным Одиссеем. Их индивидуальные имена и действия в этой песне не названы."
  - id: dodona-zeus-oracular-oak
    name: "Прорицательный дуб Зевса в Додоне"
    type: location
    description: "Песнь 14: Священный дуб в Додоне, от которого, согласно вымышленному рассказу Одиссея, герой якобы собирался узнать волю Зевса и решить, возвращаться ли на Итаку открыто или тайно. Это упоминание о прорицалище внутри заведомо ложной истории; фактическое посещение Додоны не подтверждается."
  - id: artemis
    name: "Артемида"
    type: character
    description: "Песнь 15: Богиня, которая в рассказе Евмея вместе с Аполлоном приходит к престарелым жителям Сиры и прекращает их жизнь безболезненными стрелами. В том же рассказе Артемида поражает финикиянку, похитившую маленького Евмея, и та падает замертво на корабле.\n\nПеснь 18: Богиня, к которой Пенелопа обращает желание умереть во сне без мучений, подобно тому как она только что сладко заснула благодаря Афине. Артемида не появляется, и просьба в этой песне не исполняется.\n\nПеснь 20: Богиня, к которой измученная Пенелопа обращается с мольбой поразить её стрелой и избавить от страданий. В её рассказе Артемида даровала дочерям Пандарея внушительный облик. Просьба Пенелопы о смерти в этой песне не исполняется."
  - id: eos
    name: "Эос"
    type: character
    description: "Песнь 15: Богиня зари, которая, согласно родословному отступлению о предках Феоклимена, уносит прекрасного Клита, чтобы он жил среди бессмертных. Это событие относится к предыстории рода, а не к путешествию Телемаха.\n\nПеснь 23: Божественная Заря, которую Афина удерживает у Океана, не позволяя запрячь коней Лампа и Фаэтона и принести утро. Позднее Афина разрешает ей взойти; самостоятельного решения Эос в этой песне не показано."
    aliases:
      - "Эос (Заря)"
  - id: theoclymenus
    name: "Феоклимен"
    type: character
    description: "Песнь 15: Прорицатель из рода Мелампода, бежавший из Аргоса после убийства родственника. Телемах берёт его на корабль. На Итаке Феоклимен распознаёт в полёте ястреба с голубем божественное знамение и предсказывает сохранение власти за домом Одиссея.\n\nПеснь 17: Прорицатель, которого Телемах привёл из Пилоса. Он говорит Пенелопе, что Одиссей уже находится на Итаке и готовит возмездие женихам, ссылаясь на птичье знамение, увиденное во время плавания. Само знамение произошло в предыдущей песне XV и здесь лишь пересказывается.\n\nПеснь 20: Прорицатель видит над женихами покров тьмы, слёзы на их лицах, кровь на стенах и балках, призраков у входа и померкшее солнце. Он предсказывает гибель женихов и покидает дом, несмотря на их насмешки."
  - id: eagle-with-goose-omen
    name: "Знамение орла с гусем"
    type: phenomenon
    description: "Песнь 15: Перед отъездом Телемаха из Лакедемона справа от путников пролетает орёл, несущий белого домашнего гуся. Елена толкует это как предвестие возвращения Одиссея и его мести женихам. Текст передаёт толкование Елены, а не утверждает, что орёл обладает сверхъестественными способностями."
  - id: hawk-with-dove-omen
    name: "Знамение ястреба с голубем"
    type: phenomenon
    description: "Песнь 15: После прибытия Телемаха на Итаку справа пролетает ястреб, названный вестником Аполлона, и разрывает пойманного голубя; перья падают между кораблём и Телемахом. Прорицатель Феоклимен видит в этом посланный богом знак будущего могущества рода Одиссея."
  - id: athena-golden-wand
    name: "Золотой жезл Афины"
    type: artifact
    description: "Песнь 16: Жезл богини, прикосновением которого она дважды меняет внешность Одиссея. Сначала возвращает ему молодость, здоровый цвет лица, тёмную бороду и красивую одежду, чтобы Телемах узнал отца; затем снова делает его старым и одетым в лохмотья перед возвращением Евмея. Чудесное действие жезла непосредственно описано в этой песне.\n\nПеснь 13: Жезл, которым Афина касается Одиссея, немедленно изменяя его вид: покрывает кожу морщинами, лишает волос, иссушает тело и тускнит глаза. В этом эпизоде жезл выступает непосредственным орудием божественного преображения; обычные посох и сумка нищего, данные вслед за ним, не наделены чудесными свойствами."
    aliases:
      - "Жезл Афины для преображения Одиссея"
  - id: fountain-nymphs
    name: "Нимфы городского источника"
    type: character
    description: "Песнь 17: Божественные дочери Зевса, которым посвящены источник и алтарь у дороги к городу. Евмей молит их о возвращении Одиссея, напоминая о прежних жертвоприношениях. Нимфы в песне не появляются и не дают слышимого ответа."
  - id: telemachus-sneeze-omen
    name: "Знамение чихания Телемаха"
    type: phenomenon
    description: "Песнь 17: В момент, когда Пенелопа говорит о будущем возвращении Одиссея и расправе над женихами, Телемах громко чихает. Пенелопа истолковывает совпадение как подтверждение того, что все женихи погибнут. Это зафиксированное в песне толкование приметы, а не утверждение о сверхъестественных свойствах самого чихания."
  - id: athena-golden-lamp
    name: "Золотой светильник Афины"
    type: artifact
    description: "Песнь 19: Светильник, который богиня несёт перед Одиссеем и Телемахом, когда они убирают оружие. Он излучает настолько необыкновенное сияние, что Телемах видит словно объятые пламенем стены, балки и опоры дома и заключает, что рядом присутствует божество. Сверхъестественность сцены связана с явлением Афины и её светильником."
  - id: autolycus
    name: "Автолик"
    type: character
    description: "Песнь 19: Дед Одиссея по матери, искусный вор и нарушитель клятв. Его необычайные способности прямо объяснены даром Гермеса, которому Автолик приносил жертвы. Во время охоты на Парнасе сыновья Автолика также произносят заклинание, останавливающее кровь из раны Одиссея."
  - id: blood-staunching-spell
    name: "Заговор для остановки крови"
    type: spell
    description: "Песнь 19: Сыновья Автолика произносят заклинание над раной юного Одиссея после нападения дикого кабана. Текст прямо связывает заговор с остановкой кровотечения; слова заклинания и подробности обряда не приводятся."
  - id: penelope-eagle-geese-dream
    name: "Сон Пенелопы об орле и двадцати гусях"
    type: phenomenon
    description: "Песнь 19: Пенелопа видит сон, в котором орёл убивает двадцать её гусей, а затем человеческим голосом объясняет, что гуси означают женихов, а орёл — вернувшегося Одиссея, который погубит их. Одиссей истолковывает сон как предвестие гибели женихов; сама Пенелопа сомневается в его достоверности."
  - id: gates-of-horn-and-ivory
    name: "Врата сновидений из рога и слоновой кости"
    type: location
    description: "Песнь 19: Два символических прохода, о которых Пенелопа рассказывает, рассуждая о правдивости снов. Сновидения, проходящие через врата из слоновой кости, обманывают людей, тогда как проходящие через роговые врата несут исполнимое предзнаменование. Врата не показаны как место реального путешествия персонажей."
  - id: eileithyia
    name: "Илифия"
    type: character
    description: "Песнь 19: Богиня, чья пещера близ критской гавани Амнис упоминается в вымышленном рассказе Одиссея о его происхождении и встрече с самим собой. Пещера названа в тексте, но никакого появления богини или чудесного события там не описано."
  - id: pandareus-daughters
    name: "Дочери Пандарея"
    type: character
    description: "Песнь 20: Осиротевшие девушки из рассказа Пенелопы, которых воспитывали богини. Афродита кормила их, Гера даровала красоту и ум, Артемида — величавость, а Афина — искусные умения. Затем вихри унесли их на служение Эриниям. Их необычная судьба передаётся как отдельный мифологический эпизод."
  - id: zeus-thunder-omen
    name: "Гром Зевса с ясного неба"
    type: phenomenon
    description: "Песнь 20: По молитве Одиссея Зевс громыхает с неба, на котором нет облаков. Это первое из двух знамений, о которых просил герой; он принимает гром как знак скорой расправы над женихами.\n\nПеснь 21: Зевс посылает гром именно в тот момент, когда Одиссей легко натягивает лук, с которым не справились женихи. Герой распознаёт звук как благоприятное знамение перед выстрелом через двенадцать топоров. Это отдельный эпизод, не тождественный грому с ясного неба в песне XX."
    aliases:
      - "Гром Зевса при натягивании лука"
  - id: miller-woman-omen
    name: "Знамение слов мельничной служанки"
    type: phenomenon
    description: "Песнь 20: Услышав гром Зевса, служанка у мельницы просит, чтобы женихи в последний раз пировали в доме Одиссея. Её слова становятся вторым знамением, запрошенным Одиссеем, и подтверждают для него надежду на возмездие."
  - id: eagle-dove-omen
    name: "Знамение орла с голубем"
    type: phenomenon
    description: "Песнь 20: Орёл с голубем в когтях пролетает слева от женихов, когда они замышляют убийство Телемаха. Амфином истолковывает птицу как предостережение о неудаче заговора, после чего женихи отказываются от плана и идут пировать."
  - id: theoclymenus-doom-vision
    name: "Видение Феоклимена о гибели женихов"
    type: phenomenon
    description: "Песнь 20: Прорицатель воспринимает зловещие образы: тьму вокруг женихов, кровь на стенах, призраков, уходящих в подземный мир, и исчезновение солнечного света. Видение сопровождает его предупреждение о неизбежной гибели женихов; другие участники пира не разделяют его восприятия."
  - id: heracles
    name: "Геракл"
    type: character
    description: "Песнь 21: Могучий сын Зевса, упомянутый в предыстории лука Одиссея. Рассказчик говорит о его необычайных подвигах и о том, как он убил Ифита, нарушив закон гостеприимства, и присвоил его коней. В текущих событиях песни Геракл не появляется.\n\nПеснь 11: Призрачный образ Геракла, которого Одиссей встречает среди умерших. В самой песне уточняется, что настоящий Геракл находится среди бессмертных богов, а здесь пребывает лишь его образ. Тень вспоминает собственные страдания и поход за псом Аида."
    aliases:
      - "Тень Геракла"
  - id: centaurs
    name: "Кентавры"
    type: creature
    description: "Песнь 21: Мифические существа, о войне которых с людьми рассказывает Антиной, предостерегая мнимого нищего от пьянства. Кентавр Эвритион, опьянев в доме Пирифоя, совершил бесчинства, за что герои изувечили его; после этого началась вражда между людьми и кентаврами. Эпизод приведён как пример, а не происходит в доме Одиссея."
  - id: athena-aegis
    name: "Эгида Афины"
    type: artifact
    description: "Песнь 22: Грозный божественный предмет, который Афина поднимает со стропила во время последней схватки. При его появлении женихи испытывают ужас и бегут к дальнему краю двора, после чего Одиссей и его союзники завершают разгром."
  - id: lampus-and-phaethon
    name: "Ламп и Фаэтон"
    type: creature
    description: "Песнь 23: Два коня, которых Заря запрягает, чтобы нести дневной свет людям. Афина задерживает их выезд, продлевая ночь Одиссея и Пенелопы. В этой песне они названы как часть небесного движения Зари."
  - id: night-prolongation
    name: "Продление ночи Афиной"
    type: phenomenon
    description: "Песнь 23: Афина останавливает приближение утра, удерживая Зарю у Океана и препятствуя её обычному пути. Благодаря вмешательству богини встреча Одиссея и Пенелопы продолжается дольше естественного срока."
  - id: aeolus
    name: "Эол"
    type: character
    description: "Песнь 23: Властитель ветров, которого Одиссей вспоминает как гостеприимного помощника во время плавания. Несмотря на помощь Эола, буря снова унесла корабль от родины. Подробности чудесного дара ветров в этой песне не повторяются."
  - id: laestrygonians
    name: "Лестригоны"
    type: creature
    description: "Песнь 23: Чудовищный народ, который, по рассказу Одиссея Пенелопе, уничтожил почти все его корабли и команды в городе Телепиле. Эпизод лишь пересказывается; новых свойств лестригонов песнь не сообщает."
  - id: suitors-shades
    name: "Тени погибших женихов"
    type: character
    description: "Песнь 24: Души женихов, убитых Одиссеем, которых Гермес собирает и ведёт в царство мёртвых. Они сохраняют память о гибели и рассказывают там о событиях на Итаке; Амфимедонт беседует с тенью Агамемнона."
  - id: hades-realm
    name: "Царство Аида"
    type: location
    description: "Песнь 24: Подземная область умерших, куда Гермес приводит души женихов. Путь проходит мимо вод Океана, скалы Левкады, солнечных врат и страны сновидений к асфоделевому лугу, где обитают тени умерших героев."
  - id: asphodel-meadow
    name: "Асфоделевый луг"
    type: location
    description: "Песнь 24: Луг в мире мёртвых, где пребывают души умерших. Здесь тени Ахилла, Агамемнона и других героев встречают приведённых Гермесом женихов и расспрашивают об их гибели."
  - id: patroclus-antilochus-ajax-shades
    name: "Тени Патрокла, Антилоха и Аякса"
    type: character
    description: "Песнь 24: Души погибших участников Троянской войны, пребывающие вместе с тенью Ахилла на асфоделевом лугу. Они названы как умершие герои, но не произносят самостоятельных речей в этой песне."
  - id: thetis
    name: "Фетида"
    type: character
    description: "Песнь 24: Бессмертная морская мать Ахилла. В рассказе Агамемнона о погребении сына она выходит из моря вместе с нимфами, приносит погребальные одежды и сосуд для останков, а затем учреждает состязания в его честь."
  - id: nereids
    name: "Морские нимфы, дочери морского старца"
    type: creature
    description: "Песнь 24: Бессмертные морские спутницы Фетиды, поднявшиеся из моря, чтобы оплакать Ахилла. Они облачают тело погибшего в бессмертные одежды; их появление пугает ахейское войско."
  - id: muses
    name: "Девять муз"
    type: character
    description: "Песнь 24: Девять божественных певиц, которые в рассказе Агамемнона поют погребальный плач по Ахиллу. Их песня заставляет всё ахейское войско рыдать; сами музы не участвуют в событиях на Итаке."
  - id: laertes-divine-renewal
    name: "Божественное обновление Лаэрта"
    type: phenomenon
    description: "Песнь 24: Афина изменяет облик престарелого Лаэрта, делая его выше и крепче, а во время последней схватки вливает в него новые силы. Оба проявления связаны с одним адресным вмешательством богини."
  - id: zeus-thunderbolt-peace
    name: "Молния Зевса при прекращении распри"
    type: phenomenon
