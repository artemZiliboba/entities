id: odyssey-butler-1900
title: "Одиссея"
original_title: "The Odyssey"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Одиссея, песни I–XXIV"
source:
  title: "Homer, The Odyssey, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Единая запись по 24 песням. Каждое описание содержит ссылки на песни в виде «Песнь N:». В песне X использован ранее опубликованный файл с переводом Батлера; сведения из других переводов не добавлялись."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: "Песнь 1: Богиня просит Зевса помочь возвращению Одиссея и отправляется на Итаку, приняв облик тафийского царя Ментеса. Она внушает Телемаху решимость отправиться за вестями об отце, затем улетает подобно птице и насылает сон на Пенелопу. В переводе Батлера именуется Минервой.\n\nПеснь 2: Богиня придаёт Телемаху необычайное величие перед собранием. Затем является ему в облике и с голосом Ментора, принимает облик самого Телемаха, чтобы собрать команду, погружает женихов в сон и посылает кораблю попутный западный ветер. В переводе Батлера названа Минервой.\n\nПеснь 3: Сопровождает Телемаха в Пилос под обликом Ментора, придаёт ему смелости говорить с Нестором и молится Посейдону во время жертвенного пира. Вечером улетает в облике орла, открывая Нестору свою божественную природу. На следующий день лично принимает посвящённую ей жертву; Нестор также вспоминает её гнев на ахейцев после взятия Трои.\n\nПеснь 4: В воспоминании Менелая отводит Елену от деревянного коня у Трои. На Итаке слышит молитву Пенелопы и создаёт для неё утешительное сновидение в облике сестры Ифтимы. В переводе Батлера именуется Минервой.\n\nПеснь 5: Богиня, заступающаяся за Одиссея перед Зевсом. После того как Посейдон разбивает плот героя бурей, Афина останавливает остальные ветры, направляет спасительный северный ветер, помогает Одиссею выбраться из прибоя и в конце навевает ему сон.\n\nПеснь 6: Богиня, которая приходит к спящей Навсикае в облике её подруги, дочери Диманта, и убеждает отправиться стирать одежду. Затем она устраивает пробуждение Одиссея, вселяет в Навсикаю мужество и устраняет её страх перед незнакомцем. После омовения героя Афина делает его выше и красивее, придавая волосам пышность. В конце песни слышит молитву Одиссея, но не показывается ему из-за гнева Посейдона.\n\nПеснь 7: Богиня скрывает Одиссея густым туманом, чтобы жители города феаков его не заметили, и под видом маленькой девочки с кувшином провожает к дворцу Алкиноя. После этого покидает Схерию и направляется в Афины.\n\nПеснь 8: Богиня принимает облик слуги Алкиноя и созывает феаков на собрание, а затем делает Одиссея на вид выше и красивее. Во время состязаний она появляется в облике мужчины и отмечает место, куда упал далеко брошенный Одиссеем диск. В песне Демодока ей также приписывается помощь ахейцам при взятии Трои."
  - id: athena-flying-sandals
    name: "Летучие сандалии Афины"
    type: artifact
    description: "Песнь 1: Нетленные золотые сандалии богини, позволяющие ей лететь с быстротой ветра над сушей и морем. Афина надевает их перед отправлением с Олимпа на Итаку."
  - id: zeus
    name: "Зевс"
    type: character
    description: "Песнь 1: Владыка богов обсуждает с Афиной судьбу Одиссея и объясняет, что Посейдон мешает его возвращению из-за ослепления Полифема. Он вспоминает, как отправлял Гермеса предупредить Эгисфа о грозящей мести Ореста. В переводе Батлера назван Юпитером.\n\nПеснь 2: Владыка богов посылает двух орлов над собранием итакийцев, когда Телемах осуждает женихов. Прорицатель Галитерс истолковывает их поведение как знак близкого возвращения Одиссея и гибели женихов; сами женихи спорят с этим толкованием.\n\nПеснь 3: В рассказе Нестора о возвращении ахейцев после падения Трои Зевс препятствует их отплытию, разжигает раздоры и насылает бурю на корабли Менелая. Эти действия относятся к прошлому, а не к путешествию Телемаха в Пилос.\n\nПеснь 4: Владыка богов, к которому Менелай должен принести жертвы для возвращения домой. Протей предсказывает особую судьбу Менелая благодаря родству с Зевсом через Елену; Елена называет Зевса подателем добра и зла.\n\nПеснь 5: Верховный бог, решающий на совете бессмертных, что Одиссей должен вернуться домой. Посылает Гермеса с приказом к Калипсо и определяет, что герой доберётся до феаков после тяжёлого плавания на плоту.\n\nПеснь 12: Верховный бог, к которому Гелиос обращается с требованием отомстить за священных коров. Зевс обещает разбить корабль Одиссея молнией и исполняет угрозу в море; спутники гибнут, а Одиссей остаётся единственным выжившим."
  - id: poseidon
    name: "Посейдон"
    type: character
    description: "Песнь 1: Бог моря, который продолжает преследовать Одиссея за ослепление циклопа Полифема, своего сына. Пока остальные боги совещаются, Посейдон находится на пиру у эфиопов. В переводе Батлера именуется Нептуном.\n\nПеснь 3: Бог моря и землетрясений, в честь которого жители Пилоса приносят жертву из чёрных быков. Афина под видом Ментора обращается к нему с молитвой о благополучии Нестора, его сыновей и Телемаха. В рассказе Нестора морскому богу также приписывается помощь во время возвращения из-под Трои; лично он не появляется.\n\nПеснь 4: Бог моря, повелевающий Протеем. В рассказе морского старца Посейдон сначала спасает Аякса из воды, затем раскалывает трезубцем скалу Гирей, когда тот хвастается независимостью от богов, и Аякс гибнет.\n\nПеснь 5: Бог моря, разгневанный на Одиссея. Увидев его на плоту, Посейдон вздымает море трезубцем, собирает грозовые тучи и вызывает бурю, разбивающую плот. После этого возвращается в свой дворец в Эгах.\n\nПеснь 7: Морской бог, названный предком царского рода феаков: от Перибеи у него родился Навсифой, дед царицы Ареты. По словам Афины, феаки плавают по морю милостью Посейдона. В действии песни VII бог лично не появляется.\n\nПеснь 8: В песне Демодока морской бог выступает поручителем Ареса и убеждает Гефеста отпустить пленников, обещая самому уплатить возмещение, если Арес этого не сделает. В конце песни Алкиной пересказывает предостережение о возможной расправе Посейдона над кораблями феаков.\n\nПеснь 9: Бог моря, отец циклопа Полифема. После ослепления сына Полифем призывает Посейдона задержать Одиссея и сделать его возвращение домой мучительным; в пределах песни IX сам Посейдон не появляется и не совершает непосредственно описанного действия."
  - id: calypso
    name: "Калипсо"
    type: character
    description: "Песнь 1: Бессмертная богиня, дочь Атланта, удерживающая Одиссея на своём острове в пещере и желающая сделать его супругом. Афина говорит, что Калипсо уговорами старается заставить героя забыть родину; сама Калипсо в этой песне не появляется.\n\nПеснь 4: Нимфа, удерживающая Одиссея на далёком острове. Протей видит героя в её доме и сообщает Менелаю, что Одиссей не может отплыть из-за отсутствия корабля и команды.\n\nПеснь 5: Бессмертная нимфа и богиня, удерживающая Одиссея на своём острове. Она предлагает сделать его бессмертным и нестареющим, но после приказа Зевса через Гермеса отпускает героя, снабжает провизией и посылает попутный ветер. Предложенное превращение Одиссея в бессмертного не происходит."
  - id: atlas
    name: "Атлант"
    type: character
    description: "Песнь 1: Отец Калипсо, названный волшебником, ведающим морскими глубинами. Он поддерживает огромные столпы, разделяющие землю и небо; его действия упомянуты Афиной при описании острова Калипсо."
  - id: polyphemus
    name: "Полифем"
    type: creature
    description: "Песнь 1: Циклоп, сын Посейдона и морской нимфы Фоосы. Зевс напоминает, что Одиссей ослепил Полифема, и именно за это Посейдон препятствует возвращению героя. В событиях песни циклоп не появляется.\n\nПеснь 2: Свирепый одноглазый великан, о котором Эгиптий говорит как об убийце его сына Антифа: циклоп запер спутников Одиссея в пещере и съел юношу. Здесь он существует только в воспоминании о прежнем путешествии; имя Полифема в этой песне не произнесено.\n\nПеснь 9: Одноглазый циклоп, сын Посейдона и нимфы Фоосы, живущий в пещере и пасущий овец и коз. Огромный и необычайно сильный, он заваливает вход громадным камнем, убивает и пожирает нескольких спутников Одиссея. Одиссей опьяняет его вином, выжигает единственный глаз заострённым колом и спасается, привязав людей под брюхом баранов. Ослеплённый Полифем молит Посейдона помешать возвращению Одиссея."
    aliases:
      - "Циклоп"
  - id: thoosa
    name: "Фооса"
    type: character
    description: "Песнь 1: Морская нимфа, мать циклопа Полифема от Посейдона и дочь морского владыки Форкия. Упоминается в объяснении Зевса о происхождении вражды Посейдона к Одиссею.\n\nПеснь 9: Морская нимфа, дочь Форкиса, названная матерью Полифема от Посейдона. В действии песни IX она не появляется; её происхождение и родство сообщаются при объяснении того, почему Посейдон покровительствует циклопу."
  - id: phorcys
    name: "Форкий"
    type: character
    description: "Песнь 1: Морской владыка и отец нимфы Фоосы, через неё дед Полифема. В песне упомянут только в родословной циклопа; самостоятельных действий не совершает.\n\nПеснь 9: Морское божество, отец нимфы Фоосы и дед Полифема по материнской линии. В песне IX он упоминается лишь в родословной циклопа; самостоятельных действий и способностей текст здесь не описывает."
    aliases:
      - "Форкис"
  - id: hermes
    name: "Гермес"
    type: character
    description: "Песнь 1: Посланник богов, которого Зевс ранее отправил предупредить Эгисфа о возмездии Ореста. Афина предлагает вновь послать его к Калипсо с приказом отпустить Одиссея; в этой песне новое поручение только обсуждается. В переводе Батлера именуется Меркурием.\n\nПеснь 5: Божественный вестник, который по приказу Зевса перелетает море и сообщает Калипсо решение отпустить Одиссея. При полёте пользуется волшебными сандалиями и держит жезл, способный усыплять и пробуждать людей.\n\nПеснь 8: Божественный вестник присутствует среди богов, пришедших увидеть пленённых Ареса и Афродиту. В шутливом разговоре с Аполлоном признаётся, что согласился бы оказаться в таких же путах рядом с Афродитой."
  - id: helios
    name: "Гелиос-Гиперион"
    type: character
    description: "Песнь 1: Солнечный бог, чьих священных быков съели спутники Одиссея. Вступление связывает этот проступок с их гибелью и невозможностью вернуться домой; сам бог в событиях Итаки не появляется.\n\nПеснь 8: Бог солнца, замечающий тайные встречи Ареса и Афродиты и сообщающий о них Гефесту. Позже он вновь следит за домом кузнеца и извещает его, когда любовники оказываются в ловушке.\n\nПеснь 12: Божество, которому принадлежат священные стада на острове Тринакия. Узнав от дочери Лампетии, что спутники Одиссея убили его коров, Гелиос требует возмездия от Зевса и грозит уйти светить мёртвым в подземный мир, если его не услышат."
    aliases:
      - "Гелиос"
      - "Гелиос — бог Солнца"
  - id: zeus-eagle-omen
    name: "Знамение двух орлов Зевса"
    type: phenomenon
    description: "Песнь 2: Два орла, посланные Зевсом, кружат над собранием жителей Итаки, дерутся и улетают направо. Галитерс видит в этом предвестие возвращения Одиссея и бедствия для женихов. Знамение имеет отдельную сюжетную роль в споре о будущем дома Одиссея."
  - id: erinyes
    name: "Эринии"
    type: creature
    description: "Песнь 2: Божественные мстительницы, которых, по словам Телемаха, Пенелопа могла бы призвать на него, если бы он насильно выгнал мать из дома. В песне они лишь упомянуты как возможные исполнительницы материнского проклятия и не появляются."
  - id: themis
    name: "Фемида"
    type: character
    description: "Песнь 2: Богиня, которую Телемах призывает вместе с Зевсом во время народного собрания, называя покровительницей его созыва и завершения. Непосредственного вмешательства Фемиды в события песни не показано."
  - id: apollo
    name: "Аполлон"
    type: character
    description: "Песнь 3: Нестор рассказывает, что Аполлон убил кормчего Менелая Фронтиса своими безболезненными стрелами у мыса Суний. Гибель кормчего заставила Менелая задержаться для погребения. Сам бог в настоящем действии песни не появляется.\n\nПеснь 8: Бог, который в песне Демодока разговаривает с Гермесом у ложа пленённых богов. В начале песни упомянуто также его прорицание Агамемнону в Пифо о ссоре ахейских вождей."
  - id: penelope-dream-phantom
    name: "Сновидение в облике Ифтимы"
    type: phenomenon
    description: "Песнь 4: Созданный Афиной призрак является спящей Пенелопе под видом её сестры Ифтимы, обещает возвращение Телемаха и говорит о покровительстве богини. После разговора видение исчезает, а Пенелопа пробуждается успокоенной."
  - id: proteus
    name: "Протей"
    type: character
    description: "Песнь 4: Бессмертный морской старец, слуга Посейдона, знающий морские пути и судьбы людей. Захваченный Менелаем, он превращается в льва, дракона, леопарда, кабана, воду и дерево, но в конце открывает путь домой и рассказывает о судьбах ахейцев."
  - id: eidothea
    name: "Эйдофея"
    type: character
    description: "Песнь 4: Морская богиня, дочь Протея, помогает Менелаю захватить отца: указывает время его выхода на берег, добывает тюленьи шкуры для укрытия и приносит амброзию, заглушающую их запах."
  - id: ambrosia-seal-scent
    name: "Амброзия против запаха тюленей"
    type: substance
    description: "Песнь 4: Ароматная амброзия, которую Эйдофея помещает под носы Менелаю и трём его спутникам, чтобы заглушить невыносимый запах тюленьих шкур во время засады на Протея."
  - id: helen-nepenthe
    name: "Зелье Елены, избавляющее от печали"
    type: substance
    description: "Песнь 4: Сильнодействующее египетское средство, подаренное Елене Полидамной, женой Фона. Подмешанное в вино, оно на целый день лишает выпивших способности плакать даже при самых тяжёлых утратах."
  - id: elysian-plain
    name: "Элизийские поля"
    type: location
    description: "Песнь 4: Блаженная область на краю света, куда, по пророчеству Протея, боги перенесут Менелая вместо обычной смерти в Аргосе. Там не бывает снега, дождя и града, а с Океана постоянно веет освежающий западный ветер."
  - id: rhadamanthus
    name: "Радаманф"
    type: character
    description: "Песнь 4: Правитель Элизийских полей, названный Протеем при пророчестве о посмертной судьбе Менелая. В событиях песни не появляется."
  - id: hera
    name: "Гера"
    type: character
    description: "Песнь 4: Богиня, которая, согласно рассказу Протея, оберегает Агамемнона во время его морского возвращения после Троянской войны. В текущих событиях Спарты не появляется.\n\nПеснь 12: Богиня, которая, по рассказу Кирки, провела корабль Арго через Блуждающие скалы, спасая Ясона. В событиях самого путешествия Одиссея она не появляется."
  - id: aphrodite
    name: "Афродита"
    type: character
    description: "Песнь 4: Богиня, которую Елена винит в своём уходе из дома к троянцам. Елена упоминает её воздействие как причину своего прежнего поступка; сама богиня в этой песне не появляется.\n\nПеснь 8: Богиня любви, супруга Гефеста в рассказе Демодока. Вместе с Аресом оказывается в неразрывных путях; после освобождения отправляется в своё святилище в Пафосе на Кипре, где Хариты купают и одевают её."
  - id: hephaestus
    name: "Гефест"
    type: character
    description: "Песнь 4: Божественный кузнец, изготовивший серебряную чашу с золотым ободом, которую Менелай намерен подарить Телемаху. Никаких сверхъестественных свойств чаши текст не сообщает.\n\nПеснь 7: Божественный кузнец, который, согласно описанию дворца Алкиноя, изготовил золотых и серебряных сторожевых псов. Эти создания не умирают и не стареют; сам Гефест в событиях песни не появляется.\n\nПеснь 8: В песне Демодока божественный кузнец узнаёт об измене Афродиты с Аресом и выковывает невидимые неразрывные путы, чтобы поймать их на супружеском ложе. Позднее освобождает пленников, получив обещание Посейдона отвечать за возмещение."
  - id: paeon
    name: "Пеон"
    type: character
    description: "Песнь 4: Божественный родоначальник египетских врачевателей: повествователь говорит, что жители Египта искусны в лекарствах, поскольку происходят от Пеона. Лично он в сюжете не действует."
  - id: hermes-winged-sandals
    name: "Летучие сандалии Гермеса"
    type: artifact
    description: "Песнь 5: Сверкающие золотые сандалии божественного вестника, позволяющие ему летать над сушей и морем с быстротой ветра. Гермес надевает их перед путешествием на остров Калипсо."
  - id: hermes-sleep-wand
    name: "Жезл Гермеса, навевающий сон"
    type: artifact
    description: "Песнь 5: Жезл, которым Гермес может по собственной воле погружать людей в сон и пробуждать их. В песне V он несёт жезл во время полёта, но не применяет его к Одиссею или Калипсо."
  - id: ino-leucothea
    name: "Ино — Левкотея"
    type: character
    description: "Песнь 5: Дочь Кадма, прежде смертная женщина, а затем морская богиня Левкотея. Поднимается из волн подобно чайке, жалеет Одиссея и даёт ему зачарованное покрывало, защищающее во время плавания. После спасения героя принимает покрывало обратно из моря."
  - id: leucothea-enchanted-veil
    name: "Зачарованное покрывало Левкотеи"
    type: artifact
    description: "Песнь 5: Волшебная ткань, которую морская богиня велит Одиссею обвязать вокруг груди перед тем, как броситься в воду. По словам Левкотеи, покрывало защитит его от вреда в море; достигнув берега, Одиссей возвращает его в волны."
  - id: river-god-scheria
    name: "Речной бог у берегов Схерии"
    type: character
    description: "Песнь 5: Неназванное божество реки, к устью которой после кораблекрушения приплывает Одиссей. Герой обращается к нему с мольбой, и бог останавливает течение и усмиряет волны, позволяя путнику добраться до берега."
  - id: ogygia
    name: "Огигия — остров Калипсо"
    type: location
    description: "Песнь 5: Уединённый остров посреди моря, где живёт бессмертная Калипсо и долго удерживает Одиссея. Её пещеру окружают деревья, виноградная лоза и четыре ручья. В песне остров служит обителью богини, но не проявляет самостоятельных магических свойств."
  - id: divine-ambrosia-and-nectar
    name: "Амброзия и нектар богов"
    type: substance
    description: "Песнь 5: Пища и напиток бессмертных, которыми Калипсо угощает Гермеса и которыми питается сама. Одиссею при этом подают обычную человеческую еду. Песнь не описывает отдельного превращающего или исцеляющего действия этих веществ."
  - id: olympus
    name: "Олимп — обитель бессмертных"
    type: location
    description: "Песнь 6: Вечное жилище богов, куда Афина возвращается после посещения Навсикаи. В описании песни VI здесь не бывает ни дождя, ни снега, ни сильного ветра: место постоянно озарено ясным светом и пребывает в покое."
  - id: athena-dream-visitation
    name: "Сновидение Навсикаи, посланное Афиной"
    type: phenomenon
    description: "Песнь 6: Божественное явление во сне, во время которого Афина принимает облик знакомой девушки и разговаривает со спящей Навсикаей. Проснувшись, царевна помнит сон и просит отца дать повозку для поездки к реке. Это действие самой Афины, а не самостоятельное существо."
  - id: athena-beautification
    name: "Преображение внешности Одиссея Афиной"
    type: phenomenon
    description: "Песнь 6: После омовения Одиссея Афина делает его на вид выше и крепче, придаёт волосам густоту и красивые локоны, а его облику — сияющую привлекательность. Навсикая замечает перемену. В песне это прямое действие богини, а не свойство воды или масла."
  - id: athena-concealing-mist
    name: "Скрывающий туман Афины"
    type: phenomenon
    description: "Песнь 7: Созданное Афиной облако тьмы, внутри которого Одиссей остаётся невидимым для феаков, пока проходит по городу и входит во дворец. Туман исчезает, когда герой припадает к коленям царицы Ареты."
  - id: immortal-metal-guard-dogs
    name: "Бессмертные металлические псы дворца Алкиноя"
    type: artifact
    description: "Песнь 7: Золотые и серебряные изображения сторожевых собак, изготовленные Гефестом для охраны дворца царя Алкиноя. В отличие от обычных статуй, они прямо названы бессмертными и нестареющими. Песня не описывает их передвижения, речи или нападений."
  - id: alcinous-everfruiting-garden
    name: "Вечно плодоносящий сад Алкиноя"
    type: location
    description: "Песнь 7: Сад при дворце царя феаков, где груши, яблоки, инжир, маслины и виноград плодоносят без перерыва круглый год: новый урожай поспевает прежде, чем исчезает прежний. Плоды не гниют и не пропадают. Текст связывает изобилие с мягким воздухом и дарами богов, не называя отдельного заклинания."
  - id: phaeacian-ships
    name: "Быстроходные корабли феаков"
    type: artifact
    description: "Песнь 7: Корабли феаков, о которых Афина говорит, что они скользят по морю быстро, словно мысль или птица. Алкиной рассказывает о плавании до Эвбеи и обратно за один день. Песня VII не утверждает, что суда сами управляют собой или обладают сознанием: это описание необычайной скорости, а не доказательство автономной магии."
  - id: muse-of-demodocus
    name: "Муза — покровительница Демодока"
    type: character
    description: "Песнь 8: Божественная покровительница певца Демодока, одарившая его искусством песнопения, но лишившая зрения. Во время пира вдохновляет его воспеть ссору Одиссея с Ахиллом. Её личное имя в песне не названо."
  - id: hephaestus-invisible-chains
    name: "Невидимые путы Гефеста"
    type: artifact
    description: "Песнь 8: Выкованные Гефестом чрезвычайно тонкие цепи, которых не может увидеть даже бог и которые нельзя разорвать или развязать. Они удерживают Ареса и Афродиту неподвижно на ложе, пока кузнец не освобождает их. Описаны внутри песни Демодока."
  - id: ares
    name: "Арес"
    type: character
    description: "Песнь 8: Бог войны, который в песне Демодока тайно встречается с Афродитой в доме Гефеста. Попадает в невидимую сеть божественного кузнеца и не может пошевелиться, пока Посейдон не добивается его освобождения."
  - id: graces
    name: "Хариты"
    type: character
    description: "Песнь 8: Божественные спутницы Афродиты, которые в рассказе Демодока после её освобождения купают богиню в Пафосе, умащают амброзиальным маслом и одевают в прекрасные одежды."
  - id: phaeacian-self-steering-ships
    name: "Самоуправляющиеся корабли феаков"
    type: artifact
    description: "Песнь 8: По словам царя Алкиноя, суда феаков не нуждаются в кормчих и обычных рулях: они сами понимают желания путешественников, знают города и страны и безопасно проходят сквозь туман и облака. Это прямое описание их необыкновенных свойств в песне VIII."
  - id: cyclopes
    name: "Циклопы"
    type: creature
    description: "Песнь 9: Племя великанов, живущих обособленно на острове без общих законов и собраний. Каждый правит собственным домом и семьёй. Услышав крики ослеплённого Полифема, соседние циклопы спрашивают, кто причиняет ему вред, но уходят, когда он отвечает, что его мучает «Никто», считая болезнь посланной Зевсом."
  - id: lotus-eaters
    name: "Лотофаги"
    type: character
    description: "Песнь 9: Жители страны лотоса, угощающие спутников Одиссея растением, после вкушения которого те забывают о возвращении домой и желают остаться среди лотофагов. Сами лотофаги не названы богами или чудовищами; их включение отражает устойчивую связь этого народа с необычайным воздействием лотоса."
  - id: forgetful-lotus
    name: "Лотос забвения"
    type: plant
    description: "Песнь 9: Растение, которым лотофаги кормят пришельцев. Попробовавшие его спутники Одиссея теряют желание сообщить новости и возвращаться на родину, предпочитая навсегда остаться среди лотофагов. Одиссей силой уводит их обратно на корабли и привязывает к скамьям."
  - id: circe
    name: "Кирка"
    type: character
    description: "Песнь 10: Богиня и волшебница, живущая на острове Ээя. Она подмешивает чары в пищу спутникам Одиссея и ударом жезла превращает их в свиней, а позднее с помощью противодействующих чар возвращает им человеческий облик."
    tags:
      - "goddess"
      - "witchcraft"
      - "transformation"
  - id: moly
    name: "Моли"
    type: plant
    description: "Песнь 10: Божественная трава с чёрным корнем и белым цветком, которую Гермес даёт Одиссею. Её сила защищает героя от колдовского напитка Кирки; смертным трудно вырвать это растение из земли, тогда как богам это доступно."
    tags:
      - "protection"
      - "anti-magic"
      - "divine-plant"
  - id: circes-wand
    name: "Жезл Кирки"
    type: artifact
    description: "Песнь 10: Волшебный жезл, которым Кирка ударяет выпивших её зелье людей, завершая превращение в животных. В выбранном тексте жезл непосредственно связан как с попыткой превращения Одиссея, так и с чарами над его спутниками."
    tags:
      - "wand"
      - "transformation"
      - "enchanted-object"
  - id: aeolus-bag-of-winds
    name: "Мешок ветров Эола"
    type: artifact
    description: "Песнь 10: Мешок из бычьей шкуры, в который Эол заключает пути ревущих ветров и плотно запечатывает серебряной нитью, оставляя свободным лишь попутный западный ветер. Когда спутники Одиссея развязывают мешок, освобождённые ветры вызывают бурю и уносят корабль назад к острову Эола."
    tags:
      - "wind"
      - "containment"
      - "enchanted-object"
  - id: underworld-entrance
    name: "Вход в царство мёртвых у киммерийцев"
    type: location
    description: "Песнь 11: Мрачная область у края Океана, где живут киммерийцы и куда не проникает свет Солнца. Здесь Одиссей выкапывает яму для жертвенных возлияний, и к крови стекаются души умерших из подземного мира. Текст не утверждает, что киммерийцы сами являются духами."
  - id: souls-of-the-dead
    name: "Души умерших"
    type: creature
    description: "Песнь 11: Бестелесные тени покойных, собирающиеся вокруг жертвенной крови в царстве мёртвых. Среди них женщины, воины, старики и дети; некоторые обретают возможность связно говорить с Одиссеем после того, как пьют кровь. Они не способны обнять живого человека как прежде, поскольку тело после смерти утрачено."
  - id: tiresias-shade
    name: "Тень Тиресия"
    type: character
    description: "Песнь 11: Душа слепого фиванского прорицателя, сохранившая после смерти разум и дар предвидения по воле Персефоны. Выпив жертвенной крови, Тиресий предсказывает Одиссею опасность со стадами Гелиоса, трудное возвращение, будущую месть женихам и путешествие с веслом в страну, где не знают моря."
  - id: persephone
    name: "Персефона"
    type: character
    description: "Песнь 11: Владычица подземного мира, которая, согласно объяснению Кирки, оставила Тиресию способность мыслить после смерти, тогда как другие души подобны теням. В рассказе Одиссея она также направляет к нему души умерших женщин и, как он опасается, может послать страшное чудовище."
  - id: hades
    name: "Аид"
    type: character
    description: "Песнь 11: Владыка царства мёртвых, упоминаемый как правитель обители умерших. В песне XI он не выступает лично и не разговаривает с Одиссеем; сведения о нём ограничены принадлежностью подземного царства."
  - id: anticleia-shade
    name: "Тень Антиклеи"
    type: character
    description: "Песнь 11: Душа матери Одиссея, умершей от тоски по сыну. После вкушения жертвенной крови узнаёт Одиссея и рассказывает о положении его семьи на Итаке. Трижды Одиссей пытается обнять её, но тень каждый раз ускользает из его рук."
  - id: elpenor-shade
    name: "Тень Эльпенора"
    type: character
    description: "Песнь 11: Душа спутника Одиссея, погибшего при падении с крыши дома Кирки. Он приходит к жертвенной яме ещё до погребения тела, говорит с Одиссеем и просит устроить ему похороны и поставить весло на могиле."
  - id: agamemnon-shade
    name: "Тень Агамемнона"
    type: character
    description: "Песнь 11: Душа убитого царя, которая после жертвенной крови рассказывает Одиссею о собственном убийстве Эгисфом и Клитемнестрой. Предостерегает героя от беспечной доверчивости при возвращении домой."
  - id: achilles-shade
    name: "Тень Ахилла"
    type: character
    description: "Песнь 11: Душа прославленного героя Троянской войны, говорящая с Одиссеем в подземном мире. Отвергает утешение о власти над мёртвыми, предпочитая даже тяжёлую жизнь простого работника участи покойного; радуется известиям о доблести сына Неоптолема."
  - id: ajax-shade
    name: "Тень Аякса"
    type: character
    description: "Песнь 11: Душа Аякса Теламонида, продолжающая сердиться на Одиссея из-за спора за доспехи Ахилла. Она не отвечает на попытки Одиссея примириться и удаляется к другим мертвецам."
  - id: minos-shade
    name: "Минос — судья умерших"
    type: character
    description: "Песнь 11: Умерший царь Минос, сын Зевса, которого Одиссей видит в царстве мёртвых с золотым скипетром. Минос разбирает споры среди теней, сидящих и стоящих вокруг него."
  - id: orion-shade
    name: "Тень Ориона"
    type: character
    description: "Песнь 11: Душа великого охотника, которую Одиссей видит в подземном мире. Орион продолжает преследовать по асфоделевому лугу призрачных зверей, убитых им при жизни, держа в руках бронзовую палицу."
  - id: tityos
    name: "Титий"
    type: character
    description: "Песнь 11: Гигант, сын Геи, лежащий в царстве мёртвых на земле и занимающий девять плетров. Два стервятника непрерывно терзают его печень в наказание за нападение на Лето."
  - id: tantalus
    name: "Тантал"
    type: character
    description: "Песнь 11: Наказанный мертвец, стоящий по горло в воде, которая отступает при попытке напиться. Над ним висят ветви с плодами, но ветер отводит их всякий раз, когда он протягивает руку."
  - id: sisyphus
    name: "Сизиф"
    type: character
    description: "Песнь 11: Наказанный мертвец, вынужденный толкать огромный камень на вершину холма. Каждый раз, когда он почти достигает цели, валун скатывается вниз и труд начинается снова."
  - id: heracles-phantom
    name: "Тень Геракла"
    type: character
    description: "Песнь 11: Призрачный образ Геракла, которого Одиссей встречает среди умерших. В самой песне уточняется, что настоящий Геракл находится среди бессмертных богов, а здесь пребывает лишь его образ. Тень вспоминает собственные страдания и поход за псом Аида."
  - id: gorgon-head-threat
    name: "Угроза головы Горгоны"
    type: creature
    description: "Песнь 11: Чудовищная голова Горгоны, которую, как опасается Одиссей, Персефона может прислать ему из подземного мира. Само чудовище в песне XI не появляется: Одиссей поспешно уходит, опасаясь возможного нападения."
  - id: sirens
    name: "Сирены"
    type: creature
    description: "Песнь 12: Две сверхъестественные певицы, живущие среди останков погибших мореходов. Их сладостное пение завораживает тех, кто проплывает мимо, и заставляет отказаться от возвращения домой; они обещают знание о Троянской войне и событиях мира. Одиссей слышит песню, будучи привязанным к мачте, и требует освободить его, но спутники затягивают путы. Внешность сирен в этой песни не описана."
  - id: wandering-rocks
    name: "Блуждающие скалы"
    type: location
    description: "Песнь 12: Смертоносные скалы, о которых Кирка рассказывает Одиссею как об одном из двух возможных путей. Ни птицы, несущие Зевсу амброзию, ни корабли обычно не проходят между ними невредимыми; лишь Арго избежал гибели благодаря помощи Геры. Скалы не показаны как одушевлённые существа."
  - id: scylla
    name: "Сцилла"
    type: creature
    description: "Песнь 12: Бессмертное и неодолимое морское чудовище, живущее в пещере высокой скалы. У неё двенадцать уродливых ног, шесть длинных шей и шесть голов с тремя рядами зубов. Она одновременно хватает шестерых спутников Одиссея и съедает их; Кирка советует не вступать с ней в бой, а скорее проплыть мимо."
  - id: charybdis
    name: "Харибда"
    type: creature
    description: "Песнь 12: Чудовищная морская сила у подножия второй скалы: трижды в день она поглощает морскую воду и трижды извергает её, создавая губительный водоворот. После гибели корабля Одиссей спасается от её воронки, ухватившись за смоковницу над водой, и дожидается, когда Харибда выбросит обратно обломки судна. В этой песни не описан человекоподобный облик Харибды."
  - id: cratais
    name: "Кратеида"
    type: character
    description: "Песнь 12: Мать Сциллы, к которой Кирка велит громко обратиться, чтобы остановить второе нападение чудовища. В самой песне Кратеида не появляется и не действует непосредственно; её влияние известно только из совета Кирки."
  - id: phaethusa
    name: "Фаэтуса"
    type: character
    description: "Песнь 12: Дочь Гелиоса и Неэры, одна из двух богинь-пастушек, которым поручено стеречь священные стада отца на Тринакии. В песне не показано её самостоятельных сверхъестественных действий."
  - id: lampetie
    name: "Лампетия"
    type: character
    description: "Песнь 12: Дочь Гелиоса и Неэры, богиня-пастушка на острове Тринакия. Когда люди Одиссея убивают священных коров, она немедленно сообщает об этом отцу, вызывая его требование наказать виновных."
  - id: helios-sacred-herds
    name: "Священные стада Гелиоса"
    type: animal
    description: "Песнь 12: Семь стад коров и семь отар овец по пятьдесят голов, принадлежащих богу Солнца; животные не размножаются и не убывают числом. После того как спутники Одиссея убивают часть коров, шкуры убитых ползают, а мясо на вертелах издаёт коровье мычание. Нарушение запрета приводит к божественному наказанию."
  - id: sea-nymphs-thrinacia
    name: "Морские нимфы у Тринакии"
    type: creature
    description: "Песнь 12: Сверхъестественные обитательницы пещеры на острове Тринакия, где они устраивают собрания и танцы. Одиссей и его спутники укрывают корабль в этой пещере во время непогоды. Иных действий нимф в песне не описано."
