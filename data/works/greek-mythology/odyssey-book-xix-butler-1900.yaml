id: odyssey-book-xix-butler-1900
title: "Одиссея. Песнь XIX: Одиссей беседует с Пенелопой"
original_title: "Odyssey, Book XIX"
author: "Гомер"
kind: epic
tradition:
  - greek-mythology
collection: "Odyssey (English prose translation by Samuel Butler, 1900)"
source:
  title: "Homer, The Odyssey, Book XIX, translated by Samuel Butler (1900)"
  url: "https://www.gutenberg.org/files/1727/1727-h/1727-h.htm"
  note: "Песнь XIX целиком в прозаическом переводе Сэмюэла Батлера (1900). Выдуманная Одиссеем критская биография и его рассказы о Додоне не принимаются за реально совершённые путешествия. Другие песни и варианты не смешиваются."
entities:
  - id: athena
    name: "Афина"
    type: character
    description: >-
      Богиня помогает Одиссею и Телемаху убрать оружие из зала, идя впереди с золотым светильником, озаряющим помещение необычайным сиянием. Позднее она отвлекает внимание Пенелопы, чтобы та не заметила, как Евриклея узнала мужа по шраму, и в конце песни насылает Пенелопе сладкий сон.
  - id: athena-golden-lamp
    name: "Золотой светильник Афины"
    type: artifact
    description: >-
      Светильник, который богиня несёт перед Одиссеем и Телемахом, когда они убирают оружие. Он излучает настолько необыкновенное сияние, что Телемах видит словно объятые пламенем стены, балки и опоры дома и заключает, что рядом присутствует божество. Сверхъестественность сцены связана с явлением Афины и её светильником.
  - id: hermes
    name: "Гермес"
    type: character
    description: >-
      Бог, в переводе Батлера именуемый Меркурием, наделил Автолика исключительной ловкостью в воровстве и клятвопреступлении, поскольку тот приносил ему жертвы. Об этом рассказывается во вставном воспоминании о детстве Одиссея и происхождении его шрама.
  - id: autolycus
    name: "Автолик"
    type: character
    description: >-
      Дед Одиссея по матери, искусный вор и нарушитель клятв. Его необычайные способности прямо объяснены даром Гермеса, которому Автолик приносил жертвы. Во время охоты на Парнасе сыновья Автолика также произносят заклинание, останавливающее кровь из раны Одиссея.
  - id: blood-staunching-spell
    name: "Заговор для остановки крови"
    type: spell
    description: >-
      Сыновья Автолика произносят заклинание над раной юного Одиссея после нападения дикого кабана. Текст прямо связывает заговор с остановкой кровотечения; слова заклинания и подробности обряда не приводятся.
  - id: penelope-eagle-geese-dream
    name: "Сон Пенелопы об орле и двадцати гусях"
    type: phenomenon
    description: >-
      Пенелопа видит сон, в котором орёл убивает двадцать её гусей, а затем человеческим голосом объясняет, что гуси означают женихов, а орёл — вернувшегося Одиссея, который погубит их. Одиссей истолковывает сон как предвестие гибели женихов; сама Пенелопа сомневается в его достоверности.
  - id: gates-of-horn-and-ivory
    name: "Врата сновидений из рога и слоновой кости"
    type: location
    description: >-
      Два символических прохода, о которых Пенелопа рассказывает, рассуждая о правдивости снов. Сновидения, проходящие через врата из слоновой кости, обманывают людей, тогда как проходящие через роговые врата несут исполнимое предзнаменование. Врата не показаны как место реального путешествия персонажей.
  - id: zeus
    name: "Зевс"
    type: character
    description: >-
      Верховный бог, упоминаемый в молитвах, клятвах и рассказах. В придуманной Одиссеем критской родословной Минос якобы регулярно советовался с Зевсом; этот эпизод принадлежит ложной биографии рассказчика. Одиссей также приписывает Зевсу гибель своих спутников за святотатство, вспоминая историю о стадах бога Солнца.
  - id: helios
    name: "Гелиос"
    type: character
    description: >-
      Бог Солнца, чьих священных коров спутники Одиссея убили на острове Тринакия. Одиссей напоминает Пенелопе об этом преступлении и о гибели команды, хотя излагает историю внутри своего обманного рассказа о странствиях.
  - id: eileithyia
    name: "Илифия"
    type: character
    description: >-
      Богиня, чья пещера близ критской гавани Амнис упоминается в вымышленном рассказе Одиссея о его происхождении и встрече с самим собой. Пещера названа в тексте, но никакого появления богини или чудесного события там не описано.
