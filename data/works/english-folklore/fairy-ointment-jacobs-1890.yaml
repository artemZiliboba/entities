id: fairy-ointment-jacobs-1890
title: "Волшебная мазь"
original_title: "Fairy Ointment"
kind: folktale
tradition:
  - english-folklore
collection: "English Fairy Tales (Joseph Jacobs, 1890)"
source:
  title: "English Fairy Tales/Fairy Ointment — Wikisource"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/Fairy_Ointment"
  note: "Полностью прочитана сказка Fairy Ointment из сборника English Fairy Tales Джозефа Джейкобса (1890), стр. 220–223, строки 100–118 Wikisource. Другие варианты сюжета о волшебной мази не смешивались."
entities:
  - id: fairy-sight-ointment
    name: "Мазь, открывающая зрение на пикси"
    type: substance
    description: >
      Мазь из коробочки хозяйки дома пикси предназначена для глаз младенца.
      Повитуха тайком наносит немного средства на правое веко и начинает
      видеть скрытую истинную обстановку жилища, необычный облик детей
      и самого пикси, незаметного остальным посетителям рынка.
      После удара пикси по этому глазу женщина теряет такое зрение
      и навсегда слепнет на правый глаз.
    tags:
      - fairy-sight
      - enchanted-ointment
  - id: squint-eyed-pixie-father
    name: "Косоглазый пикси — отец семейства"
    type: creature
    description: >
      Маленький необычный старик привозит повитуху к своей семье,
      скрывающейся под обманчиво обыденным видом. На рынке он
      незаметно для обычных людей забирает товары с прилавков.
      Когда повитуха узнаёт его благодаря мази, пикси спрашивает,
      каким глазом она его видит, и ударом лишает её зрения
      на этот глаз.
    tags:
      - pixie
      - invisibility
      - fairy-glamour
  - id: pixie-mother-and-children
    name: "Семья пикси — мать и дети"
    type: creature
    description: >
      Семья, за младенцем которой ухаживает повитуха. Под действием
      мази её зрение меняется: мать выглядит прекрасной женщиной
      в белом шёлке, младенец — необыкновенно красивым,
      а старшие дети обнаруживают черты проказливых пикси:
      плоские носы, заострённые уши и волосатые лапы.
      Мать передаёт повитухе коробочку с волшебной мазью.
    tags:
      - pixie
      - fairy-glamour
