id: king-o-the-cats-jacobs-1894
title: "Король кошек"
original_title: "The King o' the Cats"
kind: legend
tradition:
  - english-folklore
collection: "More English Fairy Tales, Joseph Jacobs (1894)"
source:
  title: "Joseph Jacobs, More English Fairy Tales (1894), The King o' the Cats"
  url: "https://www.gutenberg.org/cache/epub/14241/pg14241-images.html"
  note: "Прочитан целиком рассказ The King o' the Cats в редакции Джозефа Джейкобса (1894). Джейкобс составил эту редакцию из нескольких английских вариантов; детали отдельных вариантов и современных пересказов не добавлены."
entities:
  - id: old-tom-tildrum-cat-king
    name: "Старый Том — король кошек"
    type: animal
    description: >-
      Большой чёрный домашний кот пономаря, до развязки выглядящий обычным питомцем. Услышав от хозяина сообщение, что Тим Толдрум умер, Том человеческим голосом восклицает, что теперь он король кошек, и исчезает через дымоход. Его способность говорить и осведомлённость о скрытой кошачьей иерархии прямо показаны; рассказ не утверждает, что он колдует или принимает человеческий облик.
  - id: nine-black-funeral-cats
    name: "Девять чёрных кошек похоронной процессии"
    type: animal
    description: >-
      Девять одинаково чёрных кошек с белыми пятнами на груди, которых пономарь видит ночью у могилы. Восемь несут маленький гроб под чёрным бархатным покровом и с золотой короной сверху; девятая, самая крупная, идёт впереди и человеческим голосом просит передать Тому Тилдруму весть о смерти Тима Толдрума. Их необычная речь и осмысленная погребальная церемония показывают, что это не обычные кошки.
