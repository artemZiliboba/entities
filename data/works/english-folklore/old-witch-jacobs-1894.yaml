id: old-witch-jacobs-1894
title: "Старая ведьма"
original_title: "The Old Witch"
kind: folktale
tradition:
  - english-folklore
collection: "More English Fairy Tales, Joseph Jacobs (1894), tale LXIV"
source:
  title: "Joseph Jacobs, More English Fairy Tales (1894), LXIV. The Old Witch"
  url: "https://en.wikisource.org/wiki/More_English_Fairy_Tales/The_Old_Witch"
  note: >-
    Прочитан весь рассказ LXIV в редакции Джозефа Джейкобса
    из More English Fairy Tales (1894). В примечаниях редактор
    указывает, что сюжет записан миссис Гомм в Дептфорде.
    Детали других вариантов и сказки братьев Гримм «Госпожа Метелица»
    не смешаны.
entities:
  - id: old-witch-of-the-house
    name: "Старая ведьма"
    type: character
    description: >-
      Хозяйка дома, нанимающая девушек в служанки и запрещающая
      им заглядывать в дымоход. Когда служанки нарушают запрет
      и уносят упавшие оттуда мешки денег, ведьма преследует их.
      Она разговаривает с яблоней, коровой и пекарем; в конце
      говорящая печь заманивает её внутрь и запирает. В тексте
      женщина прямо названа ведьмой, однако отдельные заклинания
      или совершённое ею превращение не показаны.
    tags:
      - witch
      - pursuit
  - id: speaking-bread-of-the-oven
    name: "Говорящие хлебы"
    type: artifact
    description: >-
      Хлебы, пекущиеся в печи семь лет и способные обращаться
      к прохожим с просьбой вынуть их. Первая девушка выполняет
      просьбу и кладёт хлебы на землю; вторая отказывается,
      опасаясь обжечь пальцы. В тексте не сказано, что хлебы
      даруют награду или сами помогают девушке спрятаться.
    tags:
      - talking-object
      - enchanted-food
  - id: speaking-cow-of-the-road
    name: "Говорящая корова"
    type: animal
    description: >-
      Корова, которая разговаривает с девушками и просит
      подоить её после семи лет ожидания. Первая девушка
      помогает ей, а во время погони корова прячет
      благодетельницу и отвечает ведьме, что не видела её.
      Вторая девушка отказывается доить корову.
      Других волшебных свойств её молока не показано.
    tags:
      - talking-animal
      - helper
  - id: speaking-apple-tree
    name: "Говорящая яблоня"
    type: plant
    description: >-
      Яблоня с тяжёлыми плодами, которая просит прохожих
      стряхнуть яблоки и поддержать ветви. Первая девушка
      выполняет просьбу; позже дерево прячет её от ведьмы
      и вводит преследовательницу в заблуждение. Вторая
      девушка не помогает яблоне, поэтому дерево выдаёт
      ведьме направление её бегства.
    tags:
      - talking-tree
      - helper
  - id: speaking-self-closing-oven
    name: "Говорящая печь"
    type: artifact
    description: >-
      Печь, способная разговаривать и самостоятельно закрывать
      дверцу. Когда ведьма разыскивает первую девушку,
      печь предлагает ей забраться внутрь и осмотреть
      дальний угол. Затем печь захлопывает дверцу и
      надолго удерживает ведьму внутри. Девушку прячет
      за печью обычный пекарь, а не сама печь.
    tags:
      - talking-object
      - enchanted-oven
  - id: money-falling-from-chimney
    name: "Мешки денег из дымохода"
    type: phenomenon
    description: >-
      Необъяснимое появление больших мешков с деньгами
      из дымохода в доме ведьмы. Когда первая девушка
      нарушает запрет и смотрит вверх, мешок падает
      ей на колени; это повторяется несколько раз.
      Позже такой же мешок получает вторая девушка.
      Текст не раскрывает источник денег и не
      показывает, что сама ведьма создаёт их заклинанием.
    tags:
      - supernatural-appearance
      - wealth
