entities:
  - id: yallery-brown
    name: "Яллери Браун"
    type: creature
    description: >-
      Крошечное существо с морщинистым лицом, тёмно-коричневой кожей и длинными сияющими жёлтыми волосами. Батрак Том Тивер освобождает его из-под большого плоского камня. Существо читает мысли Тома, обещает исполнить желание и по зову появляется рядом с ним. После просьбы облегчить работу Тома оно невидимо выполняет за него дела, заставляет инструменты двигаться без человеческих рук и одновременно портит работу другим батракам. Яллери Браун запрещает благодарить себя. Когда Том всё же произносит благодарность, существо прекращает помощь, но обещает преследовать его несчастьями до конца жизни; затем исчезает, обернувшись собственными волосами и уплыв по ветру. Текст прямо отвергает определение существа как богла, но не называет его точную природу.
  - id: yallery-brown-misfortune-curse
    name: "Проклятие вечной неудачи Яллери Брауна"
    type: spell
    description: >-
      Враждебное обещание Яллери Брауна, выраженное повторяемой им песенной формулой после того, как Том нарушил запрет благодарить помощника. Существо предрекает, что работа Тома не принесёт пользы и что повсюду его будут преследовать беды. Рассказ подтверждает действие проклятия: после ухода духа дела Тома постоянно рушатся, гибнут дети, портятся посевы и не откармливается скот; голос Яллери Брауна продолжает повторять формулу, хотя сам он больше не показывается. Не утверждается, что слова песни действуют независимо от воли существа.
