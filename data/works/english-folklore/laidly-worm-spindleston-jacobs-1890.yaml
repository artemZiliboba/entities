id: laidly-worm-spindleston-jacobs-1890
title: "Отвратительный змей со Спиндлстонской скалы"
original_title: "The Laidly Worm of Spindleston Heugh"
kind: legend
tradition:
  - english-folklore
collection: "English Fairy Tales, Joseph Jacobs (1890)"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), The Laidly Worm of Spindleston Heugh"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/The_Laidly_Worm_of_Spindleston_Heugh"
  note: "Полный текст конкретного рассказа из сборника Джозефа Джейкобса 1890 года; иные балладные и литературные версии предания не смешиваются."
entities:
  - id: witch-queen-laidly-toad
    name: "Королева-ведьма, ставшая жабой"
    type: character
    description: >-
      Новая жена короля Бамборо, известная ведьма. Из зависти к красоте падчерицы Маргарет накладывает на неё заклятие, превращающее девушку в чудовищного змея до трёх поцелуев её брата Чайлда Уайнда. Ведьма чувствует приближение врага магическим чутьём, посылает подвластных ей бесов на корабль и принуждает заколдованную Маргарет преградить гавань. После снятия чар с принцессы прикосновение рябиновой ветки превращает саму королеву в уродливую жабу; рассказ утверждает, что она остаётся такой.
  - id: margaret-laidly-worm
    name: "Маргарет — Отвратительный змей"
    type: creature
    description: >-
      Принцесса Маргарет, обращённая мачехой в огромного ядовитого змея, который обвивается вокруг Спиндлстонской скалы. Из-за голода чудовище пожирает всё на пути, пока жители не начинают ежедневно оставлять ему молоко семи коров. По приказу ведьмы змей трижды отталкивает от берега корабль брата, но после его высадки перестаёт сопротивляться и человеческим голосом просит три поцелуя. Третий поцелуй возвращает Маргарет человеческий облик.
  - id: witch-queen-familiar-imps
    name: "Бесы-помощники королевы"
    type: creature
    description: >-
      Подвластные королеве-ведьме бесы, которых она призывает помешать кораблю Чайлда Уайнда достичь берега. Им велено вызвать шторм или пробить днище судна. Подлетев к кораблю, бесы обнаруживают, что рябиновый киль лишает их силы над ним, и возвращаются к хозяйке, не выполнив приказа.
  - id: mighty-warlock-and-familiar
    name: "Колдун-прорицатель"
    type: character
    description: >-
      Могущественный колдун, к которому обращаются жители после появления змея. Посоветовавшись со своими книгами и духом-помощником, он раскрывает, что чудовище — заколдованная принцесса Маргарет. Он предписывает ежедневно приносить ей молоко семи коров и вызвать из-за моря её брата, способного снять чары. Собственного превращения или боевого колдовства в рассказе не совершает.
  - id: protective-rowan-keel-and-twig
    name: "Защитная рябина"
    type: plant
    description: >-
      Рябина обладает в рассказе двумя прямо показанными чудесными свойствами. Киль корабля Чайлда Уайнда, сделанный из её древесины, защищает судно от бесов королевы: те не способны ни поднять губительный шторм, ни повредить корпус. Позднее прикосновение рябиновой ветки к королеве-ведьме немедленно превращает её в жабу. Рассказ не уточняет, действует ли ветка независимо от победы над колдовством королевы.
