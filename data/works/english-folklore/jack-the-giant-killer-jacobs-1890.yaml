id: jack-the-giant-killer-jacobs-1890
title: "Джек — победитель великанов"
original_title: "Jack the Giant-Killer"
kind: folktale
tradition:
  - english-folklore
collection: "English Fairy Tales (Joseph Jacobs, 1890)"
source:
  title: "English Fairy Tales / Jack the Giant-Killer, Joseph Jacobs (1890)"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/Jack_the_Giant-Killer"
  note: "Только вариант Jack the Giant-Killer из English Fairy Tales (1890) Джозефа Джейкобса; другие истории о Джеке и позднейшие пересказы не смешиваются."
entities:
  - id: cormoran
    name: "Великан Корморан"
    type: creature
    description: "Огромный великан из Корнуолла, живущий в пещере на горе и похищающий скот жителей окрестностей. Джек заманивает его в глубокую яму и убивает."
  - id: blunderbore
    name: "Великан Бландербор"
    type: creature
    description: "Великан, хозяин заколдованного замка в лесу. Захватывает Джека, намереваясь съесть его вместе с братом; Джек освобождается и убивает обоих."
  - id: blunderbore-brother
    name: "Брат Бландербора"
    type: creature
    description: "Безымянный великан, которого Бландербор зовёт разделить трапезу из пленённого Джека. Джек побеждает обоих братьев."
  - id: two-headed-welsh-giant
    name: "Двуглавый валлийский великан"
    type: creature
    description: "Двуглавый великан, который притворяется гостеприимным хозяином и пытается ночью убить Джека. После обмана с мешком для каши смертельно ранит себя ножом."
  - id: three-headed-giant
    name: "Трёхглавый великан"
    type: creature
    description: "Трёхглавый великан, способный противостоять сотням вооружённых людей. Джек обманывает его угрозой нападения войска и получает четыре волшебные вещи."
  - id: invisibility-coat
    name: "Плащ невидимости"
    type: artifact
    description: "Старый плащ трёхглавого великана, скрывающий носителя от чужих глаз. Джек пользуется им, чтобы проникать в опасные места и незаметно подходить к врагам."
  - id: knowledge-cap
    name: "Шапка всеведения"
    type: artifact
    description: "Старая шапка трёхглавого великана, сообщающая владельцу необходимые сведения. Подсказывает Джеку, как вернуть платок, спрятанный у демона."
  - id: sharpness-sword
    name: "Всеразящий меч"
    type: artifact
    description: "Ржавый на вид волшебный меч трёхглавого великана, разрубающий всё, по чему ударит. Джек применяет его против великанов."
  - id: swiftness-shoes
    name: "Башмаки быстроты"
    type: artifact
    description: "Волшебная обувь трёхглавого великана, позволяющая необычайно быстро передвигаться. Джек использует её, преследуя демона и заманивая великана в ловушку."
  - id: possessed-lady
    name: "Дама, одержимая семью злыми духами"
    type: character
    description: "Знатная девушка, находящаяся под властью семи злых духов. Ставит жениху смертельно опасные испытания; после гибели демона чары рассеиваются."
  - id: seven-evil-spirits
    name: "Семь злых духов"
    type: creature
    description: "Семь злых духов, которыми одержима дама, избранная сыном короля Артура. Их влияние прекращается после разрушения чар."
  - id: familiar-spirit
    name: "Дух-помощник дамы"
    type: creature
    description: "Сверхъестественный помощник, которого дама призывает ночью, чтобы перенестись к Люциферу."
  - id: lucifer
    name: "Люцифер"
    type: creature
    description: "Демон, к которому одержимая дама приходит ночью и у которого оставляет платок. Джек похищает платок, а затем отрубает демону голову, разрушая чары."
  - id: thunderdell
    name: "Великан Тандерделл"
    type: creature
    description: "Двуглавый великан с севера, мстящий Джеку за гибель родичей. Джек заманивает его на подпиленный мост и убивает."
  - id: galligantua
    name: "Великан Галлигэнтьюа"
    type: creature
    description: "Великан, удерживающий заколдованный замок на вершине горы. При содействии колдуна превращает пленников в зверей и птиц; Джек убивает его."
  - id: old-conjurer
    name: "Старый колдун"
    type: character
    description: "Колдун, помогающий Галлигэнтьюа заманивать пленников и превращать их в животных. После звука волшебной трубы его уносит вихрь."
  - id: enchanted-castle-galligantua
    name: "Заколдованный замок Галлигэнтьюа"
    type: location
    description: "Замок на горе, где удерживают превращённых в животных пленников. После разрушения заклятия исчезает в облаке дыма."
  - id: fiery-griffins
    name: "Два огненных грифона"
    type: creature
    description: "Два грозных грифона, охраняющих ворота заколдованного замка и губящих приближающихся. Джек проходит мимо них невидимым."
  - id: enchanted-white-hind
    name: "Герцогская дочь в облике белой лани"
    type: character
    description: "Дочь герцога, похищенная в огненной колеснице и превращённая колдовством в белую лань. После разрушения чар возвращает человеческий облик."
  - id: fiery-dragons
    name: "Огненные драконы"
    type: creature
    description: "Драконы, впряжённые в пылающую колесницу, на которой похищают герцогскую дочь."
  - id: golden-trumpet
    name: "Золотая труба, разрушающая чары"
    type: artifact
    description: "Золотая труба на воротах заколдованного замка. Её звук сотрясает замок и приводит к падению власти великана и разрушению колдовства."
  - id: animal-transformation-curse
    name: "Чары превращения пленников"
    type: spell
    description: "Колдовство, обращающее захваченных рыцарей и дам в птиц и зверей. После гибели великана и разрушения чар пленники вновь становятся людьми."
