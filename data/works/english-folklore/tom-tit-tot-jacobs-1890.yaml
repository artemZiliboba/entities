entities:
  - id: tom-tit-tot-imp
    name: "Том-Тит-Тот — чертёнок-прядильщик"
    type: creature
    description: >
      Маленькое чёрное хвостатое существо предлагает королеве каждый день
      превращать доставленный лён в пять готовых мотков пряжи. Взамен оно
      требует угадать его имя за месяц: каждый вечер разрешает три попытки,
      а в случае неудачи обещает забрать женщину себе. Существо прилетает
      к окну, прядёт на маленькой прялке и исчезает навсегда, когда королева
      называет услышанное от короля имя Том-Тит-Тот.
    tags:
