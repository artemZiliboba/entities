id: jack-golden-snuff-box-jacobs-1890
title: "Джек и его золотая табакерка"
original_title: "Jack and his Golden Snuff-Box"
kind: folktale
tradition:
  - english-folklore
collection: "English Fairy Tales, Joseph Jacobs (1890), tale XVII"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), XVII. Jack and his Golden Snuff-Box"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/Jack_and_his_Golden_Snuff-Box"
  note: >-
    Полностью прочитан рассказ XVII из сборника Джозефа Джейкобса
    English Fairy Tales (1890), текст Wikisource. В примечаниях
    Джейкобс указывает источник: F. Hindes Groome, In Gipsy Tents.
    Используется только редакция Джейкобса, без деталей
    параллельных сюжетов о волшебной табакерке.
entities:
  - id: golden-snuff-box
    name: "Золотая волшебная табакерка"
    type: artifact
    description: >-
      Табакерка, которую отец вручает Джеку перед путешествием,
      велев открыть её лишь в смертельной опасности. При открытии
      из неё выходят три маленьких красных человечка, готовые
      исполнять приказы того, кто открыл крышку. С её помощью
      Джек выполняет невыполнимые задания и возвращает
      похищенный замок; когда табакерку открывает слуга,
      те же существа подчиняются уже ему.
    tags:
      - enchanted-object
      - summoning
  - id: three-little-red-men
    name: "Три маленьких красных человечка"
    type: creature
    description: >-
      Трое сверхъестественных маленьких людей, появляющихся
      из золотой табакерки. Исполняют приказы открывшего её:
      создают озеро с военными кораблями, вырубают лес,
      возводят замок на двенадцати золотых столбах
      и многократно переносят его через море.
      Во время девятидневного путешествия по замку
      участвуют в церковной службе. Текст не сообщает
      их личных имён и не разделяет способности
      между отдельными членами троицы.
    tags:
      - supernatural-servants
      - magical-construction
      - teleportation
  - id: king-of-mice
    name: "Король мышей"
    type: animal
    description: >-
      Говорящий правитель всех мышей, живущий в собственном
      дворце и способный созывать мышей со всего света.
      Он принимает Джека, расспрашивает подданных о
      пропавшем замке и направляет гостя к двум своим
      братьям — королю лягушек и королю птиц.
      Позднее хранит возвращённый замок по просьбе Джека.
    tags:
      - talking-animal
      - animal-king
  - id: helpful-little-mouse
    name: "Мышонок-помощник"
    type: animal
    description: >-
      Говорящий мышонок, стоящий на страже дворца короля
      мышей. Добровольно сопровождает Джека, прячется
      в его кармане, а затем проникает в похищенный
      замок и выносит золотую табакерку. В тексте
      действует благодаря ловкости и речи;
      способности становиться невидимым ему не приписаны.
    tags:
      - talking-animal
      - helper
  - id: king-of-frogs
    name: "Король лягушек"
    type: animal
    description: >-
      Говорящий правитель всех лягушек и брат королей
      мышей и птиц. Принимает Джека, созывает
      лягушек со всего света и расспрашивает их
      о пропавшем замке. Не получив сведений,
      отправляет героя к своему старшему брату.
    tags:
      - talking-animal
      - animal-king
  - id: helpful-little-frog
    name: "Лягушонок-помощник"
    type: animal
    description: >-
      Говорящий лягушонок, стоящий на страже дворца
      короля лягушек. Уговаривает Джека взять его
      в путешествие. Когда найденную табакерку
      случайно роняют в море, дважды ныряет
      за ней и после долгих поисков возвращает
      её путешественникам.
    tags:
      - talking-animal
      - helper
  - id: king-of-birds
    name: "Король птиц"
    type: animal
    description: >-
      Говорящий старший из трёх братьев, правитель
      всех птиц. Созывает своих подданных, чтобы
      узнать местонахождение похищенного замка.
      После сообщения орла отправляет его
      вместе с Джеком за море. Принимает
      путешественников и помогает организовать
      возвращение замка.
    tags:
      - talking-animal
      - animal-king
  - id: castle-finding-eagle
    name: "Орёл-перевозчик"
    type: animal
    description: >-
      Говорящий орёл, который видел похищенный
      замок за морем и сообщает о нём королю птиц.
      По его поручению переносит Джека на спине
      через море к замку, а затем участвует
      в обратном пути. Орёл не назван
      заколдованным, но в сказке разговаривает
      с людьми и выполняет необычную роль
      разумного помощника.
    tags:
      - talking-animal
      - helper
      - flight
