id: fish-and-ring-jacobs-1890
title: "Рыба и кольцо"
original_title: "The Fish and the Ring"
kind: folktale
tradition:
  - english-folklore
collection: "English Fairy Tales, Joseph Jacobs (1890), tale XXXV"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), XXXV. The Fish and the Ring"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/The_Fish_and_the_Ring"
  note: "Полный текст рассказа XXXV в редакции Джозефа Джейкобса 1890 года; в примечаниях Джейкобс ссылается на Henderson, со слов S. Baring-Gould. Другие сюжеты о кольце, возвращённом рыбой, не смешиваются."
entities:
  - id: prophetic-magician-baron-humphrey
    name: "Барон Хамфри — волшебник-прорицатель"
    type: character
    description: >-
      Могущественный барон, прямо названный великим волшебником, которому известно, что произойдёт в будущем. Из Книги судеб он узнаёт, что его маленькому сыну суждено жениться на бедной девочке из Йорка; позднее берётся составить гороскоп незнакомой девушки. Пытается предотвратить предсказанный брак, но не может изменить судьбу. Рассказ не приписывает ему превращений, боевых заклинаний или способности управлять событиями.
  - id: book-of-fate
    name: "Книга судеб"
    type: artifact
    description: >-
      Книга, в которую заглядывает барон-волшебник, чтобы узнать будущее своего сына. Она открывает ему предстоящий брак мальчика с новорождённой бедной девочкой из Йорка; последующие события подтверждают точность предсказания. Текст не объясняет устройство книги и не показывает, что она способна изменять предначертанное.
