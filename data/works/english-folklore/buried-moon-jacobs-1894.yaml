id: buried-moon-jacobs-1894
title: "Погребённая Луна"
original_title: "The Buried Moon"
kind: legend
tradition:
  - english-folklore
collection: "More English Fairy Tales, рассказ LXVI"
source:
  title: "Joseph Jacobs, More English Fairy Tales (1894), No. LXVI, The Buried Moon"
  url: "https://en.wikisource.org/wiki/More_English_Fairy_Tales/The_Buried_Moon"
  note: "Прочитан полный рассказ LXVI в редакции Джозефа Джейкобса (1894), переработанный из рассказа миссис Балфур о болотах Линкольншира. Не смешивать с другими пересказами и литературными адаптациями."
entities:
  - id: personified-moon-of-carland
    name: "Луна — защитница болотных путников"
    type: character
    description: >-
      Олицетворённая Луна, которая сходит с неба в человеческом облике, укрыв сияющие волосы тёмным капюшоном. Свет её волос и ног разгоняет мрак и обращает в бегство болотную нечисть, помогая заблудившемуся путнику спастись. Попав в плен к чёрному корню, Луна оказывается погребена под водой и перестаёт появляться в небе; после освобождения людьми мгновенно возвращается на небосвод и вновь освещает болота.
  - id: animated-black-snag
    name: "Чёрная коряга, удерживающая Луну"
    type: plant
    description: >-
      Чёрная болотная коряга у глубокой заводи. Когда Луна хватается за неё, пытаясь удержаться от падения, коряга оживает, обвивает её запястья подобно наручникам и не позволяет освободиться. Позднее у подножия коряги нечисть прячет Луну под тяжёлым камнем; её силуэт напоминает крест и помогает людям найти место заточения.
  - id: bogles-of-carland
    name: "Болотные боглы"
    type: creature
    description: >-
      Враждебные ночные существа болот Карленда, которые выходят в темноте и заманивают людей в опасные топи. Они не переносят лунного света и прячутся при его появлении. Когда Луна оказывается обездвижена, боглы участвуют в издевательствах над ней, приносят большой камень, чтобы придавить её под водой, и выставляют стражу у места заточения.
  - id: crawling-horrors-of-marsh
    name: "Ползучие ужасы болот"
    type: creature
    description: >-
      Чудовищные ползающие создания, выходящие вместе с прочей нечистью во время отсутствия Луны. Когда Луна оказывается поймана, они обвивают её колени и предлагают задушить пленницу. При лунном свете, как и прочие злые ночные существа, скрываются в тёмных уголках болот.
  - id: marsh-witch-bodies
    name: "Болотные ведьмы"
    type: character
    description: >-
      Ведьмы, собирающиеся среди ночной нечисти вокруг пойманной Луны. Они обвиняют её в том, что её свет разрушает их колдовство, и предлагают отравить пленницу. В рассказе не показано исполнение этого замысла: вместо этого нечисть прячет Луну под камнем в болоте.
  - id: will-o-the-wykes-guards
    name: "Блуждающие огни — стражи Луны"
    type: creature
    description: >-
      Два блуждающих болотных огня, которым ночные существа приказывают поочерёдно сторожить чёрную корягу, чтобы погребённая Луна не смогла выбраться. Позднее один маленький мерцающий огонёк на коряге помогает людям узнать место заточения. Текст не говорит, что огни сами наложили заклятие на Луну.
  - id: wise-woman-of-old-mill
    name: "Вещунья со старой мельницы"
    type: character
    description: >-
      Знающая женщина, к которой жители обращаются, когда Луна не возвращается на небо. Она пытается узнать её местонахождение по варочному котлу, зеркалу и книге, но сначала не получает ответа. Услышав рассказ спасшегося путника, советует людям молча идти в болота с камнем во рту и ореховой веткой в руках и искать знаки гроба, свечи и креста. По этим указаниям люди находят и освобождают Луну.
