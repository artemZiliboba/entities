entities:
  - id: hedley-kow
    name: "Хедли Коу"
    type: creature
    description: >-
      Сверхъестественный оборотень, которого бедная пожилая
      женщина случайно встречает по дороге домой. Сначала
      он выглядит как тяжёлый чёрный горшок, полный золотых
      монет; пока женщина тащит находку на шали, та
      превращается сперва в большой слиток серебра,
      затем в железо и наконец в камень. У ворот
      камень внезапно подпрыгивает, пищит, вырастает
      размером с крупную лошадь, обзаводится четырьмя
      длинными ногами, двумя длинными ушами и хвостом,
      после чего убегает, брыкаясь и смеясь.
      Женщина узнаёт в нём Хедли Коу. В тексте
      существо не говорит человеческими словами,
      не причиняет ей вреда и не оставляет ей
      настоящих сокровищ.
    tags:
      - shapeshifter
      - trickster
      - supernatural-creature
