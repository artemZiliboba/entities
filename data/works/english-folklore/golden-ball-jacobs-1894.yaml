id: golden-ball-jacobs-1894
title: "Золотой шар"
original_title: "The Golden Ball"
kind: folktale
tradition:
  - english-folklore
collection: "More English Fairy Tales, Joseph Jacobs (1894), tale XLVI"
source:
  title: "Joseph Jacobs, More English Fairy Tales (1894), XLVI. The Golden Ball"
  url: "https://en.wikisource.org/wiki/More_English_Fairy_Tales/The_Golden_Ball"
  note: "Прочитан полный текст сказки XLVI и примечание Джейкобса к ней. Источник редакции: S. Baring-Gould, в первом издании Henderson, Folk-Lore of the Northern Counties, pp. 333–335. Другие версии и детская игра Mary Brown не смешаны."
entities:
  - id: self-moving-golden-ball
    name: "Самодвижущийся золотой шар"
    type: artifact
    description: >-
      Один из двух золотых шаров, вручённых девушкам незнакомым молодым человеком с угрозой казни за потерю. Когда младшая сестра подбрасывает свой шар у ограды, тот перелетает через неё, самостоятельно катится по траве к дому и скрывается за дверью. В доме боглы играют им под кроватью; после того как юноша ранит их, он забирает шар и возвращает возлюбленной. Самостоятельное движение шара прямо показано, но способность накладывать проклятия или управлять казнью текстом не подтверждена.
  - id: bogles-of-golden-ball-house
    name: "Боглы из дома золотого шара"
    type: creature
    description: >-
      Множество сверхъестественных существ, заполняющих двор загадочного дома ночью. Они требуют у юноши обе половины рассечённого великана, называя его своим хозяином. На третью ночь боглы возятся под кроватью, перебрасывая золотой шар; юноша отрубает высунутые конечности, и раненые боглы с плачем убегают, забыв шар. В рассказе не названы их число и индивидуальные имена.
  - id: first-giant-of-golden-ball-house
    name: "Первый великан из дома золотого шара"
    type: creature
    description: >-
      Великан в пять раз выше юноши, который приходит в загадочный дом первой ночью и выглядывает в окно на боглов во дворе. Юноша одним ударом меча рассекает его надвое: верхняя половина падает во двор, а нижняя продолжает стоять у окна. По требованию боглов юноша выбрасывает вслед и нижнюю половину. Сохранение положения тела после рассечения — единственная показанная аномалия; отдельного колдовства великан не совершает.
  - id: second-giant-of-golden-ball-house
    name: "Второй великан из дома золотого шара"
    type: creature
    description: >-
      Второй великан, входящий в дом следующей ночью. Юноша рассекает его мечом надвое, но отделённые ноги продолжают двигаться и уходят вверх по дымоходу. Юноша бросает туда же голову великана. Движение отделённых ног прямо подтверждено, однако происхождение этой способности и дальнейшая судьба великана не раскрыты.
