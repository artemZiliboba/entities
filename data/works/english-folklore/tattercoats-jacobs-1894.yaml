id: tattercoats-jacobs-1894
title: "Лохмотья"
original_title: "Tattercoats"
kind: folktale
tradition:
  - english-folklore
collection: "More English Fairy Tales, Joseph Jacobs (1894), tale LVI"
source:
  title: "Joseph Jacobs, More English Fairy Tales (1894), LVI. Tattercoats"
  url: "https://www.gutenberg.org/cache/epub/14241/pg14241-images.html"
  note: "Полный текст сказки LVI Tattercoats в редакции Джозефа Джейкобса (1894); в примечании Джейкобс называет рассказчицу Салли Браун, записанную миссис Балфур в Линкольншире. Детали иных версий истории о бедной невесте не добавлены."
entities:
  - id: gooseherd-with-magic-pipe
    name: "Пастух гусей — таинственный музыкант"
    type: character
    description: >-
      Единственный друг отвергнутой внучки лорда, которую зовут Лохмотьями. Играет на небольшой дудочке, под музыку которой девушка забывает горести и танцует вместе с гусями. Во время королевского бала его игра сопровождает чудесное превращение лохмотьев девушки в драгоценные одежды, появление золотой короны и превращение гусей в пажей. После этого пастуха никто больше не видит. Текст не объясняет его происхождения и не называет его феей или колдуном.
  - id: gooseherds-transforming-pipe
    name: "Волшебная дудочка пастуха"
    type: artifact
    description: >-
      Небольшая дудочка, на которой играет пастух гусей. Её мелодия заставляет слушателей танцевать и сопровождает развитие любви принца к Лохмотьям. Во время бала несколько тихих нот вызывают явно сверхъестественное превращение: рваная одежда девушки становится роскошным платьем с драгоценными камнями, на голове появляется золотая корона, а гуси превращаются в пажей. Джейкобс в примечании специально отмечает волшебную дудочку как исключение из почти лишённой чудесных элементов сказки.
