entities:
  - id: cauld-lad-of-hilton
    name: "Холодный парень из Хилтона"
    type: creature
    description: >-
      Домовой дух-брауни, обитавший в замке Хилтон. По ночам переставляет мебель, опрокидывает столы, портит еду и гасит огонь, а когда слуги оставляют ему сливки или лепёшку с мёдом, убирает кухню. Выглядит как маленькое существо, отчасти человек, отчасти гоблин, с заострёнными ушами и волосатой кожей. Печально поёт о ещё не родившемся человеке, которому предстоит его погубить. Когда слуги оставляют ему зелёный плащ с капюшоном, надевает их, пляшет и объявляет, что больше не будет помогать; затем исчезает навсегда. Рассказ не раскрывает его происхождения и не подтверждает, что предсказанное в песне уничтожение действительно произошло.
