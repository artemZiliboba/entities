id: lambton-worm-jacobs-1894
title: "Лэмбтонский червь"
original_title: "The Lambton Worm"
kind: legend
tradition:
  - english-folklore
collection: "More English Fairy Tales, Joseph Jacobs (1894), tale LXXXV"
source:
  title: "Joseph Jacobs, More English Fairy Tales (1894), LXXXV. The Lambton Worm"
  url: "https://en.wikisource.org/wiki/More_English_Fairy_Tales/The_Lambton_Worm"
  note: "Прочитан полный текст сказания LXXXV и примечание Джейкобса. Джейкобс сообщает, что переработал Henderson, Folk-Lore of Northern Counties, pp. 287–289. Детали других версий легенды не смешаны."
entities:
  - id: lambton-worm
    name: "Лэмбтонский червь"
    type: creature
    description: >-
      Чудовищный змееподобный червь, которого юный наследник Лэмбтона выловил из реки Уир и бросил в колодец. Существо вырастает до гигантских размеров, обвивает холм тремя кольцами, пожирает скот и требует ежедневного молока от девяти коров. Его сила позволяет ломать деревья и насмерть сдавливать рыцарей. После семи лет разорения молодой Лэмбтон побеждает чудовище, надев доспех, покрытый остриями копий: при попытке сдавить противника червь сам ранит себя об острия, после чего герой рассекает его мечом. Перед смертью чудовище испускает кровь и огонь.
  - id: wise-woman-of-brugeford
    name: "Мудрая женщина из Браджфорда"
    type: character
    description: >-
      Прорицательница, к которой молодой Лэмбтон обращается за советом, как уничтожить чудовищного червя. Она знает, что убить его может только сам Лэмбтон, велит покрыть доспех остриями копий и встретить чудовище на речной скале на рассвете. Также требует поклясться убить первое существо, встреченное у порога родного дома после победы, и предсказывает девять поколений несчастной смерти для рода в случае нарушения клятвы. Рассказ не показывает отдельного заклинания, совершённого ею.
  - id: nine-generations-lambton-curse
    name: "Проклятие девяти поколений Лэмбтонов"
    type: phenomenon
    description: >-
      Сверхъестественное последствие нарушенной клятвы, предсказанное мудрой женщиной из Браджфорда. Герой обещает убить первое существо, встретившее его на пороге после победы над червём, но первым появляется его отец. Хотя затем герой убивает своего пса Бориса, клятва уже нарушена. Согласно заключению рассказа, на протяжении девяти поколений никто из Лэмбтонов не умер в собственной постели. Текст не объясняет механизм действия проклятия и не утверждает, что его наложила сама мудрая женщина.
