id: horned-women-jacobs-1892
title: "Рогатые женщины"
original_title: "The Horned Women"
kind: folktale
tradition:
  - irish-folklore
collection: "Celtic Fairy Tales"
author: "Леди Уайльд (источник версии); Джозеф Джейкобс (редактор)"
source:
  title: "Joseph Jacobs (ed.), Celtic Fairy Tales (1892), tale IV: The Horned Women, pp. 30–33"
  url: "https://www.gutenberg.org/cache/epub/35862/pg35862-images.html"
  note: "Рассказ IV целиком, включая исходную историю о двенадцати ведьмах и помощь Духа колодца. Джейкобс прямо указывает источником первую историю из Ancient Legends леди Уайльд. Из примечаний и других вариантов не переносились дополнительные персонажи или магические способности."
entities:
  - id: twelve-horned-witches
    name: "Двенадцать рогатых ведьм"
    type: creature
    description: >-
      Двенадцать сверхъестественных женщин, приходящих ночью
      в дом хозяйки. У первой один рог на лбу, у второй два,
      и так далее до двенадцатой. Они прядут и ткут,
      накладывают на хозяйку чары неподвижности и немоты,
      а из крови спящих готовят особую лепёшку.
      Испугавшись ложного крика о пожаре на своей горе,
      улетают, затем возвращаются, но не могут
      преодолеть защиту, устроенную по совету Духа колодца.
    tags:
      - witches
      - horned-beings
      - enchantment
  - id: spirit-of-the-well
    name: "Дух колодца"
    type: creature
    description: >-
      Невидимый дух, чей голос помогает хозяйке
      наполнить водой сито, подсказывает способ
      выманить ведьм из дома и объясняет, как
      разрушить их чары и защитить жилище.
      Ведьмы проклинают его за вмешательство.
    tags:
      - well-spirit
      - protective-helper
  - id: witches-paralysis-spell
    name: "Чары неподвижности и немоты"
    type: spell
    description: >-
      Колдовство рогатых ведьм, из-за которого
      хозяйка не может встать, позвать на помощь
      или произнести слово. Действие описано
      непосредственно в сказке; самостоятельная
      формула заклятия не приведена.
    tags:
      - paralysis
      - silence
  - id: blood-cake
    name: "Кровавая лепёшка ведьм"
    type: artifact
    description: >-
      Лепёшка, приготовленная ведьмами из муки
      и крови спящих домочадцев. Дух колодца
      велит разломать её и вложить по кусочку
      в рот каждому спящему; после этого они
      приходят в себя. Ведьмы пытаются
      приказать лепёшке открыть дверь,
      но она отвечает, что разломана.
    tags:
      - enchanted-food
      - restoration
