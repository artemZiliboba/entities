entities:
  - id: rose-elf
    name: "Розовый эльф"
    type: character
    description: >
      Крошечное крылатое существо, невидимое человеческому
      глазу и живущее внутри роз. Случайно становится
      свидетелем убийства молодого человека, а затем
      проникает в сновидение его возлюбленной и
      сообщает ей место, где спрятано тело.
      Позднее рассказывает о преступлении духам
      жасминовых цветов и пчёлам.
    tags:
      - elf
      - invisible
      - dream-message
  - id: jasmine-flower-spirits
    name: "Духи жасминовых цветов"
    type: creature
    description: >
      В каждом цветке жасмина, выросшего над
      локоном убитого юноши, обитает отдельный
      маленький дух. Духи знают об убийстве
      и сообща мстят преступнику: ночью
      выходят из цветков, насылают кошмары
      и поражают спящего невидимыми
      отравленными стрелами, отчего тот умирает.
    tags:
      - flower-spirits
      - vengeance
      - nightmare
  - id: angel-of-death
    name: "Ангел смерти"
    type: character
    description: >
      Прекрасный ангел смерти появляется
      во время последнего сна девушки,
      потерявшей возлюбленного. Уносит
      её душу из мира живых; повествование
      сообщает, что после смерти она
      оказывается на небесах рядом
      с любимым.
    tags:
      - angel
      - psychopomp
      - afterlife
  - id: speaking-bee-queen
    name: "Пчелиная царица"
    type: animal
    description: >
      Разумная владычица пчёл, которая
      выслушивает переданную пчёлами
      историю об убийстве и приказывает
      рою заколоть виновного жалами.
      Наутро обнаруживает, что убийца
      уже погиб от стрел цветочных духов;
      после этого её пчёлы помогают
      раскрыть преступление, разбив
      горшок с жасмином.
    tags:
      - talking-animal
      - ruler-of-animals
      - vengeance
