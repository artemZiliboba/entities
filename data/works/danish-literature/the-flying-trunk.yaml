entities:
  - id: flying-trunk
    name: "Летающий сундук"
    type: artifact
    description: >
      Волшебный сундук, подаренный разорившемуся купеческому сыну. Стоит
      владельцу залезть внутрь и нажать замок, как сундук поднимается в воздух
      и переносит его над облаками в далёкую страну, а затем служит для
      повторных полётов к башне принцессы.
    tags:
      - flying
      - trunk
      - transport
      - magical-artifact
