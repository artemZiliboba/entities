    name: "Ожившая тень учёного"
    type: creature
    description: >-
      Тень учёного, отделившаяся от хозяина после того, как он шутливо отправил её в дом напротив. Тень самостоятельно странствует, подглядывает за людьми и постепенно приобретает человеческое тело, одежду и положение в обществе. Спустя годы она возвращается, выдаёт учёного за собственную тень и добивается брака с принцессой. Когда учёный пытается раскрыть обман, ожившая тень организует его заключение и казнь.
