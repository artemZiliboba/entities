id: the-tinder-box
title: "Огниво"
original_title: "Fyrtøiet"
kind: story
tradition:
  - danish-literature
author: "Ханс Кристиан Андерсен"
collection: "Fairy Tales and Other Stories"
source:
  title: "Fairy Tales and Other Stories (1914) — The Tinder-box"
  url: "https://en.wikisource.org/wiki/Fairy_Tales_and_Other_Stories_%28Andersen%2C_Craigie%29/The_Tinder-box"
  note: >
    Английский перевод У. А. и Дж. К. Крейги в оксфордском издании 1914 года,
    опубликованный на Wikisource. Запись следует именно этой редакции сказки и
    не смешивает детали других переводов и пересказов.

entities:
  - id: old-witch
    name: "Старая ведьма"
    type: character
    description: >
      Сверхъестественный персонаж, прямо названный в тексте ведьмой. Она знает
      устройство пространства под полым деревом, свойства трёх псов и место,
      где её бабушка оставила волшебное огниво, а также направляет солдата к
      артефакту.
    tags:
      - witch
      - supernatural
      - guide

  - id: princess-prophecy
    name: "Пророчество о браке принцессы"
    type: phenomenon
    description: >
      Предсказание о том, что принцесса выйдет замуж за простого солдата.
      Именно из-за него король скрывает дочь в медном замке; к финалу
      предсказанное событие сбывается, когда солдат становится королём и
      женится на принцессе.
    tags:
      - prophecy
      - fate
      - marriage

  - id: magic-tinder-box
    name: "Волшебное огниво"
    type: artifact
    description: >
      Старое огниво, которое позволяет солдату вызывать трёх сверхъестественных
      псов. Один удар огнива призывает стража медных денег, два — стража
      серебра, три — стража золота; вызванные псы исполняют приказы владельца.
    tags:
      - summoning
      - command
      - magic-object

  - id: dog-of-copper
    name: "Пёс медного сундука"
    type: creature
    description: >
      Сверхъестественный пёс с глазами величиной с чайные чашки, охраняющий
      сундук с медными деньгами под полым деревом. После одного удара огнива
      мгновенно появляется перед владельцем, выполняет его приказания и способен
      переносить спящую принцессу.
    tags:
      - guardian
      - summoning
      - supernatural-dog

  - id: dog-of-silver
    name: "Пёс серебряного сундука"
    type: creature
    description: >
      Второй сверхъестественный пёс, чьи глаза сравниваются с мельничными
      колёсами. Он охраняет серебро и появляется по двум ударам огнива; вместе с
      другими псами приходит на помощь солдату перед казнью.
    tags:
      - guardian
      - summoning
      - supernatural-dog

  - id: dog-of-gold
    name: "Пёс золотого сундука"
    type: creature
    description: >
      Самый большой из трёх сверхъестественных псов, с глазами величиной с
      Круглую башню Копенгагена. Он охраняет золото, вызывается тремя ударами
      огнива и вместе с двумя другими псами спасает солдата от казни.
    tags:
      - guardian
      - summoning
      - supernatural-dog
