id: goblin-and-huckster-andersen-dulcken
title: "Домовой и лавочник"
original_title: "Nissen hos Spekhøkeren"
kind: story
tradition:
  - danish-literature
author: "Ханс Кристиан Андерсен"
collection: "What the Moon Saw: and Other Tales"
source:
  title: "The Goblin and the Huckster, translated by H. W. Dulcken, What the Moon Saw: and Other Tales"
  url: "https://www.gutenberg.org/cache/epub/27000/pg27000-images.html"
  note: "Английский перевод H. W. Dulcken, рассказ THE GOBLIN AND THE HUCKSTER, страницы 66–70, Project Gutenberg #27000. Прочитан весь рассказ от описания лавки до решения домового делить время между лавочником и студентом; другие переводы не смешивались."
entities:
  - id: hucksters-goblin
    name: "Домовой лавочника"
    type: character
    description: >-
      Маленький домовой, живущий при лавке торговца из-за рождественской каши с маслом. Ночью он умеет снимать язык со спящей хозяйки и временно наделять им речью неодушевлённые предметы. Увидев чудесное сияние, исходящее от книги стихов студента, домовой начинает разрываться между поэзией и сытой жизнью в лавке. Во время пожара он первым делом спасает книгу.
  - id: borrowed-speaking-tongue
    name: "Заимствованный язык хозяйки"
    type: artifact
    description: >-
      Язык спящей жены лавочника, который домовой снимает и кладёт на бочку с газетами, кофемолку, бочонок с маслом и денежный ящик. Пока язык находится на предмете, тот получает способность говорить и высказывать своё мнение. Одновременно язык может оживлять речью только один предмет; в конце домовой возвращает его хозяйке.
  - id: poetry-book-luminous-tree
    name: "Светящееся древо поэзии"
    type: phenomenon
    description: >-
      Чудесное видение, которое домовой наблюдает через замочную скважину, когда студент читает спасённую от уничтожения книгу стихов. Из книги вырывается луч света, вырастающий в огромное дерево с женскими лицами вместо цветов и сияющими звёздами вместо плодов; комнату наполняет музыка. Сияние исчезает с погашенной свечой, но мелодия продолжает звучать. Видение можно понимать как сказочный образ силы поэзии.
