entities:
  - id: cupid-naughty-boy
    name: "Амур — озорной мальчик"
    type: character
    description: >-
      Мальчик с золотистыми волосами, который просится переждать дождь у старого поэта и называет себя Купидоном. Согревшись у очага, он пускает стрелу в сердце гостеприимного хозяина и убегает. Далее он незаметно преследует людей, маскируется под студента и появляется в других местах, поражая своими стрелами даже пожилых людей. Текст прямо связывает его действия с любовными переживаниями и сердечной болью.
  - id: cupids-bow-and-arrows
    name: "Лук и стрелы Амура"
    type: artifact
    description: >-
      Оружие Купидона, которым он поражает человеческие сердца. Несмотря на дождь, мальчик обнаруживает, что лук высох и не испортился, после чего стреляет в приютившего его поэта прямо в сердце. Позднее Купидон скрытно поражает стрелами студентов, девушек и других людей; это волшебное действие представлено как источник сердечных страданий.
