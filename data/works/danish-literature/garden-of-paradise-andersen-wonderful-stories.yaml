id: garden-of-paradise-andersen-wonderful-stories
title: "Райский сад"
original_title: "The Garden of Paradise"
kind: story
tradition:
  - danish-literature
author: "Ханс Кристиан Андерсен"
collection: "Wonderful Stories for Children (английский перевод, издание Project Gutenberg № 43600)"
source:
  title: "The Garden of Paradise, Wonderful Stories for Children, pp. 74–101"
  url: "https://www.gutenberg.org/files/43600/43600-h/43600-h.htm#Page_74"
  note: "Конкретный английский текст из Wonderful Stories for Children, Project Gutenberg eBook 43600, страницы 74–101. Рассмотрен только этот рассказ; сведения из иных переводов и вариантов не добавлялись."
entities:
  - id: mother-of-four-winds
    name: "Мать четырёх ветров"
    type: character
    description: >
      Могущественная старуха из пещеры ветров. Её сыновья —
      олицетворённые ветры четырёх сторон света; она может
      складывать их и заключать в мешки, несмотря на их
      огромную силу. После утраты принцем рая вновь
      встречает его у пещеры.
    tags:
      - personification
      - supernatural-ruler
  - id: north-wind
    name: "Северный ветер"
    type: character
    description: >
      Один из четырёх сыновей матери ветров. Входит
      в пещеру с морозом, градом и снегом. Рассказывает,
      как на далёком севере сдвигал огромные льдины,
      зажимал корабли охотников и засыпал их снегом.
    tags:
      - personification
      - weather-magic
  - id: west-wind
    name: "Западный ветер"
    type: character
    description: >
      Сын матери ветров, похожий на дикого человека.
      Рассказывает, как в Америке поднимал ураган,
      вырывал деревья и гнал их к водопаду,
      а также срывал кокосы и носился над саванной.
    tags:
      - personification
      - storm
  - id: south-wind
    name: "Южный ветер"
    type: character
    description: >
      Сын матери ветров, возвращающийся из Африки.
      Поднимает в пустыне песчаные столбы и
      погребает караван под песком. За жестокость
      мать заключает его в мешок, затем выпускает.
      Приносит восточному ветру лист с историей феникса.
    tags:
      - personification
      - sandstorm
  - id: east-wind
    name: "Восточный ветер"
    type: character
    description: >
      Четвёртый сын матери ветров. Каждые сто лет
      посещает Райский сад; переносит принца
      над морями и горами на собственной спине,
      проводит через холодную пещеру и доставляет
      к фее рая. Его крылья сияют и дают тепло.
    tags:
      - personification
      - magical-flight
  - id: phoenix-bird
    name: "Птица феникс"
    type: animal
    description: >
      Единственная в мире птица феникс, о которой
      рассказывает южный ветер. Сжигает своё
      гнездо и погибает в пламени, но оставленное
      в огне яйцо раскрывается и выпускает
      молодого феникса, нового царя птиц.
      Передаёт фее написанную клювом историю жизни.
    tags:
      - phoenix
      - rebirth
  - id: fairy-of-paradise
    name: "Фея Райского сада"
    type: character
    description: >
      Владычица Райского сада и Острова блаженства.
      Показывает принцу живые изображения прошлого
      и чудесную прогулку, во время которой мир
      проходит перед неподвижной лодкой. Назначает
      испытание: сто лет не следовать за ней
      к Древу познания и не целовать её.
      Нарушение запрета ведёт к исчезновению сада.
    tags:
      - fairy
      - supernatural-ruler
      - temptation
  - id: personified-death
    name: "Смерть с чёрными крыльями"
    type: character
    description: >
      Могучий старик с косой и большими чёрными
      крыльями. После падения принца объявляет,
      что вернётся за ним позднее: праведника
      вознесёт к вечному раю над звёздами,
      а нераскаявшегося отправит в бездну.
    tags:
      - death-personification
      - afterlife
  - id: paradise-garden-island
    name: "Райский сад на Острове блаженства"
    type: location
    description: >
      Скрытый под землёй после изгнания Адама и Евы
      сад, сохраняющий собственное солнце, мягкий
      воздух и чудесную природу. В нём живёт фея,
      поют растения и время течёт иначе:
      сто земных лет ощущаются как сто минут.
      После нарушения запрета принцем сад
      уходит ещё глубже и становится ему недоступен.
    tags:
      - otherworld
      - altered-time
  - id: tree-of-knowledge
    name: "Древо познания"
    type: plant
    description: >
      Дерево в зале Райского сада, с золотыми
      яблоками и красными каплями на листьях.
      Возле него фея устраивает запретное
      испытание принца. От дерева слышится
      песня, напоминающая голос его матери;
      поцелуй феи под его ветвями приводит
      к погружению рая в глубину.
    tags:
      - enchanted-tree
      - forbidden-knowledge
  - id: living-history-windowpanes
    name: "Окна с живыми картинами прошлого"
    type: artifact
    description: >
      Стёкла дворца феи, на которых само время
      запечатлело события истории. Внутри
      изображений люди ходят, деревья
      шевелятся; принц видит изгнание
      Адама и Евы и сон Иакова как живые сцены.
    tags:
      - visions
      - magical-history
  - id: stationary-world-viewing-boat
    name: "Лодка, перед которой проходит мир"
    type: artifact
    description: >
      Чудесная лодка феи остаётся на месте,
      покачиваясь на воде, тогда как перед
      её пассажирами проходят области Земли:
      Альпы, Австралия, египетские пирамиды
      и северные сияния. Позволяет наблюдать
      далёкие края, не отплывая.
    tags:
      - magical-vision
      - world-viewing
  - id: singing-paradise-plants
    name: "Поющие растения Райского сада"
    type: plant
    description: >
      Цветы и листья Райского сада встречают
      принца песней, которую не способен
      воспроизвести человеческий голос,
      а затем прощаются с восточным ветром.
      В танцевальном зале тычинки белых
      лилий звучат словно маленькие золотые арфы.
    tags:
      - singing-plants
      - enchanted-flora
  - id: flaming-water-lily
    name: "Пламенная водяная лилия"
    type: plant
    description: >
      Необыкновенная водяная лилия у реки
      перед Островом блаженства. Её листья
      переливаются цветами радуги,
      а сам цветок горит оранжевым пламенем,
      которое питается водой, словно лампа маслом.
    tags:
      - magical-plant
      - supernatural-fire
