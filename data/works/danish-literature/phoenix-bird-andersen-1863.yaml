entities:
  - id: phoenix
    name: "Птица Феникс"
    type: creature
    description: >-
      Единственная в мире чудесная птица, впервые появившаяся из розы
      под Древом познания в раю. Когда искра с огненного меча ангела
      сожгла её гнездо, птица погибла, но из красного раскалённого яйца
      родился новый Феникс. С тех пор раз в сто лет она сгорает
      в собственном гнезде и возрождается из яйца. В рассказе
      Феникс также является людям в разных образах — мотылька,
      ворона, лебедя — и олицетворяет поэзию, вдохновение
      и бессмертие искусства.
