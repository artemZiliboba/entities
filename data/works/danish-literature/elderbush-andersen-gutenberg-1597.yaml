original_title: "Hyldemoer"
kind: story
tradition:
  - danish-literature
author: "Ханс Кристиан Андерсен"
collection: "Andersen's Fairy Tales, Project Gutenberg eBook #1597"
source:
  title: "The Elderbush, Andersen's Fairy Tales, Project Gutenberg eBook #1597"
  url: "https://www.gutenberg.org/files/1597/1597-h/1597-h.htm"
  note: "Полный английский текст THE ELDERBUSH в Project Gutenberg #1597, от простуды мальчика до заключительного разговора с матерью. Чудеса показаны внутри истории/сновидения, и рассказ оставляет их буквальную реальность открытой; детали других редакций не смешивались."
entities:
  - id: elder-tree-mother-remembrance
    name: "Бузинная матушка — Воспоминание"
    type: character
    description: >-
      Женщина, появляющаяся в цветущем бузинном кусте, который вырастает из чайника в рассказе для больного мальчика. Старик называет её дриадой, а в конце она сама говорит, что её настоящее имя — Воспоминание. Она становится юной девушкой, переносит мальчика в воздушной беседке, проводит его через времена года и показывает течение человеческой жизни. Её чудеса принадлежат истории, которую мальчик мог увидеть во сне.
  - id: enchanted-elder-bower
    name: "Летающая беседка из бузинных ветвей"
    type: location
    description: >-
      Цветущие ветви бузины смыкаются вокруг Бузинной матушки и мальчика, образуя воздушное жилище, которое переносит их по воздуху. Этот чудесный эпизод следует за появлением огромного куста из чайника; после пробуждения мальчика куста в комнате нет.
  - id: transformed-walking-stick-horse
    name: "Посох, превратившийся в коня"
    type: artifact
    description: >-
      Отцовская трость, которую дети оседлали в волшебном путешествии с Бузинной матушкой. Её набалдашник становится головой ржущего коня, появляются грива и четыре ноги; на таком коне дети скачут по лужайке, видя будто бы далёкие места. Превращение происходит внутри рассказа или сна.
  - id: ever-fresh-elderflower
    name: "Неувядающий цветок бузины"
    type: plant
    description: >-
      Цветок, который девушка-Бузинная матушка даёт мальчику на память перед отъездом. Он хранится в молитвеннике и спустя долгие годы остаётся свежим; при взгляде на него герой видит девушку и вспоминает картины разных времён года. Цветок сохраняет чудесную свежесть в пределах рассказанной истории.
