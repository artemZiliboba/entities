entities:
  - id: living-one-legged-tin-soldier
    name: "Оживший одноногий оловянный солдатик"
    type: artifact
    description: >
      Игрушечный солдатик, отлитый из олова с одной ногой.
      В отсутствие людей способен думать, чувствовать,
      испытывать любовь к бумажной танцовщице и
      осмысленно наблюдать за происходящим, хотя
      сохраняет неподвижную военную выправку.
      Переживает путешествие по сточной канаве,
      попадает в брюхо рыбы и возвращается в дом.
      В печи расплавляется в кусочек олова
      в форме сердца.
    tags:
      - animated-toy
      - sentient-object
  - id: snuffbox-goblin
    name: "Чёрный гоблин из табакерки"
    type: creature
    description: >
      Маленький чёрный гоблин, выскакивающий
      из игрушечной табакерки в полночь.
      Угрожает солдатику, запрещая смотреть
      на танцовщицу. После угрозы солдатик
      падает из окна, а позднее оказывается
      брошен в печь; рассказчик оставляет
      неясным, действительно ли гоблин
      вызвал эти события.
    tags:
      - goblin
      - animated-toy
      - threat
  - id: animated-toy-ensemble
    name: "Оживающие ночью игрушки"
    type: artifact
    description: >
      Игрушки детской комнаты после отхода
      людей ко сну самостоятельно устраивают
      игры, сражения и балы. Щелкунчики
      кувыркаются, карандаш подпрыгивает,
      а оловянные солдатики в коробке
      шумят и хотят присоединиться,
      но не могут поднять крышку.
      Их ночное оживление описано
      как единое свойство игрушечного мира.
    tags:
      - animated-objects
      - nocturnal-magic
  - id: sentient-paper-dancer
    name: "Ожившая бумажная танцовщица"
    type: artifact
    description: >
      Бумажная фигурка танцовщицы перед
      игрушечным замком. Стоит на одной ноге,
      вытянув вторую назад, и привлекает
      внимание оловянного солдатика.
      В конце истории смотрит на него
      перед гибелью, когда сквозняк
      уносит её в печь. Рассказчик
      приписывает фигурке ответный взгляд,
      но не описывает её самостоятельных
      магических действий.
    tags:
      - sentient-toy
      - enchanted-figurine
