id: elfin-mount-andersen-1913
title: "Эльфова гора"
original_title: "Elfin-Mount"
kind: story
tradition:
  - danish-literature
author: "Ханс Кристиан Андерсен"
collection: "Hans Andersen's Fairy Tales, иллюстрации W. Heath Robinson, Henry Holt & Co., New York, 1913"
source:
  title: "Elfin-Mount, Hans Andersen's Fairy Tales (1913), pp. 121–132"
  url: "https://www.gutenberg.org/cache/epub/66688/pg66688-images.html"
  note: "Английская редакция из издания Henry Holt & Co. (1913), с. 121–132, Project Gutenberg № 66688. Прочитан только раздел ELFIN-MOUNT; другие переводы и варианты не смешивались."
entities:
  - id: elfin-king
    name: "Король эльфов"
    type: character
    description: >
      Правитель Эльфовой горы, устраивающий торжественный пир для норвежского тролля и его сыновей. Представляет гостям семь дочерей, каждая из которых показывает своё умение.
  - id: elfin-housekeeper
    name: "Экономка короля эльфов"
    type: character
    description: >
      Пожилая эльфийка, дальняя родственница короля, полая со спины, как и другие эльфы. Приглашает ночного ворона разнести приглашения и руководит подготовкой пиршества.
  - id: dofrefield-troll-chief
    name: "Старый тролль с Доврефьелля"
    type: creature
    description: >
      Глава норвежских троллей, приезжает с двумя сыновьями в Эльфову гору. Носит корону из сосулек и шишек, выбирает младшую дочь короля эльфов себе в жёны и рассказывает о жизни в норвежских горах.
  - id: elder-troll-son
    name: "Первый сын норвежского тролля"
    type: creature
    description: >
      Один из двух сыновей горного тролля, приглашённых выбрать невест среди дочерей короля эльфов. Вместе с братом нарушает правила застолья, покидает показ волшебных умений и отказывается жениться.
  - id: younger-troll-son
    name: "Второй сын норвежского тролля"
    type: creature
    description: >
      Второй сын тролля с Доврефьелля. Вместе с братом швыряет шишки в гостью, тушит блуждающие огни, а затем предпочитает тосты и сон на столе поиску невесты.
  - id: first-elf-daughter
    name: "Старшая дочь короля эльфов"
    type: character
    description: >
      Прозрачная, как лунный свет, эльфийка. Вставляет в рот белую палочку и исчезает на глазах у гостей, демонстрируя собственное необычное умение.
  - id: second-elf-daughter
    name: "Вторая дочь короля эльфов"
    type: character
    description: >
      Эльфийка, способная идти рядом с собственным двойником, будто с тенью, хотя у эльфов и троллей обычной тени нет.
  - id: third-elf-daughter
    name: "Третья дочь короля эльфов"
    type: character
    description: >
      Эльфийка, обучившаяся у мудрой болотной ведьмы варить пиво и украшать ольховые дрова светляками. Её умения показаны как ремесло, а не самостоятельное заклинание.
  - id: fourth-elf-daughter
    name: "Четвёртая дочь короля эльфов"
    type: character
    description: >
      Эльфийка, играющая на золотой арфе. Первый аккорд заставляет всех гостей поднять левую ногу, второй — подчиняться её воле.
  - id: fifth-elf-daughter
    name: "Пятая дочь короля эльфов"
    type: character
    description: >
      Эльфийка, заявляющая, что полюбила север и согласится выйти замуж только при переезде в Норвегию. Младшая сестра объясняет это страхом перед концом света.
  - id: sixth-elf-daughter
    name: "Шестая дочь короля эльфов"
    type: character
    description: >
      Эльфийка, которая, по собственным словам, умеет говорить людям только правду. На пиру отказывается искать мужа и говорит, что ей пора шить саван.
  - id: seventh-elf-daughter
    name: "Седьмая дочь короля эльфов"
    type: character
    description: >
      Младшая эльфийка, искусная рассказчица. Обещает старому троллю по сказке на каждый палец руки; так очаровывает его, что он выбирает её своей женой.
  - id: will-o-wisp-procession
    name: "Блуждающие огни — вестники"
    type: phenomenon
    description: >
      Разумные блуждающие огни, приглашённые освещать шествие факелов. Двое приносят весть о прибытии троллей; позднее сыновья тролля гасят огни, готовящиеся к процессии.
  - id: elfin-mount
    name: "Эльфова гора"
    type: location
    description: >
      Обитаемая эльфами гора с залами и кухней внутри. Во время подготовки праздника поднимается на четырёх красных столбах, затем раскрывается для выхода экономки и приёма гостей, а на рассвете закрывается.
  - id: commanding-golden-harp
    name: "Золотая арфа повиновения"
    type: artifact
    description: >
      Инструмент четвёртой дочери короля эльфов: от первого аккорда все присутствующие поднимают левую ногу, от второго вынуждены исполнять её желания.
  - id: mer-king
    name: "Морской король"
    type: creature
    description: >
      Повелитель морского народа, приглашённый на пир со своими дочерьми. Для их удобства хозяева предоставляют большие кадки с водой, в которых морские гости сидят за столом.
