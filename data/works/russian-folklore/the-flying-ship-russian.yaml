id: the-flying-ship-russian
title: "Летучий корабль"
original_title: "Летучий корабль"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — Летучий корабль"
  url: "https://ru.wikisource.org/wiki/Летучий_корабль_(Афанасьев)"
  note: >
    Использована редакция сказки из собрания А. Н. Афанасьева,
    опубликованная в Викитеке. Запись следует только этому тексту и не
    смешивает детали иных вариантов, позднейших обработок и экранизаций.

entities:
  - id: flying-ship
    name: "Летучий корабль"
    type: artifact
    description: >
      Чудесный корабль, построенный героем после встречи со стариком.
      Он способен лететь по воздуху и доставляет героя вместе с его
      необыкновенными спутниками ко двору царя.
    tags:
      - flying
      - ship
      - magical-transport
      - quest

  - id: far-hearer
    name: "Слухало"
    type: character
    description: >
      Необыкновенный спутник героя, способный слышать происходящее на
      огромном расстоянии. Его сверхъестественный слух позволяет следить
      за выполнением царских испытаний.
    tags:
      - super-hearing
      - companion
      - helper
      - distance

  - id: far-seer
    name: "Стреляло"
    type: character
    description: >
      Спутник с необычайной дальностью зрения и стрельбы, способный
      поражать цель на расстоянии, недоступном обычному человеку.
      Его дар используется для выполнения одного из царских заданий.
    tags:
      - super-sight
      - archer
      - companion
      - distance

  - id: fleet-runner
    name: "Скороход"
    type: character
    description: >
      Чудесный бегун, вынужденный ограничивать собственную скорость;
      когда ограничение снято, он способен преодолевать огромные расстояния
      за необычайно короткое время.
    tags:
      - super-speed
      - runner
      - companion
      - helper

  - id: great-eater
    name: "Объедало"
    type: character
    description: >
      Спутник героя с ненасытной сверхъестественной способностью поглощать
      огромное количество пищи, благодаря чему он выполняет царское
      испытание, невозможное для обычного человека.
    tags:
      - super-appetite
      - eater
      - companion
      - trial

  - id: great-drinker
    name: "Опивало"
    type: character
    description: >
      Спутник, способный выпить чрезвычайно большое количество жидкости.
      Его чудесная способность позволяет герою пройти ещё одно царское
      испытание.
    tags:
      - super-appetite
      - drinker
      - companion
      - trial

  - id: frost-man
    name: "Морозило"
    type: character
    description: >
      Необыкновенный спутник, связанный с сильным холодом. Его способность
      резко охлаждать окружающее пространство спасает героя и товарищей
      во время испытания жаром.
    tags:
      - frost
      - cold
      - companion
      - helper
