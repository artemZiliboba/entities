id: marya-morevna
title: "Марья Моревна"
original_title: "Марья Моревна"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки"
source:
  title: "Народные русские сказки (Афанасьев) — Марья Моревна, № 159"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Марья_Моревна"
  note: >
    Сказка № 159 из собрания А. Н. Афанасьева. Текст сверён по Викитеке,
    которая указывает издание: Народные русские сказки А. Н. Афанасьева:
    в 3 т. — М.: Наука, 1984–1985. Использована только эта редакция;
    детали других вариантов не смешивались.

entities:
  - id: falcon-shapeshifter
    name: "Сокол-оборотень"
    type: character
    description: >
      Сверхъестественный жених Марьи-царевны. Он прилетает соколом во время
      грозы, ударяется оземь и превращается в доброго молодца; позднее снова
      принимает птичий облик и добывает живую воду для воскрешения Ивана.
    tags:
      - shapeshifter
      - falcon
      - magical-helper

  - id: eagle-shapeshifter
    name: "Орёл-оборотень"
    type: character
    description: >
      Сверхъестественный жених Ольги-царевны, способный переходить между
      обликами орла и человека. После гибели Ивана он вытаскивает из моря
      бочку с его останками.
    tags:
      - shapeshifter
      - eagle
      - magical-helper

  - id: raven-shapeshifter
    name: "Ворон-оборотень"
    type: character
    description: >
      Сверхъестественный жених Анны-царевны, превращающийся из ворона в
      человека и обратно. Для воскрешения Ивана он приносит мёртвую воду.
    tags:
      - shapeshifter
      - raven
      - magical-helper

  - id: koschei-the-deathless
    name: "Кощей Бессмертный"
    type: creature
    description: >
      Сверхъестественный похититель Марьи Моревны. После десяти лет заточения
      три ведра воды мгновенно возвращают ему прежнюю силу; он разрывает
      двенадцать цепей, вылетает страшным вихрем и пользуется необычайно
      быстрым говорящим конём.
    tags:
      - koschei
      - deathless
      - supernatural-strength

  - id: three-buckets-strength-restoration
    name: "Возвращение силы Кощею тремя вёдрами воды"
    type: phenomenon
    description: >
      После десятилетнего голода и жажды Кощей выпивает три полных ведра
      обычной воды и сразу возвращает прежнюю сверхъестественную силу,
      достаточную, чтобы одним движением разорвать двенадцать цепей.
    tags:
      - strength-restoration
      - koschei
      - supernatural-recovery

  - id: silver-life-tokens
    name: "Серебряные памятные вещи — вестники беды"
    type: artifact
    description: >
      Серебряные ложка, вилка и табакерка, оставленные Иваном у трёх зятьёв.
      В момент его гибели серебро само чернеет, сообщая им, что с Иваном
      случилась беда.
    tags:
      - life-token
      - omen
      - silver

  - id: dead-water
    name: "Мёртвая вода"
    type: substance
    description: >
      Чудесная вода, принесённая вороном после гибели Ивана. Когда ею
      окропляют собранные части тела, они срастаются и вновь образуют целое
      тело, подготавливая его к оживлению живой водой.
    tags:
      - dead-water
      - restoration
      - resurrection

  - id: living-water
    name: "Живая вода"
    type: substance
    description: >
      Чудесная вода, добытая соколом. После того как тело Ивана соединено
      мёртвой водой, окропление живой водой возвращает его к жизни.
    tags:
      - living-water
      - resurrection
      - healing

  - id: koscheis-talking-horse
    name: "Говорящий конь Кощея"
    type: animal
    description: >
      Необычайно быстрый конь Кощея, который чувствует побег Марьи Моревны,
      разговаривает с хозяином и каждый раз уверяет, что успеет догнать
      беглецов даже после долгой задержки.
    tags:
      - talking-horse
      - supernatural-speed
      - koschei

  - id: baba-yaga
    name: "Баба-яга за огненной рекой"
    type: character
    description: >
      Сверхъестественная хозяйка табуна за огненной рекой. Она ежедневно
      облетает вокруг света на своей кобылице, испытывает пастухов тремя
      невозможными заданиями и владеет богатырскими конями.
    tags:
      - baba-yaga
      - witch
      - horse-mistress

  - id: baba-yagas-mares
    name: "Кобылицы Бабы-яги"
    type: animal
    description: >
      Чудесный табун, который три дня подряд мгновенно разбегается так, что
      обычный пастух не может его собрать: сначала по лугам, затем по лесам,
      а на третий день кобылицы уходят в море и стоят в воде по шею.
    tags:
      - magical-horses
      - baba-yaga
      - impossible-task

  - id: magical-bridge-handkerchief
    name: "Платок, создающий мост"
    type: artifact
    description: >
      Волшебный платок Кощея. Три взмаха вправо создают высокий прочный мост
      через огненную реку; два взмаха влево оставляют мост тонким, благодаря
      чему преследующая Баба-яга проваливается в огонь.
    tags:
      - magic-handkerchief
      - bridge
      - fire-river

  - id: fire-river
    name: "Огненная река"
    type: location
    description: >
      Сверхъестественная огненная преграда, отделяющая владения Бабы-яги.
      Пересечь её можно по мосту, вызванному волшебным платком; падение в реку
      оказывается смертельным для Бабы-яги.
    tags:
      - fire-river
      - magical-barrier
      - baba-yaga

  - id: overseas-bird-helper
    name: "Заморская птица-помощница"
    type: animal
    description: >
      Говорящая птица, пощажённая Иваном вместе с птенцами. В ответ она
      созывает птиц со всего света, которые загоняют разбежавшихся кобылиц
      Бабы-яги обратно домой.
    tags:
      - talking-bird
      - magical-helper
      - animal-army

  - id: lioness-helper
    name: "Львица-помощница"
    type: animal
    description: >
      Говорящая львица, чьего львёнка Иван отказывается съесть. Позднее она
      созывает лютых зверей со всего света и заставляет кобылиц Бабы-яги
      вернуться из дремучих лесов.
    tags:
      - talking-animal
      - magical-helper
      - animal-army

  - id: queen-bee-helper
    name: "Пчелиная матка-помощница"
    type: animal
    description: >
      Говорящая пчелиная матка, чей мёд Иван не трогает. На третий день она
      созывает неисчислимых пчёл, которые жалят кобылиц и выгоняют их из моря,
      а затем советует Ивану украсть особого жеребёнка.
    tags:
      - talking-animal
      - magical-helper
      - bees

  - id: heroic-foal
    name: "Богатырский жеребёнок Ивана"
    type: animal
    description: >
      Невзрачный жеребёнок из конюшни Бабы-яги, которого пчела советует
      украсть. После откорма на зелёных лугах он превращается в чудного
      богатырского коня, летящего словно птица и превосходящего коня Кощея.
    tags:
      - heroic-horse
      - supernatural-speed
      - transformation

  - id: baba-yagas-iron-mortar
    name: "Железная ступа Бабы-яги"
    type: artifact
    description: >
      Чудесное средство передвижения Бабы-яги: во время погони она скачет в
      железной ступе, погоняет пестом и заметает след помелом.
    tags:
      - magic-mortar
      - magical-transport
      - baba-yaga
