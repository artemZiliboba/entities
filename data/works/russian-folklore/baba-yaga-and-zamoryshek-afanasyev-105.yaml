id: baba-yaga-and-zamoryshek-afanasyev-105
title: "Баба-яга и Заморышек"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Баба-яга и Заморышек, № 105"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Баба-яга_и_Заморышек"
  note: "Один самостоятельный вариант № 105 по изданию: Народные русские сказки А. Н. Афанасьева, М.: Наука, 1984–1985. Соседние сказки и иные варианты не использованы."
entities:
  - id: mysterious-old-man
    name: "Вещий старик"
    type: character
    description: >
      Неизвестный старик встречает бездетного отца Заморышка в лесу, угадывает
      его невысказанное желание иметь детей и сообщает необычный способ:
      собрать яйца с деревенских дворов и посадить на них наседку.
      Следование совету приводит к появлению сорока одного сына.
    tags:
      - prophecy
      - supernatural-helper
  - id: miraculous-egg-born-brothers
    name: "Сорок один брат, рождённый из яиц"
    type: character
    description: >
      Мальчики, включая Заморышка, появляются из сорока одного яйца,
      высиженных курицей по совету вещего старика. Их рождение и
      необыкновенно быстрое взросление имеют чудесную природу.
    tags:
      - miraculous-birth
      - accelerated-growth
  - id: sea-mare
    name: "Чудесная морская кобылица"
    type: animal
    description: >
      Говорящая кобылица выходит ночью из морской глубины и съедает стог
      сена. После того как Заморышек удерживается на её спине, она
      призывает из моря сорок одного жеребца и отдаёт их ему.
    tags:
      - talking-animal
      - sea
      - magical-helper
  - id: forty-one-sea-stallions
    name: "Сорок один чудесный конь"
    type: animal
    description: >
      Жеребцы выходят из моря по зову чудесной кобылицы и достаются
      Заморышку с братьями. Конь Заморышка позднее говорит человеческим
      голосом и заранее предупреждает хозяина о ночном замысле Бабы-яги.
    tags:
      - talking-animal
      - magical-helper
  - id: baba-yaga
    name: "Баба-яга"
    type: character
    description: >
      Сверхъестественная хозяйка палат с сорока одной дочерью. Устраивает
      гостям опасную ночёвку, приказывает слугам обезглавить пришельцев,
      а после неудачи преследует братьев с огненным щитом.
    tags:
      - witch
      - antagonist
  - id: fiery-shield
    name: "Огненный щит Бабы-яги"
    type: artifact
    description: >
      Щит, которым Баба-яга во время погони палит во все четыре стороны,
      угрожая бегущим братьям. Его необычное огненное действие прямо
      показано в сказке.
    tags:
      - fire
      - magical-weapon
  - id: bridge-making-handkerchief
    name: "Платочек, создающий мост"
    type: artifact
    description: >
      Платочек, взятый Заморышком у Бабы-яги. Один взмах создаёт мост
      через море, по которому братья спасаются; взмах в другую сторону
      убирает мост, останавливая преследовательницу.
    tags:
      - magical-transport
      - transformation
