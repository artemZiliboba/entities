id: finist-bright-falcon-feather
title: "Пёрышко Финиста ясна сокола"
original_title: "Пёрышко Финиста ясна сокола"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки"
source:
  title: "Народные русские сказки (Афанасьев) — Пёрышко Финиста ясна сокола, № 234"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Пёрышко_Финиста_ясна_сокола"
  note: >
    Использован только вариант № 234 из собрания А. Н. Афанасьева на Викитеке.
    Страница также содержит вариант № 235, но его детали в эту запись не
    включались. Викитека указывает издание: Народные русские сказки
    А. Н. Афанасьева: в 3 т. — М.: Наука, 1984–1985.

entities:
  - id: finist-bright-falcon
    name: "Финист ясный сокол"
    type: character
    description: >
      Сверхъестественный царевич-оборотень. Он свободно переходит между обликами
      прекрасного царевича, ясного сокола и пёрышка, прилетает к девушке по
      ночам и после возвращения на родину чудесным образом вызывает богатые
      наряды и золотую карету.
    tags:
      - shapeshifter
      - falcon
      - prince
      - magical-lover

  - id: finist-feather-form
    name: "Пёрышко Финиста"
    type: artifact
    description: >
      Материальный облик Финиста, который отец девушки покупает у таинственного
      старичка. В комнате пёрышко вылетает из коробочки, ударяется об пол и
      становится царевичем; по желанию Финист снова обращается пёрышком или
      соколом.
    tags:
      - transformation
      - feather
      - shapeshifter
      - finist

  - id: guiding-yarn-ball
    name: "Путеводный клубочек"
    type: artifact
    description: >
      Клубок, подаренный первой старушкой. Он самостоятельно катится по дороге,
      а девушка должна идти вслед за ним; так клубок последовательно приводит
      её к двум следующим избушкам и помогает продолжить поиски Финиста.
    tags:
      - magic-ball
      - guidance
      - quest

  - id: silver-distaff-golden-spindle
    name: "Серебряное донце и золотое веретенце"
    type: artifact
    description: >
      Первый чудесный рукодельный дар. Когда девушка начинает прясть с его
      помощью, из кудели тянется нить из чистого золота; этот предмет она
      обменивает на возможность провести ночь возле Финиста.
    tags:
      - magical-tool
      - spinning
      - golden-thread

  - id: silver-plate-golden-egg
    name: "Серебряное блюдечко и золотое яичко"
    type: artifact
    description: >
      Второй чудесный дар. Девушка катает золотое яичко по серебряному блюдцу,
      и от этого появляются многочисленные золотые яйца; вещь становится ценой
      за вторую ночь возле Финиста.
    tags:
      - magical-tool
      - golden-eggs
      - multiplication

  - id: golden-hoop-self-embroidering-needle
    name: "Золотое пялечко и самовышивающая иголочка"
    type: artifact
    description: >
      Третий чудесный рукодельный дар. Девушке достаточно держать золотое
      пялечко: иголочка сама вышивает необыкновенные узоры, благодаря чему она
      получает право провести у Финиста третью ночь.
    tags:
      - magical-tool
      - self-working
      - embroidery

  - id: sleeping-potion
    name: "Сонное зелье"
    type: substance
    description: >
      Зелье, которое просвирнина дочь три вечера подмешивает Финисту в питьё.
      После него он погружается в настолько крепкий сон, что не слышит плача и
      долгих попыток девушки разбудить его.
    tags:
      - sleeping-potion
      - enchanted-drink
      - magical-sleep

  - id: summoned-regalia-and-golden-carriage
    name: "Чудесно вызванные наряды и золотая карета"
    type: phenomenon
    description: >
      После возвращения к дому девушки Финист свистит в окно, и сразу появляются
      богатые платья, украшения и золотая карета. После поездки в церковь всё
      так же внезапно исчезает, а сам Финист вновь становится пёрышком.
    tags:
      - summoning
      - magical-clothing
      - golden-carriage
      - manifestation
