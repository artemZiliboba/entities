id: nikita-kozhemyaka-afanasyev-148
title: "Никита Кожемяка"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Никита Кожемяка, № 148"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Никита_Кожемяка"
  note: "Самостоятельный вариант № 148; по изданию: Народные русские сказки А. Н. Афанасьева, М.: Наука, 1984–1985. Запись П. И. Якушкина в Козлове Тамбовской губернии. Другие версии сказания не использованы."
entities:
  - id: nikita-kozhemyaka
    name: "Никита Кожемяка"
    type: character
    description: >
      Киевский кожемяка и богатырь необычайной силы: нечаянно разрывает
      двенадцать кож, одолевает змея, а затем запрягает побеждённое
      чудовище в трёхсотпудовую соху и проводит огромную борозду от Киева
      до моря. После этого убивает змея, освобождая царевну и людей от
      его власти.
    tags:
      - bogatyr
      - extraordinary-strength
      - dragon-slayer
  - id: tribute-taking-serpent
    name: "Змей, похитивший царевну"
    type: creature
    description: >
      Летающий змей, требующий с жителей окрестностей Киева девушек
      и пожирающий их. Похищает царскую дочь и удерживает её в берлоге.
      Признаёт Никиту Кожемяку сильнее себя, терпит поражение в бою,
      а затем тянет его тяжёлую соху, пока богатырь не убивает его в море.
    tags:
      - serpent
      - flying-creature
      - antagonist
