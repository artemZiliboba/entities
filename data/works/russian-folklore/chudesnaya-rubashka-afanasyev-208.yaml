id: chudesnaya-rubashka-afanasyev-208
title: "Чудесная рубашка (Афанасьев, № 208)"
original_title: "Чудесная рубашка"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева, № 208"
source:
  title: "Народные русские сказки (Афанасьев)/Чудесная рубашка — № 208, Викитека"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Чудесная_рубашка"
  note: "Прочитан целиком только вариант № 208, записанный Д. Петуховым в Соликамском уезде Пермской губернии (строки 116–161 Викитеки; издание Наука, 1984–1985). Соседний самостоятельный вариант № 209 не смешивался."
entities:
  - id: six-headed-serpent
    name: "Шестиглавый змей"
    type: creature
    description: >
      Летающий шестиглавый змей нанимает солдата варить кашу на девять лет. В награду даёт богатырского коня и волшебную рубаху. Позднее складывает разрубленное тело солдата, оживляет его мёртвой и живой водой и обучает искусству превращаться в разные облики.
    tags:
      - dragon
      - revival
      - shapechanging
  - id: strength-giving-shirt
    name: "Волшебная богатырская рубаха"
    type: artifact
    description: >
      Рубаха из толстого холста, полученная солдатом от шестиглавого змея. Надевший её обретает богатырскую силу. Королевич крадёт рубаху с помощью королевны и благодаря ей побеждает солдата; в конце солдат возвращает рубаху и снова получает её силу.
    tags:
      - enchanted-clothing
      - superhuman-strength
  - id: shapechanging-heroic-horse
    name: "Богатырский конь-оборотень"
    type: animal
    description: >
      Подаренный змеем конь солдата способен по собственной воле обернуться простой клячей. Так он позволяет конюхам привязать к себе мешок с разрубленным телом хозяина, затем мчится быстрее птицы к змею и ржанием пробуждает его, чтобы спасти солдата.
    tags:
      - shapechanging
      - magical-horse
  - id: dead-water
    name: "Мёртвая вода"
    type: substance
    description: >
      Змей омывает ею собранные части разрубленного солдатского тела, отчего они срастаются. После этого для возвращения жизни он применяет отдельно живую воду; сама мёртвая вода не оживляет.
    tags:
      - restoration
      - magic-water
  - id: living-water
    name: "Живая вода"
    type: substance
    description: >
      После соединения частей тела мёртвой водой шестиглавый змей окропляет солдата живой водой и возвращает его к жизни. Обе воды используются последовательно и обладают разными действиями.
    tags:
      - resurrection
      - magic-water
  - id: soldiers-shapechanging-art
    name: "Искусство солдата превращаться в разные облики"
    type: spell
    description: >
      Шестиглавый змей обучает оживлённого солдата превращениям. Солдат становится голубем, затем человеком, цветком, маленькой мухой и соколом, чтобы тайно приблизиться к похитившему рубаху королевичу и вернуть волшебную одежду.
    tags:
      - transformation
      - learned-magic
