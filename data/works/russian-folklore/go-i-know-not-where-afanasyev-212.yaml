id: go-i-know-not-where-afanasyev-212
title: "Пойди туда — не знаю куда, принеси то — не знаю что"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Пойди туда — не знаю куда, принеси то — не знаю что, № 212"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Пойди_туда_—_не_знаю_куда,_принеси_то_—_не_знаю_что"
  note: "Только самостоятельный вариант № 212, публикация по изданию М.: Наука, 1984–1985. Варианты № 213–215 на той же странице не использованы."
entities:
  - id: fedots-wife
    name: "Жена Федота — девушка-горлица"
    type: character
    description: >
      Сначала появляется в облике говорящей горлицы, затем превращается в девушку и становится женой стрельца Федота. Умеет вновь обращаться птицей и вызывает волшебных помощников посредством книги.
  - id: summoning-book
    name: "Волшебная книга жены Федота"
    type: artifact
    description: >
      При раскрытии книги появляются два неведомых молодца, исполняющие поручения хозяйки и исчезающие после завершения работы.
  - id: two-unknown-youths
    name: "Два неведомых молодца"
    type: character
    description: >
      Пара вызываемых книгой помощников, которые за считаные минуты ткут необычайно искусный ковёр и за одну ночь доставляют из далёкого царства златорогого оленя.
  - id: baba-yaga
    name: "Баба-яга"
    type: character
    description: >
      Знает мысли королевского коменданта и дважды предлагает ему губительные для Федота поручения; её знание мыслей явно выходит за пределы обычного.
  - id: guiding-ball
    name: "Путеводный мячик"
    type: artifact
    description: >
      Мяч, подаренный Федоту женой, сам катится по пути к её родне, перекидывается мостом через реки и превращается в пуховую постель для отдыха.
  - id: mother-in-law
    name: "Мать жены Федота"
    type: character
    description: >
      Владеет волшебной книгой, вызывает великанов, повелевает зверями, птицами и морскими обитателями, чтобы разыскать путь к неведомому слуге.
  - id: book-summoned-giants
    name: "Два великана из книги"
    type: creature
    description: >
      Два гиганта, появляющиеся по вызову волшебной книги матери стрельчихи. Переносят её с Федотом к середине океана и держат над водой.
  - id: wise-old-frog
    name: "Старая говорящая лягушка"
    type: animal
    description: >
      Знает дорогу к тайной пещере за огненной рекой; раздувается до величины стога сена и одним прыжком переносит Федота через реку.
  - id: fiery-river
    name: "Огненная река"
    type: location
    description: >
      Преграда на пути к пещере невидимого слуги. Федот пересекает её верхом на чудесно увеличившейся лягушке.
  - id: shmat-razum
    name: "Шмат-разум"
    type: creature
    description: >
      Невидимый говорящий слуга, мгновенно создающий и убирающий еду и убранство, переносящий хозяина по воздуху и возводящий остров с беседкой и дворец. По собственной воле возвращается к Федоту после обмена с купцами.
  - id: garden-box
    name: "Ящичек с возникающим садом"
    type: artifact
    description: >
      При открывании маленького ящика возникает целый сад с деревьями, цветами и дорожками; при закрывании сад исчезает.
  - id: ship-making-axe
    name: "Топор, создающий корабли"
    type: artifact
    description: >
      Каждый удар топора создаёт снаряжённый корабль с командой, парусами и пушками; когда топор убирают, вызванные корабли исчезают.
  - id: army-summoning-horn
    name: "Рог, вызывающий войско"
    type: artifact
    description: >
      Звуком рога можно вызвать вооружённые пешие и конные полки, которые выполняют приказы; при трублении с другого конца вызванное войско исчезает.
