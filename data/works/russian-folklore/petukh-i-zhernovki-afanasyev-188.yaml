id: petukh-i-zhernovki-afanasyev-188
title: "Петух и жерновки (Афанасьев, № 188)"
original_title: "Петух и жерновки"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева, № 188"
source:
  title: "Народные русские сказки (Афанасьев)/Петух и жерновки — № 188, Викитека"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Петух_и_жерновки"
  note: "Прочитан весь самостоятельный текст варианта № 188, записанного в Воронежской губернии, по публикации Викитеки на основе издания Наука (1984–1985). Не смешивались текст из Народных русских легенд (1914) и варианты с горошиной вместо жёлудя."
entities:
  - id: sky-reaching-oak
    name: "Дуб, выросший до неба"
    type: plant
    description: >
      Из жёлудя, обронённого старухой в подполье, за короткое время вырастает дуб, который пробивает путь через пол, потолок и крышу избы и дорастает до самого неба. Старик взбирается по нему на небо и находит там чудесного петушка и жерновки. В тексте не говорится, что дерево исполняет желания или само переносит людей.
    tags:
      - sky-reaching
      - extraordinary-growth
  - id: pancake-pie-millstones
    name: "Чудесные жерновки, мелющие блины и пироги"
    type: artifact
    description: >
      Найденные стариком на небе ручные жерновки при каждом повороте выдают готовые блины и пироги вместо обычной муки. Старуха кормит ими старика и проезжего барина; тот похищает жерновки, а петушок возвращает их хозяевам. Упоминание золотого и голубого цвета не означает иных магических свойств.
    tags:
      - food-creation
      - magic-mill
  - id: golden-combed-rooster
    name: "Кочеток — золотой гребенёк, масляна головка"
    type: animal
    description: >
      Говорящий петушок, которого старик приносит с неба вместе с жерновками. Летит к барину требовать похищенное, а когда его бросают в колодец, выпивает всю воду по собственному приказу. Брошенный в жаркую печь, изливает запасённую воду и гасит огонь. После этого забирает жерновки и возвращает их старику со старухой.
    tags:
      - talking-animal
      - water-control
      - magical-rooster
