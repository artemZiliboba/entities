id: ivan-tsarevich-firebird-grey-wolf
title: "Сказка об Иване-царевиче, Жар-птице и о сером волке"
original_title: "Сказка об Иване-царевиче, Жар-птице и о сером волке"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки"
source:
  title: "Народные русские сказки (Афанасьев) — Сказка об Иване-царевиче, жар-птице и о сером волке, № 168"
  url: "https://ru.wikisource.org/wiki/Сказка_об_Иване-царевиче,_жар-птице_и_о_сером_волке"
  note: >
    Сказка № 168 из собрания А. Н. Афанасьева. Основной текст сверён по Викитеке;
    дополнительно использован Annotated Afanas'ev Library для идентификации той же
    редакции. Детали других вариантов сюжета ATU 550 и литературных переработок
    не смешивались.

entities:
  - id: golden-apple-tree
    name: "Яблоня с золотыми яблоками"
    type: plant
    description: >
      Любимая яблоня царя Выслава Андроновича, на которой растут золотые яблоки.
      Именно за её плодами каждую ночь прилетает Жар-птица, что запускает поиски.
    tags:
      - golden-apples
      - magical-tree
      - royal-garden

  - id: firebird
    name: "Жар-птица"
    type: animal
    description: >
      Чудесная золотая птица с глазами, подобными восточному хрусталю. Её
      появление ночью освещает весь царский сад, а сама птица регулярно похищает
      золотые яблоки и становится главным объектом поисков царевичей.
    tags:
      - firebird
      - golden-bird
      - magical-light
      - quest-object

  - id: grey-wolf
    name: "Серый волк"
    type: animal
    description: >
      Говорящий сверхъестественный помощник Ивана-царевича. Он переносит героя
      с огромной скоростью, заранее знает, где находятся Жар-птица, златогривый
      конь и Елена Прекрасная, умеет менять облик и позднее оживляет Ивана.
    tags:
      - talking-animal
      - magical-helper
      - supernatural-speed
      - shapeshifter

  - id: wolf-to-elena-transformation
    name: "Превращение Серого волка в Елену Прекрасную"
    type: spell
    description: >
      Серый волк ударяется о землю и принимает облик Елены Прекрасной настолько
      точно, что царь Афрон не замечает подмены. После исполнения обмана волк
      снова возвращается к своему естественному облику.
    tags:
      - transformation
      - shapeshifting
      - deception

  - id: wolf-to-golden-horse-transformation
    name: "Превращение Серого волка в златогривого коня"
    type: spell
    description: >
      Второе самостоятельное превращение Серого волка: он принимает облик
      златогривого коня, чтобы Иван мог обменять ложного коня на Жар-птицу.
      Позднее волк сбрасывает царя Долмата и снова становится волком.
    tags:
      - transformation
      - shapeshifting
      - horse

  - id: golden-maned-horse
    name: "Златогривый конь"
    type: animal
    description: >
      Редкий чудесный конь царя Афрона с золотой гривой, ради которого Иван
      выполняет следующее задание. После добычи конь становится постоянным
      средством передвижения Ивана и Елены.
    tags:
      - magical-horse
      - golden-mane
      - quest-object

  - id: talking-raven
    name: "Ворон-воронович"
    type: animal
    description: >
      Говорящий ворон, которого Серый волк заставляет помочь в обмен на жизнь
      воронёнка. Он летит за тридевять земель и на третий день приносит два
      пузырька — с мёртвой и живой водой.
    tags:
      - talking-bird
      - magical-helper
      - raven

  - id: dead-water
    name: "Мёртвая вода"
    type: substance
    description: >
      Чудесная вода, сращивающая разрубленное тело. Серый волк сначала проверяет
      её на воронёнке, а затем соединяет ею части тела убитого Ивана-царевича.
    tags:
      - dead-water
      - restoration
      - resurrection

  - id: living-water
    name: "Живая вода"
    type: substance
    description: >
      Чудесная вода, возвращающая жизнь после восстановления тела мёртвой водой.
      Ею Серый волк оживляет сначала воронёнка, а затем Ивана-царевича.
    tags:
      - living-water
      - resurrection
      - healing
