id: the-magic-ring-afanasyev-191
title: "Волшебное кольцо"
original_title: "Волшебное кольцо"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — Волшебное кольцо, № 191"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Волшебное_кольцо"
  note: >
    Использован только вариант № 191 на общей странице вариантов № 190—191
    по изданию "Народные русские сказки А. Н. Афанасьева" (М.: Наука,
    1984—1985), опубликованному в Викитеке. Детали варианта № 190,
    одноимённой заветной сказки и позднейших обработок не смешиваются.

entities:
  - id: serpent-maiden
    name: "Красная девица-змея"
    type: character
    description: >
      Сверхъестественная дочь царя подземной стороны, которую Мартын
      освобождает из огня. Она превращается из девушки в змею и обратно,
      приводит героя в подземное царство и объясняет, как получить
      чудодейное кольцо.
    tags:
      - shapeshifter
      - serpent
      - maiden
      - helper

  - id: underground-kingdom
    name: "Подземное царство"
    type: location
    description: >
      Скрытая под огромным камнем чудесная страна, куда девушка-змея
      приводит Мартына. За подземным ходом открываются поле, небо и дворец
      её отца, царя этой необычной стороны.
    tags:
      - underground
      - hidden-realm
      - otherworld
      - kingdom

  - id: magic-ring
    name: "Чудодейное кольцо"
    type: artifact
    description: >
      Волшебное кольцо царя подземной стороны. Если перекинуть его с руки
      на руку, появляются двенадцать одинаковых молодцев, способных за
      чрезвычайно короткое время исполнить приказ владельца, включая
      строительство, перенос людей и восстановление созданного ими.
    tags:
      - ring
      - summoning
      - command
      - magical-servants

  - id: twelve-ring-servants
    name: "Двенадцать молодцев"
    type: character
    description: >
      Группа сверхъестественных слуг, вызываемых чудодейным кольцом.
      Они появляются по его активации, принимают приказ владельца и
      исполняют невозможные по обычным меркам работы: за ночь возводят
      дворец, мост и собор, переносят королевну и затем восстанавливают
      исчезнувшие постройки.
    tags:
      - summoned-servants
      - twelve
      - construction
      - teleportation
