id: vasilisa-the-beautiful
title: "Василиса Прекрасная"
original_title: "Василиса Прекрасная"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки"
source:
  title: "Народные русские сказки (Афанасьев) — Василиса Прекрасная, № 104"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Василиса_Прекрасная"
  note: >
    Сказка № 104 из собрания А. Н. Афанасьева. Текст сверён по Викитеке,
    которая указывает издание: Народные русские сказки А. Н. Афанасьева:
    в 3 т. — М.: Наука, 1984–1985. Использована только эта редакция сказки;
    детали других вариантов о Василисе и Бабе-яге не смешивались.

entities:
  - id: mothers-magic-doll
    name: "Материнская куколка"
    type: artifact
    description: >
      Кукла, оставленная Василисе умирающей матерью вместе с благословением.
      После угощения она разговаривает с хозяйкой, даёт советы, выполняет
      тяжёлую работу, указывает безопасный путь и за одну ночь изготавливает
      ткацкий стан.
    tags:
      - magic-doll
      - helper
      - talking-artifact
      - household-magic

  - id: mothers-blessing
    name: "Материнское благословение"
    type: spell
    description: >
      Защитная сила, переданная Василисе матерью вместе с куколкой. Баба-яга
      прямо связывает с этим благословением способность девушки выполнить
      невозможные задания и изгоняет её, заявляя, что не терпит благословенных.
    tags:
      - blessing
      - protection
      - maternal-magic

  - id: baba-yaga
    name: "Баба-яга"
    type: character
    description: >
      Людоедка и сверхъестественная хозяйка лесной избушки. Она ездит в ступе,
      повелевает оживающими воротами, тремя парами бесплотных рук и тремя
      всадниками, задаёт Василисе невозможные работы и вручает ей огненный
      череп.
    tags:
      - baba-yaga
      - witch
      - cannibal
      - supernatural-mistress

  - id: white-rider-day
    name: "Белый всадник — ясный день"
    type: character
    description: >
      Всадник в белом на белом коне, появление которого сопровождает рассвет.
      Баба-яга прямо называет его своим ясным днём и одним из верных слуг.
    tags:
      - personification
      - day
      - rider
      - baba-yaga-servant

  - id: red-rider-sun
    name: "Красный всадник — солнце"
    type: character
    description: >
      Красный всадник на красном коне, проезжающий перед восходом солнца.
      Баба-яга отождествляет его со своим красным солнышком.
    tags:
      - personification
      - sun
      - rider
      - baba-yaga-servant

  - id: black-rider-night
    name: "Чёрный всадник — тёмная ночь"
    type: character
    description: >
      Чёрный всадник на чёрном коне, исчезающий у ворот Бабы-яги в момент
      наступления полной темноты. Баба-яга называет его своей тёмной ночью.
    tags:
      - personification
      - night
      - rider
      - baba-yaga-servant

  - id: flying-mortar-pestle-broom
    name: "Ступа, пест и помело Бабы-яги"
    type: artifact
    description: >
      Чудесный дорожный комплект Бабы-яги: ступа является по свисту и несёт
      хозяйку через лес, пест служит для погоняния, а помело заметает след.
    tags:
      - flying-mortar
      - magical-transport
      - baba-yaga

  - id: enchanted-gates
    name: "Повинующиеся ворота Бабы-яги"
    type: artifact
    description: >
      Ворота лесной усадьбы, которые по приказу Бабы-яги сами отпираются,
      распахиваются и затем снова запираются. Их запоры и детали сделаны из
      человеческих конечностей и костей.
    tags:
      - enchanted-gate
      - self-moving
      - bone-fence
      - baba-yaga

  - id: disembodied-hand-servants
    name: "Три пары бесплотных рук"
    type: creature
    description: >
      Невидимые слуги Бабы-яги, проявляющиеся только как три пары рук. По её
      приказу они уносят пшеницу для помола и мак для выжимки масла, после чего
      снова исчезают из виду.
    tags:
      - disembodied-hands
      - supernatural-servants
      - baba-yaga

  - id: flaming-skull
    name: "Череп с горящими глазами"
    type: artifact
    description: >
      Человеческий череп с забора Бабы-яги, чьи глаза светятся как огонь.
      Баба-яга насаживает его на палку и отдаёт Василисе вместо обычного огня;
      череп сам велит не бросать его и нести к мачехе.
    tags:
      - flaming-skull
      - talking-artifact
      - magical-fire
      - skull

  - id: skull-burning-gaze
    name: "Сжигающий взгляд черепа"
    type: phenomenon
    description: >
      Сверхъестественное действие огненного черепа в доме мачехи. Его глаза
      неотступно следят за мачехой и её дочерьми, куда бы они ни прятались,
      и к утру полностью сжигают их в уголь, не причиняя вреда Василисе.
    tags:
      - magical-fire
      - burning-gaze
      - punishment
      - skull
