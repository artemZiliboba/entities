id: morozko
title: "Морозко"
original_title: "Морозко"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — Морозко"
  url: "https://ru.wikisource.org/wiki/Морозко_(Афанасьев)"
  note: >
    Текст из собрания А. Н. Афанасьева, опубликованный в Викитеке.
    Запись следует именно этой редакции и не смешивает детали позднейших
    литературных пересказов, экранизаций и иных вариантов.

entities:
  - id: morozko
    name: "Морозко"
    type: character
    description: >
      Персонифицированный дух мороза, который приходит к девушкам в лесу,
      разговаривает с ними и испытывает их отношением к холоду. Покорную
      падчерицу он одаривает богатствами, а грубую родную дочь мачехи губит
      морозом.
    tags:
      - frost-spirit
      - winter
      - supernatural-judge
      - gift

  - id: freezing-trial
    name: "Испытание морозом"
    type: phenomenon
    description: >
      Повторяемое сверхъестественное испытание, в котором Морозко усиливает
      холод и спрашивает девушку, тепло ли ей. Ответ и поведение определяют
      исход встречи: награду или гибель от мороза.
    tags:
      - frost
      - trial
      - reward
      - punishment

  - id: miraculous-dowry
    name: "Чудесные дары Морозко"
    type: artifact
    description: >
      Богатые дары, которыми Морозко награждает терпеливую падчерицу после
      испытания. Они появляются как прямой сверхъестественный результат его
      благосклонности и служат знаком чудесного вознаграждения.
    tags:
      - gifts
      - dowry
      - reward
      - morozko
