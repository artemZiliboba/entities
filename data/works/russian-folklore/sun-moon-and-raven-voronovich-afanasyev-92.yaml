id: sun-moon-and-raven-voronovich-afanasyev-92
title: "Солнце, Месяц и Ворон Воронович"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Солнце, Месяц и Ворон Воронович, № 92"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Солнце,_Месяц_и_Ворон_Воронович"
  note: "Только вариант № 92 по изданию: Народные русские сказки А. Н. Афанасьева, М.: Наука, 1984–1985, том 1. Другие варианты, пересказы и соседние сказки не использованы."
entities:
  - id: personified-sun
    name: "Солнце (Солнышко)"
    type: character
    description: >
      Олицетворённое Солнце, которое откликается на просьбу старика,
      согревает его и забирает в жёны старшую дочь. Принимая тестя
      в гостях, Солнце своим жаром разогревает поставленную на него
      сковороду и печёт оладьи без печи.
    tags:
      - personification
      - solar
      - supernatural-heat
  - id: personified-moon
    name: "Месяц"
    type: character
    description: >
      Олицетворённый Месяц помогает старику светом и уносит его среднюю
      дочь. Во время визита тестя освещает тёмную баню: просовывает
      палец в отверстие стены, и внутри становится светло.
    tags:
      - personification
      - lunar
      - supernatural-light
  - id: raven-voronovich
    name: "Ворон Воронович"
    type: animal
    description: >
      Говорящий ворон, который помогает старику собрать рассыпанную
      крупу и уносит его младшую дочь. Позднее принимает старика
      у себя, приглашает ночевать на насесте и укрывает под крылом;
      во сне оба падают и погибают.
    tags:
      - talking-animal
      - supernatural-suitor
