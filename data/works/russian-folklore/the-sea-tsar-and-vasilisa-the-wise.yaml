id: the-sea-tsar-and-vasilisa-the-wise
title: "Морской царь и Василиса Премудрая"
original_title: "Морской царь и Василиса Премудрая"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — Морской царь и Василиса Премудрая"
  url: "https://ru.wikisource.org/wiki/Морской_царь_и_Василиса_Премудрая_(Афанасьев)"
  note: >
    Использована редакция сказки из собрания А. Н. Афанасьева,
    опубликованная в Викитеке. Запись следует только этому тексту и не
    смешивает детали иных вариантов и позднейших обработок.

entities:
  - id: sea-tsar
    name: "Морской царь"
    type: character
    description: >
      Сверхъестественный властитель подводного царства, который получает
      обещанного ему царского сына, задаёт герою невозможные задания и
      преследует беглецов после их ухода из своего владения.
    tags:
      - sea
      - ruler
      - antagonist
      - otherworld

  - id: vasilisa-the-wise
    name: "Василиса Премудрая"
    type: character
    description: >
      Волшебная дочь Морского царя и помощница царевича. Она выполняет
      невозможные задания с помощью сверхъестественной силы, организует
      побег и магически противодействует преследованию отца.
    tags:
      - sorceress
      - helper
      - wise-maiden
      - transformation

  - id: sea-kingdom
    name: "Подводное царство Морского царя"
    type: location
    description: >
      Иномирное владение Морского царя, куда попадает царевич и где живут
      его сверхъестественные дочери. Здесь герой проходит чудесные испытания,
      прежде чем бежать вместе с Василисой.
    tags:
      - underwater
      - otherworld
      - kingdom
      - sea-tsar

  - id: escape-transformations
    name: "Превращения при бегстве"
    type: spell
    description: >
      Магическая защита Василисы во время погони: она изменяет облик
      беглецов и окружающего пространства, чтобы посланные Морским царём
      преследователи не смогли их узнать и задержать.
    tags:
      - transformation
      - escape
      - disguise
      - pursuit
