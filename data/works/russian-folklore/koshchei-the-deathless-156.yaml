id: koshchei-the-deathless-156
title: "Кощей Бессмертный"
original_title: "Кощей Бессмертный"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — Кощей Бессмертный, № 156"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Кощей_Бессмертный"
  note: >
    Использован только вариант № 156 на общей странице вариантов № 156—158
    по изданию "Народные русские сказки А. Н. Афанасьева" (М.: Наука,
    1984—1985), опубликованному в Викитеке. Детали вариантов № 157—158
    и позднейших пересказов не смешиваются.

entities:
  - id: koshchei-the-deathless
    name: "Кощей Бессмертный"
    type: character
    description: >
      Сверхъестественный похититель и противник Ивана-царевича, чья жизнь
      вынесена из тела и спрятана в цепочке тайников. Пока яйцо с его смертью
      цело, Кощей неуязвим; сжатие яйца причиняет ему боль, а разрушение
      непосредственно убивает его.
    tags:
      - koshchei
      - external-soul
      - immortal
      - antagonist

  - id: koshcheis-death-egg
    name: "Яйцо со смертью Кощея"
    type: artifact
    description: >
      Яйцо, в котором заключена смерть Кощея и с которым напрямую связана
      его жизненная сила. Когда Иван-царевич сжимает яйцо, Кощею становится
      плохо; после того как яйцо раздавлено, Кощей немедленно умирает.
    tags:
      - egg
      - external-soul
      - life-link
      - koshchei

  - id: sea-bridge-pike
    name: "Щука-мост"
    type: animal
    description: >
      Чудесная щука, дважды помогающая Ивану-царевичу пересечь море,
      ложась поперёк него как мост. Она также возвращает яйцо со смертью
      Кощея после того, как герой роняет его в глубокую воду.
    tags:
      - pike
      - magical-helper
      - bridge
      - sea

  - id: summoning-ring
    name: "Перстень, вызывающий двенадцать молодцев"
    type: artifact
    description: >
      Обручальный перстень царской дочери, который при перебрасывании
      с руки на руку вызывает двенадцать одинаковых молодцев. По приказу
      владельца они мгновенно выполняют сверхъестественно трудные действия.
    tags:
      - ring
      - summoning
      - magical-servants
      - command

  - id: twelve-ring-servants
    name: "Двенадцать молодцев из перстня"
    type: character
    description: >
      Группа сверхъестественных слуг, появляющихся из магического перстня.
      Они разговаривают с владельцем и по его приказу мгновенно переносят
      Ивана-царевича с недоступной горы.
    tags:
      - summoned-servants
      - twelve
      - teleportation
      - ring
