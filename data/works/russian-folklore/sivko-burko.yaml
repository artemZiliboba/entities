id: sivko-burko
title: "Сивко-бурко"
original_title: "Сивко-бурко"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — Сивко-бурко"
  url: "https://ru.wikisource.org/wiki/Сивко-бурко_(Афанасьев)"
  note: >
    Текст из собрания А. Н. Афанасьева, опубликованный в Викитеке.
    Запись следует именно этой редакции и не смешивает детали других
    вариантов, позднейших обработок и экранизаций.

entities:
  - id: sivko-burko
    name: "Сивко-бурко"
    type: animal
    description: >
      Волшебный конь, являющийся Ивану по особому призыву. Он обладает
      сверхъестественной силой и прыжком, позволяющим герою достигнуть
      царевны на высокой башне, и служит главным чудесным помощником Ивана.
    tags:
      - magical-horse
      - helper
      - supernatural-strength
      - leap

  - id: horse-ear-transformation
    name: "Преображение через ухо Сивка-бурка"
    type: spell
    description: >
      Чудесное преображение Ивана, происходящее при взаимодействии с
      волшебным конём: герой входит в одно ухо Сивка-бурка и выходит из
      другого изменившимся, после чего выглядит как прекрасный молодец.
    tags:
      - transformation
      - magical-horse
      - beauty
      - hero

  - id: sivko-burko-summoning
    name: "Призыв Сивка-бурка"
    type: spell
    description: >
      Особая словесная формула, которой Иван вызывает волшебного коня.
      После произнесения призыва Сивко-бурко появляется перед героем и
      становится доступен ему для чудесной помощи.
    tags:
      - summoning
      - magical-horse
      - incantation
      - helper
