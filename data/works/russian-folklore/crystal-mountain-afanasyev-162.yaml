id: crystal-mountain-afanasyev-162
title: "Хрустальная гора"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Хрустальная гора, № 162"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Хрустальная_гора"
  note: "Самостоятельный вариант № 162 из издания: Народные русские сказки А. Н. Афанасьева, М.: Наука, 1984–1985. Другие сказки и редакции не использованы."
entities:
  - id: talking-falcon
    name: "Говорящий сокол"
    type: animal
    description: >
      Сокол, выступающий от имени зверей, птиц и прочих животных при разделе
      павшей лошади. За справедливое решение он дарует Ивану-царевичу
      возможность по желанию обращаться соколом и муравьём.
    tags:
      - talking-animal
      - magical-helper
      - transformation
  - id: ivan-tsarevich-shapeshifter
    name: "Иван-царевич, обращающийся соколом и муравьём"
    type: character
    description: >
      Младший царский сын получает от говорящего сокола дар превращения.
      В соколином облике он летает и побеждает многоглавых змеев, а в облике
      муравья проникает сквозь узкую трещину внутрь хрустальной горы.
    tags:
      - shapeshifting
      - hero
  - id: three-headed-serpent
    name: "Трёхглавый змей"
    type: creature
    description: >
      Летающий змей с тремя головами, прилетающий с озера и требующий
      у пастуха трёх коров. Иван-царевич в облике сокола побеждает его,
      срубив все три головы.
    tags:
      - serpent
      - multi-headed
  - id: six-headed-serpent
    name: "Шестиглавый змей"
    type: creature
    description: >
      Другой летающий змей с шестью головами требует у пастуха шесть коров.
      Иван-царевич превращается в сокола и побеждает его.
    tags:
      - serpent
      - multi-headed
  - id: twelve-headed-serpent
    name: "Двенадцатиглавый змей"
    type: creature
    description: >
      Змей с двенадцатью головами похищает царевну и заключает её
      в хрустальную гору. В его теле скрыта последовательность вложенных
      друг в друга предметов и животных, заканчивающаяся семечком,
      способным уничтожить гору.
    tags:
      - serpent
      - multi-headed
      - abduction
  - id: crystal-mountain
    name: "Хрустальная гора"
    type: location
    description: >
      Чудесная гора, втянувшая в себя большую часть чужого царства.
      Внутри неё заточена похищенная царевна. Гора тает, когда Иван-царевич
      подносит к ней зажжённое семечко, добытое из двенадцатиглавого змея.
    tags:
      - enchanted-location
      - imprisonment
  - id: mountain-melting-seed
    name: "Семечко, растапливающее хрустальную гору"
    type: artifact
    description: >
      Скрытое внутри яйца, утки, зайца и сундука семечко, находящееся
      в теле двенадцатиглавого змея. Иван-царевич добывает его,
      зажигает и подносит к хрустальной горе, после чего та быстро тает.
    tags:
      - magical-object
      - fire
