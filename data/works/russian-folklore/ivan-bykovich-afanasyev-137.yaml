id: ivan-bykovich-afanasyev-137
title: "Иван Быкович"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Иван Быкович, № 137, Народные русские сказки А. Н. Афанасьева"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Иван_Быкович"
  note: "Вариант № 137, издание М.: Наука, 1984—1985, по Викитеке; рассмотрен весь текст именно этого варианта."
entities:
  - id: golden-finned-ruff
    name: "Златопёрый ёрш"
    type: animal
    description: >
      Чудесная рыба из царского пруда: после её приготовления царица, кухарка и корова, выпившая помои, одновременно зачинают трёх необыкновенно сильных сыновей.
  - id: ivan-bykovich
    name: "Иван Быкович"
    type: character
    description: >
      Богатырь, родившийся от коровы после воздействия златопёрого ерша. Обладает нечеловеческой силой и по собственной воле превращается в воробья, чтобы подслушать замыслы врагов.
  - id: ivan-tsarevich
    name: "Иван-царевич"
    type: character
    description: >
      Один из трёх необыкновенно сильных братьев, рождённых после употребления чудесного ерша; способен обращаться с непосильной для обычного человека железной палкой.
  - id: cooks-son-ivan
    name: "Иван, кухаркин сын"
    type: character
    description: >
      Один из трёх чудесно рождённых братьев, наделённый сверхчеловеческой силой; вместе с Иваном-царевичем сопровождает Ивана Быковича.
  - id: turning-hut
    name: "Избушка на курячьих ножках"
    type: location
    description: >
      Лесное жилище на курячьих ножках и бараньих рожках, которое поворачивается по обращённой к нему просьбе путников.
  - id: baba-yaga
    name: "Баба-яга"
    type: character
    description: >
      Сверхъестественная хозяйка поворачивающейся избушки, встречающая братьев и предупреждающая о чудовищах у реки Смородины.
  - id: six-headed-chudo-yudo
    name: "Шестиглавое чудо-юдо"
    type: creature
    description: >
      Шестиглавое чудовище, охраняющее переправу через реку Смородину; первое из трёх противников, сражённых Иваном Быковичем.
  - id: nine-headed-chudo-yudo
    name: "Девятиглавое чудо-юдо"
    type: creature
    description: >
      Девятиглавое чудовище, выходящее к Калинову мосту во вторую ночь и обладающее громадной силой.
  - id: twelve-headed-chudo-yudo
    name: "Двенадцатиглавое чудо-юдо"
    type: creature
    description: >
      Самое сильное из трёх чудовищ у моста; огненным пальцем мгновенно приращивает отсечённые головы, пока Иван Быкович не отрубает этот палец.
  - id: twelve-winged-horse
    name: "Двенадцатикрылый конь"
    type: animal
    description: >
      Необыкновенный конь двенадцатиглавого чуда-юда, имеющий двенадцать крыльев, серебряную шерсть и золотые гриву и хвост.
  - id: blood-warning-towel
    name: "Кровоточащее полотенце"
    type: artifact
    description: >
      Белое полотенце, оставленное Иваном Быковичем как волшебный знак хода битвы: с него течёт кровь в миску, и переполнение миски означает необходимость срочной помощи.
  - id: old-witch
    name: "Старая ведьма"
    type: character
    description: >
      Мать жён чудовищ, способная менять облик и мгновенно перенести Ивана Быковича в подземелье, схватив его за руку.
  - id: apple-tree-wife
    name: "Младшая жена чуда-юда"
    type: character
    description: >
      Колдунья, превращающаяся в яблоню с золотыми и серебряными плодами; наводит голод, а сорвавший её яблоко должен погибнуть.
  - id: well-wife
    name: "Средняя жена чуда-юда"
    type: character
    description: >
      Колдунья, насылающая жажду и превращающаяся в колодец с золотой и серебряной чашами; прикоснувшегося к чаше она намеревается утопить.
  - id: golden-bed-wife
    name: "Старшая жена чуда-юда"
    type: character
    description: >
      Колдунья, насылающая сон и превращающаяся в золотую кровать, на которой уснувший должен сгореть.
  - id: giant-old-man
    name: "Старый старик, отец чудовищ"
    type: character
    description: >
      Подземный великан, отец чудовищ, чьи тяжёлые брови и ресницы двенадцать богатырей поднимают железными вилами; распоряжается чудесной дубинкой и кораблями.
  - id: ship-summoning-club
    name: "Дубинка для вызова кораблей"
    type: artifact
    description: >
      Дубинка, выданная стариком Ивану Быковичу: удары по дубу и приказ вызывают скрытые в нём корабли; герой выпускает целый флот.
  - id: ship-bearing-oak
    name: "Дуб с чудесными кораблями"
    type: plant
    description: >
      Дуб, из которого по ударам дубинки и приказу выходят корабли и лодки; в тексте служит вместилищем целого чудесного флота.
  - id: obeidailo
    name: "Объедайло"
    type: character
    description: >
      Чудесный спутник Ивана Быковича, поглощающий за один раз целые возы хлеба и справляющийся с огромным запасом еды.
  - id: opivailo
    name: "Опивайло"
    type: character
    description: >
      Чудесный спутник Ивана Быковича, выпивающий невероятные количества вина и пива вместе с бочками.
  - id: bath-freezer
    name: "Старичок, остужающий баню"
    type: character
    description: >
      Чудесный спутник, который одним дуновением и плевком превращает раскалённую баню в ледяную, оставляя снег по углам.
  - id: star-gazer
    name: "Старичок-звездочёт"
    type: character
    description: >
      Чудесный спутник, превращающийся в звезду, находящий на небе скрывшуюся царицу и возвращающий её на корабль.
  - id: ruff-swimmer
    name: "Старичок, обращающийся ершом"
    type: character
    description: >
      Чудесный спутник, превращающийся в ерша, преследующий царицу в облике щуки и вынуждающий её вернуться на корабль.
  - id: golden-haired-queen
    name: "Царица — золотые кудри"
    type: character
    description: >
      Царица, умеющая превращаться в звезду и в щуку, чтобы бежать от Ивана Быковича; позже помогает ему пройти испытание над пропастью.
  - id: feather-light-blessing
    name: "Пожелание лёгкости лебединого пуха"
    type: spell
    description: >
      Произнесённое царицей пожелание, после которого Иван Быкович проходит по жерди над ямой так легко, что она не прогибается.
