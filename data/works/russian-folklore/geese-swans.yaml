id: geese-swans
title: "Гуси-лебеди"
original_title: "Гуси-лебеди"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — Гуси-лебеди, № 113"
  url: "https://ru.wikisource.org/wiki/Народные_русские_сказки_(Афанасьев)/Гуси-лебеди"
  note: >
    Вариант № 113, записанный в Курской губернии; текст по изданию
    "Народные русские сказки А. Н. Афанасьева" (М.: Наука, 1984—1985),
    опубликованному в Викитеке. Другие варианты и позднейшие пересказы
    не смешиваются.

entities:
  - id: baba-yaga
    name: "Баба-яга"
    type: character
    description: >
      Сверхъестественная старуха, живущая в избушке на курьих ножках.
      В её доме находится похищенный мальчик, а гуси-лебеди связаны с её
      владением и преследуют девочку после освобождения брата.
    tags:
      - baba-yaga
      - witch
      - antagonist
      - forest

  - id: geese-swans
    name: "Гуси-лебеди"
    type: animal
    description: >
      Стая необычных птиц, известная похищением маленьких детей. Они уносят
      брата героини к жилищу Бабы-яги, а затем организованно преследуют детей
      во время побега.
    tags:
      - geese-swans
      - child-abduction
      - pursuit
      - supernatural-animal

  - id: chicken-legged-hut
    name: "Избушка на курьих ножках"
    type: location
    description: >
      Сверхъестественное жилище Бабы-яги, которое стоит на курьих ножках
      и поворачивается. Внутри девочка находит похищенного брата.
    tags:
      - hut
      - chicken-legs
      - baba-yaga
      - moving-location

  - id: talking-oven
    name: "Говорящая печь"
    type: artifact
    description: >
      Печь, которая разговаривает с девочкой, предлагает ей ржаной пирожок
      в обмен на помощь, а во время погони прячет её с братом внутри и тем
      самым спасает от гусей-лебедей.
    tags:
      - talking-object
      - oven
      - helper
      - concealment

  - id: talking-apple-tree
    name: "Говорящая яблоня"
    type: plant
    description: >
      Яблоня, способная разговаривать и договариваться с героиней. После того
      как девочка съедает её лесное яблоко, дерево закрывает детей ветвями
      и листьями от пролетающих гусей-лебедей.
    tags:
      - talking-plant
      - apple-tree
      - helper
      - concealment

  - id: milk-river-kissel-banks
    name: "Молочная речка с кисельными берегами"
    type: location
    description: >
      Чудесная река из молока с кисельными берегами, которая разговаривает
      с девочкой. После принятия её угощения река прячет детей под берегом
      и защищает их от погони.
    tags:
      - magical-river
      - milk
      - kissel
      - helper
