id: at-the-pikes-command
title: "По щучьему веленью"
original_title: "По щучьему веленью"
kind: folktale
tradition:
  - russian-folklore
collection: "Народные русские сказки А. Н. Афанасьева"
source:
  title: "Народные русские сказки А. Н. Афанасьева — По щучьему веленью"
  url: "https://ru.wikisource.org/wiki/По_щучьему_веленью_(Афанасьев)"
  note: >
    Текст из собрания А. Н. Афанасьева, опубликованный в Викитеке.
    Запись следует именно этой редакции и не смешивает детали других
    вариантов, литературных обработок и экранизаций.

entities:
  - id: magic-pike
    name: "Волшебная щука"
    type: animal
    description: >
      Пойманная Емелей щука обладает сверхъестественной силой и в обмен
      на освобождение сообщает ему формулу, исполняющую его желания.
      Дарованная ею сила приводит в движение предметы и осуществляет
      приказания героя без обычного физического действия.
    tags:
      - pike
      - wish-granting
      - magical-helper
      - command

  - id: pikes-command
    name: "Щучье веленье"
    type: spell
    description: >
      Магическая словесная формула, полученная Емелей от щуки. После её
      произнесения и формулировки желания неодушевлённые предметы начинают
      самостоятельно выполнять приказ, а другие желаемые события
      осуществляются сверхъестественным образом.
    tags:
      - spell
      - command
      - wish
      - animation

  - id: self-moving-buckets
    name: "Самоходные вёдра"
    type: artifact
    description: >
      Вёдра с водой, которые по щучьему веленью сами отправляются от проруби
      домой, поднимаются в избу и становятся на место, не расплескав воду.
      Это первое наглядное проявление подаренной Емеле магической команды.
    tags:
      - buckets
      - self-moving
      - animated-object
      - water

  - id: self-cutting-axe
    name: "Саморубящий топор"
    type: artifact
    description: >
      Топор, который после волшебного приказа самостоятельно рубит дрова,
      пока Емеля не приказывает ему прекратить работу.
    tags:
      - axe
      - self-acting
      - animated-object
      - woodcutting

  - id: self-moving-sledge
    name: "Самоходные сани"
    type: artifact
    description: >
      Сани, которые по щучьему веленью едут без запряжённой лошади и везут
      Емелю туда, куда он приказывает.
    tags:
      - sledge
      - self-moving
      - transport
      - animated-object

  - id: self-moving-stove
    name: "Самоходная печь"
    type: artifact
    description: >
      Домашняя печь, которая по волшебному приказу Емели покидает избу и
      самостоятельно везёт его к царю, превращаясь в сверхъестественное
      средство передвижения.
    tags:
      - stove
      - self-moving
      - transport
      - animated-object

  - id: wish-built-palace
    name: "Дворец, созданный щучьим веленьем"
    type: location
    description: >
      Великолепный дворец, возникающий по желанию Емели благодаря полученной
      от щуки силе. Он появляется сверхъестественно и становится жилищем
      Емели и царевны после их спасения.
    tags:
      - palace
      - magical-creation
      - wish
      - dwelling

  - id: emelyas-transformation
    name: "Преображение Емели"
    type: spell
    description: >
      Сверхъестественное изменение внешности Емели по его собственному
      желанию через щучье веленье: герой становится таким красавцем, что
      окружающие не узнают прежнего простака.
    tags:
      - transformation
      - beauty
      - wish
      - emelya
