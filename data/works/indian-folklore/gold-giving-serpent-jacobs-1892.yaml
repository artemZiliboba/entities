  - id: gold-giving-serpent
    name: "Змея, дарующая золото"
    type: creature
    description: >-
      Большая кобра, живущая в муравейнике на поле бедного брахмана Харида́тты. Брахман принимает её за божество-хранителя поля и начинает ежедневно оставлять у норы чашу молока; каждое утро в чаше оказывается золотой динар. Когда сын брахмана пытается убить змею палкой ради предполагаемого клада, она смертельно кусает его. Позже змея разговаривает с отцом погибшего, отказывается возобновлять дружбу и на прощание дарит драгоценную жемчужину. Сказка не подтверждает, что змея действительно является божеством, а не сверхъестественным животным, способным говорить и приносить золото.
