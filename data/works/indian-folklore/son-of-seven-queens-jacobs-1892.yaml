id: son-of-seven-queens-jacobs-1892
title: "Сын семи цариц"
original_title: "The Son of Seven Queens"
kind: folktale
tradition:
  - indian-folklore
collection: "Indian Fairy Tales (Joseph Jacobs, 1892), сказка XVI, с. 115–126"
source:
  title: "The Son of Seven Queens — Indian Fairy Tales, Joseph Jacobs, XVI"
  url: "https://www.gutenberg.org/cache/epub/7128/pg7128-images.html"
  note: >-
    Прочитан полный текст сказки XVI, с. 115–126, в Indian Fairy Tales
    Джозефа Джейкобса (1892). В примечании редактора указан источник
    Steel and Temple, Wideawake Stories, с. 98–110, ранее опубликованный
    в Indian Antiquary, том X. За основу взята именно редакция Джейкобса;
    параллельные рассказы о семи матерях, дополнительные версии и
    комментарии не включались.
entities:
  - id: white-hind-witch
    name: "Белая лань-колдунья"
    type: character
    description: >-
      Колдунья, появляющаяся перед царём в облике белой лани
      с золотыми рогами и серебряными копытами. В горной хижине
      она принимает облик прекрасной девушки и чарами
      подчиняет себе царя, вынуждая отнять глаза у семи жён.
      Став новой царицей, распознаёт их выросшего сына
      колдовским способом и трижды отправляет его к своей
      матери с письменным приказом убить посланца.
      В конце сказки её чары над царём рассеиваются.
    tags:
      - shapeshifting
      - witchcraft
      - enchantment
  - id: white-hind-witch-mother
    name: "Старая колдунья — мать белой лани"
    type: character
    description: >-
      Старуха, живущая в горной хижине, мать белой
      лани-колдуньи. Сначала она хранит ожерелье
      из глаз семи ослеплённых цариц, затем
      направляет юношу к чудесной корове и полю
      необыкновенного риса. Когда мальчик обращается
      в пепел из-за нарушения запрета оглядываться,
      старуха находит останки колдовским искусством,
      смешивает их с водой, придаёт человеческий облик,
      добавляет каплю собственной крови и своим
      дыханием возвращает его к жизни.
    tags:
      - witchcraft
      - resurrection
  - id: demon-king-jogi
    name: "Джоги — царь демонов"
    type: creature
    description: >-
      Властитель демонов, владеющий белой чудесной
      коровой. Он безостановочно доит её возле
      молочного пруда. Когда сын семи цариц
      объявляет, что царь Индра якобы требует
      кожу Джоги для барабана, испуганный владыка
      демонов отдаёт корову, лишь бы сохранить
      жизнь. Его сверхъестественное положение
      прямо названо в тексте, но самостоятельных
      заклинаний он не произносит.
    tags:
      - demon
      - supernatural-ruler
  - id: demon-guardians-seven-queens
    name: "Демоны — стражи чудесных владений"
    type: creature
    description: >-
      Огромные полчища демонов, охраняющие
      сверхъестественные сокровища. Восемнадцать
      тысяч стражей окружают молочно-белый пруд,
      где живёт чудесная корова Джоги; восемнадцать
      миллионов стерегут поле, на котором растёт
      рис миллионократного урожая. Юноша проходит
      мимо первых, не глядя по сторонам,
      и добирается до риса среди вторых,
      но погибает, когда оборачивается на голоса.
    tags:
      - demon
      - guardian
  - id: inexhaustible-milk-cow
    name: "Чудесная белая корова Джоги"
    type: animal
    description: >-
      Белая корова, дающая неиссякающее количество
      молока. Джоги доит её день и ночь, и молоко
      наполняет целый водоём. После того как
      сын семи цариц получает корову, его матери
      делают из её молока творог и сыворотку,
      продают излишки и становятся состоятельными,
      так и не сумев израсходовать весь удой.
    tags:
      - inexhaustible
      - magical-animal
  - id: millionfold-rice
    name: "Рис миллионократного урожая"
    type: plant
    description: >-
      Чудесный рис, который созревает за одну ночь
      и приносит огромный урожай. Поле этого
      риса стерегут миллионы демонов. Старуха
      велит юноше сорвать самый высокий колос
      в центре поля и не оборачиваться.
      Услышав за спиной множество ласковых голосов,
      он нарушает запрет и превращается в пепел.
      После воскрешения юноша доставляет рис
      своим матерям, и те становятся очень богаты.
    tags:
      - magical-crop
      - rapid-growth
      - enchanted-field
