id: demon-with-the-matted-hair-jacobs-1892
title: "Демон со спутанными волосами"
original_title: "The Demon with the Matted Hair"
kind: folktale
tradition:
  - indian-folklore
collection: "Indian Fairy Tales"
author: "Джозеф Джейкобс (редактор); У. Х. Д. Рауз (перевод)"
source:
  title: "Joseph Jacobs, Indian Fairy Tales (1892), no. XXV: The Demon with the Matted Hair, pp. 194–198"
  url: "https://www.gutenberg.org/cache/epub/7128/pg7128-images.html"
  note: "Полностью рассмотрена сказка XXV в издании Джозефа Джейкобса 1892 года. В примечаниях редактора источник определён как Pancavudha-Jātaka, № 55, в переводе У. Х. Д. Рауза. Сравнительные параллели с африканским и американским фольклором в текст сказки не переносились."
entities:
  - id: matted-hair-demon
    name: "Демон со спутанными волосами"
    type: creature
    description: >-
      Чудовище, обитающее в лесу и убивающее путников. Способно
      становиться ростом с пальму; его густые спутанные волосы
      удерживают стрелы, меч, копьё и палицу царевича, а затем
      и все его конечности и голову. Удивлённый бесстрашием
      пленника, демон отпускает его и после наставления
      отказывается от прежних злодеяний.
    tags:
      - demon
      - giant
      - supernatural-hair
  - id: prince-five-weapons
    name: "Царевич Пять Оружий"
    type: character
    description: >-
      Царевич, в котором в этом рассказе воплощён бодхисаттва.
      Получает пять видов оружия, вступает в схватку с лесным
      демоном и остаётся бесстрашным даже после того, как
      застревает в его волосах. Побеждает не чудесным оружием,
      а находчивостью и нравственным наставлением.
      В заключении рассказа Учитель отождествляет царевича
      с самим собой в прежнем рождении.
    tags:
      - bodhisattva
      - past-life
