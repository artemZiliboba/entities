id: punchkin
title: "Панчкин"
original_title: "Punchkin"
kind: folktale
tradition:
  - indian-folklore
collection: "Old Deccan Days"
author: "Мэри Фрер"
source:
  title: "Old Deccan Days — Punchkin"
  url: "https://www.gutenberg.org/ebooks/36696"
  note: >
    Текст из сборника Mary Frere, Old Deccan Days, в открытом издании
    Project Gutenberg. Для проверки эпизодов также использована версия сказки
    в Indian Fairy Tales Джозефа Джейкобса, который прямо указывает Old Deccan
    Days своим источником. Детали иных вариантов не смешиваются с записью.

entities:
  - id: punchkin-magician
    name: "Панчкин"
    type: character
    description: >
      Могущественный колдун, способный превращать людей и возвращать им прежний
      облик. Его собственная жизнь сверхъестественно вынесена из тела и связана
      с зелёным попугаем, спрятанным далеко от дворца.
    tags:
      - magician
      - antagonist
      - transformation
      - external-soul

  - id: punchkin-parrot
    name: "Попугай с жизнью Панчкина"
    type: animal
    description: >
      Маленький зелёный попугай, от жизни которого непосредственно зависит жизнь
      Панчкина. Повреждения крыльев и ног птицы одновременно лишают колдуна рук
      и ног, а смерть попугая приводит к смерти Панчкина.
    tags:
      - external-soul
      - vulnerability
      - hidden-life

  - id: punchkin-wand
    name: "Волшебная палочка Панчкина"
    type: artifact
    description: >
      Магический предмет, взмахом которого Панчкин восстанавливает человеческий
      облик превращённых им людей и возвращает множество пленников из состояния
      камней, скал и деревьев.
    tags:
      - wand
      - transformation
      - restoration

  - id: genii-guardians
    name: "Джинны-стражи"
    type: creature
    description: >
      Многие тысячи сверхъестественных стражей, поставленных вокруг пальм,
      скрывающих попугая с жизнью Панчкина. Они должны убивать каждого, кто
      приблизится к тайнику.
    tags:
      - guardian
      - genie
      - hidden-object

  - id: balna-dog-transformation
    name: "Превращение Балны в чёрную собаку"
    type: spell
    description: >
      Чары Панчкина, которыми он превращает отказавшую ему принцессу Балну в
      маленькую чёрную собаку и уводит её из дворца против воли.
    tags:
      - transformation
      - curse
      - dog

  - id: petrified-prisoners
    name: "Пленники, превращённые в камни и деревья"
    type: phenomenon
    description: >
      Колдовское состояние множества пленников Панчкина, включая царских сыновей:
      люди существуют как камни, скалы и деревья, пока колдун не возвращает им
      человеческий облик.
    tags:
      - petrification
      - transformation
      - imprisonment

  - id: parrot-hiding-place
    name: "Тайник жизненного попугая"
    type: location
    description: >
      Труднодоступное место в далёких густых джунглях: круг пальм, внутри которого
      стоят шесть сосудов с водой, а под нижним спрятана клетка с попугаем,
      содержащим жизнь Панчкина. Тайник окружён тысячами джиннов.
    tags:
      - hidden-place
      - external-soul
      - jungle

  - id: helpful-eaglets
    name: "Орлята-помощники"
    type: animal
    description: >
      Два молодых орла, спасённых царевичем от змеи. Они скрещивают крылья,
      позволяют герою сесть на них и переносят его через огромные расстояния
      прямо к тайнику жизненного попугая.
    tags:
      - animal-helper
      - flight
      - gratitude
