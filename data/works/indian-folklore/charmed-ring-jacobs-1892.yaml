id: charmed-ring-jacobs-1892
title: "Волшебное кольцо"
original_title: "The Charmed Ring"
kind: folktale
tradition:
  - indian-folklore
collection: "Indian Fairy Tales, рассказ XII"
author: "Джозеф Джейкобс (составитель и редактор)"
source:
  title: "Joseph Jacobs, Indian Fairy Tales (1892), No. XII, The Charmed Ring, pp. 90–99"
  url: "https://en.wikisource.org/wiki/Indian_Fairy_Tales_(Jacobs)/The_Charmed_Ring"
  note: "Полный текст конкретного рассказа XII из издания 1892 года; в примечаниях Джейкобс указывает Folk-Tales of Kashmir Дж. Х. Ноулза, стр. 20–28. События иных вариантов сюжета о волшебном кольце не смешиваются."
entities:
  - id: charmed-ring
    name: "Волшебное кольцо раджи Индраши"
    type: artifact
    description: >-
      Кольцо с правой руки раджи Индраши, которое по обращённой к нему просьбе создаёт обставленный дом и прекрасную принцессу. Позднее с его помощью похититель переносит дом и принцессу в дворцовый сад, а законный владелец возвращает их. После кражи кольца юноша не может пользоваться созданным им домом, пока помощники не возвращают предмет.
  - id: inexhaustible-pot-and-spoon
    name: "Волшебные горшок и ложка"
    type: artifact
    description: >-
      Пара чудесных предметов раджи Индраши, переданная спасителю его сына вместе с кольцом. Если обратиться к горшку и ложке, они доставляют разнообразные изысканные блюда. Рассказ описывает их как совместно действующий магический комплект, не разделяя функции двух предметов.
  - id: snake-prince-indrasha-son
    name: "Змеиный царевич"
    type: creature
    description: >-
      Говорящая змея, сын раджи Индраши. Купеческий сын спасает её от людей, собиравшихся убить пойманное животное. Змея открывает своё происхождение, проводит спасителя через священный источник в царство отца и советует просить в награду волшебное кольцо, горшок и ложку. Текст не описывает её превращения в человека.
  - id: raja-indrasha
    name: "Раджа Индраша"
    type: character
    description: >-
      Правитель подводного или подземного царства, доступного через священный источник у подножия горы, и отец говорящего змеиного царевича. Благодарит юношу за спасение сына и отдаёт собственное чудесное кольцо, а также горшок и ложку, производящие еду. Собственных заклинаний раджа в рассказе не произносит; его сверхъестественный статус раскрывается через владения, родство со змеёй и волшебные дары.
  - id: ogress-bee-shapeshifter
    name: "Людоедка, принимающая облик пчелы"
    type: creature
    description: >-
      Тётка царя, людоедка, которая обещает добыть для царского сына женщину с золотыми волосами. Она превращается в пчелу, находит принцессу, затем принимает облик старухи и выдаёт себя за её родственницу. Добившись доверия, похищает волшебное кольцо, снова оборачивается пчелой и уносит его ко двору; позднее прячет кольцо в желудке. Спящую людоедку заставляет откашлять кольцо крыса, забравшаяся ей в горло.
  - id: sacred-spring-to-indrasha-realm
    name: "Священный источник — вход в царство Индраши"
    type: location
    description: >-
      Источник у подножия горы, через который говорящая змея ведёт своего спасителя в владения раджи Индраши. Герой ныряет в воду и оказывается в ином царстве, а по возвращении выходит обратно к ожидающим собаке и кошке. Источник служит сверхъестественным проходом, хотя не назван самостоятельным разумным существом.
  - id: nadhar-bone-breaking-bird
    name: "Птица надхар"
    type: creature
    description: >-
      Необычная птица, о которой рассказчик сообщает, что её взгляд способен ломать рыбьи кости. Кошка ловит надхара, заманив его к туше ягнёнка, и заставляет помочь вернуть кольцо, проглоченное рыбой. Птица обращается к царю рыб, который разыскивает пропажу. Способность взгляда названа прямо, но в самом поиске кольца не применяется.
