id: the-light-princess
title: "Лёгкая принцесса"
original_title: "The Light Princess"
kind: story
tradition:
  - scottish-literature
author: "George MacDonald"
collection: "Dealings with the Fairies"
source:
  title: "Dealings with the Fairies (1867) — The Light Princess"
  url: "https://en.wikisource.org/wiki/Dealings_with_the_Fairies/The_Light_Princess"
  note: >
    Текст сказки Джорджа Макдональда в сборнике Dealings with the Fairies
    (1867), опубликованный на Wikisource. Запись следует этой редакции и не
    смешивает детали позднейших адаптаций.

entities:
  - id: princess-makemnoit
    name: "Принцесса"
    type: character
    description: >
      Принцесса с рождения находится под сверхъестественным воздействием,
      лишившим её земного притяжения и обычной душевной тяжести. Она свободно
      парит и легко уносится ветром, но в воде временно обретает нормальный вес;
      после снятия чар возвращается к обычному состоянию.
    tags:
      - levitation
      - curse
      - altered-gravity

  - id: princess-makemnoit-witch
    name: "Принцесса Макемнойт"
    type: character
    description: >
      Злая сестра короля, прямо представленная как ведьма. Оскорблённая тем,
      что её не пригласили на крестины, она накладывает на младенца заклятие,
      лишающее принцессу тяжести, а позднее магически вмешивается в судьбу озера.
    tags:
      - witch
      - curse
      - antagonist

  - id: gravity-curse
    name: "Заклятие невесомости"
    type: spell
    description: >
      Проклятие Макемнойт, из-за которого принцесса теряет физическую тяжесть:
      её тело перестаёт подчиняться обычному притяжению, она может парить и
      улетать от слабого толчка или ветра. Заклятие также связано с её
      неспособностью воспринимать происходящее с обычной серьёзностью.
    tags:
      - curse
      - gravity
      - levitation

  - id: enchanted-lake
    name: "Озеро принцессы"
    type: location
    description: >
      Озеро, в котором действие проклятия меняется: погружённая в воду
      принцесса вновь ощущает вес и способна двигаться как обычный человек.
      Поэтому озеро становится единственным местом, где она чувствует себя
      естественно, и ключевым пространством противодействия чарам.
    tags:
      - enchanted-location
      - water
      - gravity

  - id: lake-draining-magic
    name: "Магическое осушение озера"
    type: phenomenon
    description: >
      Сверхъестественное воздействие Макемнойт на озеро: вода начинает уходить
      через скрытый канал и продолжает убывать вопреки попыткам людей остановить
      процесс, пока не выполняется условие, позволяющее восстановить озеро.
    tags:
      - water
      - draining
      - witchcraft

  - id: lake-restoration-condition
    name: "Условие восстановления озера"
    type: phenomenon
    description: >
      Волшебное условие, согласно которому озеро может наполниться вновь лишь
      после добровольной жертвы человека. Принц соглашается занять отверстие,
      через которое уходит вода, и по мере его погружения уровень озера
      восстанавливается.
    tags:
      - sacrifice
      - restoration
      - magical-condition

  - id: curse-breaking-tears
    name: "Слёзы, снимающие чары"
    type: substance
    description: >
      Первые настоящие слёзы принцессы знаменуют разрушение её заклятия:
      после пережитого страха и горя она плачет, вновь обретает тяжесть и
      способность к обычным человеческим чувствам.
    tags:
      - tears
      - curse-breaking
      - restoration
