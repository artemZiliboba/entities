id: the-princess-and-the-goblin
title: "Принцесса и гоблин"
original_title: "The Princess and the Goblin"
kind: novel
tradition:
  - scottish-literature
author: "George MacDonald"
source:
  title: "The Princess and the Goblin (1872)"
  url: "https://www.gutenberg.org/ebooks/708"
  note: >
    Полный английский текст романа Джорджа Макдональда The Princess and the
    Goblin (1872), Project Gutenberg eBook #708. Запись следует этому тексту и
    не смешивает детали продолжения The Princess and Curdie или адаптаций.

entities:
  - id: goblins
    name: "Гоблины"
    type: creature
    description: >
      Подземный народ, изменившийся за поколения жизни под горами. Гоблины
      разумны, организованы и враждебны людям; у них необычная анатомия ног,
      а их уязвимость к ритмическим стихам и пению неоднократно используется
      Кёрди для защиты.
    tags:
      - goblin
      - underground
      - supernatural-folk

  - id: goblin-animals
    name: "Животные гоблинов"
    type: creature
    description: >
      Странные домашние и сторожевые существа подземного народа, описанные как
      искажённые сочетания признаков разных животных. Они сопровождают гоблинов,
      преследуют людей и образуют отдельную сверхъестественную фауну пещер.
    tags:
      - hybrid-creature
      - underground
      - goblin

  - id: great-great-grandmother
    name: "Прабабушка Ирэн"
    type: character
    description: >
      Таинственная предок-покровительница принцессы Ирэн, появляющаяся в
      верхней комнате башни и доступная не всем одинаково. Она обладает
      сверхъестественным знанием, прядёт особую нить, направляет Ирэн и
      вмешивается в события, защищая девочку и Кёрди.
    tags:
      - guardian
      - supernatural
      - guidance

  - id: grandmothers-fire
    name: "Огонь прабабушки"
    type: phenomenon
    description: >
      Необычный огонь в комнате прабабушки, связанный с её присутствием и
      видимый не каждому. Его свет и сияние сопровождают сверхъестественные
      проявления покровительницы и помогают Ирэн узнавать её присутствие.
    tags:
      - magical-fire
      - light
      - guardian

  - id: grandmothers-thread
    name: "Нить прабабушки"
    type: artifact
    description: >
      Почти невидимая волшебная нить, соединённая с кольцом Ирэн и клубком
      прабабушки. Она натягивается и ведёт девочку по безопасному либо
      необходимому пути, в том числе через гору к пленённому Кёрди, а затем
      выводит обоих наружу.
    tags:
      - thread
      - guidance
      - rescue

  - id: opal-ring
    name: "Опаловое кольцо Ирэн"
    type: artifact
    description: >
      Кольцо, подаренное прабабушкой Ирэн и служащее материальным якорем
      волшебной нити. Нить закреплена на кольце и становится доступной Ирэн,
      когда ей требуется сверхъестественное руководство.
    tags:
      - ring
      - magical-link
      - guidance

  - id: grandmothers-bath
    name: "Ванна прабабушки"
    type: substance
    description: >
      Необычная вода, в которой прабабушка купает Ирэн. Купание сопровождается
      сверхъестественным переживанием света и покоя и восстанавливает девочку
      после пережитого страха.
    tags:
      - magical-water
      - restoration
      - protection

  - id: rhyming-goblin-repellent
    name: "Рифмы против гоблинов"
    type: spell
    description: >
      Ритмические стихи и песни, которыми Кёрди отпугивает гоблинов. Текст
      неоднократно показывает, что гоблины не выносят стихотворного ритма:
      рифмы вызывают у них страх и заставляют отступать.
    tags:
      - rhyme
      - repellent
      - goblin

  - id: goblin-foot-vulnerability
    name: "Уязвимость ног гоблинов"
    type: phenomenon
    description: >
      Сверхъестественная особенность гоблинов: их головы чрезвычайно тверды,
      тогда как ступни остаются особенно мягкими и чувствительными. Кёрди
      обнаруживает эту закономерность и использует её как устойчивую слабость
      подземного народа.
    tags:
      - vulnerability
      - goblin
      - supernatural-body
