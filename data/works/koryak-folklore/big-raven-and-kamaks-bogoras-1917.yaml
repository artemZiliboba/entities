id: big-raven-and-kamaks-bogoras-1917
title: "Большой Ворон и камаки"
original_title: "Big-Raven and the Kamaks"
kind: folktale
tradition:
  - koryak-folklore
collection: "Koryak Texts, рассказ № 5"
source:
  title: "Waldemar Bogoras, Koryak Texts (1917), No. 5, Big-Raven and the Kamaks, pp. 42–43"
  url: "https://sacred-texts.com/asia/kort/kort09.htm"
  note: "Конкретный корякский текст № 5 из публикации В. Г. Богораза 1917 года, с английским переводом и корякским оригиналом. Рассказ прочитан целиком; не смешивать с рассказами № 4 и № 13, где также появляются камаки."
entities:
  - id: big-raven-quyqinn-aqu
    name: "Большой Ворон (Куйкынняку)"
    type: character
    description: >-
      В этом рассказе Большой Ворон скатывается с высокой горы прямо ко входу в жилище камаков. Маленькие камаки принимают его за человеческую добычу и съедают по частям, но он остаётся жив и возвращается домой: рассказ прямо объясняет это тем, что он шаман. Поев приготовленного женой супа, он проглатывает большой каменный молот, снова приходит к камакам, извергает содержимое желудка через дымовое отверстие их дома и убивает главного камака молотом. Не следует переносить сюда космогонические деяния Ворона из других сюжетов.
  - id: kamaks
    name: "Камаки"
    type: creature
    description: >-
      Злые духи, обитающие в собственном жилище. Маленькие камаки встречают скатившегося с горы Большого Ворона как человеческую добычу, вносят его внутрь и поедают тело сустав за суставом, но не могут окончательно уничтожить шамана. Позже Ворон наполняет их дом извергнутым содержимым желудка, вынуждая их карабкаться вверх. В примечании к тексту Богораз поясняет слово «камак» как злого духа; в рассказе их индивидуальные имена не названы.
  - id: chief-kamak
    name: "Большой камак"
    type: creature
    description: >-
      Крупный камак, который во время ответного нападения Большого Ворона стоит посреди жилища духов, тогда как остальные пытаются подняться выше. Большой Ворон поражает его большим каменным молотом и убивает. В тексте не сообщается, что этот камак является правителем или обладает особыми способностями сверх принадлежности к камакам.
