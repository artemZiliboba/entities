id: big-raven-and-the-mice-bogoras-1917
title: "Большой Ворон и мыши"
original_title: "Big-Raven and the Mice"
kind: folktale
tradition:
  - koryak-folklore
collection: "Koryak Texts, рассказ № 2"
source:
  title: "Waldemar Bogoras, Koryak Texts (1917), No. 2, Big-Raven and the Mice, pp. 23–32"
  url: "https://home.snafu.de/duerr/PDF_Doku/Bogoras1917.pdf"
  note: "Один конкретный корякский текст № 2 в публикации В. Г. Богораза 1917 года, английский перевод с корякским оригиналом. Полный сюжет прочитан от находки нерпы мышами до последнего обмана Большого Ворона у реки. Не смешивать с отдельным рассказом № 3 «The Mouse-Girls» и другими историями о Большом Вороне."
entities:
  - id: big-raven-quyqinn-aqu
    name: "Большой Ворон (Куйкынняку)"
    type: character
    description: >-
      Главный персонаж рассказа, в корякском тексте Quyqinn'aqu. Узнав о найденной мышами молодой нерпе, приходит к мышиным девушкам, требует искать у него вшей и резким встряхиванием головы разбрасывает их в разные стороны, после чего забирает нерпу домой. Позднее мыши похищают приготовленное мясо с помощью шаманского пучка травы и неоднократно обманывают Ворона. В финале, увидев собственное раскрашенное отражение в воде, он принимает его за женщину и бросается в реку. В этом рассказе его поведение одновременно человеческое и звериное; способности творить мир здесь не описаны.
  - id: mouse-women
    name: "Мышиные девушки"
    type: creature
    description: >-
      Группа мышиных персонажей с человеческими чертами: они говорят, танцуют, пользуются одеждой, посудой и шаманскими приёмами. Рассказ не утверждает, что они превратились из животных в людей. Младшая из них, прозванная Лысой, находит молодую нерпу, которую забирает Большой Ворон. Под руководством матери мыши с помощью заговорённого пучка травы заставляют Ворона отложить трапезу, затем возвращают мясо и устраивают ему ряд жестоких розыгрышей. Младшая мышь выделяется в эпизодах, но в тексте остаётся участницей той же семьи.
  - id: mouse-mother
    name: "Мать мышиных девушек"
    type: creature
    description: >-
      Говорящая мышь-мать, распоряжающаяся действиями дочерей. После похищения Большим Вороном нерпы велит дочерям наблюдать за его домом и подготовить шаманский пучок травы, который изменяет его намерение съесть приготовленное мясо. Её роль в рассказе связана с хитростью и применением магического средства; отдельного собственного превращения или заклинания ей не приписано.
  - id: enchanted-grass-bundle
    name: "Заговорённый пучок травы"
    type: artifact
    description: >-
      Небольшой пучок травы, над которым заранее совершено магическое действие. По распоряжению матери мышиных девушек его бросают через дымовое отверстие в жилище Большого Ворона. Сразу после этого Ворон предлагает жене Мити отложить поедание приготовленной нерпы до следующего дня, что даёт мышам время забрать мясо. Текст упоминает также поиски маленькой шаманской палочки, но не сообщает, что палочку использовали в этом эпизоде; подтверждённое действие относится к заговорённой траве.
