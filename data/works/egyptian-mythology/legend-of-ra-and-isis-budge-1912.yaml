id: legend-of-ra-and-isis-budge-1912
title: "Легенда о Ра и Исиде"
original_title: "The Legend of Ra and Isis"
kind: myth
tradition:
  - egyptian-mythology
collection: "Legends of the Gods: The Egyptian Texts"
author: "Э. А. Уоллис Бадж (перевод и редакция)"
source:
  title: "E. A. Wallis Budge, Legends of the Gods: The Egyptian Texts (1912), chapter III, The Legend of Ra and Isis"
  url: "https://www.gutenberg.org/cache/epub/9411/pg9411.html"
  note: "Полный текст главы THE LEGEND OF RA AND ISIS, по иератическому Туринскому папирусу, в переводе Баджа 1912 года. Не смешивается с главой II о гибели человечества и с комментарием Баджа, где обсуждаются другие версии мифа."
entities:
  - id: ra
    name: "Ра"
    type: character
    description: >-
      Древнеегипетский солнечный бог и создатель мира,
      обладающий множеством имён и обликов.
      Его тайное имя скрыто в теле и недоступно
      даже другим богам. Укушенный сотворённой
      Исидой змеёй, Ра терпит страшные муки
      и соглашается передать ей сокровенное имя
      в обмен на избавление от яда.
    aliases:
      - "Ре"
    tags:
      - sun-god
      - creator
      - secret-name
  - id: isis
    name: "Исида"
    type: character
    description: >-
      Богиня, владеющая могущественными словами
      заклинаний. Из слюны стареющего Ра и земли
      создаёт ядовитую священную змею, чтобы
      заставить солнечного бога раскрыть тайное
      имя. После передачи имени из тела Ра
      в её тело произносит заклятие,
      изгоняющее смертельный яд.
    tags:
      - goddess
      - sorcery
      - healing
  - id: isis-created-sacred-serpent
    name: "Священная змея Исиды"
    type: creature
    description: >-
      Змея, которую Исида лепит из слюны Ра
      и земли и оставляет на его дороге.
      Жалит солнечного бога, вызывая
      невыносимую боль и действие яда,
      от которого тот не может избавиться
      самостоятельно. Её дальнейшая судьба
      после исцеления Ра не сообщается.
    tags:
      - magical-creation
      - venomous-serpent
  - id: ra-secret-name
    name: "Тайное имя Ра"
    type: phenomenon
    description: >-
      Сокровенное имя бога, скрытое в его теле
      и защищающее от чужих чар. Исида
      добивается передачи имени из тела Ра
      в собственное тело и получает
      власть произнести действенное
      исцеляющее заклятие. Точное звучание
      имени в мифе не раскрыто.
    tags:
      - true-name
      - divine-power
  - id: isis-antivenom-spell
    name: "Заклинание Исиды против змеиного яда"
    type: spell
    description: >-
      Произнесённые Исидой слова силы,
      приказывающие яду выйти из тела Ра.
      После получения тайного имени
      бога Исида использует их для его
      исцеления. В конце текста предписано
      повторять эти слова над изображениями
      богов как защитное средство
      против отравления.
    tags:
      - healing-spell
      - antivenom
  - id: horus
    name: "Гор"
    type: character
    description: >-
      Сын Исиды, к которому богиня
      обращается в момент передачи
      тайного имени Ра. Она требует,
      чтобы Ра скрепил передачу клятвой,
      касающейся его двух глаз.
      Изображение Гора также названо
      среди образов, над которыми
      следует читать защитное заклинание.
    tags:
      - deity
      - divine-son
