id: golden-crab-greek-lang-1894
title: "Золотой краб"
original_title: "The Golden Crab"
kind: folktale
tradition:
  - greek-folklore
collection: "The Yellow Fairy Book, под редакцией Эндрю Лэнга (1894)"
source:
  title: "The Golden Crab, The Yellow Fairy Book (1894), pp. 26–31"
  url: "https://www.gutenberg.org/files/28314/28314-h/28314-h.htm"
  note: "Конкретная английская редакция сказки The Golden Crab из The Yellow Fairy Book (1894), с. 26–31, Project Gutenberg № 28314. Сноска сборника: «Prinz Krebs», из Griechische Märchen, Schmidt. Прочитан весь раздел от THE GOLDEN CRAB до THE IRON STOVE; версии не смешаны."
entities:
  - id: enchanted-golden-crab-prince
    name: "Заколдованный принц — золотой краб"
    type: character
    description: >
      Королевский сын, обращённый заклятием в золотого
      краба днём и возвращающий человеческий облик ночью.
      Умеет говорить в облике краба, превращаться в орла
      по собственной воле и после еды оставлять
      на тарелке золото. Посылает рыбаков
      к королю просить руки его дочери.
      После сожжения его крабового панциря
      вынужден ещё три месяца оставаться
      под чарами, затем окончательно
      принимает человеческий облик.
    tags:
      - shapeshifter
      - enchanted-prince
      - talking-animal
  - id: golden-creation-rod
    name: "Золотой жезл чудесного созидания"
    type: artifact
    description: >
      Жезл, который заколдованный принц передаёт
      жене рыбака. Три удара о землю создают
      за одну ночь стену выше королевской башни,
      покрытую всеми цветами мира; повторение
      обряда создаёт сад с тремя фонтанами,
      изливающими золото, алмазы и бриллианты.
      Удар жезлом также вызывает слугу
      из горы или садовых ворот.
    tags:
      - magical-rod
      - creation
      - summoning
  - id: enchanted-eagle-brothers
    name: "Одиннадцать заколдованных орлов-юношей"
    type: creature
    description: >
      Спутники золотого краба, вместе с ним
      образующие двенадцать орлов, которые
      прилетают к скрытому дворцу и,
      искупавшись в чаше фонтана,
      становятся юношами. После трапезы
      снова превращаются в орлов
      и улетают. Рассказ не называет
      их поимённо и не объясняет,
      кто наложил на них чары.
    tags:
      - shapeshifter
      - enchanted-eagles
  - id: crab-shell-enchantment
    name: "Золотой крабовый панцирь"
    type: artifact
    description: >
      Оставляемый заколдованным принцем
      при переходе в человеческий облик
      крабовый панцирь. Королева-мать
      сжигает его, после чего принц
      исчезает из дворца и вновь
      встречается с супругой лишь
      в подземном дворце среди орлов.
      Разрушение панциря не освобождает
      его сразу: чары продолжаются
      ещё три месяца.
    tags:
      - enchanted-shell
      - transformation
