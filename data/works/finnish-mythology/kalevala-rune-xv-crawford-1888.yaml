id: kalevala-rune-xv-crawford-1888
title: "Калевала: руна XV — Воскрешение Лемминкяйнена"
original_title: "Rune XV. Lemminkainen's Restoration"
kind: epic
tradition:
  - finnish-mythology
collection: "Kalevala"
author: "Элиас Лённрот (составитель); Джон Мартин Кроуфорд (перевод, 1888)"
source:
  title: "The Kalevala, translated by John Martin Crawford (1888), Rune XV: Lemminkainen's Restoration"
  url: "https://en.wikisource.org/wiki/The_Kalevala/Rune_XV"
  note: "Полностью прочитана руна XV английского перевода Кроуфорда 1888 года. Не смешивались руна XIV о гибели Лемминкяйнена, руна X о Сампо и иные переводы Калевалы."
entities:
  - id: lemminkainen
    name: "Лемминкяйнен"
    type: character
    description: >-
      Герой и волшебный певец, погибший в реке Туони.
      Мать собирает части его тела и с помощью
      целительных сил возвращает к жизни.
      После воскрешения герой вновь говорит
      и способен творить заклинания песней.
    aliases:
      - "Каукомиели"
    tags:
      - magic-singer
      - resurrected-hero
  - id: lemminkainen-mother
    name: "Мать Лемминкяйнена"
    type: character
    description: >-
      Обладающая магической силой мать героя,
      которая разыскивает его в царстве мёртвых,
      собирает разрозненные останки медными
      граблями, соединяет тело и молит
      божественных помощников восстановить
      жилы и сосуды. Трижды посылает пчелу
      за целительным мёдом и оживляет сына.
    tags:
      - sorceress
      - resurrection
  - id: bleeding-hairbrush
    name: "Кровоточащая щётка Лемминкяйнена"
    type: artifact
    description: >-
      Золотистая щётка для волос героя,
      с которой начинает сочиться алая кровь,
      когда Лемминкяйнен гибнет или
      оказывается в смертельной опасности.
      По этому знаку жена и мать узнают
      о беде до получения известий.
    tags:
      - omen
      - sympathetic-magic
  - id: louhi
    name: "Лоухи"
    type: character
    description: >-
      Хозяйка Похьёлы, пославшая Лемминкяйнена
      выполнять опасные задания ради руки
      её дочери. Сперва скрывает от его матери
      правду о последнем задании, но затем
      признаётся, что отправила героя
      к реке смерти за лебедем Туони.
    tags:
      - northland-mistress
  - id: ilmarinen
    name: "Ильмаринен"
    type: character
    description: >-
      Бессмертный кузнец, прежде выковавший
      небесный свод. По просьбе матери
      Лемминкяйнена изготавливает огромные
      медные грабли с железными зубьями,
      которыми она достаёт останки сына
      со дна реки Туони.
    tags:
      - divine-smith
  - id: tuoni-death-river
    name: "Река Туони"
    type: location
    description: >-
      Река в царстве смерти Туонела,
      куда попадает погибший Лемминкяйнен.
      В её глубинах и водоворотах остаются
      разрозненные части тела героя.
      Мать ищет их длинными граблями,
      пока Солнце усыпляет обитателей
      подземного царства.
    aliases:
      - "Река Маналы"
    tags:
      - underworld
      - death-river
  - id: personified-sun
    name: "Одухотворённое Солнце"
    type: creature
    description: >-
      Солнце, отвечающее на вопросы матери
      Лемминкяйнена и сообщающее, что герой
      погиб в реке Туони. По её молитве
      трижды усиливает сияние и усыпляет
      обитателей царства мёртвых,
      позволяя матери искать останки сына.
    tags:
      - talking-sun
      - supernatural-sleep
  - id: suonetar
    name: "Суонетар"
    type: character
    description: >-
      Богиня жил и кровеносных сосудов,
      к которой обращается мать Лемминкяйнена
      при восстановлении разорванного тела.
      Её призывают со серебряным веретеном
      и медной прялкой, чтобы соединить
      сосуды и исцелить повреждения.
      Личное появление богини не описано.
    tags:
      - healing-goddess
      - invocation
  - id: helpful-bee
    name: "Пчела-посланница"
    type: animal
    description: >-
      Разговаривающая пчела, трижды посылаемая
      матерью Лемминкяйнена за целебным
      мёдом. Сначала собирает лесной бальзам,
      затем добывает зачарованный мёд
      за семью морями, а в третий раз
      достигает седьмого неба и приносит
      действенное средство Укко.
    tags:
      - talking-animal
      - divine-messenger
  - id: ukko
    name: "Укко"
    type: character
    description: >-
      Небесный бог и создатель,
      чей бальзам, приготовленный
      из его дыхания, обладает
      силой возвращать здоровье
      и жизнь. Мать героя признаёт,
      что окончательное воскрешение
      Лемминкяйнена стало возможным
      благодаря помощи Укко.
    tags:
      - sky-god
      - divine-healer
  - id: ukko-life-balm
    name: "Животворящий бальзам Укко"
    type: substance
    description: >-
      Целебный мёд и бальзам из
      небесных котлов Укко, куда
      пчела добирается на третий раз.
      Мать испытывает принесённое
      средство и смазывает им тело,
      глаза, уши и язык сына,
      после чего он окончательно
      просыпается, видит и говорит.
    tags:
      - divine-medicine
      - resurrection
  - id: enchanted-turi-honey
    name: "Зачарованный мёд острова Тури"
    type: substance
    description: >-
      Волшебный бальзам, который
      пчела добывает за семью морями
      в жилищах Палвойнена.
      Мать девять раз смазывает им
      тело Лемминкяйнена, но этого
      средства оказывается недостаточно:
      герой остаётся немым.
    tags:
      - magic-honey
      - incomplete-healing
  - id: suoyatar
    name: "Суойатар"
    type: character
    description: >-
      Сверхъестественная прародительница
      змей, упомянутая матерью героя
      при объяснении происхождения
      змеиного яда. Её слюна
      попадает в море и становится
      началом появления змеи.
      В эпизоде она не действует лично.
    tags:
      - serpent-origin
      - mythic-being
