  url: "https://en.wikisource.org/wiki/The_Green_Fairy_Book/The_Story_of_Caliph_Stork"
  note: "Полный самостоятельный текст The Story of Caliph Stork, главы I–V, строки 118–232 Wikisource, из The Green Fairy Book (1892), редактор Эндрю Лэнг; первоначальный литературный сюжет Вильгельма Гауфа. Не смешивать с иными переводами и редакциями."
entities:
  - id: mutabor-transforming-snuff
    name: "Превращающий порошок и слово «Мутабор»"
    type: substance
    description: >
      Чёрный порошок из табакерки позволяет принявшему его и
      произнёсшему «Мутабор» превратиться в выбранное животное
      и понимать речь зверей и птиц. Чтобы вернуть человеческий
      облик, необходимо трижды поклониться на восток и вновь
      произнести слово. Смех в зверином облике заставляет
      забыть слово, из-за чего калиф и визирь остаются аистами,
      пока не подслушивают заклинание. Порошок действует также
      на узурпатора Мирзу.
    tags:
      - transformation
      - magic-word
      - animal-language
  - id: magician-kaschnur
    name: "Колдун Кашнур"
    type: character
    description: >
      Могущественный чародей, желающий отомстить калифу и
      индийскому царю. Он устраивает ловушку с превращающим
      порошком, чтобы его сын Мирза занял престол Багдада,
      а принцессу Лузу превращает в сову при помощи поданного
      под видом слуги напитка. Переносит заколдованную
      принцессу в заброшенный замок и накладывает условие,
      что она останется совой до добровольного предложения брака.
    tags:
      - sorcerer
      - curse
      - shapeshifting
  - id: princess-lusa-screech-owl
    name: "Принцесса Луза в облике совы"
    type: character
    description: >
      Дочь индийского царя, которую колдун Кашнур обманом
      заставляет выпить превращающее зелье. В облике совы
      она говорит на арабском, днём слепа и видит лишь при
      лунном свете. Старинное предсказание связывает её
      освобождение с аистом. Когда калиф добровольно
      предлагает ей брак, чары снимаются и она вновь
      становится человеком.
    tags:
      - enchanted-person
      - owl-transformation
      - broken-curse
  - id: kaschnur-peddler-accomplice
    name: "Торговец — сообщник колдуна"
    type: character
    description: >
      Продавец приносит калифу табакерку с порошком и
      латинскую рукопись с инструкцией. Позднее калиф и
      визирь видят его на тайном пиршестве колдунов, где
      он хвастается обманом и раскрывает забытое ими
      слово «Мутабор». Его собственные заклинания
      или способность превращаться в тексте не показаны.
    tags:
      - sorcerer-accomplice
      - magical-deception
