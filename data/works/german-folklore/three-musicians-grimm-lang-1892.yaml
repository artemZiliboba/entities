id: three-musicians-grimm-lang-1892
title: "Три музыканта"
original_title: "The Three Musicians"
kind: folktale
tradition:
  - german-folklore
collection: "The Green Fairy Book (edited by Andrew Lang, 1892)"
source:
  title: "The Three Musicians, The Green Fairy Book, Wikisource"
  url: "https://en.wikisource.org/wiki/The_Green_Fairy_Book/The_Three_Musicians"
  note: "Прочитан полный самостоятельный текст строк 106–147 Wikisource, редакция The Green Fairy Book (1892), в конце указана атрибуция Grimm. Не смешивались другие редакции сюжета."
entities:
  - id: enchanted-castle-dwarf
    name: "Карлик — хранитель зачарованного замка"
    type: character
    description: >
      Низкорослый седобородый волшебный страж живёт в пустом замке, где невидимые руки готовят еду и обслуживают гостей. Нападает на путников, но теряет силу, когда флейтист вырывает его бороду. Показывает путь в зачарованную страну и объясняет, как разбудить спящую принцессу. Его сила заключена в бороде.
    tags:
      - dwarf
      - sorcerer
  - id: dwarf-magic-beard
    name: "Волшебная борода карлика"
    type: artifact
    description: >
      В бороде заключена вся колдовская сила карлика. Когда флейтист вырывает её, сам он ощущает необычайную силу и замечает прежде скрытые вещи, а карлик становится беспомощным. Вернуть бороду карлику означает восстановить его опасную власть.
    tags:
      - power-source
      - magical-strength
  - id: water-parting-wand
    name: "Жезл, раздвигающий воды"
    type: artifact
    description: >
      Жезл карлика, прикосновение которого заставляет бурную реку расступиться и остановиться, позволяя пройти по сухому дну. Флейтист забирает жезл и с его помощью переправляет карлика обратно, после чего воды смыкаются. Герои сохраняют жезл, чтобы карлик не смог вернуться.
    tags:
      - wand
      - water-magic
  - id: sleep-enchanting-bird
    name: "Птица, усыпившая принцессу своим пением"
    type: animal
    description: >
      Птица в клетке над постелью принцессы поёт песню, погрузившую её в многовековой волшебный сон; пение продолжается всё время действия чар. По указанию карлика флейтист убивает птицу, сжигает её сердце в порошок и кладёт порошок в рот принцессе, отчего та просыпается.
    tags:
      - enchanted-song
      - sleep
  - id: enchanted-sleeping-princess
    name: "Принцесса в многовековом волшебном сне"
    type: character
    description: >
      Владычица скрытого королевства и замка спит сотни лет под чарами песни птицы. Не просыпается от обычного шума; оживает, когда флейтист кладёт ей в рот порошок из сожжённого сердца птицы. После пробуждения её дворец вновь наполняется слугами.
    tags:
      - enchanted-person
      - sleep-curse
  - id: enchanted-hidden-kingdom
    name: "Зачарованное королевство за рекой"
    type: location
    description: >
      Скрытая страна за бурной рекой, куда карлик проводит флейтиста через тайные проходы. Её небо сияет золотом, звёзды необычайно велики, а в центре стоит дворец спящей принцессы. Место прямо названо зачарованным и веками недоступно людям, пока карлик не теряет силу.
    tags:
      - enchanted-land
      - hidden-kingdom
