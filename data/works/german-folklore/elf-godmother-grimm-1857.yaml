id: elf-godmother-grimm-1857
title: "Крёстная у маленького народца"
original_title: "Die Wichtelmänner. Zweites Märchen"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Haus-Märchen, KHM 39/2, седьмое издание (1857)"
author: "Братья Гримм (составители)"
source:
  title: "Die Wichtelmänner. Zweites Märchen, Kinder- und Haus-Märchen, Band 1, 7. Auflage (1857), S. 207–208"
  url: "https://de.wikisource.org/wiki/Die_Wichtelm%C3%A4nner_(1857)"
  note: "Прочитан полный немецкий текст второй из трёх самостоятельных сказок KHM 39 в последней авторской редакции 1857 года, страницы 207–208. Не смешивалась с первой сказкой о сапожнике, третьей о подменыше и ранними редакциями."
entities:
  - id: mountain-elves
    name: "Маленький народец из полой горы"
    type: creature
    description: >-
      Сверхъестественные маленькие человечки, живущие внутри полой горы. Они приглашают бедную служанку стать крёстной матерью их ребёнка, присылают за ней трёх провожатых и устраивают гостеприимный приём. После пребывания девушки они наполняют её карманы золотом и выводят из горы. Три дня, которые она, по её ощущению, провела у маленького народца, оказываются семью годами в человеческом мире.
  - id: hollow-mountain-of-elves
    name: "Полая гора маленького народца"
    type: location
    description: >-
      Скрытое внутри горы жилище маленького народца, куда три человечка приводят служанку на крестины. Внутри всё миниатюрно и богато убрано. Гостья проводит там, как ей кажется, три дня, но по возвращении обнаруживает, что во внешнем мире миновало семь лет и прежние хозяева умерли. Текст не поясняет, чем вызвана разница во времени.
