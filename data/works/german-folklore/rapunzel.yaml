id: rapunzel
title: "Рапунцель"
original_title: "Rapunzel"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Hausmärchen, KHM 12"
source:
  title: "Grimm's Household Tales, Volume 1 (1884) — Rapunzel"
  url: "https://en.wikisource.org/wiki/Grimm%27s_Household_Tales%2C_Volume_1/Rapunzel"
  note: >
    Английский перевод Маргарет Хант 1884 года, сказка KHM 12. Запись следует
    именно этой редакции и не смешивает детали других изданий, переводов или
    позднейших адаптаций.

entities:
  - id: enchantress
    name: "Колдунья"
    type: character
    description: >
      Могущественная волшебница, которой принадлежит сад с рапунцелем. Она
      забирает новорождённую Рапунцель, заточает её в башне, а позднее магически
      переносит девушку в пустынное место после того, как отрезает ей волосы.
    tags:
      - enchantress
      - magic
      - antagonist

  - id: enchanted-rampion
    name: "Рапунцель из сада колдуньи"
    type: plant
    description: >
      Растение, растущее в саду могущественной колдуньи и вызывающее у матери
      Рапунцель непреодолимое желание съесть его. Сам текст не показывает у
      растения отдельного заклинательного действия, поэтому его магический
      статус связан прежде всего с принадлежностью зачарованному пространству
      и необычной силой желания.
    tags:
      - rampion
      - enchanted-garden
      - desire

  - id: rapunzels-hair
    name: "Длинные волосы Рапунцель"
    type: artifact
    description: >
      Необычайно длинные волосы Рапунцель служат единственным средством доступа
      в башню: по призыву девушка распускает косы, и колдунья либо королевич
      поднимаются по ним наверх. После отрезания колдунья использует волосы как
      средство обмана, чтобы поднять королевича в башню.
    tags:
      - hair
      - tower-access
      - enchanted

  - id: healing-tears
    name: "Исцеляющие слёзы Рапунцель"
    type: substance
    description: >
      Слёзы Рапунцель возвращают зрение ослепшему королевичу: две слезы попадают
      ему в глаза, после чего они вновь становятся ясными и он снова видит.
    tags:
      - healing
      - tears
      - restoration
