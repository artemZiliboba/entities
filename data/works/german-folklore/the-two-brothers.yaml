id: the-two-brothers
title: "Два брата"
original_title: "Die zwei Brüder"
kind: folktale
tradition:
  - german-folklore
author: "Братья Гримм"
collection: "Kinder- und Hausmärchen"
source:
  title: "Die zwei Brüder (KHM 60)"
  url: "https://de.wikisource.org/wiki/Die_zwei_Br%C3%BCder_(1857)"
  note: >
    Сказка братьев Гримм, KHM 60, по седьмому изданию Kinder- und Hausmärchen
    (1857), Wikisource; текст на странице дважды вычитан по источнику.
    Для англоязычной сверки использован перевод Маргарет Рейн Хант на
    Wikisource. Детали ранних редакций и иных вариантов не смешивались.

entities:
  - id: gold-bird
    name: "Золотая птица"
    type: animal
    description: >
      Чудесная птица, целиком состоящая из золота. Её сердце и печень обладают
      особым свойством: съевший их человек каждое утро находит под подушкой
      золотую монету.
    tags:
      - golden-bird
      - magical-animal
      - wealth

  - id: gold-bird-heart-and-liver
    name: "Сердце и печень Золотой птицы"
    type: substance
    description: >
      Два внутренних органа чудесной птицы, случайно съеденные братьями-близнецами.
      После этого у каждого из них каждое утро появляется золотая монета под
      подушкой.
    tags:
      - magical-food
      - gold
      - wealth

  - id: daily-gold-coins
    name: "Ежедневные золотые монеты"
    type: phenomenon
    description: >
      Постоянный сверхъестественный эффект после вкушения сердца и печени
      Золотой птицы: каждое утро у каждого близнеца под подушкой оказывается
      по одной золотой монете.
    tags:
      - magical-wealth
      - gold
      - recurring-magic

  - id: life-indicator-knife
    name: "Нож, показывающий судьбу братьев"
    type: artifact
    description: >
      Блестящий нож, который при расставании братья втыкают в дерево на
      перекрёстке. Сторона, обращённая вслед одному из них, ржавеет, если он
      умирает, и остаётся блестящей, пока он жив; частичная ржавчина указывает
      на тяжёлую беду.
    tags:
      - life-token
      - omen
      - divination

  - id: hare-helpers
    name: "Зайцы-помощники"
    type: animal
    description: >
      Два молодых зайца, отданные говорящим взрослым зайцем братьям в обмен на
      его жизнь. После разделения один сопровождает каждого охотника; заяц
      западного брата дважды приносит с далёкой горы корень жизни.
    tags:
      - talking-animal
      - magical-helper
      - resurrection

  - id: fox-helpers
    name: "Лисы-помощники"
    type: animal
    description: >
      Два молодых лиса, полученные братьями от говорящего взрослого лиса.
      Они входят в свиту охотников, понимают речь и выполняют поручения; один
      из них помогает подтвердить возвращение победителя дракона.
    tags:
      - talking-animal
      - magical-helper
      - fox

  - id: wolf-helpers
    name: "Волки-помощники"
    type: animal
    description: >
      Два молодых волка, которых говорящий волк отдаёт близнецам. Они следуют
      за братьями как разумные слуги; волк западного брата участвует в битве
      с драконом и позднее выполняет поручения хозяина.
    tags:
      - talking-animal
      - magical-helper
      - wolf

  - id: bear-helpers
    name: "Медведи-помощники"
    type: animal
    description: >
      Два молодых медведя, полученные от говорящего медведя. Они сопровождают
      братьев, действуют как разумные помощники и участвуют в борьбе с
      семиглавым драконом.
    tags:
      - talking-animal
      - magical-helper
      - bear

  - id: lion-helpers
    name: "Львы-помощники"
    type: animal
    description: >
      Два молодых льва, отданные братьям говорящим львом. Лев западного брата
      сражается с драконом, руководит остальными животными после гибели хозяина
      и помогает вернуть его к жизни.
    tags:
      - talking-animal
      - magical-helper
      - lion

  - id: strength-drink
    name: "Три кубка сверхъестественной силы"
    type: substance
    description: >
      Три наполненных кубка на алтаре часовни Драконьей горы. Выпив их, охотник
      становится сильнейшим человеком на земле и получает достаточно силы,
      чтобы поднять и использовать спрятанный у порога меч.
    tags:
      - strength
      - magical-drink
      - dragon-quest

  - id: dragon-sword
    name: "Меч Драконьей горы"
    type: artifact
    description: >
      Тяжёлый меч, закопанный у порога часовни. До чудесного усиления охотник
      не может сдвинуть его с места; после трёх кубков силы легко поднимает меч
      и отрубает им головы семиглавому дракону.
    tags:
      - magic-sword
      - dragon-slayer
      - strength

  - id: seven-headed-dragon
    name: "Семиглавый дракон"
    type: creature
    description: >
      Чудовище на горе, ежегодно требующее в жертву непорочную девушку и
      угрожающее разорить страну. Оно имеет семь голов, летает и извергает
      пламя из семи пастей.
    tags:
      - dragon
      - seven-headed
      - fire
      - sacrifice

  - id: life-root
    name: "Корень жизни"
    type: plant
    description: >
      Чудесный корень, растущий на далёкой горе. Если вложить его в рот
      погибшему, он исцеляет любые раны и возвращает жизнь даже обезглавленному
      человеку; заяц использует его для двух воскрешений.
    tags:
      - resurrection
      - healing
      - magical-plant

  - id: enchanted-white-hind
    name: "Белая лань из заколдованного леса"
    type: animal
    description: >
      Неуловимая белая лань, появляющаяся перед обоими братьями в заколдованном
      лесу. Погоня за ней уводит каждого охотника глубоко в чащу к месту,
      где действует ведьма.
    tags:
      - white-hind
      - enchanted-forest
      - lure

  - id: forest-witch
    name: "Ведьма заколдованного леса"
    type: character
    description: >
      Старуха, заманивающая охотников в ловушку. Она неуязвима для обычных
      свинцовых пуль, превращает людей и животных в камень волшебной веткой и
      умеет возвращать окаменевших к жизни.
    tags:
      - witch
      - petrification
      - bulletproof

  - id: petrifying-restoring-switch
    name: "Ветка окаменения и оживления"
    type: artifact
    description: >
      Волшебная ветка ведьмы. Ею можно мгновенно превратить животное или
      человека в камень; позднее ведьма той же веткой касается каменных фигур
      и возвращает их к жизни.
    tags:
      - petrification
      - restoration
      - magic-wand

  - id: silver-button-shot
    name: "Серебряные пуговицы против ведьмы"
    type: artifact
    description: >
      Три серебряные пуговицы, которыми охотник заряжает ружьё вместо
      бесполезных свинцовых пуль. Ведьмина защита против них не действует, и
      выстрел сбивает её с дерева.
    tags:
      - silver
      - witch-slaying
      - magical-vulnerability

  - id: enchanted-forest
    name: "Заколдованный лес ведьмы"
    type: location
    description: >
      Лес, в котором ведьма заманивает путников к месту окаменения. После её
      гибели чаща сама раскрывается и светлеет, так что далёкий королевский
      замок становится виден за несколько часов пути.
    tags:
      - enchanted-forest
      - witch
      - transformation
