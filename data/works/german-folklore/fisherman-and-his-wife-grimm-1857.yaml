entities:
  - id: enchanted-flounder-prince
    name: "Заколдованный принц-камбала"
    type: animal
    description: >-
      Большая говорящая камбала, утверждающая, что на самом деле является
      заколдованным принцем. После освобождения рыбаком исполняет просьбы
      его жены Ильзебилль: дарует дом и дворец, делает её королём,
      императором и папой римским. Когда она требует стать подобной Богу,
      рыба возвращает супругов в прежнюю жалкую хижину.
      Происхождение и условия снятия заклятия в сказке не раскрываются.
    aliases:
      - "Волшебная камбала"
    tags:
      - enchanted-prince
      - talking-animal
      - wish-granting
