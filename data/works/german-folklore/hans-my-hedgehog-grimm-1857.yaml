entities:
  - id: hans-my-hedgehog
    name: "Ганс — мой ёжик"
    type: character
    description: >-
      Сын крестьянина, родившийся с верхней половиной тела ежа и нижней половиной человека после желания отца иметь ребёнка любой ценой. Он говорит, играет на волынке, ездит верхом на петухе и умеет находить путь в большом лесу. Женившись на дочери второго короля, снимает с себя ежиную кожу; когда её сжигают, он окончательно принимает человеческий облик.
  - id: hedgehog-skin
    name: "Ежиная кожа Ганса"
    type: artifact
    description: >-
      Съёмная ежиная кожа, сохраняющая необычный звериный облик Ганса. Перед первой брачной ночью он просит поставить у двери четырёх стражников и разжечь огонь; затем выходит из кожи, а стражники немедленно сжигают её. После уничтожения кожи Ганс освобождается от прежнего облика и остаётся человеком.
