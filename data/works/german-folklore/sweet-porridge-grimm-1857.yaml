entities:
  - id: magic-porridge-pot
    name: "Волшебный горшочек с кашей"
    type: artifact
    description: >-
      Маленький горшочек, подаренный бедной девочке пожилой женщиной в лесу. На слова «Горшочек, вари» он сам начинает готовить сладкую пшённую кашу, а на слова «Горшочек, стой» прекращает варить. Когда мать девочки забывает вторую команду, горшочек переполняется и каша затопляет дома и улицу; вернувшаяся девочка останавливает его правильными словами.
