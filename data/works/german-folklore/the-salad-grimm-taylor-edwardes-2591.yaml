id: the-salad-grimm-taylor-edwardes-2591
title: "Волшебный салат"
original_title: "The Salad"
kind: folktale
tradition:
  - german-folklore
collection: "Grimms' Fairy Tales (translations by Edgar Taylor and Marian Edwardes; Project Gutenberg #2591)"
source:
  title: "The Salad, Grimms' Fairy Tales, Project Gutenberg #2591"
  url: "https://www.gutenberg.org/files/2591/2591-h/2591-h.htm"
  note: >-
    Полностью прочитан раздел THE SALAD (строки 1975–2005 HTML-версии
    Project Gutenberg #2591), англоязычная редакция в переводах
    Эдгара Тейлора и Мариан Эдвардс. Не смешано с немецким текстом
    Der Krautesel и другими вариантами.
entities:
  - id: wishing-cloak
    name: "Плащ желаний"
    type: artifact
    description: >-
      Волшебный плащ, найденный охотником после выстрела в стаю птиц.
      Тот, кто надевает его и желает оказаться в определённом месте,
      мгновенно переносится туда; плащ переносит и сопровождающего
      человека. Охотник попадает с девушкой на алмазную гору,
      а затем девушка похищает плащ и возвращается с его помощью
      в замок. Самостоятельной воли плащ не проявляет.
    tags:
      - teleportation
      - enchanted-cloak
  - id: gold-bringing-birds-heart
    name: "Птичье сердце, приносящее золото"
    type: artifact
    description: >-
      Сердце птицы, которую охотник подстрелил среди девяти птиц,
      державших волшебный плащ. Пока сердце находится у человека,
      каждое утро под его подушкой появляется кусочек золота.
      После похищения сердца золото появляется под подушкой девушки,
      а ведьма забирает их. Рассказ не утверждает, что всякая птица
      обладает подобным свойством.
    tags:
      - wealth
      - enchanted-object
  - id: witch-of-the-castle
    name: "Ведьма из замка"
    type: character
    description: >-
      Пожилая ведьма, живущая в замке с молодой девушкой.
      Знает о волшебном сердце и плаще охотника и устраивает
      их похищение через девушку. Когда охотник оказывается
      на алмазной горе, ведьма наводит на него глубокий сон,
      что позволяет снять с него плащ. Позже ведьма сама
      съедает салат, превращающий в осла, и погибает,
      не успев получить средство обратного превращения.
    tags:
      - witch
      - enchanted-sleep
  - id: giants-of-diamond-mountain
    name: "Великаны алмазной горы"
    type: creature
    description: >-
      Трое великанов, обитающих на горе, куда охотник
      попадает с помощью плаща желаний. Они замечают
      притворяющегося спящим человека, обсуждают, стоит ли
      его убивать, и уходят. Один из великанов говорит,
      что облако может унести человека с вершины горы;
      позже это действительно происходит. Отдельных
      имён и сверхъестественных умений помимо их
      великанской природы текст не называет.
    tags:
      - giants
      - mountain
  - id: donkey-transforming-salad
    name: "Салат, превращающий в осла"
    type: plant
    description: >-
      Растущий в саду кочан салата, от нескольких укусов
      которого человек превращается в осла, сохраняя
      способность осознавать происходящее. Сначала его
      действие испытывает охотник, а затем он кормит
      таким салатом ведьму, служанку и девушку, которые
      тоже превращаются в ослов. Эффект сохраняется,
      пока не съеден другой, восстанавливающий салат.
    tags:
      - transformation
      - enchanted-plant
  - id: human-restoring-salad
    name: "Салат, возвращающий человеческий облик"
    type: plant
    description: >-
      Другой вид салата из того же сада, который отменяет
      превращение в осла. Охотник обнаруживает его,
      когда ест зелень после собственного превращения,
      и снова становится человеком. Позднее он даёт
      этот салат двум оставшимся в живых превращённым
      женщинам, возвращая им человеческий облик.
      Он не оживляет умершую ведьму.
    tags:
      - transformation
      - restoration
