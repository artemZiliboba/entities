id: godfather-death-grimm-1857
title: "Смерть в крёстные"
original_title: "Der Gevatter Tod"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Haus-Märchen, KHM 44, седьмое издание (1857)"
author: "Братья Гримм (составители)"
source:
  title: "Der Gevatter Tod, Kinder- und Haus-Märchen, Band 1, 7. Auflage (1857), S. 219–222"
  url: "https://de.wikisource.org/wiki/Der_Gevatter_Tod_(1857)"
  note: "Полный оригинальный немецкий текст KHM 44 последней авторской редакции 1857 года, вычитанный по сканам. Версии 1812–1850 годов и другие рассказы о Смерти-крёстном не смешивались."
entities:
  - id: personified-death
    name: "Смерть — крёстный отец"
    type: character
    description: >-
      Олицетворённая Смерть, которая одинаково забирает бедных и богатых и соглашается стать крёстным тринадцатого ребёнка бедняка. Она показывается взрослому крестнику у изголовья либо у ног больного, определяя возможность исцеления. После двукратного обмана ведёт врача в подземную пещеру жизненных свечей и умышленно гасит его свечу, отчего тот умирает.
  - id: god-at-crossroads
    name: "Бог на дороге"
    type: character
    description: >-
      Бог первым встречается бедняку, ищущему крёстного для своего тринадцатого ребёнка, знает его нужду и предлагает позаботиться о младенце. Бедняк отвергает предложение, считая, что Бог несправедливо распределяет богатство и бедность; повествователь прямо указывает на ошибочность такого суждения.
  - id: devil-at-crossroads
    name: "Дьявол на дороге"
    type: character
    description: >-
      Дьявол встречает бедняка после Бога и предлагает стать крёстным его ребёнка, обещая золото в изобилии и все земные удовольствия. Бедняк отказывается, называя Дьявола обманщиком и искусителем. Других действий Дьявола в этой сказке не описано.
  - id: healing-herb-of-death
    name: "Целебная трава Смерти"
    type: plant
    description: >-
      Трава, которую Смерть показывает своему крестнику в лесу как часть дара будущему врачу. Если Смерть стоит у изголовья больного, лекарство из этой травы возвращает здоровье; если у ног, исцеление запрещено и больной обречён. Врач дважды нарушает правило, переворачивая больных так, чтобы Смерть оказалась у изголовья, и исцеляет их травой.
  - id: human-life-candles
    name: "Свечи человеческих жизней"
    type: artifact
    description: >-
      Бесчисленные горящие огни в подземной пещере Смерти, каждому из которых соответствует жизнь определённого человека. Одни свечи велики, другие почти догорели; их пламя постоянно гаснет и вновь загорается в разных местах. Смерть показывает врачу его короткий огарок и нарочно роняет его при попытке переставить на новую свечу; огонь гаснет, и врач сразу умирает.
