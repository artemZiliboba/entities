id: the-pink-grimm-taylor-edwardes-2591
title: "Гвоздика"
original_title: "Die Nelke"
kind: folktale
tradition:
  - german-folklore
author: "Братья Гримм"
collection: "Kinder- und Hausmärchen, KHM 76"
source:
