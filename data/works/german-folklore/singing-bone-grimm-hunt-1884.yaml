id: singing-bone-grimm-hunt-1884
title: "Поющая косточка"
original_title: "Der singende Knochen (The Singing Bone)"
kind: folktale
tradition:
  - german-folklore
author: "Якоб и Вильгельм Гримм"
collection: "Kinder- und Hausmärchen, № 28"
source:
  title: "Grimm's Household Tales, Volume I, No. 28, The Singing Bone, translated by Margaret Hunt (1884)"
  url: "https://www.worldoftales.com/fairy_tales/Brothers_Grimm/Margaret_Hunt/The_Singing_Bone.html"
  note: "Сказка № 28 в английском переводе Маргарет Хант (1884), по тексту из Grimm's Household Tales. Использован вариант о двух братьях, а не ранняя редакция с тремя братьями или параллельные балладные варианты."
entities:
  - id: forest-little-man
    name: "Маленький человек из леса"
    type: character
    description: >-
      Неизвестный маленький человек встречает младшего брата на пути в лес и вручает ему чёрное копьё, объясняя подарок добрым и невинным сердцем юноши. Он обещает, что с этим оружием охотник сможет смело выступить против огромного кабана и зверь не причинит ему вреда. Сказка не раскрывает происхождение дарителя и не называет его гномом или волшебником.
  - id: black-spear-against-boar
    name: "Чёрное копьё"
    type: artifact
    description: >-
      Копьё, подаренное младшему брату таинственным маленьким человеком. Даритель обещает защиту от кабана при использовании оружия; зверь бросается на направленное в него копьё и смертельно ранит себя. Текст подтверждает особую роль дара и обещание безопасности, но не описывает самостоятельного заклинания или иных свойств копья.
  - id: singing-bone-horn
    name: "Поющая кость убитого брата"
    type: artifact
    description: >-
      Косточка убитого младшего брата, найденная пастухом спустя годы под мостом. Пастух вырезает из неё мундштук для своего рожка; при игре кость сама поёт о том, что старший брат убил младшего ради кабана и женитьбы на королевской дочери. Она повторяет разоблачительную песню перед королём, благодаря чему находят останки погибшего и раскрывают преступление.
