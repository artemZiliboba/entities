id: snow-white-and-rose-red-grimm-1857
title: "Беляночка и Розочка"
original_title: "Schneeweißchen und Rosenroth"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Hausmärchen, № 161, седьмое издание (1857)"
author: "Братья Гримм (составители)"
source:
  title: "Schneeweißchen und Rosenroth, Kinder- und Haus-Märchen, 7. Auflage (1857), Band 2, S. 296–303"
  url: "https://de.wikisource.org/wiki/Schneewei%C3%9Fchen_und_Rosenroth_(1857)"
  note: "Полный оригинальный немецкий текст сказки KHM 161 в седьмом издании 1857 года, выверенный по сканам. Образ ребёнка-ангела дан как предположение матери, не установленная сверхъестественная сущность. Другие редакции и пересказы не смешивались."
entities:
  - id: enchanted-bear-prince
    name: "Заколдованный принц-медведь"
    type: character
    description: >-
      Королевский сын, которого злой карлик проклял жить в лесу в облике дикого чёрного медведя. Он сохраняет человеческую речь, зимними вечерами приходит греться в дом вдовы и дружит с Беляночкой и Розочкой. Когда медведь убивает карлика, медвежья шкура спадает, и принц вновь становится человеком.
  - id: wicked-dwarf
    name: "Злой карлик"
    type: creature
    description: >-
      Маленькое подземное существо с длинной белой бородой и огненно-красными глазами. Он похитил сокровища королевского сына и наложил на него заклятие медвежьего облика, действующее до собственной смерти карлика. Девочки трижды спасают карлика от беды, но он отвечает им неблагодарностью; погибает от удара лапы заколдованного принца.
  - id: bear-transformation-curse
    name: "Проклятие медвежьего облика"
    type: spell
    description: >-
      Чары злого карлика, из-за которых королевский сын вынужден жить диким медведем в лесу. Заклятие не снимается добротой девушек или временем года: в конце рассказа принц освобождается только после гибели наложившего чары карлика.
  - id: white-clad-guardian-child
    name: "Белое дитя — возможный ангел-хранитель"
    type: character
    description: >-
      Незнакомый прекрасный ребёнок в сияющей белой одежде, которого сёстры видят утром после ночёвки в лесу у самого обрыва. Он молча приветливо смотрит на них и уходит. Мать полагает, что это был ангел, оберегавший добрых детей; текст не утверждает его природу как установленный факт.
