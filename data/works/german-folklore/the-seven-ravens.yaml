id: the-seven-ravens
title: "Семь воронов"
original_title: "Die sieben Raben"
kind: folktale
tradition:
  - german-folklore
author: "Братья Гримм"
collection: "Kinder- und Hausmärchen"
source:
  title: "Die sieben Raben (KHM 25)"
  url: "https://de.wikisource.org/wiki/Die_sieben_Raben_(1857)"
  note: >
    Сказка братьев Гримм, KHM 25, по седьмому изданию Kinder- und Hausmärchen
    (1857), Wikisource. Текст редакции последней руки сверён по страницам
    скана; для англоязычной проверки использован Project Gutenberg eBook
    #2591, The Seven Ravens. Детали ранних редакций и иных вариантов не смешивались.

entities:
  - id: seven-raven-brothers
    name: "Семь братьев-воронов"
    type: character
    description: >
      Семеро сыновей, которых необдуманное пожелание отца мгновенно превращает
      в чёрных воронов. Они сохраняют человеческую речь и узнают семейное
      кольцо сестры; после её появления чары прекращаются, и братья вновь
      принимают человеческий облик.
    tags:
      - enchanted-brothers
      - ravens
      - transformation
      - curse

  - id: fathers-raven-curse
    name: "Отцовское проклятие превращения в воронов"
    type: spell
    description: >
      Невольное проклятие, возникшее из гневного пожелания отца, чтобы семь
      сыновей стали воронами. Слова исполняются сразу: над домом появляется
      семь чёрных воронов, а родители не могут отменить превращение.
    tags:
      - curse
      - transformation
      - ravens

  - id: sun
    name: "Солнце-людоед"
    type: character
    description: >
      Олицетворённое Солнце, к которому девочка приходит в поисках братьев.
      Оно оказывается слишком горячим и страшным и, по словам рассказа,
      пожирает маленьких детей, поэтому девочка бежит от него.
    tags:
      - personification
      - sun
      - cosmic-being

  - id: moon
    name: "Луна-людоед"
    type: character
    description: >
      Олицетворённая Луна, второй небесный адресат поисков. Она описана как
      холодная, злая и также угрожающая съесть девочку, из-за чего та уходит
      дальше к звёздам.
    tags:
      - personification
      - moon
      - cosmic-being

  - id: stars
    name: "Добрые звёзды"
    type: character
    description: >
      Олицетворённые звёзды, которые дружелюбно принимают девочку и сообщают,
      что её братья находятся на Стеклянной горе. Они дают ей волшебную
      косточку-ключ, необходимую для входа туда.
    tags:
      - personification
      - stars
      - magical-helpers

  - id: glass-mountain
    name: "Стеклянная гора"
    type: location
    description: >
      Иной мир, где живут семь братьев-воронов. Вход в гору заперт и должен
      открываться особой косточкой, подаренной звёздами; потеряв её, сестра
      вынуждена пожертвовать собственным пальцем вместо ключа.
    tags:
      - glass-mountain
      - otherworld
      - enchanted-location

  - id: star-bone-key
    name: "Косточка-ключ звёзд"
    type: artifact
    description: >
      Маленькая косточка, которую звёзды дают девочке как единственный
      предусмотренный ключ от Стеклянной горы. Она завёрнута в платок, но
      по дороге исчезает, вынуждая героиню искать иной способ открыть дверь.
    tags:
      - magic-key
      - stars
      - glass-mountain

  - id: finger-key
    name: "Палец-ключ от Стеклянной горы"
    type: artifact
    description: >
      Собственный мизинец девочки, который она отрезает после потери волшебной
      косточки и вставляет в замочную скважину. Жертва действует как замена
      магическому ключу и открывает запертую дверь Стеклянной горы.
    tags:
      - key
      - sacrifice
      - glass-mountain

  - id: raven-dwarf
    name: "Карлик-служитель воронов"
    type: character
    description: >
      Маленький обитатель Стеклянной горы, который встречает сестру и называет
      семь воронов своими господами. Он впускает девочку и готовит для братьев
      семь тарелок и семь кубков, пока те отсутствуют.
    tags:
      - dwarf
      - otherworld
      - raven-servant

  - id: raven-disenchantment
    name: "Освобождение семи воронов от чар"
    type: spell
    description: >
      Снятие превращения, происходящее после того, как братья узнают семейное
      кольцо и желают, чтобы сестра оказалась рядом. Когда девушка выходит
      из-за двери, все семь воронов немедленно возвращают человеческий облик.
    tags:
      - disenchantment
      - transformation
      - siblings
