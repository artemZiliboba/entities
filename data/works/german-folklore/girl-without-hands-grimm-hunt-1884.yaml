id: girl-without-hands-grimm-hunt-1884
title: "Девушка без рук"
original_title: "Das Mädchen ohne Hände (The Girl Without Hands)"
kind: folktale
tradition:
  - german-folklore
author: "Якоб и Вильгельм Гримм"
collection: "Kinder- und Hausmärchen, № 31"
source:
  title: "Grimm's Household Tales, Volume I, No. 31, The Girl Without Hands, translated by Margaret Hunt (1884)"
  url: "https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/The_Girl_Without_Hands"
  note: "Полный текст сказки № 31 в английском переводе Маргарет Хант (1884), основанном на позднем издании Гриммов. Не смешивать с ранними и местными вариантами, описанными в примечаниях к сборнику."
entities:
  - id: devil-millers-bargain
    name: "Дьявол, заключивший сделку с мельником"
    type: character
    description: >-
      Является мельнику в облике незнакомого старика и обещает внезапное богатство за то, что находится за мельницей. Вместо яблони, которую имел в виду мельник, дьявол рассчитывает получить его дочь. Не может приблизиться к чистой и благочестивой девушке, даже когда отец по его требованию отрубает ей руки; после третьей неудачи теряет на неё право. Позднее подменяет письма между королём и его матерью, добиваясь изгнания молодой королевы с ребёнком.
  - id: protecting-angel
    name: "Ангел — защитник девушки"
    type: character
    description: >-
      Появляется в ответ на молитву девушки без рук и осушает ров вокруг королевского сада, чтобы она могла достать грушу; сопровождает её и виден садовнику. После изгнания королевы с младенцем ангел вновь помогает ей, приводит к лесному дому с надписью «Здесь все живут свободно» и принимает облик девушки в белом, которая семь лет заботится о матери и сыне. В конце помогает им воссоединиться с королём.
  - id: restoration-of-maidens-hands
    name: "Чудесное восстановление рук"
    type: phenomenon
    description: >-
      У девушки, которой отец отрубил обе кисти по требованию дьявола, после семи лет жизни под защитой ангела вновь вырастают настоящие руки. Повествование прямо приписывает исцеление Божьей милости и её благочестию. Ранее король велел изготовить для неё серебряные протезы, но сами они не описаны как волшебные и позднее служат лишь подтверждением её личности.
