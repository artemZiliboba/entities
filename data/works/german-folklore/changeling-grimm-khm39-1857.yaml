id: changeling-grimm-khm39-1857
title: "Подменыш маленького народца"
original_title: "Die Wichtelmänner. Drittes Märchen"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Haus-Märchen, KHM 39/3, седьмое издание (1857)"
author: "Братья Гримм (составители)"
source:
  title: "Die Wichtelmänner. Drittes Märchen, Kinder- und Haus-Märchen, Band 1, 7. Auflage (1857), S. 208"
  url: "https://de.wikisource.org/wiki/Die_Wichtelm%C3%A4nner_(1857)"
  note: "Прочитан полный немецкий текст только третьей самостоятельной истории KHM 39 на странице 208 седьмого издания 1857 года, дважды вычитанный по сканам. Не смешивалась с первой и второй историями и другими вариантами о подменышах."
entities:
  - id: child-stealing-little-folk
    name: "Маленький народец, похищающий младенцев"
    type: creature
    description: >-
      Сверхъестественные маленькие человечки, которые похищают младенца из колыбели и оставляют на его месте подменыша. Когда подменыш смеётся над попыткой матери вскипятить воду в яичных скорлупках, появляется множество человечков. Они возвращают настоящего ребёнка, кладут его на очаг и уносят подменыша обратно.
  - id: ancient-changeling
    name: "Древний подменыш"
    type: creature
    description: >-
      Существо с большой головой и неподвижными глазами, подложенное маленьким народцем вместо человеческого младенца. Подменыш требует только еды и питья, умеет говорить и утверждает, что стар возрастом с Вестервальд. Увидев, как женщина кипятит воду в двух яичных скорлупках, он смеётся, после чего похитители забирают его и возвращают ребёнка.
