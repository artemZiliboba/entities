entities:
  - id: two-shoemaking-elves
    name: "Два ночных эльфа-сапожника"
    type: creature
    description: >-
      Двое маленьких обнажённых человечков, которые в полночь тайно приходят в мастерскую бедного сапожника и с необыкновенной быстротой и мастерством сшивают обувь из подготовленной кожи. Их помощь повторяется ночь за ночью, пока сапожник не становится состоятельным. Получив от супругов сшитую специально для них одежду и маленькие башмачки, эльфы радуются, танцуют и навсегда покидают мастерскую.
