id: twelve-brothers-grimm-1857
title: "Двенадцать братьев"
original_title: "Die zwölf Brüder"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Haus-Märchen, KHM 9, 7. Auflage (1857)"
author: "Братья Гримм (составители)"
source:
  title: "Die zwölf Brüder, Kinder- und Haus-Märchen, Band 1, 7. Auflage (1857), S. 48–53"
  url: "https://de.wikisource.org/wiki/Die_zw%C3%B6lf_Br%C3%BCder_(1857)"
  note: "Использован полный немецкий текст KHM 9 седьмого издания (1857), страницы 48–53, дважды вычитанный по сканам. Не смешивался с версиями 1812–1850 годов и переводами."
entities:
  - id: twelve-raven-brothers
    name: "Двенадцать братьев-воронов"
    type: character
    description: >-
      Двенадцать сыновей короля, скрывающихся в лесу от смертного приговора отца. Когда их сестра срывает двенадцать белых лилий в саду, все братья мгновенно превращаются в воронов и улетают. После семи лет молчания и отказа от смеха сестры они вновь становятся людьми и спасают её от казни.
  - id: twelve-enchanted-lilies
    name: "Двенадцать заколдованных лилий"
    type: plant
    description: >-
      Двенадцать белых цветов, растущих в саду заколдованного лесного домика, где живут братья. Сестра срывает их, чтобы подарить каждому брату по цветку, но это действие одновременно обращает всех двенадцать братьев в воронов. Старая женщина объясняет, что цветы были связаны с братьями.
  - id: enchanted-forest-house
    name: "Заколдованный лесной домик"
    type: location
    description: >-
      Пустой дом в глубине леса, названный в сказке заколдованным. В нём десять лет скрываются двенадцать братьев; рядом расположен сад с двенадцатью белыми лилиями. В тот миг, когда девушка срывает цветы и братья становятся воронами, домик вместе с садом исчезает.
