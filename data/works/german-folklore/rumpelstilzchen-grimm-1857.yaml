entities:
  - id: rumpelstilzchen
    name: "Румпельштильцхен"
    type: creature
    description: >-
      Таинственный маленький человечек, трижды появляющийся перед дочерью
      мельника в запертой комнате и прядущий солому в золото. За первые
      две ночи получает ожерелье и кольцо, а за третью требует её первого
      ребёнка после восшествия на престол. Позднее соглашается отказаться
      от ребёнка, если королева за три дня назовёт его имя. Узнав, что
      имя раскрыто, в ярости проваливает ногу в землю и разрывает себя
      надвое. Превращение соломы в золото — его собственное волшебное
      умение, а не свойство прялки.
    aliases:
      - "Румпельстильцхен"
      - "Rumpelstiltskin"
    tags:
      - supernatural-helper
      - transmutation
      - secret-name
