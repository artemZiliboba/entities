id: three-little-men-in-the-wood-grimm-13
title: "Три человечка в лесу"
original_title: "Die drei Männlein im Walde"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Hausmärchen, братья Гримм, KHM 13"
source:
  title: "The Three Little Men in the Wood, KHM 13, перевод Маргарет Хант (1884)"
  url: "https://en.wikisource.org/wiki/Grimm%27s_Household_Tales,_Volume_1/The_Three_Little_Men_in_the_Wood"
  note: "Только сказка № 13 в переводе Margaret Hunt, Grimm's Household Tales, том I, George Bell and Sons, Лондон, 1884. Соседние сказки, поздние пересказы и другие редакции не смешивались."
entities:
  - id: three-forest-dwarfs
    name: "Три лесных человечка"
    type: creature
    description: >
      Трое маленьких лесных существ живут в домике среди зимнего леса
      и наделяют людей сверхъестественными дарами или проклятиями.
      Доброй девушке они даруют возрастающую красоту, золотые монеты
      при каждом произнесённом слове и будущее замужество с королём.
      Её невежливой сводной сестре они предрекают усиливающееся
      уродство, жаб при каждом слове и несчастную смерть.
    tags:
      - dwarfs
      - supernatural-gifts
      - curses
  - id: blessed-stepdaughter
    name: "Девушка, благословлённая лесными человечками"
    type: character
    description: >
      Падчерица делится хлебом с тремя лесными человечками и выполняет
      их просьбу, после чего получает чудесные дары: с каждым днём
      становится красивее, а при её речи изо рта падают золотые монеты.
      Она выходит замуж за короля. После покушения мачехи возвращается
      ночью к младенцу в облике утки, а когда король трижды взмахивает
      мечом над её духом, вновь становится живой женщиной.
    tags:
      - blessing
      - gold
      - shapeshifting
      - restoration
  - id: cursed-stepsister
    name: "Сводная сестра, проклятая лесными человечками"
    type: character
    description: >
      Родная дочь мачехи отказывает трём лесным человечкам в угощении
      и не желает выполнить их просьбу. За это получает проклятие:
      с каждым днём становится безобразнее, а при каждом произнесённом
      слове из её рта выскакивает жаба. Вместе с матерью она
      подменяет королеву, но в конце сказки разоблачена.
    tags:
      - curse
      - toads
