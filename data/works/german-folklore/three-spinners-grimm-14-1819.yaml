entities:
  - id: three-mysterious-spinners
    name: "Три чудесные пряхи"
    type: character
    description: >
      Три необычные женщины приходят к девушке, которой королева велела
      напрясть три комнаты льна. У первой широкая плоская ступня,
      у второй свисающая нижняя губа, у третьей широкий большой палец.
      Они обещают быстро выполнить работу, если девушка назовёт их
      родственницами и пригласит на свадьбу. Пока первые две работают
      с прялкой и нитью, третья крутит нить и ударяет пальцем по столу:
      после каждого удара появляется моток тонко спрядённой пряжи.
      Вместе женщины завершают всю работу, а на свадьбе их рассказы
      о прядении пугают жениха и освобождают девушку от этого занятия.
    tags:
      - supernatural-helpers
      - magical-spinning
      - bargain
