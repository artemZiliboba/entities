id: three-languages-grimm-1857
title: "Три языка"
original_title: "Die drei Sprachen"
kind: folktale
tradition:
  - german-folklore
collection: "Kinder- und Haus-Märchen, № 33, седьмое издание (1857)"
author: "Братья Гримм (составители)"
source:
  title: "Die drei Sprachen, Kinder- und Haus-Märchen, 7. Auflage (1857), Band 1, S. 172–174"
  url: "https://de.wikisource.org/wiki/Die_drei_Sprachen_(1857)"
  note: "Полностью прочитан немецкий текст KHM 33 последней авторской редакции 1857 года, страницы 172–174; транскрипция дважды сверена с оригиналом. Редакции 1819–1850 годов не смешивались."
entities:
  - id: animal-language-knowing-count
    name: "Юноша, понимающий три языка животных"
    type: character
    description: >-
      Сын швейцарского графа, который за три года у трёх учителей осваивает речь собак, птиц и лягушек. Он узнаёт от заколдованных собак, как освободить их от стражи клада, слышит предсказание лягушек о своём будущем избрании папой и понимает советы двух белых голубей, подсказывающих ему слова мессы.
  - id: cursed-tower-dogs
    name: "Заколдованные собаки старой башни"
    type: animal
    description: >-
      Стая свирепых собак, вынужденных охранять сундук с золотом в подземелье старой башни. Они требуют человеческих жертв и пожирают людей, но встречают понимающего их язык юношу дружелюбно. Собаки объясняют, как поднять сокровище и снять с них проклятие; после освобождения исчезают.
  - id: prophetic-marsh-frogs
    name: "Вещие лягушки болота"
    type: animal
    description: >-
      Лягушки, которых юноша слышит на болоте по пути в Рим. Понимая их кваканье, он узнаёт, что ему предстоит стать папой, и печалится от такого неожиданного предсказания. Позднее избрание действительно происходит.
  - id: two-white-doves
    name: "Два белоснежных голубя"
    type: animal
    description: >-
      Два белых голубя, которые внезапно садятся на плечи юноши в римской церкви именно тогда, когда кардиналы решают избрать папой человека, отмеченного божественным знамением. Они убеждают юношу принять сан, а затем нашёптывают ему необходимые слова во время мессы. Духовенство считает их появление знаком Бога.
