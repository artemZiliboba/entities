id: the-devil-with-the-three-golden-hairs
title: "Чёрт с тремя золотыми волосами"
original_title: "Der Teufel mit den drei goldenen Haaren"
kind: folktale
tradition:
  - german-folklore
author: "Братья Гримм"
collection: "Kinder- und Hausmärchen"
source:
  title: "Der Teufel mit den drei goldenen Haaren (KHM 29)"
  url: "https://de.wikisource.org/wiki/Der_Teufel_mit_den_drei_goldenen_Haaren_(1857)"
  note: >
    Сказка братьев Гримм, KHM 29, по седьмому изданию Kinder- und Hausmärchen
    (1857), Wikisource; текст дважды вычитан по сканам источника. Для
    англоязычной сверки использован перевод Маргарет Рейн Хант (1884) на
    Wikisource. Детали ранних редакций и иных вариантов не смешивались.

entities:
  - id: luck-child
    name: "Счастливчик, рождённый в сорочке"
    type: character
    description: >
      Мальчик, родившийся в плодной оболочке, которому предсказано жениться
      на королевской дочери в четырнадцать лет. Рассказ прямо связывает его
      рождение с необычайной удачей: всё, за что он берётся, оборачивается
      благополучно, несмотря на попытки короля погубить его.
    tags:
      - luck-child
      - prophecy
      - supernatural-luck

  - id: marriage-prophecy
    name: "Пророчество о браке с королевской дочерью"
    type: phenomenon
    description: >
      Предсказание, сделанное при рождении Счастливчика: в четырнадцать лет
      он должен получить в жёны дочь короля. Король неоднократно пытается
      сорвать пророчество, но оно всё равно исполняется.
    tags:
      - prophecy
      - fate
      - royal-marriage

  - id: devil
    name: "Чёрт с тремя золотыми волосами"
    type: creature
    description: >
      Хозяин ада, с головы которого герой должен добыть три золотых волоса.
      Он чувствует присутствие человеческой плоти и знает скрытые причины
      трёх чудесных бедствий, ответы на которые его бабушка выведывает,
      вырывая волосы во время сна.
    tags:
      - devil
      - hell
      - golden-hairs

  - id: devils-grandmother
    name: "Бабушка чёрта"
    type: character
    description: >
      Сверхъестественная старуха в аду, которая решает помочь Счастливчику.
      Она превращает его в муравья, прячет в складках одежды, добывает три
      золотых волоса и хитростью получает от чёрта ответы на три загадки.
    tags:
      - supernatural-helper
      - transformation
      - hell

  - id: ant-transformation
    name: "Превращение Счастливчика в муравья"
    type: spell
    description: >
      Чары бабушки чёрта, мгновенно превращающие героя в муравья, чтобы
      спрятать его от хозяина ада. После ухода чёрта старуха возвращает
      Счастливчику человеческий облик.
    tags:
      - transformation
      - ant
      - concealment

  - id: three-golden-devil-hairs
    name: "Три золотых волоса чёрта"
    type: artifact
    description: >
      Три золотых волоса, которые король требует принести из ада как условие
      сохранения брака. Бабушка чёрта по одному вырывает их во время его сна,
      и герой доставляет волосы королю как доказательство выполненного задания.
    tags:
      - golden-hairs
      - quest-object
      - devil

  - id: wine-fountain
    name: "Источник, текущий вином"
    type: location
    description: >
      Рыночный источник, который прежде вместо воды давал вино, но полностью
      иссяк. Чёрт раскрывает причину: под камнем в источнике сидит жаба; после
      её уничтожения вино должно снова потечь.
    tags:
      - magical-fountain
      - wine
      - curse-like-affliction

  - id: fountain-blocking-toad
    name: "Жаба, иссушающая винный источник"
    type: animal
    description: >
      Жаба, скрытая под камнем внутри чудесного источника. Пока она находится
      там, источник не даёт ни вина, ни воды; чёрт утверждает, что после её
      гибели прежний поток вина восстановится.
    tags:
      - toad
      - magical-affliction
      - wine-fountain

  - id: golden-apple-tree
    name: "Дерево золотых яблок"
    type: plant
    description: >
      Чудесное городское дерево, которое прежде приносило золотые яблоки,
      но перестало давать даже листья. Чёрт объясняет, что его корень грызёт
      мышь; если мышь убить, дерево снова станет плодоносить золотом.
    tags:
      - magical-tree
      - golden-apples
      - restoration

  - id: tree-root-mouse
    name: "Мышь у корня золотого дерева"
    type: animal
    description: >
      Мышь, подтачивающая корень дерева золотых яблок. Её действие лишает
      дерево листвы и чудесных плодов, а продолжение вреда должно окончательно
      погубить дерево.
    tags:
      - mouse
      - magical-affliction
      - golden-apple-tree

  - id: bound-ferryman
    name: "Заколдованный перевозчик"
    type: character
    description: >
      Перевозчик через большую воду, вынужденный бесконечно возить путников
      туда и обратно без смены. Освободиться он может только передав шест
      следующему пассажиру, после чего обязанность переходит к тому человеку.
    tags:
      - ferryman
      - supernatural-bond
      - curse

  - id: ferrymans-transfer-curse
    name: "Проклятие перевозчика"
    type: spell
    description: >
      Сверхъестественное правило, приковывающее владельца перевозочного шеста
      к бесконечной службе. Чтобы избавиться от неё, перевозчик должен вручить
      шест прибывшему пассажиру; тогда обязанность немедленно переходит к нему.
    tags:
      - curse
      - transfer
      - ferryman

  - id: entrance-to-hell
    name: "Вход в ад"
    type: location
    description: >
      Доступное герою сверхъестественное пространство за большой водой.
      Внутри всё чёрное и закопчённое; здесь живут чёрт и его бабушка, а герой
      добывает три золотых волоса и тайные ответы на загадки.
    tags:
      - hell
      - otherworld
      - quest-location
