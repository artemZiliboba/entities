id: the-three-snake-leaves
title: "Три змеиных листика"
original_title: "Die drei Schlangenblätter"
kind: folktale
tradition:
  - german-folklore
author: "Братья Гримм"
collection: "Kinder- und Hausmärchen"
source:
  title: "Die drei Schlangenblätter (KHM 16)"
  url: "https://de.wikisource.org/wiki/Die_drei_Schlangenbl%C3%A4tter_(1857)"
  note: >
    Сказка братьев Гримм, KHM 16, по седьмому изданию Kinder- und Hausmärchen
    (1857), Wikisource. Для англоязычной сверки использован Project Gutenberg,
