entities:
  - id: three-snake-leaves
    name: "Три змеиных листика"
    type: plant
    description: >
      Три зелёных листа с чудесной силой восстановления жизни. Вторая змея
      кладёт по одному листу на каждую рану разрубленной змеи, после чего части
      срастаются и та оживает; позднее те же листья дважды возвращают к жизни
      людей, если положить один на рот и два на глаза.
    tags:
      - resurrection
      - magical-plant
      - healing
      - snake

  - id: snake-leaf-resurrection
    name: "Воскрешение змеиными листиками"
    type: phenomenon
    description: >
      Повторяемый сверхъестественный эффект трёх листьев: они сначала сращивают
      разрубленную на части змею и возвращают ей жизнь, затем оживляют умершую
      королеву и позднее утонувшего молодого короля.
    tags:
      - resurrection
      - restoration
      - life-restoration
