id: star-child-wilde-methuen-1915
title: "Мальчик-звезда"
original_title: "The Star-Child"
kind: story
tradition:
  - irish-literature
author: "Оскар Уайльд"
collection: "A House of Pomegranates (1891), седьмое издание Methuen & Co. (1915)"
source:
  title: "The Star-Child, A House of Pomegranates, Methuen & Co., 7th ed. (1915), pp. 147 onward"
  url: "https://www.gutenberg.org/cache/epub/873/pg873-images.html"
  note: "Полный английский текст последней сказки сборника, оцифрованный Дэвидом Прайсом по изданию Methuen & Co. 1915 года; Project Gutenberg eBook #873. Другие издания и пересказы не смешивались."
entities:
  - id: libyan-magician
    name: "Ливийский волшебник"
    type: character
    description: >-
      Старик, купивший Мальчика-звезду в рабство, назван в тексте искуснейшим волшебником Ливии, обучившимся своему искусству у обитателя гробниц Нила. Он держит мальчика взаперти, посылает его за тремя кусочками золота и угрожает наказаниями. Каких-либо конкретных заклинаний или чудес, совершённых им в повествовании, не показано.
  - id: speaking-hare
    name: "Говорящий заяц-помощник"
    type: animal
    description: >-
      Заяц, которого Мальчик-звезда освобождает из охотничьей ловушки. Заяц отвечает человеческой речью и трижды помогает своему спасителю найти спрятанные в лесу кусочки белого, жёлтого и красного золота. Он подчёркивает, что возвращает мальчику проявленную к нему доброту.
  - id: speaking-forest-animals
    name: "Говорящие лесные звери и птицы"
    type: animal
    description: >-
      Звери и птицы, разговаривающие между собой и с людьми в сказочном лесу. В начале истории волк, птицы и другие обитатели леса обсуждают зимнюю стужу; позднее крот, коноплянка и белка отвечают Мальчику-звезде, когда тот ищет мать, напоминая о его прежней жестокости. Говорящий заяц-помощник учтён отдельно ввиду самостоятельной повторяющейся роли.
  - id: star-child-appearance-change
    name: "Чудесное изменение облика Мальчика-звезды"
    type: phenomenon
    description: >-
      После жестокого отречения от матери прежде прекрасный Мальчик-звезда внезапно становится уродливым: его лицо сравнивается с жабой, а тело — со змеёй. Три года он скитается в таком облике; после проявленных им милосердия и сострадания красота столь же неожиданно возвращается. Герой считает первое изменение наказанием за жестокость, но текст не называет исполнителя и не описывает заклинания.
