id: selfish-giant-wilde-celt-1987
title: "Великан-эгоист"
original_title: "The Selfish Giant"
kind: story
tradition:
  - irish-literature
author: "Оскар Уайльд"
collection: "The Works of Oscar Wilde (Galley Press, London, 1987), pp. 297–300"
source:
  title: "The Selfish Giant — CELT, University College Cork, E850003-009"
  url: "https://celt.ucc.ie/published/E850003-009.html"
  note: "Полный английский текст The Selfish Giant, по The Works of Oscar Wilde (London: Galley Press, 1987), pp. 297–300; электронная выверенная редакция CELT E850003-009, University College Cork. Другие редакции и рассказы сборника не смешивались."
entities:
  - id: selfish-giant
    name: "Великан-эгоист"
    type: creature
    description: >
      Великан, владеющий садом и замком. Семь лет гостит у корнуолльского
      огра, затем запрещает детям играть в саду. Его жестокость сопровождается
      непрекращающейся зимой, а после раскаяния весна возвращается.
      Позже он помогает маленькому мальчику забраться на дерево,
      стареет и умирает под цветущими ветвями.
    tags:
      - giant
      - moral-transformation
  - id: divine-child
    name: "Чудесный мальчик со следами гвоздей"
    type: character
    description: >
      Маленький мальчик, которого великан подсаживает на дерево.
      Спустя годы появляется вновь в зимнем саду под необычайным
      деревом, со следами гвоздей на ладонях и ступнях.
      Называет раны ранами Любви и приглашает великана
      в свой сад, который именует Раем. Христианская
      символика указывает на Христа, хотя прямо
      имя в тексте не названо.
    tags:
      - divine-child
      - paradise
      - christian-symbolism
  - id: personified-snow
    name: "Олицетворённый Снег"
    type: character
    description: >
      Говорящий Снег, который вместе с Морозом радуется,
      что весна не приходит в сад великана. Укрывает траву
      белым плащом, поселяется в саду и приглашает
      Северный ветер.
    tags:
      - personified-season
      - winter
  - id: personified-frost
    name: "Олицетворённый Мороз"
    type: character
    description: >
      Говорящий Мороз, который вместе со Снегом решает
      поселиться в саду на весь год. Серебрит деревья
      и участвует в зимних плясках.
    tags:
      - personified-weather
      - winter
  - id: personified-north-wind
    name: "Олицетворённый Северный ветер"
    type: character
    description: >
      Северный ветер в мехах, приглашённый Снегом и Морозом.
      Ревёт над садом и срывает трубы с крыши.
      Предлагает пригласить Град, затем продолжает
      бушевать в саду, пока туда не возвращаются дети.
    tags:
      - personified-wind
      - winter
  - id: personified-hail
    name: "Олицетворённый Град"
    type: character
    description: >
      Град, пришедший по приглашению Северного ветра.
      Носит серую одежду, обладает ледяным дыханием,
      ежедневно три часа гремит по крыше замка,
      ломая черепицу, и бегает по саду.
    tags:
      - personified-weather
      - winter
  - id: personified-autumn
    name: "Олицетворённая Осень"
    type: character
    description: >
      Осень, которая дарит золотые плоды другим садам,
      но отказывает саду великана, прямо объясняя
      свой отказ его эгоизмом.
    tags:
      - personified-season
      - judgment
  - id: personified-spring
    name: "Олицетворённая Весна"
    type: character
    description: >
      Весна, не входящая в сад великана, пока он прогоняет
      детей. Возвращается вместе с ними после того,
      как великан разрушает стену и разрешает
      детям свободно играть.
    tags:
      - personified-season
      - renewal
  - id: speaking-garden-trees
    name: "Оживающие деревья сада великана"
    type: plant
    description: >
      Деревья в саду реагируют на присутствие детей:
      покрываются цветами, радостно машут ветвями.
      Одно дерево разговаривает с маленьким мальчиком,
      приглашая его взобраться, и опускает ветви.
      Когда великан подсаживает ребёнка, дерево
      сразу расцветает. Деревья объединены в группу,
      так как большинство не индивидуализировано.
    tags:
      - sentient-trees
      - animated-plants
  - id: miraculous-golden-branch-tree
    name: "Дерево с золотыми ветвями и серебряными плодами"
    type: plant
    description: >
      Дерево в дальнем углу сада, которое чудесным образом
      цветёт посреди зимы при повторном появлении мальчика.
      Покрыто белыми цветами, имеет золотые ветви
      и серебряные плоды. Под ним великан умирает,
      окружённый белыми цветами.
    tags:
      - miraculous-tree
      - golden-branches
      - silver-fruit
