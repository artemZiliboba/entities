id: young-king-wilde-methuen-1915
title: "Юный король"
original_title: "The Young King"
kind: story
tradition:
  - irish-literature
author: "Оскар Уайльд"
collection: "A House of Pomegranates (1891), Methuen & Co., седьмое издание (1915)"
source:
  title: "The Young King, A House of Pomegranates, Methuen & Co., 7th ed. (1915), pp. 1–30"
  url: "https://www.gutenberg.org/cache/epub/873/pg873-images.html"
  note: "Полный английский текст первой сказки сборника в издании Methuen & Co. 1915 года, оцифрованном David Price для Project Gutenberg #873. Персонификации болезни и драконы появляются внутри третьего сна; это не утверждение об их существовании вне сна. Иные редакции не смешивались."
entities:
  - id: dream-death
    name: "Смерть из третьего сна"
    type: character
    description: >-
      Персонифицированная Смерть, появляющаяся в третьем сне юного короля у копей, где добывают рубины для короны. Требует у Алчности зерно, а после отказа вызывает Лихорадку, Горячку и Чуму, которые губят работников. Затем уезжает верхом на красном коне. Её действия происходят внутри сновидения.
  - id: dream-avarice
    name: "Алчность из третьего сна"
    type: character
    description: >-
      Персонифицированная Алчность, владеющая работниками рубиновых копей в третьем сне короля. Отказывается отдать Смерти одно из трёх зёрен, даже когда вызванные Смертью болезни губят людей. После гибели всех работников с криком убегает в лес.
  - id: dream-ague
    name: "Лихорадка из чаши Смерти"
    type: character
    description: >-
      Персонифицированная болезнь Ague, возникающая из чаши, которой Смерть зачерпывает воду в третьем сне короля. Проходит среди работников рубиновых копей; после её появления треть из них лежит мёртвой. За ней следует холодный туман, а рядом бегут водяные змеи.
  - id: dream-fever
    name: "Горячка в огненном одеянии"
    type: character
    description: >-
      Персонифицированная Fever, появляющаяся из зарослей болиголова после того, как Смерть бросает в лес чёрный камень. В третьем сне короля она проходит через толпу в огненном одеянии, убивает каждого, кого касается, и иссушает траву под ногами.
  - id: dream-plague
    name: "Крылатая Чума"
    type: character
    description: >-
      Персонифицированная Чума, которую Смерть призывает свистом в третьем сне юного короля. Она летит по воздуху с надписью Plague на лбу и стаей истощённых грифов вокруг; накрывает долину крыльями, после чего ни один работник не остаётся в живых.
  - id: dream-dragons
    name: "Драконы из рубиновой долины"
    type: creature
    description: >-
      Драконы, выползающие из ила на дне опустевшей долины после того, как Чума уничтожает работников рубиновых копей. Упоминаются в третьем сне юного короля вместе с другими ужасными чешуйчатыми существами; их отдельные способности и дальнейшая роль не описаны.
  - id: flowering-staff
    name: "Расцветший пастуший посох"
    type: artifact
    description: >-
      Сухой пастуший посох юного короля, который во время молитвы перед коронацией чудесно расцветает белыми лилиями. Стебли лилий уподоблены серебру. Прежде посох был обычной принадлежностью пастуха; чудо совершается в соборе.
  - id: flowering-thorn-crown
    name: "Расцветший терновый венец"
    type: artifact
    description: >-
      Венец из сухой ветви дикого шиповника, который юный король сплетает вместо золотой короны. В соборе во время его молитвы ветвь чудесно покрывается красными розами с листьями, уподобленными чеканному золоту.
  - id: sunwoven-coronation-robe
    name: "Солнечное коронационное одеяние"
    type: phenomenon
    description: >-
      Чудесное одеяние, которое солнечные лучи словно ткут вокруг юного короля, когда он молится в соборе в пастушьей одежде. Оно прекраснее приготовленного для него золотого плаща и воспринимается присутствующими как знак высшего признания его королевского достоинства.
  - id: mystical-shrine-light
    name: "Мистический свет алтарной святыни"
    type: phenomenon
    description: >-
      Сверхъестественное сияние, исходящее из хрусталя многолучевой дароносицы после того, как дверцы драгоценной святыни в соборе сами распахиваются. Свет сопровождает чудесное преображение облика юного короля и преклонение придворных.
