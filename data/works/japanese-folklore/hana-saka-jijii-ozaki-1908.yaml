entities:
  - id: miraculous-rice-mortar
    name: "Чудесная ступа из дерева над могилой Сиро"
    type: artifact
    description: >-
      Деревянная ступа, изготовленная добрым стариком из ствола дерева,
      под которым был похоронен его пёс Сиро. При толчении риса
      в ней количество пищи многократно увеличивается, а рисовые лепёшки
      появляются словно сами собой. У жестокого соседа ступа не даёт
      съедобных лепёшек; сосед разбивает и сжигает её.
    tags:
      - food-multiplication
      - magical-object
  - id: blossom-making-ashes
    name: "Пепел, заставляющий деревья цвести"
    type: substance
    description: >-
      Пепел, оставшийся после сожжения чудесной ступы. Когда добрый
      старик рассыпает его по ветвям, деревья мгновенно покрываются
      цветами даже поздней осенью; с его помощью он оживляет цветение
      засохшей вишни в саду даймё. У завистливого соседа пепел
      не вызывает цветения.
    tags:
      - magical-ashes
      - plant-growth
