id: man-who-did-not-wish-to-die-ozaki-1908
title: "Человек, который не хотел умирать"
original_title: "The Story of the Man Who Did Not Wish to Die"
kind: folktale
tradition:
  - japanese-folklore
author: "Еи Теодора Одзаки (пересказ)"
collection: "Japanese Fairy Tales (1908)"
source:
  title: "Yei Theodora Ozaki, Japanese Fairy Tales (1908), The Story of the Man Who Did Not Wish to Die"
  url: "https://www.gutenberg.org/cache/epub/4018/pg4018-images.html"
  note: "Полный рассказ из издания 1908 года, Project Gutenberg #4018. В предисловии Одзаки указывает литературный источник: Chosei Furo («Долголетие») Тамэнага Синсуя. События на острове и полёт журавля раскрыты в финале как сон, посланный Дзёфуку; не смешивать с другими версиями легенд о Хорай."
entities:
  - id: jofuku-patron-of-hermits
    name: "Дзёфуку — покровитель отшельников"
    type: character
    description: >-
      Бывший придворный китайского императора, отправившийся искать эликсир бессмертия и, по рассказу, почитаемый как божество-покровитель отшельников. После семидневной молитвы Сэнтаро Дзёфуку является в сияющем облаке и показывает ему в чудесном сне страну вечной жизни. По словам посланника, именно Дзёфуку устроил испытание героя, включая нападение акулы во сне.
  - id: paper-crane-of-jofuku
    name: "Бумажный журавль Дзёфуку"
    type: artifact
    description: >-
      В сновидении Сэнтаро Дзёфуку вручает ему маленького бумажного журавля. Птица увеличивается до размеров ездового животного, самостоятельно летит через море к острову бессмертных, затем складывается и прячется в карман. Через триста лет журавль вновь вырастает и несёт героя обратно; во время бури бумага намокает, и птица падает в море. Все эти события происходят внутри поучительного сна.
  - id: land-of-perpetual-life
    name: "Страна вечной жизни"
    type: location
    description: >-
      Чудесная островная страна, которую Сэнтаро посещает во сне, устроенном Дзёфуку. Её жители не умирают и не болеют, а обычные яды не вредят им и даже улучшают самочувствие. Бессмертие тяготит обитателей: они тщетно стремятся узнать смерть, надеясь попасть в рай. Пребывание героя здесь в течение трёхсот лет оказывается частью испытательного видения, а не реальным путешествием.
  - id: elixir-of-life-horai
    name: "Эликсир жизни Хорай"
    type: substance
    description: >-
      Легендарный напиток, который, по рассказу о китайском императоре, хранят отшельники далёкой страны Хорайдзан и который дарует выпившему вечную жизнь. За ним император посылает Дзёфуку, но тот не возвращается. Сэнтаро ищет эликсир, однако не находит и не пробует его; существование напитка в пределах сюжета передаётся как предание, а не наблюдаемое действие.
  - id: immortality-seeking-hermits
    name: "Бессмертные отшельники Хорай"
    type: character
    description: >-
      Легендарные подвижники, которые, по словам Дзёфуку и старинным рассказам, живут в Хорайдзане и знают тайну эликсира жизни. Дзёфуку объясняет Сэнтаро, что отшельник должен отказаться от земных желаний, питаться плодами и корой и благодаря долгому подвигу перестаёт страдать от голода, холода и жары, становится настолько лёгким, что ездит на журавле или карпе и ходит по воде. Сэнтаро не встречает их лично.
  - id: messenger-of-jofuku
    name: "Светозарный посланник Дзёфуку"
    type: character
    description: >-
      После пробуждения Сэнтаро из необычайного сна перед ним наяву появляется окружённый светом посланник Дзёфуку. Он объясняет, что страна бессмертных и падение в море были испытанием, передаёт наставления о трудолюбивой и доброй жизни и вручает книгу нравственных правил, после чего исчезает. Книга не описана как магический предмет.
