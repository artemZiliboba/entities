entities:
  - id: rashomon-oni
    name: "Они у ворот Расёмон"
    type: creature
    description: >-
      Огромный они, нападающий по вечерам на путников у ворот Расёмон в Киото. Он выше ворот, его глаза сверкают, а из пасти при дыхании вырывается пламя. В поединке с воином Ватанабэ теряет руку и спасается бегством. Позднее принимает облик старой кормилицы Ватанабэ, выманивает у него отрубленную руку, возвращает её себе и вновь превращается в великана, после чего скрывается сквозь крышу в тумане и облаках. Впоследствии перестаёт тревожить город.
