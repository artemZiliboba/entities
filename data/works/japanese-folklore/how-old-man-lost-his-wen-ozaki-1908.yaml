id: how-old-man-lost-his-wen-ozaki-1908
title: "Как старик лишился шишки"
original_title: "How an Old Man Lost His Wen"
kind: folktale
tradition:
  - japanese-folklore
collection: "Japanese Fairy Tales (Yei Theodora Ozaki, 1908)"
source:
  title: "How an Old Man Lost His Wen, Yei Theodora Ozaki, Japanese Fairy Tales (1908)"
  url: "https://www.gutenberg.org/files/4018/4018-h/4018-h.htm"
  note: "Полный текст отдельной английской версии HOW AN OLD MAN LOST HIS WEN из сборника Japanese Fairy Tales (1908), Project Gutenberg #4018, от появления шишки до наказания второго старика. Другие варианты японского сюжета Kobutori Jiisan не смешивались."
entities:
  - id: oni-chief
    name: "Предводитель они на лесном пиру"
    type: creature
    description: >-
      Рогатый предводитель ночного сборища демонов-они в горах. Он приглашает старика, хорошо исполнившего танец, прийти снова и требует оставить залог. По совету слуги одним прикосновением без боли снимает с правой щеки старика многолетнюю шишку, не оставляя шрама, и уносит её. На следующий вечер принимает другого старика за прежнего танцора и возвращает шишку, бросив её ему на правую щёку; нарост сразу прирастает и не поддаётся попыткам его снять.
  - id: forest-oni-revelers
    name: "Рогатые они лесного сборища"
    type: creature
    description: >-
      Сотни демонов-они, которые появляются на горном склоне после грозы и устраивают ночное пиршество с музыкой и танцами. Одни из них огромны, другие отличаются необычайно большими глазами, носами или ртами; у всех на лбу рога. Один из приближённых советует вождю взять шишку танцора в залог, а остальные одобряют танец первого старика и отвергают выступление второго. После снятия и возвращения шишки демоны внезапно исчезают.
