id: my-lord-bag-of-rice-ozaki-1908
title: "Господин Рисовый Мешок"
original_title: "My Lord Bag of Rice"
kind: folktale
tradition:
  - japanese-folklore
collection: "Japanese Fairy Tales (Yei Theodora Ozaki, 1908)"
source:
  title: "My Lord Bag of Rice, Yei Theodora Ozaki, Japanese Fairy Tales (1908)"
  url: "https://www.gutenberg.org/cache/epub/4018/pg4018-images.html"
  note: "Полный английский текст MY LORD BAG OF RICE в сборнике Japanese Fairy Tales, Project Gutenberg #4018; также сверены сканы The Japanese Fairy Book на Wikisource. Вариант Одзаки, без смешения с другими пересказами легенды о Тавара Тода."
entities:
  - id: lake-biwa-dragon-king
    name: "Царь драконов озера Бива"
    type: character
    description: >-
      Повелитель подводного дворца на озере Бива. В облике огромного змея ложится поперёк моста, испытывая храбрость воина Хидэсато, затем предстаёт человеком и просит избавить его семью от чудовищной многоножки. После победы угощает гостя и награждает его тремя волшебными предметами, обеспечивающими неиссякаемую пищу, ткань и приготовление еды без огня.
  - id: giant-centipede-mikami
    name: "Гигантская многоножка горы Миками"
    type: creature
    description: >-
      Чудовищная многоножка, обвивающая гору Миками своим телом. Её глаза светятся как два огненных шара, а множество ног горят подобно фонарям. Она угрожает семье Царя драконов и невосприимчива к обычным стрелам. Хидэсато убивает её лишь третьей стрелой, предварительно смочив наконечник слюной, которую в рассказе считают губительной для многоножек.
  - id: dragon-kings-fish-retinue
    name: "Рыбы-слуги Царя драконов"
    type: creature
    description: >-
      Слуги подводного владыки, первоначально выглядящие как рыбы. При прощании с воином они превращаются в людей в парадных одеждах и драконьих венцах, несут дары хозяина к дому Хидэсато и исчезают, доставив их.
  - id: inexhaustible-rice-bag
    name: "Неиссякаемый мешок риса"
    type: artifact
    description: >-
      Подарок Царя драконов воину Хидэсато. Сколько бы риса ежедневно ни брали из мешка для семьи и слуг, запас не уменьшается. Благодаря этому дару герой получает прозвище Господин Рисовый Мешок.
  - id: inexhaustible-silk-roll
    name: "Неиссякаемый свиток шёлка"
    type: artifact
    description: >-
      Свёрток шёлковой ткани, подаренный Царём драконов. Даже после многократного отрезания длинных кусков для новых нарядов воина рулон не становится короче.
  - id: self-cooking-pot
    name: "Горшок, готовящий без огня"
    type: artifact
    description: >-
      Волшебная кухонная посуда из даров Царя драконов. Любая помещённая в неё пища готовится вкусно и без разведения огня, избавляя хозяина от расходов на топливо.
  - id: underwater-dragon-palace
    name: "Подводный дворец Царя драконов"
    type: location
    description: >-
      Дворец на дне озера Бива, куда Царь драконов приглашает Хидэсато. Здесь живут его семья и слуги-рыбы, здесь герой видит чудесное пиршество и наблюдает приближение гигантской многоножки к берегу. Владыка способен провести гостя во дворец и обратно.
