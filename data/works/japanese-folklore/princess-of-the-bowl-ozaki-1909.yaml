entities:
  - id: mothers-enchanted-bowl
    name: "Заколдованная чаша материнской защиты"
    type: artifact
    description: >-
      Большая лакированная чаша, которую умирающая мать надевает на голову юной принцессы, желая скрыть её красоту от опасностей. Сила материнского желания делает чашу сверхъестественно неотделимой от головы девушки: её не могут снять ни отец, ни слуги, ни люди Ямакагэ, а при попытках оторвать чаша издаёт крики и стоны. Когда принцесса попадает в реку, чаша держит её голову над водой и не даёт утонуть. В тот момент, когда девушке больше не нужна защита, чаша сама с треском распадается на множество частей, а под ней обнаруживается богатое приданое, приготовленное матерью. Текст прямо объясняет чудесную силу предмета материнской любовью.
