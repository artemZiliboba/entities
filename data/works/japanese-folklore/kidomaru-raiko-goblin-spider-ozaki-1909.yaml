id: kidomaru-raiko-goblin-spider-ozaki-1909
title: "Кидомару-разбойник, храбрый Райко и паук-оборотень"
original_title: "Kidomaru the Robber, Raiko the Brave, and the Goblin Spider"
kind: legend
tradition:
  - japanese-folklore
collection: "Warriors of Old Japan, and Other Stories (Yei Theodora Ozaki, 1909)"
source:
  title: "Kidomaru the Robber, Raiko the Brave, and the Goblin Spider, chapter VI, Yei Theodora Ozaki (1909)"
  url: "https://www.gutenberg.org/cache/epub/41437/pg41437-images.html"
  note: "Полностью прочитана глава VI от истории Кидомару до уничтожения паука, Project Gutenberg #41437. Включены три сюжета внутри одной авторской главы; с соседней главой V об Оэяме и другими версиями легенд не смешивалось."
entities:
  - id: kidomaru-posthumous-will
    name: "Кидомару — разбойник с посмертной волей"
    type: character
    description: >-
      Разбойник необычайной физической силы, способный разорвать железную цепь. После того как Райко отрубает ему голову, тело Кидомару остаётся стоять и успевает нанести удар кинжалом по седлу противника, прежде чем упасть. Рассказ прямо объясняет движение обезглавленного тела столь сильной злой волей разбойника, что она продолжает действовать после смерти.
  - id: goblin-spider
    name: "Паук-оборотень, принимавший облик послушника"
    type: creature
    description: >-
      Огромный паук-демон, который по ночам принимает облик юного храмового послушника и приносит заболевшему Райко якобы лекарство, от которого воину становится всё хуже. При разоблачении выбрасывает из рук липкую белую паутину, внезапно разрастающуюся в огромную сеть и сковывающую человека. Раненный мечом Райко, паук скрывается в горной пещере, где слуги воина обнаруживают его истинное чудовищное тело и убивают. После гибели существа Райко выздоравливает.
