id: the-bamboo-cutter-and-the-moon-child
title: "Бамбуковый резчик и лунное дитя"
original_title: "The Bamboo-Cutter and the Moon-Child"
kind: folktale
tradition:
  - japanese-folklore
collection: "The Japanese Fairy Book"
author: "Яэй Теодора Одзаки"
source:
  title: "The Japanese Fairy Book — The Bamboo-Cutter and the Moon-Child"
  url: "https://en.wikisource.org/wiki/The_Japanese_Fairy_Book/The_Bamboo-Cutter_and_the_Moon-Child"
  note: >
    Английская версия японской сказки из сборника Yei Theodora Ozaki,
    The Japanese Fairy Book. Запись следует только этой редакции и не смешивает
    её с другими версиями Такэтори-моногатари. Для контроля издания также
    использован Project Gutenberg eBook #4018.

entities:
  - id: princess-moonlight
    name: "Принцесса Лунный Свет"
    aliases:
      - "Лунное дитя"
      - "Кагуя-химэ"
    type: character
    description: >
      Небесная девушка, найденная трёхдюймовым ребёнком внутри сияющего бамбука.
      За три месяца она вырастает во взрослую женщину, сама излучает мягкий свет,
      может утрачивать телесную форму и превращаться в тень, а позднее признаётся,
      что пришла с Луны и должна вернуться туда после временного земного изгнания.
    tags:
      - moon-being
      - supernatural-child
      - radiance
      - transformation

  - id: luminous-bamboo
    name: "Сияющий бамбук"
    type: plant
    description: >
      Стебель бамбука, из полости которого исходит яркое мягкое сияние и внутри
      которого резчик обнаруживает крошечную Принцессу Лунный Свет. Он служит
      непосредственным местом её чудесного появления в земном мире.
    tags:
      - magical-plant
      - radiance
      - miraculous-birth

  - id: bamboo-wealth
    name: "Золото и драгоценности в бамбуке"
    type: phenomenon
    description: >
      После появления Принцессы резчик начинает находить в разрезаемых стеблях
      золото и драгоценные камни. Позднее глава лунных посланников объясняет,
      что это богатство было намеренно послано ими в награду за заботу о ней.
    tags:
      - supernatural-wealth
      - reward
      - bamboo

  - id: buddhas-shining-bowl
    name: "Сияющая каменная чаша Будды"
    type: artifact
    description: >
      Подлинная чаша Будды, которую первый жених должен привезти из Индии.
      Принцесса ожидает, что настоящая реликвия наполнит комнату светом; отсутствие
      сияния у поддельной чаши разоблачает обман жениха.
    tags:
      - sacred-relic
      - radiance
      - suitor-trial

  - id: mount-horai
    name: "Гора Хорай"
    type: location
    description: >
      Легендарная гора в Восточном море, куда второй жених должен отправиться за
      ветвью чудесного дерева. В рассказе это заведомо недостижимое место из
      области предания; жених не достигает его и вместо этого фабрикует реликвию.
    tags:
      - legendary-place
      - otherworld
      - suitor-trial

  - id: horai-jewel-tree
    name: "Драгоценное дерево Хорая"
    type: plant
    description: >
      Чудесное дерево, которое, по условию испытания, растёт на вершине Хорая:
      его корни серебряные, ствол золотой, а плоды представляют собой белые
      драгоценности. Жених приносит лишь искусную подделку его ветви.
    tags:
      - magical-tree
      - gold
      - silver
      - jewels
      - suitor-trial

  - id: fire-rat
    name: "Огненная крыса"
    type: creature
    description: >
      Сверхъестественное животное из Китая, части тела которого, согласно тексту,
      неуязвимы для огня. Третий жених должен добыть её шкуру, но полученная им
      вещь сгорает при проверке и оказывается поддельной.
    tags:
      - fireproof
      - magical-animal
      - suitor-trial

  - id: fire-rat-skin
    name: "Шкура огненной крысы"
    type: artifact
    description: >
      Искомая реликвия третьего испытания. Подлинная шкура должна выдерживать
      огонь без повреждений; Принцесса проверяет принесённый образец пламенем и
      по его сгоранию устанавливает, что он не настоящий.
    tags:
      - fireproof
      - magical-hide
      - suitor-trial

  - id: five-colour-jewel-dragon
    name: "Дракон с пятицветным камнем"
    type: creature
    description: >
      Дракон, который носит на голове камень, излучающий пять цветов. Четвёртый
      жених получает задание разыскать это существо и принести его камень, но
      отказывается от поисков после тяжёлого морского путешествия.
    tags:
      - dragon
      - magical-creature
      - suitor-trial

  - id: five-colour-radiating-jewel
    name: "Пятицветный камень дракона"
    type: artifact
    description: >
      Сверхъестественный камень на голове дракона, сияющий пятью цветами и
      требуемый Принцессой как доказательство четвёртого испытания. В выбранной
      версии он остаётся недобытым.
    tags:
      - magical-jewel
      - radiance
      - dragon
      - suitor-trial

  - id: moon-world
    name: "Лунный мир"
    type: location
    description: >
      Родина Принцессы Лунный Свет и её небесной семьи. Она была временно
      отправлена оттуда на Землю в наказание и в назначенную ночь должна
      вернуться туда вместе с лунными посланниками.
    tags:
      - moon
      - celestial-realm
      - otherworld

  - id: moon-envoys
    name: "Лунные посланники"
    type: creature
    description: >
      Группа светящихся небесных существ, прибывающих с Луны за Принцессой.
      Они появляются внутри спустившегося облака, не боятся двух тысяч воинов и
      беспрепятственно уводят её обратно в лунный мир.
    tags:
      - moon-beings
      - luminous
      - celestial-messengers

  - id: chief-moon-envoy
    name: "Вождь лунных посланников"
    type: character
    description: >
      Главный среди лунных существ, похожий на царя. Он выходит из небесной
      колесницы, остаётся парить в воздухе, объявляет о завершении земного срока
      Принцессы и раскрывает происхождение богатства, найденного в бамбуке.
    tags:
      - moon-being
      - leader
      - levitation

  - id: flying-moon-chariot
    name: "Летающая лунная колесница"
    type: artifact
    description: >
      Небесная колесница, прибывающая в опустившемся с Луны облаке вместе с
      посланниками. После прощания она поднимает Принцессу и её спутников обратно
      к Луне и исчезает среди облаков на рассвете.
    tags:
      - flying-vehicle
      - moon
      - celestial-transport

  - id: robe-of-wings
    name: "Крылатое одеяние"
    type: artifact
    description: >
      Чудесный плащ или одеяние с крыльями, которое лунные существа приносят для
      Принцессы перед возвращением. Она просит не надевать его сразу, чтобы ещё
      успеть написать последнее письмо Императору в человеческом облике.
    tags:
      - winged-robe
      - celestial-artifact
      - transformation

  - id: elixir-of-life
    name: "Эликсир жизни"
    type: substance
    description: >
      Жидкость в сосуде, принесённая лунными существами. Принцесса выпивает лишь
      часть и передаёт остаток вместе с письмом Императору; тот не решается его
      принять и велит сжечь эликсир на вершине Фудзи.
    tags:
      - immortality
      - elixir
      - moon

  - id: shadow-fading
    name: "Превращение Принцессы в тень"
    type: phenomenon
    description: >
      Сверхъестественное исчезновение телесной формы Принцессы, когда Император
      пытается принудить её отправиться во дворец. Она начинает блекнуть и
      превращаться в тень, а после обещания оставить её свободной вновь принимает
      прежний облик.
    tags:
      - transformation
      - disappearance
      - shadow

  - id: self-opening-screens
    name: "Самооткрывшиеся ширмы"
    type: phenomenon
    description: >
      В момент призыва лунного посланника ширмы комнаты, где скрыта Принцесса,
      сами собой раздвигаются и открывают её взору ожидающих. Обычная охрана дома
      не способна воспрепятствовать этому действию.
    tags:
      - supernatural-opening
      - moon-magic
      - revelation
