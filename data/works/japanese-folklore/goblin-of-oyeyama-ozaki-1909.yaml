id: goblin-of-oyeyama-ozaki-1909
title: "Демон горы Оэяма"
original_title: "The Goblin of Oyeyama"
kind: legend
tradition:
  - japanese-folklore
collection: "Warriors of Old Japan, and Other Stories (Yei Theodora Ozaki, 1909)"
source:
  title: "The Goblin of Oyeyama, chapter V, Yei Theodora Ozaki, Warriors of Old Japan, and Other Stories (1909)"
  url: "https://www.gutenberg.org/cache/epub/41437/pg41437-images.html"
  note: "Полностью прочитана отдельная глава V, THE GOBLIN OF OYEYAMA, от описания похищений до возвращения Райко в Киото, Project Gutenberg #41437. Не смешано с соседней главой о Кидомару и пауке и с иными версиями легенды о Сютэндодзи."
entities:
  - id: shutendoji
    name: "Сютэндодзи"
    type: creature
    description: >-
      Огромный краснокожий демон, владыка горы Оэяма, похищающий жителей Киото и держащий пленниц в железном дворце. Умеет принимать человеческий облик, чтобы проникать в столицу. После того как боги связывают его, а Райко отрубает ему голову, отделённая голова взлетает, изрыгает пламя и пытается укусить воина; второй удар меча останавливает её.
  - id: oyeyama-oni-retinue
    name: "Они — свита Сютэндодзи"
    type: creature
    description: >-
      Демоны, прислуживающие владыке горы Оэяма и охраняющие его железный дворец. Двое стражей у ворот имеют красную и чёрную кожу и вооружены железными дубинами. Другие демоны участвуют в пиршествах и теряют сознание после волшебного сакэ, а затем погибают от мечей спутников Райко.
  - id: three-shrine-deities
    name: "Три божества — покровители воинов"
    type: character
    description: >-
      Божества святилищ Сумиёси, Кумано и Хатимана, к которым воины обращаются с молитвами перед походом. На горной тропе являются тремя старцами, передают Райко чудесное сакэ и исчезают, окружённые светом. Позднее вновь появляются в сияющем облаке внутри дворца и сообщают, что связали руки и ноги Сютэндодзи. Райко распознаёт их как богов посещённых святилищ.
  - id: shimben-kidoku-shu
    name: "Симбэн-кидоку-сю — сакэ против демонов"
    type: substance
    description: >-
      Волшебное сакэ, подаренное Райко тремя божествами в белом кувшине. Для людей оно служит укрепляющим напитком, а демонов лишает сил и погружает в беспомощный сон. На пиру в дворце Сютэндодзи напиток передают из чаши в чашу, но запас в сосуде не уменьшается, сколько бы из него ни наливали. Благодаря сакэ воины могут напасть на спящих демонов.
  - id: black-iron-palace
    name: "Дворец Чёрного железа"
    type: location
    description: >-
      Крепость Сютэндодзи на горе Оэяма, выстроенная из чёрного железа и охраняемая демонами. Здесь чудовище держит похищенных девушек и устраивает людоедские пиры. Дворец служит резиденцией они, однако сам материал стен не обладает доказанной магической силой.
