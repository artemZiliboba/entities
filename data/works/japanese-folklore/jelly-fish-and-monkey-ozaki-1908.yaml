id: jelly-fish-and-monkey-ozaki-1908
title: "Медуза и обезьяна"
original_title: "The Jelly Fish and the Monkey"
kind: folktale
tradition:
  - japanese-folklore
collection: "Japanese Fairy Tales (Yei Theodora Ozaki, 1908)"
source:
  title: "The Jelly Fish and the Monkey, Yei Theodora Ozaki, Japanese Fairy Tales (1908)"
  url: "https://www.gutenberg.org/cache/epub/4018/pg4018-images.html"
  note: "Полный английский рассказ THE JELLY FISH AND THE MONKEY из сборника Japanese Fairy Tales, Project Gutenberg #4018, от описания морского царства до объяснения бескостности медуз. Только вариант Одзаки; другие версии (включая Chamberlain) не смешивались."
entities:
  - id: rin-jin-dragon-king
    name: "Риндзин — Царь драконов моря"
    type: character
    description: >-
      Сверхъестественный владыка морских существ, живущий в роскошном дворце на дне океана. Хранит две драгоценности, с помощью которых можно заставлять море отступать или поднимать громадные приливные волны. Чтобы исцелить заболевшую жену, приказывает медузе привести живую обезьяну. После неудачи посланника велит лишить медузу костей и избить.
  - id: dragon-queen
    name: "Морская царица-драконица"
    type: creature
    description: >-
      Молодая драконица с зелёной блестящей чешуёй и огненными глазами, ставшая женой Риндзина. После свадьбы заболевает, и придворный врач объявляет, что вылечить её сможет только печень живой обезьяны. Исцеление в рассказе не показано, поскольку обезьяна ускользает.
  - id: jellyfish-formerly-legged
    name: "Медуза-курáгэ"
    type: creature
    description: >-
      В древности медуза была существом с четырьмя ногами, твёрдым панцирем и костями, способным выходить на сушу. Морской царь посылает её за обезьяной; медуза переносит обезьяну на спине, но раскрывает цель путешествия и верит выдумке о печени, оставленной на дереве. За провал ей вытаскивают кости и избивают до бесформенного состояния; сказка объясняет этим бескостность её потомков.
  - id: ebbing-tide-jewel
    name: "Драгоценность отлива"
    type: artifact
    description: >-
      Одна из двух волшебных драгоценностей, хранящихся у Риндзина. Если бросить её в океан, вода отступает от суши. В рассказе эта сила прямо описана при представлении морского царства, но применение камня в событиях путешествия медузы не показано.
  - id: flowing-tide-jewel
    name: "Драгоценность прилива"
    type: artifact
    description: >-
      Вторая волшебная драгоценность морского царя. При броске в океан вызывает подъём волн высотой с горы и затопление берега. Как и драгоценность отлива, упоминается в начале рассказа как знак власти Риндзина, но не используется в основном действии.
  - id: dragon-kings-sea-palace
    name: "Подводный дворец Риндзина"
    type: location
    description: >-
      Резиденция морского Царя драконов на дне океана, где живут владыка, его жена и многочисленные морские слуги. Дворец построен из коралла, украшен драгоценными минералами и перламутром; в саду растут необычные коралловые деревья с плодами, похожими на самоцветы. Это место обитания драконов и подводного двора, но сами строительные материалы не объявлены волшебными.
