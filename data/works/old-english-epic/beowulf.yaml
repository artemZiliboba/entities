id: beowulf
title: "Беовульф"
original_title: "Beowulf"
kind: epic
tradition:
  - old-english-epic
collection: "Beowulf: An Anglo-Saxon Epic Poem"
source:
  title: "Beowulf: An Anglo-Saxon Epic Poem"
  url: "https://www.gutenberg.org/files/16328/16328-h/16328-h.htm"
  note: >
    Английский перевод Джона Лессли Холла (1892) с текста Heyne-Socin,
    опубликованный Project Gutenberg. Запись следует этой редакции и не
    смешивает детали других переводов и позднейших адаптаций.

entities:
  - id: grendel
    name: "Грендель"
    type: creature
    description: >
      Сверхъестественное чудовище, много лет нападающее по ночам на Хеорот.
      Оно обладает огромной физической силой, голыми руками распахивает
      укреплённые двери зала и уносит людей, пока Беовульф не побеждает его
      в рукопашной схватке, смертельно оторвав ему руку.
    tags:
      - monster
      - supernatural-strength
      - night-creature

  - id: grendels-mother
    name: "Мать Гренделя"
    type: creature
    description: >
      Чудовищная обитательница подводного логова, приходящая в Хеорот мстить
      за смерть сына. Она уносит одного из людей Хродгара и затем сражается
      с Беовульфом в зале под водой, где обычный меч героя оказывается
      бесполезен против неё.
    tags:
      - monster
      - underwater
      - avenger

  - id: giants-sword
    name: "Древний меч великанов"
    type: artifact
    description: >
      Огромный старинный меч работы великанов, найденный Беовульфом в логове
      матери Гренделя. Обычный человек не смог бы носить это оружие; Беовульф
      убивает им хозяйку логова, после чего клинок тает от соприкосновения с
      кровью Гренделя, оставляя рукоять.
    tags:
      - giant-made
      - sword
      - supernatural-weapon

  - id: fire-dragon
    name: "Огненный дракон"
    type: creature
    description: >
      Летающий огнедышащий дракон, веками охраняющий древний клад в кургане.
      После кражи чаши он покидает логово и выжигает владения геатов, а в
      финальной битве смертельно ранит Беовульфа, прежде чем погибнуть от рук
      героя и Виглафа.
    tags:
      - dragon
      - fire
      - treasure-guardian
