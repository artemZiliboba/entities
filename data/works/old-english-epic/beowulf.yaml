id: beowulf
title: "Беовульф"
original_title: "Beowulf"
kind: epic
tradition:
  - old-english-epic
collection: "Beowulf: An Anglo-Saxon Epic Poem"
source:
  title: "Beowulf: An Anglo-Saxon Epic Poem"
  url: "https://www.gutenberg.org/files/16328/16328-h/16328-h.htm"
  note: >
    Английский перевод Джона Лессли Холла (1892) с текста Heyne-Socin,
    опубликованный Project Gutenberg. Запись следует этой редакции и не
    смешивает детали других переводов и позднейших адаптаций.

entities:
  - id: grendel
    name: "Грендель"
    type: creature
    description: >
      Сверхъестественное чудовище, много лет нападающее по ночам на Хеорот.
      Оно обладает огромной физической силой, голыми руками распахивает
      укреплённые двери зала и уносит людей. В этой редакции также прямо
      говорится, что обычное оружие не могло ранить Гренделя; Беовульф
      побеждает его в рукопашной схватке, смертельно оторвав ему руку.
    tags:
      - monster
      - supernatural-strength
      - weapon-immunity
      - night-creature

  - id: grendel-weapon-immunity
    name: "Неуязвимость Гренделя для оружия"
    type: phenomenon
    description: >
      Сверхъестественная защита Гренделя, из-за которой земные мечи и иное
      оружие не способны причинить ему вред. В переводе Холла это свойство
      прямо поясняется как невозможность ранить чудовище оружием, поэтому
      Беовульф одерживает победу голыми руками.
    tags:
      - invulnerability
      - weapon-immunity
      - enchantment

  - id: grendels-mother
    name: "Мать Гренделя"
    type: creature
    description: >
      Чудовищная обитательница подводного логова, приходящая в Хеорот мстить
      за смерть сына. Она уносит одного из людей Хродгара и затем сражается
      с Беовульфом в зале под водой, где Хрунтинг оказывается бесполезен
      против неё.
    tags:
      - monster
      - underwater
      - avenger

  - id: breca-swim-nickers
    name: "Девять никеров из морского испытания Беовульфа"
    type: creature
    description: >
      Морские чудовища, напавшие на Беовульфа во время его многодневного
      состязания в плавании с Брекой. Герой рассказывает, что одно из существ
      утянуло его ко дну, а к рассвету он убил девять никеров, после чего
      морские путешественники были избавлены от их нападений.
    tags:
      - sea-monster
      - nicker
      - underwater

  - id: grendel-mere-monsters
    name: "Морские драконы и никеры у логова Гренделя"
    type: creature
    description: >
      Сверхъестественные обитатели водоёма у логова Гренделя и его матери:
      змеи, морские драконы и никеры, которых воины видят в воде и на скалах.
      Одного из этих чудовищ Беовульф убивает стрелой, после чего его вытаскивают
      на берег и рассматривают спутники героя.
    tags:
      - sea-monster
      - sea-dragon
      - nicker
      - guardian

  - id: grendels-underwater-hall
    name: "Подводный зал Гренделя и его матери"
    type: location
    description: >
      Подводное логово, куда мать Гренделя уносит Беовульфа. Внутри находится
      крытый зал, куда не проникает окружающая вода; помещение освещено
      необычным огненным сиянием и служит местом решающей схватки героя с
      хозяйкой логова.
    tags:
      - underwater
      - monster-lair
      - supernatural-location

  - id: giants-sword
    name: "Древний меч великанов"
    type: artifact
    description: >
      Огромный старинный меч работы великанов, найденный Беовульфом в логове
      матери Гренделя. Обычный человек не смог бы носить это оружие; Беовульф
      убивает им хозяйку логова, после чего клинок тает от соприкосновения с
      кровью Гренделя, оставляя рукоять с древними рунами.
    tags:
      - giant-made
      - sword
      - supernatural-weapon

  - id: fire-dragon
    name: "Огненный дракон"
    type: creature
    description: >
      Летающий огнедышащий дракон, веками охраняющий древний клад в кургане.
      После кражи чаши он покидает логово и выжигает владения геатов, а в
      финальной битве смертельно ранит Беовульфа, прежде чем погибнуть от рук
      героя и Виглафа.
    tags:
      - dragon
      - fire
      - treasure-guardian

  - id: enchanted-dragon-hoard
    name: "Заколдованный клад дракона"
    type: artifact
    description: >
      Древний клад из сосудов, украшений и оружия, веками лежащий в земляном
      хранилище, которое затем сторожит дракон. После его гибели текст прямо
      поясняет, что сокровище было защищено магией и недоступно людям без
      особого дозволения свыше.
    tags:
      - treasure
      - enchantment
      - dragon-hoard

  - id: hoard-warding-magic
    name: "Магическая охрана клада"
    type: spell
    description: >
      Неназванное охранное колдовство, наложенное на древний клад. Оно не
      позволяет людям прикасаться к сокровищу и открывать хранилище, кроме тех,
      кому доступ к нему оказывается дозволен; перевод Холла прямо называет
      клад защищённым магией.
    tags:
      - ward
      - protection
      - treasure
