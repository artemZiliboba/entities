id: magic-fiddle-santal-jacobs-1892
title: "Волшебная скрипка"
original_title: "The Magic Fiddle"
kind: folktale
tradition:
  - santal-folklore
collection: "Indian Fairy Tales (Joseph Jacobs, 1892)"
source:
  title: "The Magic Fiddle, tale VI, in Indian Fairy Tales, Joseph Jacobs (1892)"
  url: "https://www.gutenberg.org/cache/epub/7128/pg7128-images.html"
  note: "Только сказка VI, The Magic Fiddle, в редакции Джозефа Джейкобса 1892 года, восходящая к A. Campbell, Santal Folk-Tales (1892), pp. 52–56. Прочитан полный рассказ от козней невесток до встречи девушки с братьями; другие версии не смешивались."
entities:
  - id: bonga-water-spirit
    name: "Бонга, утопивший девушку"
    type: creature
    description: >-
      Дух бонга, к которому обращаются жёны семерых братьев с просьбой помешать их сестре набрать воду. По его вмешательству вода в пруду исчезает, затем поднимается всё выше, но кувшин девушки не погружается в неё, пока та не тонет. После гибели девушки дух превращает её в бонга, подобного себе, и уводит с собой.
  - id: transformed-bonga-girl
    name: "Девушка, ставшая бонга"
    type: character
    description: >-
      Сестра семерых братьев, утопленная из-за зависти невесток и превращённая духом в бонга. Позднее появляется в облике огромного говорящего бамбука. Из сделанной из него скрипки выходит в человеческом облике, готовит еду для семьи деревенского старосты и возвращается в инструмент. После того как сын старосты удерживает её, остаётся жить с ним и при встрече с братьями рассказывает о пережитом.
  - id: bamboo-fiddle
    name: "Скрипка из говорящего бамбука"
    type: artifact
    description: >-
      Музыкальный инструмент, который странствующий йог изготавливает из необычного бамбука, прежде говорившего человеческим голосом и препятствовавшего рубке. Скрипка звучит особенно проникновенно, её мелодия заставляет слушателей плакать и напоминает братьям об утраченной сестре. Внутри неё скрывается превращённая в бонга девушка, способная выходить из инструмента и возвращаться в него; именно связь с девушкой делает скрипку чудесной.
