id: battle-of-the-birds-jacobs-1892
title: "Битва птиц"
original_title: "The Battle of the Birds"
kind: folktale
tradition:
  - scottish-folklore
collection: "Celtic Fairy Tales"
author: "Джозеф Джейкобс (редактор, 1892)"
source:
  title: "Joseph Jacobs, Celtic Fairy Tales (1892), The Battle of the Birds, pp. 206–222"
  url: "https://en.wikisource.org/wiki/Celtic_Fairy_Tales/The_Battle_of_the_Birds"
  note: "Полный текст конкретной редакции Джозефа Джейкобса, включая начало о крапивнике и финал с говорящими голубями. Джейкобс сам составил её по материалам Джона Фрэнсиса Кэмпбелла с деталями других записей; дополнительно не смешивались независимые варианты."
entities:
  - id: wren
    name: "Говорящий крапивник"
    type: animal
    description: >-
      Крапивник нанимается батраком к земледельцу, разговаривает с людьми, молотит зерно цепом и вступает в спор с мышью, из-за которого птицы и звери сходятся на битву. Сверхъестественность проявляется в человеческой речи и поведении; других чар ему не приписано.
  - id: enchanted-raven
    name: "Заколдованный ворон"
    type: character
    description: >-
      Большой чёрный ворон, спасённый принцем от змеи. Говорит с ним, переносит его через горы и долины, знакомит с сёстрами, а на третий день является прекрасным юношей. Объясняет, что злой друид наложил на него чары, а встреча с принцем освободила его.
  - id: evil-druid
    name: "Злой друид"
    type: character
    description: >-
      Не названный по имени колдун, прежде превративший юношу в ворона. О нём известно только со слов освобождённого юноши; иных действий и способностей сказка не сообщает.
  - id: enchanted-castle-bundle
    name: "Узелок с замком и садом"
    type: artifact
    description: >-
      Подарок освобождённого ворона принцу: маленький узелок, при развязывании которого возникает большой замок с садом и плодовым деревом. Великан умеет снова свернуть замок и сад в узелок, чтобы перенести их в желаемое место.
  - id: giant
    name: "Великан — отец Рыжей Мэри"
    type: creature
    description: >-
      Великан, способный мгновенно свернуть огромный замок с садом обратно в узелок. Взамен требует первенца королевского сына по достижении семи лет, забирает мальчика и позднее испытывает его невыполнимыми заданиями. Преследуя дочь, проявляет огромную силу, но гибнет в чудесно возникшем озере.
  - id: auburn-mary
    name: "Рыжая Мэри"
    type: character
    description: >-
      Младшая дочь великана, тайно помогающая воспитанному отцом королевичу: за ночь очищает хлев и покрывает его крышей из разноцветного пуха. Велит юноше разобрать её тело на кости, чтобы взобраться по гладкому дереву, а затем оживить её водой; позднее оживляет яблочные дольки, создаёт преграды во время бегства и вызывает говорящих голубей из бокала вина.
  - id: resurrection-spring
    name: "Источник оживления Рыжей Мэри"
    type: location
    description: >-
      Родник у основания огромной ели. Когда принц раскладывает кости и плоть убитой по её приказу Мэри и окропляет их водой из источника, девушка возвращается к жизни. Недостающий мизинец не восстанавливается, потому что его кость оставлена на дереве.
  - id: speaking-apple-pieces
    name: "Говорящие дольки яблока"
    type: artifact
    description: >-
      Девять долек яблока, разложенных Рыжей Мэри в доме перед побегом. Они по очереди отвечают на вопросы проснувшегося великана, выдавая себя за беглецов и задерживая погоню. После этой сцены новых действий долек не описано.
  - id: grey-filly
    name: "Серо-голубая кобылка"
    type: animal
    description: >-
      Лошадь, на которой бегут от великана принц и Рыжая Мэри. В её ухе по очереди оказываются терновая веточка, каменная щепка и пузырь с водой: брошенные за спину, они мгновенно становятся огромной терновой чащей, каменной преградой и озером. Источник волшебства не разъясняется; конь и дары из уха объединены в один комплекс.
  - id: magic-flight-barriers
    name: "Три чудесные преграды при бегстве"
    type: spell
    description: >-
      Три последовательных превращения предметов, извлечённых из уха серо-голубой кобылки: терновая ветка становится лесом в двадцать миль, осколок камня — огромной каменной стеной, а пузырь воды — озером в двадцать миль. Последняя преграда топит преследующего великана.
  - id: forgetting-kiss
    name: "Забывающий поцелуй"
    type: phenomenon
    description: >-
      Рыжая Мэри предупреждает принца, что поцелуй человека или животного заставит его забыть о ней. Вернувшись во дворец, он получает поцелуй старой борзой и действительно утрачивает память о возлюбленной, пока не слышит рассказ говорящих голубей.
  - id: golden-and-silver-pigeons
    name: "Золотой и серебряный голуби"
    type: creature
    description: >-
      Два необычных голубя, возникающих вместе с пламенем из бокала вина Рыжей Мэри на свадьбе принца. Они разговаривают и разыгрывают сцены из прежних испытаний, напоминая принцу о помощи девушки и возвращая ему память.
