id: molly-whuppie-jacobs-1890
title: "Молли Уаппи"
original_title: "Molly Whuppie"
kind: folktale
tradition:
  - scottish-folklore
collection: "English Fairy Tales, Joseph Jacobs (1890)"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), Molly Whuppie"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/Molly_Whuppie"
  note: "Прочитан полный текст сказки Molly Whuppie в редакции Джозефа Джейкобса (1890), включая все три возвращения к великану. Варианты с дополнительными волшебными свойствами похищенных вещей не использованы."
entities:
  - id: molly-whuppies-giant
    name: "Великан из дома в лесу"
    type: creature
    description: >-
      Огромный людоед, живущий с женой и тремя дочерьми в лесном доме. По запаху распознаёт присутствие посторонних людей и ночью пытается убить трёх девочек, но из-за подменённых Молли соломенных верёвок и золотых цепочек убивает собственных дочерей. Позднее трижды преследует Молли после похищения меча, кошелька и кольца, но не может перейти мост в один волос. Его огромный рост и людоедская природа подтверждены рассказом; способности колдовать текст не показывает.
  - id: bridge-of-one-hair
    name: "Мост в один волос"
    type: location
    description: >-
      Необычайно тонкий мост, который Молли Уаппи трижды пересекает, убегая от великана после похищения его меча, кошелька и кольца. Великан ни разу не может перейти вслед за ней, поэтому мост служит постоянной границей спасения. Текст не объясняет, создан ли он волшебством, и не утверждает, что он самостоятельно заколдовывает или отбрасывает великана.
