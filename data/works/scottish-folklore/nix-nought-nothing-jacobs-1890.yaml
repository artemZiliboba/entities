id: nix-nought-nothing-jacobs-1890
title: "Никс Ничего Ничего"
original_title: "Nix Nought Nothing"
kind: folktale
tradition:
  - scottish-folklore
collection: "English Fairy Tales, Joseph Jacobs (1890)"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), Nix Nought Nothing"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/Nix_Nought_Nothing"
  note: "Прочитан полный самостоятельный рассказ из редакции Джозефа Джейкобса 1890 года; сведения из других вариантов сюжета о дочери великана не добавлены."
entities:
  - id: nix-giant
    name: "Великан, похитивший Никса"
    type: creature
    description: >-
      Огромный великан, переносящий короля через опасную реку на спине в обмен на обещанного ему Никса Ничего Ничего. Получив мальчика, воспитывает его, а повзрослевшему герою назначает три практически невыполнимых задания под угрозой съедения: очистить громадную конюшню, осушить озеро и добыть семь яиц с дерева высотой в семь миль. Преследует беглецов, но гибнет в волне, выпущенной из волшебной фляги его дочери. Текст не показывает у него колдовства помимо сказочной силы и размеров.
  - id: giants-daughter-nix
    name: "Дочь великана — волшебная помощница"
    type: character
    description: >-
      Дочь великана, которая любит Никса и обладает необычными способностями. По её зову полевые звери и птицы очищают огромную конюшню, а морские рыбы выпивают целое озеро. Чтобы герой взобрался на гладкое дерево, она отрезает собственные пальцы рук и ног и превращает их в ступени. Во время бегства указывает, когда бросить волшебные предметы, и сама разбивает флягу, вызывающую губительную волну. Её действия позволяют герою избежать смерти.
  - id: giants-daughters-comb
    name: "Гребень, порождающий терновник"
    type: artifact
    description: >-
      Гребень из волос дочери великана. Во время погони она велит Никсу бросить его на землю, и из каждого зубца мгновенно вырастает густой колючий куст. Великан вынужден долго пробираться через заросли, пока беглецы удаляются.
  - id: giants-daughters-hair-dagger
    name: "Кинжал для волос, порождающий изгородь из бритв"
    type: artifact
    description: >-
      Кинжал-заколка дочери великана, который Никс бросает по её приказу во время погони. На месте предмета мгновенно возникает плотная изгородь из острых перекрещённых бритв. Великан вынужден осторожно преодолевать преграду, что даёт беглецам время скрыться.
  - id: giants-daughters-magic-flask
    name: "Волшебная фляга с губительной волной"
    type: artifact
    description: >-
      Волшебная фляга, взятая дочерью великана из своей комнаты перед побегом. Когда отец почти хватает Никса, девушка разбивает флягу о землю. Из неё вырывается и быстро поднимается огромная волна, которая накрывает и топит великана.
  - id: vengeful-henwife
    name: "Птичница, насылающая непробудный сон"
    type: character
    description: >-
      Птичница, сын которой погиб от руки великана после того, как королевская семья пыталась подменить им Никса. Узнав вернувшегося героя, она из мести накладывает на него чары: едва войдя в родительский замок, Никс падает в непробудный сон. Позже птичница обучает дочь садовника противозаклинанию, позволяющему временно будить спящего.
  - id: waking-countercharm
    name: "Песенное противозаклинание сна"
    type: spell
    description: >-
      Противозаклинание, которому птичница обучает дочь садовника. Девушка поёт его в замке, и Никс на время пробуждается от наложенного птичницей сна. После повторного исполнения песни герой окончательно просыпается для разговора с родителями и своей настоящей невестой. Текст не приводит точных слов заклинания, поэтому их нельзя реконструировать.
