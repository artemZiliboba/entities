id: childe-rowland-jacobs-1890
title: "Юный Роланд"
original_title: "Childe Rowland"
kind: folktale
tradition:
  - scottish-folklore
collection: "English Fairy Tales, рассказ XXI"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), No. XXI, Childe Rowland"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/Childe_Rowland"
  note: "Прочитан полный рассказ XXI в редакции Джозефа Джейкобса 1890 года, опубликованный на Wikisource. Не смешивать с иными версиями баллады и пересказами о Роланде."
entities:
  - id: warlock-merlin
    name: "Колдун Мерлин"
    type: character
    description: >-
      Волшебник, к которому братья обращаются после исчезновения Бёрд Эллен. Мерлин знает, что девушку увели феи в Тёмную башню короля Эльфландии, и объясняет путь к ней. Он предупреждает, что в стране эльфов нельзя есть и пить, а встречных следует поражать мечом до встречи с сестрой. В этом варианте Мерлин выступает прорицателем и наставником, но сам не освобождает пленников.
  - id: king-of-elfland
    name: "Король Эльфландии"
    type: character
    description: >-
      Владыка страны эльфов, чьими чарами удерживаются Бёрд Эллен и два её брата. Старшие братья лежат в Тёмной башне словно мёртвые, а сестра не может предупредить Роланда об опасности. После поражения в поединке король соглашается освободить пленников, оживляет братьев кроваво-красной жидкостью из флакона и снимает заклятие с девушки произнесёнными словами.
  - id: queens-victorious-sword
    name: "Меч, не знающий промаха"
    type: artifact
    description: >-
      Отцовский меч, который мать вручает юному Роланду перед походом и над которым произносит заклинание победы. Рассказ подчёркивает, что меч никогда не разил напрасно: Роланд с его помощью обезглавливает встреченных слуг короля эльфов и одолевает самого короля, заставив того снять чары с пленников. Чудесная сила меча связывается с благословением матери и его необычайной надёжностью.
  - id: blood-red-reviving-liquid
    name: "Кроваво-красное оживляющее снадобье"
    type: substance
    description: >-
      Жидкость кроваво-красного цвета из флакона в сундуке короля Эльфландии. После поражения король смазывает ею уши, веки, ноздри, губы и кончики пальцев двух заколдованных братьев Роланда. Оба немедленно возвращаются к жизни и рассказывают, что их души отсутствовали, но теперь вернулись.
  - id: elfland-dark-tower
    name: "Тёмная башня короля Эльфландии"
    type: location
    description: >-
      Волшебное обиталище короля эльфов внутри зелёного холма. Дверь открывается после трёх обходов холма против движения солнца и повторённой просьбы впустить путника. За ней находятся сумрачные проходы и огромный зал, освещённый вращающимся драгоценным камнем. Здесь удерживаются заколдованные братья и сестра Роланда; место служит входом в иное царство.
  - id: elfland-enchanted-food
    name: "Пища страны эльфов"
    type: substance
    description: >-
      Еда и питьё в стране эльфов, от которых Мерлин строго предостерегает братьев: съевший хотя бы кусок или выпивший каплю не сможет вернуться в мир людей. Бёрд Эллен приносит Роланду хлеб и молоко в золотой чаше, но герой вспоминает запрет и выбрасывает угощение. Само действие чар не показано, однако условие сверхъестественной опасности прямо сформулировано Мерлином.
