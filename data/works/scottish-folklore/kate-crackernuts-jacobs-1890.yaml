id: kate-crackernuts-jacobs-1890
title: "Кейт Щелкунья"
original_title: "Kate Crackernuts"
kind: folktale
tradition:
  - scottish-folklore
collection: "English Fairy Tales (Joseph Jacobs, 1890)"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), Kate Crackernuts"
  url: "https://en.wikisource.org/wiki/English_Fairy_Tales/Kate_Crackernuts"
  note: "Прочитан полный самостоятельный рассказ в редакции Джозефа Джейкобса (1890). Извлечены только сущности, показанные в этом варианте, без переноса деталей иных шотландских вариантов."
entities:
  - id: henwife-witch
    name: "Птичница-колдунья"
    type: character
    description: >-
      Женщина, к которой завистливая королева трижды посылает падчерицу Анну натощак. Дважды девушка успевает поесть по дороге, и ничего не происходит; в третий раз она приходит голодной, поднимает крышку горшка, после чего её собственная голова отпадает и заменяется овечьей. Птичница организует колдовство, но текст не описывает произносимого ею заклинания.
  - id: head-changing-pot
    name: "Горшок, меняющий голову"
    type: artifact
    description: >-
      Горшок птичницы, крышку которого Анна должна поднять по её приказу. Если девушка успевает поесть перед визитом, действие не наступает. Когда она приходит натощак и поднимает крышку, человеческая голова отделяется и на её месте появляется овечья. Рассказ не уточняет, заключена ли сила в самом горшке или в колдовстве птичницы; предмет включён как непосредственный носитель чудесного действия.
  - id: fairy-dancing-company
    name: "Феи ночного бала"
    type: creature
    description: >-
      Множество прекрасных фей, танцующих ночью в зале внутри зелёного холма. Они окружают заколдованного принца и заставляют его плясать до полного изнеможения; когда он падает, обмахивают его веерами, пока он не сможет продолжать. Среди фей есть ребёнок, играющий чудесным жезлом и птицей. Кейт незаметно наблюдает за их собранием три ночи подряд.
  - id: opening-green-hill
    name: "Зелёный холм — вход в зал фей"
    type: location
    description: >-
      Зелёный холм, к которому больной принц каждую полночь приезжает верхом. По произнесённой им формуле холм раскрывается, пропуская всадника, коня и собаку; Кейт добавляет слова о себе и тоже попадает внутрь. За проходом находится ярко освещённый зал, где феи проводят изнурительные танцы до петушиного крика.
  - id: fairy-restoring-wand
    name: "Жезл, снимающий заклятие с Анны"
    type: artifact
    description: >-
      Жезл, с которым играет ребёнок фей. Подслушав слова феи, Кейт узнаёт, что три прикосновения жезла вернут сестре прежнюю внешность. Она отвлекает ребёнка орехами, забирает жезл и дома трижды касается Анны: овечья голова исчезает, а человеческая возвращается.
  - id: healing-fairy-bird
    name: "Птица, исцеляющая принца"
    type: animal
    description: >-
      Птица, с которой играет ребёнок фей в третью ночь. Кейт слышит, что три кусочка её мяса способны исцелить изнурённого принца, и выманивает птицу орехами. Дома она готовит её и даёт принцу три порции: после каждой он заметно крепнет, а после третьей полностью выздоравливает. Иных волшебных свойств птицы текст не сообщает.
