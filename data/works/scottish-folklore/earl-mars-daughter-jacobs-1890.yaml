id: earl-mars-daughter-jacobs-1890
title: "Дочь графа Мара"
original_title: "Earl Mar's Daughter"
kind: folktale
tradition:
  - scottish-folklore
collection: "English Fairy Tales, рассказ XXIX"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), No. XXIX, Earl Mar's Daughter"
  url: "https://www.gutenberg.org/cache/epub/7439/pg7439-images.html"
  note: "Полный текст рассказа XXIX в редакции Джозефа Джейкобса (1890), переложенный им из одноимённой баллады в Ballad Book Уильяма Аллингема. Включены только события этой редакции, без сведений из других версий баллады."
entities:
  - id: prince-florentine-dove
    name: "Принц Флорентин — голубь"
    type: character
    description: >-
      Сын королевы-волшебницы, превращённый матерью в голубя за непослушание. Днём он живёт в птичьем облике, а ночью снова становится человеком; дочь графа Мара принимает голубя в комнату и тайно выходит за принца замуж. Когда отец жены грозит убить птицу, Флорентин улетает к матери. После нового колдовства он становится ястребом и возглавляет стаю птиц, спасающую жену от навязанной свадьбы. В конце мать снимает с него чары.
  - id: florentines-enchantress-mother
    name: "Мать Флорентина — королева-волшебница"
    type: character
    description: >-
      Королева, владеющая магией и заклинаниями. За неповиновение обращает сына Флорентина в голубя на дневное время. Позднее, узнав о насильственной свадьбе его жены, признаёт, что не может сама совершить требуемое превращение, и обращается за помощью к своей наставнице, вещунье из Остри. Вернувшись с горящими травами, произносит заклинание, превращающее Флорентина в ястреба, его семерых сыновей — в лебедят, а музыкантов и танцоров — в серых цапель. В конце освобождает сына от первоначальных чар.
  - id: spaewife-of-ostree
    name: "Вещунья из Остри"
    type: character
    description: >-
      Наставница королевы-волшебницы, живущая в пещере в Остри. Когда королева не может своими силами превратить сына, его детей и слуг в птиц, она обращается к вещунье за помощью. После посещения пещеры королева возвращается с дымящимися травами и осуществляет превращение. Рассказ не показывает собственных заклинаний вещуньи и не уточняет, какой именно совет или средство та дала.
  - id: enchanted-bird-retinue
    name: "Заколдованная птичья свита"
    type: creature
    description: >-
      Семеро сыновей Флорентина, превращённые в белых лебедят, и двадцать четыре танцора и музыканта, превращённые в серых цапель по заклинанию королевы. Вместе с принцем-ястребом они прилетают к замку графа Мара, разгоняют свадебную процессию и уносят мать лебедят на сложенном из птичьих тел подобии перины. Превращение всей свиты совершается одним общим магическим действием; текст не сообщает об отдельных способностях каждого участника.
