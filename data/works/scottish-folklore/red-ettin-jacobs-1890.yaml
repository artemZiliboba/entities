id: red-ettin-jacobs-1890
title: "Красный эттин"
original_title: "The Red Ettin"
kind: folktale
tradition:
  - scottish-folklore
collection: "English Fairy Tales, рассказ XXIII"
author: "Джозеф Джейкобс (составитель и редактор)"
source:
  title: "Joseph Jacobs, English Fairy Tales (1890), No. XXIII, The Red Ettin"
  url: "https://www.gutenberg.org/cache/epub/7439/pg7439-images.html"
  note: "Полный рассказ XXIII в редакции Джейкобса 1890 года. В примечании Джейкобс указывает The Red Etin из Popular Rhymes of Scotland Роберта Чемберса, но сообщает, что сократил число героев с трёх до двух и заменил загадки; сведения из варианта Чемберса не смешиваются с текстом Джейкобса."
entities:
  - id: red-ettin-three-headed-giant
    name: "Красный эттин"
    type: creature
    description: >-
      Страшный трёхголовый великан, живущий в замке и похитивший дочь шотландского короля Малькольма. Каждая его голова задаёт путнику загадку; неспособного ответить старшего брата великан ударяет молотом и обращает в каменный столб. Младший брат, подготовленный феей, отвечает на все три загадки, после чего отрубает эттину головы обычным топором. Волшебное превращение пленника в камень приписано действию самого эттина.
  - id: two-headed-four-horned-beasts
    name: "Двуголовые четырёхрогие чудовища"
    type: creature
    description: >-
      Множество необычных опасных зверей на пути к замку Красного эттина. У каждого по две головы, а на каждой голове по четыре рога. Старший брат бежит от них, тогда как младший проходит через стадо и убивает напавшее чудовище одним ударом подаренного феей волшебного жезла. Текст не называет их отдельным видом и не приписывает им колдовских способностей.
  - id: helpful-fairy-old-woman
    name: "Фея в облике старухи"
    type: character
    description: >-
      Пожилая женщина, встреченная младшим братом после ухода из дома. Получив от него часть лепёшки, дарит ему волшебный жезл, заранее рассказывает, какие опасности встретятся на пути и как действовать, а затем мгновенно исчезает. Рассказ прямо называет её доброй феей; не следует отождествлять её со старухой, сидящей у очага в замке эттина.
  - id: fairy-magical-wand
    name: "Волшебный жезл феи"
    type: artifact
    description: >-
      Жезл, подаренный младшему брату доброй феей. Герой одним ударом убивает напавшее на него двуголовое чудовище, а после победы над эттином касается жезлом каменного столба, отчего его заколдованный старший брат возвращается к жизни. Именно жезл, а не обычный топор, устраняет последствия превращения в камень.
  - id: brothers-fate-revealing-knife
    name: "Нож, показывающий судьбу брата"
    type: artifact
    description: >-
      Нож, который старший брат оставляет младшему перед путешествием. По его словам, чистое лезвие означает, что владелец жив и здоров, а потускнение и ржавчина предвещают беду. Наутро после превращения старшего брата в каменный столб младший действительно обнаруживает нож заржавевшим и отправляется его искать. Нож служит сверхъестественным указателем состояния отсутствующего человека.
