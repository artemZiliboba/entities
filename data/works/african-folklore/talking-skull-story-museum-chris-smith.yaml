id: talking-skull-story-museum-chris-smith
title: "Говорящий череп"
original_title: "The Talking Skull"
kind: folktale
tradition:
  - african-folklore
source:
  title: "The Talking Skull, The Story Museum, storytext based on an original telling by Chris Smith"
  url: "https://storymuseum.s3-assets.com/TheTalkingSkull_story_text.pdf"
  note: "Полный короткий текст в PDF The Story Museum, SMEB0210; редакция на основе рассказа Криса Смита. В этой версии король сам идёт к черепу и казнит охотника, а спустя месяцы второй охотник встречает два говорящих черепа. Африканский сюжет распространён широко; конкретная этническая традиция в данном тексте не указана. Другие версии не смешивались."
entities:
  - id: first-talking-skull
    name: "Первый говорящий череп"
    type: creature
    description: >-
      Человеческий череп, лежащий в лесу и обладающий способностью говорить без живого тела. На вопрос первого охотника объясняет, что оказался здесь из-за разговоров, и предупреждает, что болтливость погубит также самого охотника. Когда охотник приводит короля, череп молчит, и король обезглавливает рассказчика. Через несколько месяцев череп снова говорит, на этот раз вместе с черепом казнённого охотника, предупреждая нового прохожего.
  - id: executed-hunters-talking-skull
    name: "Говорящий череп казнённого охотника"
    type: creature
    description: >-
      Останки охотника, которого король обезглавил после безуспешной попытки заставить первый череп говорить при свидетеле. Через несколько месяцев второй охотник обнаруживает рядом два черепа, и оба отвечают ему человеческой речью. В тексте не говорится, что череп казнённого умел разговаривать сразу после казни: это показано лишь при встрече со вторым охотником.
