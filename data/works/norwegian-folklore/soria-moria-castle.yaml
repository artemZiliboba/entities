id: soria-moria-castle
title: "Замок Сориа-Мориа"
original_title: "Soria Moria Slott"
kind: folktale
tradition:
  - norwegian-folklore
author: "Peter Christen Asbjørnsen and Jørgen Moe"
collection: "Popular Tales from the Norse"
source:
  title: "Popular Tales from the Norse (1859) — Soria Moria Castle"
  url: "https://en.wikisource.org/wiki/Popular_Tales_from_the_Norse/Soria_Moria_Castle"
  note: >
    Английский перевод George Webbe Dasent, издание 1859 года. Запись следует
    именно этой версии сказки; детали иных норвежских вариантов и позднейших
    пересказов не смешиваются.

entities:
  - id: three-headed-troll
    name: "Трёхголовый тролль"
    type: creature
    description: >
      Первый из троллей, удерживающих принцесс в Сориа-Мориа. Он обладает
      тремя головами и вступает в бой с Хальвором, который побеждает его
      при помощи найденного в замке меча.
    tags:
      - troll
      - three-heads
      - antagonist
      - castle

  - id: six-headed-troll
    name: "Шестиголовый тролль"
    type: creature
    description: >
      Второй тролль Сориа-Мориа, имеющий шесть голов. Он сильнее первого и
      охраняет следующую принцессу, но также погибает в поединке с Хальвором.
    tags:
      - troll
      - six-heads
      - antagonist
      - castle

  - id: nine-headed-troll
    name: "Девятиголовый тролль"
    type: creature
    description: >
      Самый могучий из трёх троллей, девятиголовый хозяин последней части
      замка. Хальвор сражается с ним дольше всего и освобождает третью
      принцессу после его гибели.
    tags:
      - troll
      - nine-heads
      - antagonist
      - castle

  - id: troll-sword
    name: "Меч троллей"
    type: artifact
    description: >
      Меч, висящий в замке и связанный с победой над троллями. Хальвор
      получает указание выпить из фляги рядом с ним, после чего становится
      достаточно силён, чтобы владеть тяжёлым оружием и сражаться с троллями.
    tags:
      - sword
      - troll
      - strength
      - combat

  - id: strength-flask
    name: "Фляга силы"
    type: substance
    description: >
      Напиток из фляги возле меча, после которого Хальвор становится способен
      поднять и использовать тяжёлый меч троллей. Этот эффект непосредственно
      предшествует его сверхчеловеческим поединкам.
    tags:
      - drink
      - strength
      - empowerment
      - combat

  - id: soria-moria-castle
    name: "Замок Сориа-Мориа"
    type: location
    description: >
      Далёкий замок троллей, где удерживаются три принцессы и куда Хальвор
      попадает после долгого пути. Он служит главным сверхъестественным
      пространством сказки и местом трёх последовательных поединков.
    tags:
      - castle
      - trolls
      - princesses
      - otherworld

  - id: magic-ring
    name: "Волшебное кольцо"
    type: artifact
    description: >
      Кольцо, которое Хальвор получает от принцессы. Повернув его, он может
      загадать желание и перенестись туда, куда хочет; с его помощью он
      возвращается домой и позднее вновь ищет дорогу к Сориа-Мориа.
    tags:
      - ring
      - wish
      - transportation
      - return
