id: three-princesses-blue-mountain-norwegian-1914
title: "Три принцессы в Синей горе"
original_title: "The Three Princesses in the Blue Mountain"
kind: folktale
tradition:
  - norwegian-folklore
collection: "East of the Sun and West of the Moon: Old Tales from the North"
source:
  title: "The Three Princesses in the Blue Mountain, перевод в сборнике East of the Sun and West of the Moon (1914), с. 171–199"
  url: "https://www.gutenberg.org/cache/epub/30973/pg30973-images.html"
  note: "Только текст сказки на страницах 171–199 иллюстрированного сборника 1914 года (G. H. Doran), опубликованный Project Gutenberg № 30973. Текст сказки напечатан по договорённости с David Nutt; соседние сказки и иные редакции не использованы."
entities:
  - id: prophetic-beggar-woman
    name: "Нищенка, предсказавшая судьбу принцесс"
    type: character
    description: >
      Незнакомая старуха знает сокровенную печаль бездетного короля
      и предсказывает рождение трёх дочерей. Она предупреждает, что
      до пятнадцатилетия младшей девочки сёстрам нельзя выходить
      под открытое небо, иначе их унесёт снежный вихрь. Предсказание
      впоследствии исполняется.
    tags:
      - prophecy
      - supernatural-knowledge
  - id: abducting-snowdrift
    name: "Снежный вихрь, похитивший принцесс"
    type: phenomenon
    description: >
      В ясный тёплый день внезапно возникает густой снежный вихрь
      и уносит трёх принцесс, нарушивших предсказанный запрет.
      Его появление и действие точно соответствуют пророчеству старухи.
    tags:
      - supernatural-weather
      - abduction
  - id: deceitful-bearded-dwarf
    name: "Бородатый карлик с костылями"
    type: creature
    description: >
      Крошечный длиннобородый старик притворяется немощным, роняет
      монету и жестоко избивает костылями наклонившихся помочь
      офицеров. Солдат ловит его бороду в расколотом полене и
      вынуждает открыть тайный вход в подземный мир принцесс.
      Его нечеловеческая малость и необычайная сила отличают его
      от обычного старика.
    tags:
      - dwarf
      - trickster
      - supernatural-strength
  - id: underworld-of-blue-mountain
    name: "Подземный мир Синей горы"
    type: location
    description: >
      Скрытый под курганом иной мир, куда ведёт глубокий проход
      сквозь воду и огонь. В нём восходит собственное золотое
      солнце, стоят медные, серебряные и золотые чертоги,
      а трёх принцесс держат в плену многоглавые тролли.
    tags:
      - otherworld
      - enchanted-location
  - id: three-headed-troll
    name: "Трёхглавый тролль"
    type: creature
    description: >
      Первый из трёх троллей, пленивших сестёр в подземных
      чертогах. Имеет три головы и чует присутствие человека.
      Старшая принцесса усыпляет его, после чего солдат
      отрубает ему головы тяжёлым мечом.
    tags:
      - troll
      - multi-headed
  - id: six-headed-troll
    name: "Шестиглавый тролль"
    type: creature
    description: >
      Второй подземный тролль с шестью головами, удерживающий
      среднюю принцессу. Чует человеческий запах, но засыпает,
      пока пленница чешет ему головы; солдат обезглавливает его.
    tags:
      - troll
      - multi-headed
  - id: nine-headed-troll
    name: "Девятиглавый тролль"
    type: creature
    description: >
      Самый многоглавый из трёх подземных троллей, пленивший
      младшую принцессу. Обладает девятью головами и носами.
      Солдат одним ударом отрубает восемь голов, а последнюю,
      проснувшуюся и заговорившую, уничтожает вторым ударом.
    tags:
      - troll
      - multi-headed
  - id: first-strengthening-horn
    name: "Первый рог с напитком силы"
    type: artifact
    description: >
      Рог в чертогах старшей принцессы содержит напиток,
      от которого солдат становится настолько сильнее, что
      после трёх глотков может свободно размахивать тяжёлым
      мечом трёхглавого тролля.
    tags:
      - magical-strength
      - enchanted-drink
  - id: second-strengthening-horn
    name: "Второй рог с напитком силы"
    type: artifact
    description: >
      Рог в чертогах средней принцессы даёт солдату силу,
      необходимую для владения более тяжёлым мечом
      шестиглавого тролля: сначала он выпивает три глотка,
      затем ещё три.
    tags:
      - magical-strength
      - enchanted-drink
  - id: third-strengthening-horn
    name: "Третий рог с напитком силы"
    type: artifact
    description: >
      Рог в золотых чертогах младшей принцессы содержит
      усиливающий напиток. Девять глотков позволяют солдату
      легко размахивать мечом девятиглавого тролля, который
      до этого он едва мог сдвинуть.
    tags:
      - magical-strength
      - enchanted-drink
  - id: bird-summoning-whistle
    name: "Ржавый свисток, созывающий птиц"
    type: artifact
    description: >
      Найденный в запертом шкафчике подземного дворца старый
      свисток. На его звук слетается огромное множество
      говорящих птиц, признающих свистящего своим хозяином;
      повторный зов приводит их мать — гигантскую орлицу.
      Позднее свисток снова вызывает орлицу на помощь.
    tags:
      - summoning
      - birds
  - id: speaking-bird-flock
    name: "Говорящая стая птиц"
    type: animal
    description: >
      Множество птиц слетается на зов ржавого свистка
      и человеческой речью спрашивает солдата о его желании.
      Они не умеют вывести его из подземного мира, но
      объясняют, что помочь может их мать.
    tags:
      - talking-animal
      - summoned-helper
  - id: giant-mother-eagle
    name: "Гигантская орлица — мать птиц"
    type: animal
    description: >
      Необычайно большая говорящая орлица появляется по зову
      свистка. За корм из двенадцати волов и запас мяса
      для перелёта она выносит солдата из подземного мира,
      затем доставляет его к королевскому дворцу.
      По повторному зову возвращает из Синей горы
      золотые шашки принцесс.
    tags:
      - giant-bird
      - talking-animal
      - magical-transport
