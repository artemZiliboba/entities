id: the-widows-son
title: "Сын вдовы"
original_title: "Enkesønnen"
kind: folktale
tradition:
  - norwegian-folklore
author: "Peter Christen Asbjørnsen and Jørgen Moe"
collection: "Popular Tales from the Norse"
source:
  title: "Popular Tales from the Norse (1859) — The Widow's Son"
  url: "https://en.wikisource.org/wiki/Popular_Tales_from_the_Norse/The_Widow%27s_Son"
  note: >
    Английский перевод George Webbe Dasent, издание 1859 года. Запись следует
    именно этой версии сказки; детали иных норвежских вариантов и позднейших
    пересказов не смешиваются.

entities:
  - id: three-headed-troll
    name: "Трёхголовый тролль"
    type: creature
    description: >
      Первый сверхъестественный противник сына вдовы, тролль с тремя головами.
      Герой встречает его в ходе поисков похищенной принцессы и побеждает,
      продолжая путь к более сильным троллям.
    tags:
      - troll
      - three-heads
      - antagonist
      - quest

  - id: six-headed-troll
    name: "Шестиголовый тролль"
    type: creature
    description: >
      Второй тролль, обладающий шестью головами и большей силой. Он составляет
      отдельное препятствие в последовательности испытаний героя.
    tags:
      - troll
      - six-heads
      - antagonist
      - quest

  - id: nine-headed-troll
    name: "Девятиголовый тролль"
    type: creature
    description: >
      Самый сильный из трёх многоголовых троллей, противостоящих герою.
      Победа над ним завершает основную цепь столкновений с троллями.
    tags:
      - troll
      - nine-heads
      - antagonist
      - quest
