id: popol-vuh-vukub-cakix-spence-1908
title: "Пополь-Вух: Вукуб-Какиш и его сыновья"
original_title: "The Myth of Vukub-Cakix"
kind: myth
tradition:
  - kiche-maya-mythology
collection: "Пополь-Вух"
author: "Льюис Спенс (английский пересказ и комментарий)"
source:
  title: "Lewis Spence, The Popol Vuh: The Mythic and Heroic Sagas of the Kichés of Central America (1908), The Myth of Vukub-Cakix, pp. 11–15"
  url: "https://www.gutenberg.org/cache/epub/56550/pg56550-images.html"
  note: "Выделен только эпизод The Myth of Vukub-Cakix в книге Льюиса Спенса (1908), с. 11–15. Это научно-популярный английский пересказ, основанный на французской редакции Брассёра де Бурбура (1861) и испанском тексте Хименеса, а НЕ буквальный перевод текста киче. Другие главы Пополь-Вух и варианты не смешивались."
entities:
  - id: vukub-cakix
    name: "Вукуб-Какиш"
    type: creature
    description: >-
      Надменное сверхъестественное существо с серебряными глазами и
      сверкающими драгоценными зубами, объявляющее себя светилом вместо
      солнца и луны. После ранения Хунахпу отрывает ему руку.
      Под видом целителей прародители заменяют его зубы кукурузными
      зёрнами и удаляют глаза; вскоре после этого он умирает.
    aliases:
      - "Семь Макао"
    tags:
      - supernatural-boaster
      - radiant-body
  - id: hun-ahpu
    name: "Хунахпу"
    type: character
    description: >-
      Один из божественных братьев-героев. Вместе со Шбаланке
      выступает против Вукуб-Какиша и его сыновей, стреляет в
      Вукуб-Какиша из духовой трубки и лишается руки в схватке.
      Позднее рука возвращается и прирастает обратно; братья
      устраивают ловушки для Сипакны и Кабракана.
    aliases:
      - "Хун-Ахпу"
    tags:
      - divine-hero
      - hero-twin
  - id: xbalanque
    name: "Шбаланке"
    type: character
    description: >-
      Второй божественный брат-герой, действующий вместе с Хунахпу.
      Участвует в свержении Вукуб-Какиша и в хитроумных ловушках,
      которыми братья побеждают его сыновей, Сипакну и Кабракана.
    tags:
      - divine-hero
      - hero-twin
  - id: xpiyacoc
    name: "Шпийакок"
    type: character
    description: >-
      Божество-прародитель, действующее совместно с Шмукане.
      Под видом престарелого целителя приходит к раненому
      Вукуб-Какишу; под предлогом лечения они удаляют
      его драгоценные зубы и глаза и помогают героям
      вернуть оторванную руку Хунахпу.
    tags:
      - creator-deity
      - divine-healer
  - id: xmucane
    name: "Шмукане"
    type: character
    description: >-
      Божество-прародительница, выступающая в паре со Шпийакоком.
      Вместе с ним изображает старую целительницу перед
      Вукуб-Какишем и участвует в лишении противника
      драгоценных зубов и глаз, а также возвращении руки Хунахпу.
    tags:
      - creator-deity
      - divine-healer
  - id: zipacna
    name: "Сипакна"
    type: creature
    description: >-
      Сын Вукуб-Какиша, наделённый сверхъестественной силой
      переносить и воздвигать горы. Переживает обрушение
      построенного четырьмястами юношами дома и губит их,
      обрушив постройку. Братья-герои заманивают его в
      ущелье приманкой в виде искусственного краба,
      после чего обрушивают на него гору.
    tags:
      - mountain-maker
      - giant-strength
  - id: cabrakan
    name: "Кабракан"
    type: creature
    description: >-
      Второй сын Вукуб-Какиша, сверхъестественный разрушитель гор,
      способный опрокидывать холмы. Хунахпу и Шбаланке
      угощают его птицей, приготовленной с землёй;
      после этого он теряет свою силу и оказывается
      связан и погребён братьями.
    tags:
      - mountain-destroyer
      - giant-strength
