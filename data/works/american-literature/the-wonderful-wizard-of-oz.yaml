id: the-wonderful-wizard-of-oz
title: "Удивительный волшебник из страны Оз"
original_title: "The Wonderful Wizard of Oz"
kind: novel
tradition:
  - american-literature
author: "Л. Фрэнк Баум"
source:
  title: "The Wonderful Wizard of Oz"
  url: "https://www.gutenberg.org/ebooks/43936"
  note: >
    Улучшенная открытая редакция Project Gutenberg, eBook #43936, с текстом
    романа Л. Фрэнка Баума и иллюстрациями У. У. Денслоу. Запись следует только
    первому роману 1900 года и не смешивает детали позднейших книг и экранизаций.

entities:
  - id: land-of-oz
    name: "Страна Оз"
    type: location
    description: >
      Волшебная страна, куда Дороти переносит циклон. Здесь живут ведьмы,
      разумные говорящие существа, ожившие создания и народы с необычными
      свойствами; покинуть страну через окружающую пустыню обычным путём трудно.
    tags:
      - magical-land
      - otherworld
      - enchanted-country

  - id: good-witch-of-the-north
    name: "Добрая Ведьма Севера"
    type: character
    description: >
      Добрая волшебница, встречающая Дороти после гибели Ведьмы Востока.
      Она умеет колдовать, предсказывает путь к Изумрудному городу и защищает
      Дороти поцелуем, оставляющим на лбу особый знак.
    tags:
      - witch
      - protector
      - magic

  - id: protective-kiss-mark
    name: "Защитный знак поцелуя Доброй Ведьмы Севера"
    type: spell
    description: >
      Магическая защита, которую Добрая Ведьма Севера накладывает поцелуем на
      лоб Дороти. Знак видят другие волшебные существа, а Ведьма Запада прямо
      понимает, что из-за него не может причинить девочке вред напрямую.
    tags:
      - protection
      - blessing
      - witchcraft

  - id: wicked-witch-of-the-east
    name: "Злая Ведьма Востока"
    type: character
    description: >
      Могущественная ведьма, державшая народ Жевунов в рабстве до тех пор,
      пока дом Дороти не падает на неё. После её гибели Дороти получает
      серебряные башмачки, которым приписывается большая магическая сила.
    tags:
      - witch
      - ruler
      - enslavement

  - id: silver-shoes
    name: "Серебряные башмачки"
    type: artifact
    description: >
      Волшебная обувь Злой Ведьмы Востока, переходящая к Дороти. Их полная сила
      долго остаётся неизвестной; в финале Глинда объясняет, что башмачки могут
      перенести владельца в любое желаемое место за три шага.
    tags:
      - teleportation
      - magical-footwear
      - witch-artifact

  - id: living-scarecrow
    name: "Живое Страшило"
    type: character
    description: >
      Соломенное пугало, которое самостоятельно разговаривает, двигается и
      мыслит, хотя считает себя лишённым мозгов. После снятия с шеста становится
      спутником Дороти и сохраняет жизнь несмотря на повреждения набивки.
    tags:
      - animated-object
      - scarecrow
      - living-construct

  - id: tin-woodman
    name: "Железный Дровосек"
    type: character
    description: >
      Бывший человек, чьи части тела последовательно заменили жестяными после
      несчастий с заколдованным топором. Он остаётся живым и разумным после
      полной замены тела металлом, но боится ржавчины и считает себя лишённым сердца.
    tags:
      - transformed-human
      - living-construct
      - tin

  - id: enchanted-axe
    name: "Заколдованный топор Железного Дровосека"
    type: artifact
    description: >
      Топор, заколдованный Злой Ведьмой Востока так, чтобы он причинял вред
      своему владельцу. Из-за его ударов Дровосек постепенно лишается рук, ног,
      головы и туловища, которые жестянщик заменяет металлическими частями.
    tags:
      - cursed-object
      - axe
      - transformation

  - id: cowardly-lion
    name: "Трусливый Лев"
    type: animal
    description: >
      Разумный говорящий лев, свободно беседующий с людьми и другими существами.
      Он становится спутником Дороти и позднее побеждает чудовищного паука,
      после чего звери леса признают его своим королём.
    tags:
      - talking-animal
      - lion
      - companion

  - id: kalidahs
    name: "Калидасы"
    type: creature
    description: >
      Свирепые чудовища с телами медведей, тигриными головами и длинными острыми
      когтями. Они преследуют путников в лесу и едва не настигают их у пропасти.
    tags:
      - hybrid-monster
      - predator
      - forest-creature

  - id: deadly-poppies
    name: "Смертоносные маки"
    type: plant
    description: >
      Огромное поле алых маков, запах которых вызывает непреодолимый сон у
      существ из плоти. Дороти и Тото засыпают, а Трусливый Лев почти погибает;
      Страшило и Железный Дровосек не подвержены действию цветов.
    tags:
      - magical-plant
      - sleep
      - enchanted-field

  - id: queen-of-field-mice
    name: "Королева полевых мышей"
    type: animal
    description: >
      Говорящая мышиная королева, которую Железный Дровосек спасает от дикого
      кота. По её приказу множество мышей помогает вывезти уснувшего Льва из
      смертоносного макового поля.
    tags:
      - talking-animal
      - queen
      - helper

  - id: wicked-witch-of-the-west
    name: "Злая Ведьма Запада"
    type: character
    description: >
      Могущественная правительница страны Мигунов. Она обладает одним глазом,
      способным видеть на огромные расстояния, повелевает зверями и рабами,
      использует Золотую Шапку для вызова Крылатых Обезьян и погибает от воды,
      растаяв после того, как Дороти обливает её.
    tags:
      - witch
      - far-sight
      - ruler
      - water-vulnerability

  - id: golden-cap
    name: "Золотая Шапка"
    type: artifact
    description: >
      Украшенная драгоценностями шапка с наложенным заклятием. Каждый её
      владелец может трижды вызвать Крылатых Обезьян и отдать им приказ;
      после трёх вызовов власть конкретного владельца над ними исчерпывается.
    tags:
      - summoning
      - enchanted-object
      - winged-monkeys

  - id: winged-monkeys
    name: "Крылатые Обезьяны"
    type: creature
    description: >
      Разумный народ летающих обезьян с крыльями. Из-за старого заклятия они
      обязаны трижды исполнять приказы каждого владельца Золотой Шапки, хотя
      сохраняют собственную волю и позднее получают свободу.
    tags:
      - flying-creature
      - enchanted-people
      - servitude

  - id: golden-cap-charm
    name: "Заклятие Золотой Шапки"
    type: spell
    description: >
      Старое магическое условие, наложенное на Крылатых Обезьян после их
      проделки с Келалой. Оно связывает весь народ обезьян с Золотой Шапкой и
      заставляет их трижды повиноваться каждому её владельцу.
    tags:
      - binding-spell
      - summoning
      - servitude

  - id: fighting-trees
    name: "Сражающиеся деревья"
    type: plant
    description: >
      Первый ряд деревьев у южной границы леса способен сознательно сгибать
      ветви, хватать пришельцев и отбрасывать их назад. Железный Дровосек
      прорубает путь, отсекая нападающие ветви.
    tags:
      - animated-plant
      - guardian
      - enchanted-forest

  - id: china-country
    name: "Фарфоровая страна"
    type: location
    description: >
      Обнесённая фарфоровыми стенами область, где земля, дома, животные и жители
      сделаны из хрупкого фарфора. Внутри своей страны фарфоровые жители могут
      двигаться и разговаривать, но вынесенные наружу застывают как обычные фигурки.
    tags:
      - magical-location
      - china
      - living-objects

  - id: living-china-people
    name: "Живые фарфоровые жители"
    type: creature
    description: >
      Маленькие разумные люди и животные из фарфора, населяющие Фарфоровую
      страну. Они разговаривают и двигаются, могут разбиваться и быть склеенными,
      но вне своей страны утрачивают подвижность.
    tags:
      - animated-object
      - china
      - living-construct

  - id: hammer-heads
    name: "Молотоголовые"
    type: creature
    description: >
      Безрукие существа, охраняющие холм на пути к стране Кводлингов. Они умеют
      мгновенно вытягивать шеи и наносить плоскими головами мощные удары,
      сбрасывая путников со склона.
    tags:
      - supernatural-creature
      - guardian
      - elastic-neck

  - id: giant-spider
    name: "Гигантский паук-людоед"
    type: creature
    description: >
      Огромное чудовище, терроризирующее зверей южного леса. Оно значительно
      крупнее слона и убивает животных; Трусливый Лев побеждает его внезапным
      нападением и после этого признаётся зверями королём.
    tags:
      - giant-monster
      - spider
      - predator

  - id: glinda-good-witch
    name: "Глинда, Добрая Ведьма Юга"
    type: character
    description: >
      Могущественная добрая ведьма страны Кводлингов. Она знает истинную силу
      Серебряных башмачков, помогает Дороти вернуться домой и использует
      последние приказы Золотой Шапки, чтобы устроить судьбу её спутников.
    tags:
      - witch
      - helper
      - magic
