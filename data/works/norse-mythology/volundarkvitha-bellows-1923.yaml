id: volundarkvitha-bellows-1923
title: "Песнь о Вёлунде"
original_title: "Völundarkviða (Völundarkvitha)"
kind: poem
tradition:
  - norse-mythology
collection: "Старшая Эдда (The Poetic Edda)"
author: "Анонимный древнескандинавский автор; Генри Адамс Беллоуз (перевод, 1923)"
source:
  title: "The Poetic Edda, translated by Henry Adams Bellows (1923), Völundarkvitha, prose introduction and stanzas 1–43"
  url: "https://en.wikisource.org/wiki/The_Poetic_Edda_(tr._Bellows)/V%C3%B6lundarkvitha"
  note: "Полный текст с прозаическим вступлением и 43 пронумерованными строфами по Беллоузу; проверочная перепечатка https://mythopedia.com/library/poetic-edda-bellows-1936/volundarkvitha/ . Утраченные строки и объяснение способа полёта не восполняются поздними сказаниями о Вёлунде."
entities:
  - id: volund
    name: "Вёлунд"
    type: character
    description: >-
      Искусный кузнец, названный в песне величайшим из альвов. После ухода жены-валькирии кует сотни золотых колец. Король Нидуд захватывает его и приказывает подрезать сухожилия на ногах. Вёлунд убивает сыновей короля, превращает их останки в драгоценные изделия и затем необъяснённым образом взлетает в воздух, оставаясь недосягаемым для всадников и лучников.
  - id: hervor-alvitr
    name: "Хервёр Альвитр"
    type: character
    description: >-
      Одна из трёх валькирий, найденных братьями-охотниками на берегу озера рядом с лебедиными одеяниями. Дочь короля Хлёдвера, живёт с Вёлундом семь зим, затем улетает навстречу сражениям и не возвращается. В тексте её называют мудрой и связывают с лебединым обликом.
  - id: hlathguth-svanhvit
    name: "Хладгуд Сванхвит"
    type: character
    description: >-
      Валькирия, дочь Хлёдвера, чьё имя означает Лебединобелая. Вместе с двумя другими девами появляется у озера с лебединым одеянием, становится спутницей Слагфида и спустя семь зим улетает. Слагфид отправляется искать её на юг.
  - id: olrun
    name: "Эльрун"
    type: character
    description: >-
      Валькирия, дочь Кьяра из Валланда. Вместе с двумя другими девами прилетает к озеру и прядёт лён; становится спутницей Эгиля. После семи зим покидает дом, улетая навстречу сражениям, а Эгиль уходит искать её на восток.
  - id: swan-garments
    name: "Лебединые одеяния валькирий"
    type: artifact
    description: >-
      Одеяния в виде лебединых перьев, лежавшие рядом с тремя девами, когда братья нашли их у озера. Прозаическое вступление прямо связывает их с природой валькирий, способных улетать; однако текст не описывает отдельного ритуала надевания и не утверждает, что без одежд они не могли бы летать.
  - id: volund-aerial-escape
    name: "Воздушный побег Вёлунда"
    type: phenomenon
    description: >-
      После расправы над сыновьями Нидуда и встречи с Бёдвильд Вёлунд, несмотря на перерезанные сухожилия ног, поднимается высоко в воздух и улетает над королевским двором. Король признаёт, что его не достанут ни всадники, ни лучники. Способ полёта в сохранившемся тексте не раскрыт.
