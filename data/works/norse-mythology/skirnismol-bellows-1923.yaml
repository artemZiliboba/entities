id: skirnismol-bellows-1923
title: "Поездка Скирнира"
original_title: "Skírnismál (Skirnismol)"
kind: poem
tradition:
  - norse-mythology
collection: "Старшая Эдда"
author: "Неизвестный древнеисландский автор; Генри Адамс Беллоуз (переводчик)"
source:
  title: "The Poetic Edda, translated by Henry Adams Bellows (1923), Skirnismol: The Ballad of Skirnir, stanzas 1–43 and prose links"
  url: "https://en.wikisource.org/wiki/The_Poetic_Edda_(tr._Bellows)/Skirnismol"
  note: "Прочитана вся поэма Skirnismol в переводе Беллоуза (1923), включая прозаические связки. Сведения из примечаний о других поэмах, позднейших мифах и Снорри не переносились в описание событий этой поэмы."
entities:
  - id: freyr
    name: "Фрейр"
    type: character
    description: >-
      Божество из рода ванов, увидевшее из Хлидскьяльва великаншу
      Герд и влюбившееся в неё. Посылает Скирнира добиваться
      встречи и передаёт ему коня и чудесный меч.
    tags:
      - deity
      - vanir
  - id: skirnir
    name: "Скирнир"
    type: character
    description: >-
      Посланник Фрейра, который едет в Ётунхейм к Герд,
      предлагает ей драгоценные дары, затем угрожает мечом
      и применяет магический жезл и руническое проклятие.
      После её согласия возвращается к Фрейру с вестью
      о назначенной встрече.
    tags:
      - divine-messenger
      - runic-magic
  - id: gerd
    name: "Герд"
    type: creature
    description: >-
      Дочь великана Гюмира, живущая за огненной преградой
      в Ётунхейме. Отказывается принять золотые яблоки
      и чудесное кольцо, предложенные Скирниром,
      но после его угроз и рунического проклятия
      назначает Фрейру встречу через девять ночей
      в роще Барри.
    aliases:
      - "Герда"
    tags:
      - giantess
  - id: freyrs-flame-crossing-horse
    name: "Конь Фрейра, проходящий сквозь пламя"
    type: animal
    description: >-
      Чудесный конь, которого Фрейр даёт Скирниру.
      Согласно словам обоих персонажей, способен
      пройти через тьму и колдовское мерцающее пламя;
      Скирнир добирается на нём до жилища Герд.
    tags:
      - magical-mount
      - fire-crossing
  - id: freyrs-self-fighting-sword
    name: "Самосражающийся меч Фрейра"
    type: artifact
    description: >-
      Меч, который, по словам Фрейра, способен
      сражаться сам против великанов, если им
      владеет достойный герой. Фрейр отдаёт его
      Скирниру, а тот угрожает им Герд.
    tags:
      - enchanted-weapon
      - autonomous-combat
  - id: multiplying-gold-ring
    name: "Кольцо, порождающее восемь колец"
    type: artifact
    description: >-
      Волшебное кольцо, которое Скирнир предлагает Герд.
      Согласно его словам, каждую девятую ночь
      от кольца отделяются ещё восемь колец такого же
      веса. Герд отвергает этот дар.
      Название Драупнир известно из примечания
      переводчика, но не произносится в самой поэме.
    tags:
      - self-multiplication
      - enchanted-ring
  - id: skirnirs-magic-staff
    name: "Магический жезл Скирнира"
    type: artifact
    description: >-
      Жезл, которым Скирнир грозит ударить Герд,
      чтобы принудить её к повиновению. Он также
      объявляет, что добыл волшебную палочку
      в лесу; текст не устанавливает однозначно,
      является ли она тем же предметом.
    tags:
      - magic-staff
      - coercion
  - id: skirnirs-three-rune-curse
    name: "Проклятие трёх рун Скирнира"
    type: spell
    description: >-
      Магическое проклятие, которым Скирнир
      угрожает Герд после отказа от даров.
      Он призывает богов и великанов в свидетели,
      обещает ей одиночество и мучительное
      существование, затем вырезает знак
      и три руны, связанные с тоской,
      безумием и вожделением. Скирнир
      утверждает, что может отменить написанное.
      Реальное исполнение проклятия в поэме
      не показано.
    tags:
      - runic-curse
      - coercion
