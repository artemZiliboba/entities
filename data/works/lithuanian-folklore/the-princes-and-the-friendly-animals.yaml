id: the-princes-and-the-friendly-animals
title: "Принцы и дружелюбные животные"
original_title: "The Princes and the Friendly Animals"
kind: folktale
tradition:
  - lithuanian-folklore
collection: "Fairy Tales from Far and Near"
author: "Katharine Pyle (retelling)"
source:
  title: "Fairy Tales from Far and Near — The Princes and the Friendly Animals"
  url: "https://www.gutenberg.org/cache/epub/66919/pg66919-images.html"
  note: >
    Сказка опубликована Кэтрин Пайл в Fairy Tales from Far and Near (1922)
    и прямо обозначена в оглавлении и заголовке как A Lithuanian Story.
    Использован только раздел The Princes and the Friendly Animals; детали
    других вариантов и соседних сказок не смешивались.

entities:
  - id: prophetic-tree-notches
    name: "Вещие зарубки на дереве"
    type: artifact
    description: >
      Три зарубки, вырезанные старшим принцем на дереве у развилки дорог и
      связанные с тремя братьями. При прикосновении из зарубки течёт молоко,
      если с соответствующим братом всё благополучно, и кровь, если его постигли
      смерть или несчастье.
    tags:
      - omen
      - divination
      - blood
      - milk

  - id: bear-helpers
    name: "Медведи-помощники"
    type: animal
    description: >
      Три медвежонка, отданные говорящей медведицей трём принцам в обмен на её
      жизнь. Они следуют за своими хозяевами как разумные слуги; медведь старшего
      принца участвует в бою с морским драконом и позднее натирает раны хозяина
      чудесной мазью.
    tags:
      - talking-animal
      - magical-helper
      - loyal-animal

  - id: lion-helpers
    name: "Львы-помощники"
    type: animal
    description: >
      Три львёнка, которых говорящая львица отдаёт братьям. Они становятся
      верными спутниками принцев; лев старшего брата сражается с драконом и после
      убийства хозяина остаётся рядом с его телом вместе с другими животными.
    tags:
      - talking-animal
      - magical-helper
      - loyal-animal

  - id: fox-helpers
    name: "Лисы-помощники"
    type: animal
    description: >
      Три лисёнка, полученные принцами от говорящей лисицы. Лис старшего принца
      действует особенно разумно: ослепляет морского дракона солёной водой и
      после гибели хозяина напоминает другим животным о чудесных лечебных
      средствах в разбойничьем доме.
    tags:
      - talking-animal
      - magical-helper
      - clever-animal

  - id: hare-helpers
    name: "Зайцы-помощники"
    type: animal
    description: >
      Три молодых зайца, присоединившиеся к братьям как слуги. Заяц старшего
      принца участвует в битве с драконом, а затем понимает поручение животных,
      разговаривает с раскаявшейся сестрой принца и приносит издалека три
      лечебных флакона.
    tags:
      - talking-animal
      - magical-helper
      - messenger

  - id: boar-helpers
    name: "Кабаны-помощники"
    type: animal
    description: >
      Три молодых кабана, служащие принцам. Кабан старшего брата атакует морского
      дракона клыками, а позднее разбивает нужный лечебный флакон, чтобы остальные
      животные смогли оживить убитого хозяина.
    tags:
      - talking-animal
      - magical-helper
      - loyal-animal

  - id: healing-ointment
    name: "Мазь исцеления ран"
    type: substance
    description: >
      Содержимое первого из трёх флаконов в разбойничьем доме. Нанесённая на
      раны мазь мгновенно исцеляет их; сначала ею вылечивают раненого разбойника,
      а затем животные закрывают ею смертельные раны принца.
    tags:
      - healing
      - magical-medicine
      - wounds

  - id: reviving-water
    name: "Вода возвращения жизни"
    type: substance
    description: >
      Жидкость из второго флакона. Несколько капель, влитых в рот убитому
      принцу, возвращают цвет его щекам и свет глазам, подготавливая окончательное
      восстановление третьим средством.
    tags:
      - revival
      - healing-water
      - resurrection

  - id: strengthening-water
    name: "Вода полного восстановления"
    type: substance
    description: >
      Содержимое третьего флакона. Выпив его после обработки ран и второй воды,
      принц полностью возвращается к жизни и становится даже сильнее, чем прежде.
    tags:
      - revival
      - healing-water
      - strength

  - id: repentance-chain
    name: "Цепь раскаяния"
    type: artifact
    description: >
      Цепь, которой старший принц приковывает предавшую его сестру, объявляя
      условие освобождения: она спадёт лишь тогда, когда девушка наполнит чашу
      слезами раскаяния. После выполнения условия цепь действительно освобождает
      её без посторонней помощи.
    tags:
      - enchantment
      - repentance
      - conditional-magic

  - id: sea-dragon
    name: "Морской дракон"
    type: creature
    description: >
      Огромное чудовище, выходящее из моря за предназначенной ему царевной и
      угрожающее разорить страну, если жертву не отдадут. Его спина напоминает
      остров, а из ноздрей идут дым и огненные искры; принц убивает дракона при
      помощи своих пяти животных.
    tags:
      - dragon
      - sea-monster
      - fire
      - sacrifice

  - id: petrifying-witch
    name: "Ведьма у лесного костра"
    type: character
    description: >
      Злая старуха, живущая у огня среди множества каменных фигур. Она обманом
      получает разрешение коснуться путников и их животных своим жезлом и так
      превращает их в камень; младший принц заставляет её раскрыть способ
      обратного превращения.
    tags:
      - witch
      - petrification
      - deception

  - id: petrifying-restoring-staff
    name: "Жезл окаменения и оживления"
    type: artifact
    description: >
      Волшебный жезл ведьмы с двумя противоположными действиями. Касание одним
      концом превращает людей и животных в неподвижный камень; если перевернуть
      жезл и коснуться фигур другим концом, камень снова становится живой плотью.
      После освобождения пленников младший принц ломает жезл.
    tags:
      - petrification
      - restoration
      - magic-staff
