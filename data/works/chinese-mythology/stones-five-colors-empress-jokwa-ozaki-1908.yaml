id: stones-five-colors-empress-jokwa-ozaki-1908
title: "Камни пяти цветов и императрица Дзёква"
original_title: "The Stones of Five Colors and the Empress Jokwa"
kind: myth
tradition:
  - chinese-mythology
collection: "Japanese Fairy Tales (Yei Theodora Ozaki, 1908)"
source:
  title: "The Stones of Five Colors and the Empress Jokwa: An Old Chinese Story, Yei Theodora Ozaki, Japanese Fairy Tales"
  url: "https://www.gutenberg.org/files/4018/4018-h/4018-h.htm"
  note: "Полный английский текст отдельного предания в конце сборника Japanese Fairy Tales (1908), Project Gutenberg #4018. Это китайский миф в пересказе, включённом в японский сборник; персонажи и события извлечены только из варианта Одзаки, не из других версий мифа о Нюйва."
entities:
  - id: empress-jokwa
    name: "Императрица Дзёква"
    type: character
    description: >-
      Великанша и правительница, восстановившая разрушенную часть небесного свода. Приказывает собрать камни пяти цветов, варит из них с фарфоровой массой пасту, вызывает облака, поднимается на них к небу и заделывает пролом. Для починки опоры неба использует ноги огромной черепахи, а посланникам даёт волшебные летающие колесницы.
  - id: wizard-kokai
    name: "Волшебник Кокай"
    type: character
    description: >-
      Великан и мятежник, способный управлять водой. Сначала призывает Водяного демона, вызвавшего потоп, затем взмахом волшебной палочки поднимает новое наводнение, а позднее повторяет заклинание, создавая огромные волны. Проиграв повелителю огня, разбивает голову о гору Шу; от удара рушится часть небесной опоры.
  - id: water-devil
    name: "Водяной демон"
    type: creature
    description: >-
      Сверхъестественный помощник волшебника Кокая, вызванный им в начале восстания. По приказу Кокая насылает на страну разрушительное наводнение. Позже Кокай снова призывает демона на помощь в битве, но противник владеет средством противодействия его водной силе.
  - id: fire-king-shikuyu
    name: "Повелитель огня Сикию"
    type: character
    description: >-
      Великан, владыка огня, живущий на Южном полюсе, потому что его присутствие обжигает всё вокруг, кроме льда и снега. Спасает воинов из потопа, явившись седым старцем, расступает воду прикосновением ног и превращается в белого журавля. Позже возглавляет войско императрицы и побеждает Кокая.
  - id: flood-dividing-transformation
    name: "Превращение спасителя в белого журавля"
    type: phenomenon
    description: >-
      Чудесное проявление силы Сикию: явившись стариком посреди наводнения, он заставляет воду расступиться под ногами и открывает сухую дорогу воинам. При приближении Кокая обращается в большого белого журавля и улетает. Позднее сам Сикию подтверждает, что был их спасителем.
  - id: water-suppressing-shrub-ashes
    name: "Пепел кустарника, усмиряющий наводнение"
    type: substance
    description: >-
      Пепел особого кустарника, который Сикию велит собрать, сжечь и раздать воинам. Когда Кокай поднимает огромные волны заклинанием, солдаты бросают пепел в воду; от соприкосновения с ним вода превращается в плотную грязь, защищающую войско от потопа. Название растения в выбранном тексте не указано.
  - id: five-colored-sky-repair-paste
    name: "Паста из пятицветных камней"
    type: substance
    description: >-
      Чудесная смесь, которую Дзёква готовит, прокипятив с фарфоровым веществом камни пяти цветов: синего, жёлтого, красного, белого и чёрного. С этой пастой она поднимается на облаках к повреждённому небосводу и заделывает пролом, восстанавливая небесные пути.
  - id: heavenly-support-pillar
    name: "Небесная опора"
    type: location
    description: >-
      Одна из опор, удерживающих небосвод над землёй. После гибели Кокая и разрушения горы Шу она ломается, так что угол неба опускается к земле. Императрица Дзёква восстанавливает опору ногами огромной черепахи; после этого Солнце и Луна могут снова безопасно совершать свои пути.
  - id: sky-road
    name: "Небесные дороги Солнца и Луны"
    type: location
    description: >-
      Пути, по которым Солнце и Луна совершают свои ежедневные путешествия. После разрушения горы Шу дороги оказываются повреждены, поэтому оба светила прекращают движение и на земле наступает тьма. Дзёква восстанавливает дороги, а посланники сообщают об этом Солнцу и Луне.
  - id: flying-clouds-jokwa
    name: "Облака, несущие императрицу"
    type: phenomenon
    description: >-
      Облака, которые Дзёква призывает с высоты и использует как средство передвижения к повреждённому небу. Она поднимается на них с сосудом пасты из пятицветных камней, чинит небесный свод и опору, затем спускается обратно на землю.
  - id: magical-flying-chariots
    name: "Волшебные летающие колесницы"
    type: artifact
    description: >-
      Чудесные колесницы, которые Дзёква даёт двум посланникам для путешествия к дворцу Солнца и Луны. Они способны лететь по воздуху со скоростью тысячи миль в минуту и позволяют преодолеть расстояние, недоступное обычным путешественникам за человеческую жизнь.
  - id: sun-personification
    name: "Солнце — небесный правитель"
    type: character
    description: >-
      Персонифицированное Солнце, живущее вместе с Луной в далёком восточном дворце. После разрушения небесных дорог перестаёт выходить в дневное путешествие, из-за чего мир остаётся без света. Получив известие о ремонте небосвода и опоры, проверяет дорогу и возобновляет движение.
  - id: moon-personification
    name: "Луна — небесная правительница"
    type: character
    description: >-
      Персонифицированная Луна, обитающая с Солнцем во дворце далеко на востоке. После повреждения небесных дорог отказывается от ночных путешествий из-за опасности. Узнав от посланников Дзёквы, что небосвод и его опора восстановлены, снова начинает освещать землю ночью.
