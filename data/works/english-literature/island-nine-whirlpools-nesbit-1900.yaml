id: island-nine-whirlpools-nesbit-1900
title: "Остров девяти водоворотов"
original_title: "The Island of the Nine Whirlpools"
kind: story
tradition:
  - english-literature
author: "E. Nesbit"
collection: "The Book of Dragons (1900), story V"
source:
  title: "The Book of Dragons — Project Gutenberg #23661, V. The Island of the Nine Whirlpools"
  url: "https://www.gutenberg.org/cache/epub/23661/pg23661-images.html"
  note: "Полностью прочитан рассказ V. The Island of the Nine Whirlpools (строки 894–1097 Project Gutenberg #23661); не смешан с остальными рассказами сборника и поздними адаптациями."
entities:
  - id: compassionate-witch
    name: "Ведьма, помогающая королеве"
    type: character
    description: >
      Ведьма варит зелье, благодаря которому у королевы появляется
      дочь, умеет создавать драгоценные камни и откликается
      на волшебный зов, связанный с пятьюдесятью поцелуями
      благодарной королевы. Переносит королеву к заточённой
      принцессе в повозке солнечных лучей, останавливает
      для девушки ощущение времени и превращает себя
      и королеву в каменные статуи. После разрушения
      чар навсегда теряет колдовские способности.
    tags:
      - witch
      - potion
      - petrification
      - time-enchantment
  - id: cruel-enchanter-king
    name: "Король-чародей"
    type: character
    description: >
      Отец принцессы, могущественный чародей, который
      заточает дочь на далёком острове под охраной
      дракона и грифона, зачаровывает её от старения
      и создаёт девять водоворотов из капель
      собственной злой крови. Искусственно соединяет
      льва и орла в грифона и путешествует
      в воздушной повозке, запряжённой молниями.
    tags:
      - enchanter
      - imprisonment
      - creature-creation
  - id: child-giving-potion
    name: "Зелье для рождения ребёнка"
    type: substance
    description: >
      Ведьма варит напиток в медном котле, добавляя
      корону, украшения с драгоценными камнями и лилии
      королевы. После того как королева выпивает
      остывшее зелье, дома в колыбели появляется
      девочка с чертами, предсказанными ведьмой.
    tags:
      - magical-potion
      - miraculous-birth
  - id: ancient-island-dragon
    name: "Дракон Одинокой башни"
    type: creature
    description: >
      Огнедышащий крылатый дракон с длинным хвостом,
      покрытым многочисленными ногами, сторожит
      принцессу на острове и готовит ей пищу.
      Каждый день засыпает на пять минут, причём
      время сна ежедневно сдвигается на три минуты;
      во сне превращается в камень. Моряк Найджел
      заманивает его к морю во время сна,
      и проснувшийся под водой дракон тонет.
    tags:
      - dragon
      - fire-breathing
      - petrification
  - id: artificial-griffin
    name: "Искусственный грифон"
    type: creature
    description: >
      Страж принцессы, созданный королём-чародеем
      соединением львиной и орлиной половин.
      Умеет выполнять домашнюю работу, подметая
      крыльями, и спит каждый день во время чая.
      Разбуженный обманом, принимает собственную
      львиную часть за врага, и обе половины
      смертельно ранят друг друга.
    tags:
      - griffin
      - artificial-creature
      - hybrid
  - id: nine-whirlpools
    name: "Девять водоворотов"
    type: phenomenon
    description: >
      Девять губительных морских водоворотов окружают
      остров с Одинокой башней. Они возникли после
      падения девяти капель злой крови короля-чародея
      в море. Раз в сутки водовороты на пять минут
      прекращаются, и вода отступает; начало
      затишья ежедневно сдвигается на пять минут.
      После извлечения девяти рубинов из песка
      водовороты исчезают навсегда.
    tags:
      - enchanted-sea
      - whirlpool
      - blood-magic
  - id: nine-blood-rubies
    name: "Девять рубинов из крови чародея"
    type: artifact
    description: >
      Девять капель злой крови короля после
      исчезновения водоворотов обнаруживаются
      на морском дне как красные рубины.
      Каждый найденный рубин устраняет один
      водоворот; позднее камни используют
      для вспашки: брошенные в поле,
      они заставляют землю перевернуться
      и вспахаться самостоятельно.
    tags:
      - enchanted-gems
      - magical-plowing
      - blood-magic
  - id: sunbeam-carriage
    name: "Повозка, запряжённая солнечными лучами"
    type: artifact
    description: >
      Ведьма перевозит королеву на далёкий остров
      в воздушной повозке, которую тянут живые
      солнечные лучи. Их скорость позволяет
      достигнуть Одинокой башни быстрее,
      чем на повозке, запряжённой молниями.
    tags:
      - magical-transport
      - sunbeams
  - id: thunderbolt-carriage
    name: "Повозка, запряжённая молниями"
    type: artifact
    description: >
      Король-чародей покидает остров на повозке,
      которую тянут живые молнии. Повозка
      поднимается в воздух и исчезает,
      оставив принцессу под стражей
      дракона и грифона.
    tags:
      - magical-transport
      - lightning
  - id: otherworldly-guiding-something
    name: "Неведомый голос из седьмого мира"
    type: phenomenon
    description: >
      Таинственное Нечто, названное более мудрым,
      чем весь мир, приходит из-за пределов
      седьмого мира и шепчет моряку Найджелу,
      достойному стать принцем. Найджел слышит
      этот шёпот, не осознавая его, и замечает
      свет Одинокой башни, что направляет
      его к заколдованной принцессе.
      Личность и происхождение Нечто не раскрыты.
    tags:
      - supernatural-guidance
      - otherworld
