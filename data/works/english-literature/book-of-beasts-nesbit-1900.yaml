entities:
  - id: book-of-beasts
    name: "Книга зверей"
    type: artifact
    description: >
      Старинная книга с изображениями животных, принадлежавшая предку
      короля Лайонела, которого считали волшебником. Когда страницы
      раскрывают при подходящих условиях, нарисованные существа
      оживают и выходят из книги. Из неё появляются бабочка,
      синяя райская птица, красный дракон, мантикора и гиппогриф.
      Существа могут добровольно возвращаться на свои страницы;
      книга также служит убежищем деревянной лошадке.
    tags:
      - living-illustrations
      - enchanted-book
      - summoning
  - id: red-dragon-of-the-book
    name: "Красный дракон из книги"
    type: creature
    description: >
      Огромный крылатый красный дракон выходит из иллюстрации
      под солнечными лучами, разоряет королевство и проглатывает
      людей, здания и предметы. Извергает огонь и дым, но
      в полдень должен прятаться от жары под деревом,
      иначе сам рискует воспламениться. В каменистой пустоши
      возвращается в нарисованную пальмовую тень,
      освобождая проглоченных.
    tags:
      - dragon
      - fire-breathing
      - living-illustration
  - id: manticore-of-the-book
    name: "Мантикора из книги"
    type: creature
    description: >
      Жёлтая мантикора с телом льва и человеческим лицом
      выходит из иллюстрации. Канцлер называет её врагом
      драконов, но на деле она боится красного дракона,
      мяукает, поедает городских кошек и выпивает
      молоко из оставленных у дверей бидонов.
      После того как дракон проглатывает её,
      возвращается невредимой и уходит обратно в книгу.
    tags:
      - manticore
      - hybrid-creature
      - living-illustration
  - id: white-hippogriff-of-the-book
    name: "Белый гиппогриф из книги"
    type: creature
    description: >
      Крылатый белый конь с длинной гривой и крыльями,
      похожими на лебединые, выходит из книги.
      Он умеет говорить, летает быстрее красного дракона
      и помогает королю Лайонелу заманить чудовище
      в пустошь, где нет деревьев. После победы
      соглашается стать королевской верховой игрушкой.
    tags:
      - hippogriff
      - flight
      - speech
  - id: talking-rocking-horse
    name: "Говорящая деревянная лошадка"
    type: artifact
    description: >
      Любимая игрушечная лошадка короля Лайонела
      оказывается проглоченной красным драконом.
      Когда дракон возвращается в книгу, лошадка
      появляется вместе с другими спасёнными,
      самостоятельно просит разрешения поселиться
      на странице гиппогрифа и остаётся там
      до времён далёких потомков короля.
    tags:
      - talking-toy
      - enchanted-toy
