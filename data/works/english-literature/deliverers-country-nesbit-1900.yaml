entities:
  - id: dragon-plague
    name: "Нашествие зелёных драконов"
    type: creature
    description: >
      Множество крылатых зелёных драконов с чешуёй и полупрозрачными
      желтоватыми крыльями внезапно появляется по всей Англии.
      Их размеры варьируются от насекомого до чудовища,
      способного унести слона. Они дышат огнём и дымом,
      опасаются ночного холода, а сильные снег, дождь и град
      гасят внутренний огонь и губят их. Один крошечный
      экземпляр остаётся у профессора после нашествия.
    tags:
      - dragon
      - fire-breathing
      - dragon-plague
  - id: awakened-saint-george
    name: "Оживший святой Георгий"
    type: character
    description: >
      Каменное надгробное изображение святого Георгия
      пробуждается после просьбы и поцелуя девочки Эффи.
      Святой разговаривает с детьми, но отказывается
      сражаться с множеством драконов в одиночку.
      Он подсказывает, что драконы не переносят холода
      и сырости, и рассказывает о кранах,
      управляющих погодой, после чего снова засыпает
      и становится неподвижным мраморным изваянием.
    tags:
      - animated-statue
      - saint-george
      - dragon-slayer
  - id: universal-weather-taps
    name: "Краны управления погодой"
    type: artifact
    description: >
      Система кранов в подземной комнате, обозначенных
      словами «Солнце», «Ветер», «Дождь», «Снег», «Град»,
      «Лёд» и названиями погодных режимов. Поворачивая
      их, дети меняют погоду во всей стране.
      Отдельный старый кран «Слив» открывает огромную
      воронку, в которую потоки воды уносят мёртвых
      драконов. Некоторые краны неисправны и
      оставляют в Англии переменчивую погоду.
    tags:
      - weather-control
      - magical-machinery
      - drainage
  - id: all-seeing-weather-mirror
    name: "Зеркало, показывающее весь мир"
    type: artifact
    description: >
      Огромное зеркало на стене подземной комнаты
      позволяет одновременно видеть события по всему миру.
      Дети наблюдают через него Англию, кишащую
      драконами, спящего святого Георгия и мать дома,
      а затем проверяют последствия управления погодой
      и открытия сливного отверстия.
    tags:
      - scrying
      - all-seeing-mirror
