id: christmas-carol-dickens-1843-gutenberg46
title: "Рождественская песнь в прозе"
original_title: "A Christmas Carol. In Prose. Being a Ghost Story of Christmas"
kind: story
tradition:
  - english-literature
author: "Чарльз Диккенс"
collection: "A Christmas Carol (first edition, 1843; illustrations by John Leech)"
source:
