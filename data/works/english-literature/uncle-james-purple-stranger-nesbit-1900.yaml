id: uncle-james-purple-stranger-nesbit-1900
title: "Дядя Джеймс, или Пурпурный незнакомец"
original_title: "Uncle James, or The Purple Stranger"
kind: story
tradition:
  - english-literature
author: "E. Nesbit"
collection: "The Book of Dragons (1900), story II"
source:
  title: "The Book of Dragons — Project Gutenberg #23661, II. Uncle James, or The Purple Stranger"
  url: "https://www.gutenberg.org/cache/epub/23661/pg23661-images.html"
  note: "Полный текст рассказа II, строки 301–461 в Project Gutenberg #23661; не смешан с другими рассказами сборника. Не приписываются непоказанные заклинания и огнедышание."
entities:
  - id: purple-stranger-dragon
    name: "Пурпурный дракон"
    type: creature
    description: >
      Большой пурпурный дракон с крыльями и очень длинным
      тонким хвостом появляется возле центрального столба
      Ротундии с повреждённым крылом. Он понимает речь,
      но сам говорить не может, поедает животных и хочет
      съесть принцессу Мэри-Энн. Когда его хвост наматывается
      на столб, дракон раскручивает весь остров, восстанавливая
      правильные размеры животных, и сам превращается
      в крошечного крылатого пурпурного тритона.
    tags:
      - dragon
      - size-change
      - winged-creature
  - id: uncle-james-magician
    name: "Дядя Джеймс"
    type: character
    description: >
      Дядя принцессы и злой волшебник, который знает всё
      без обучения и способен услышать невысказанные мысли
      дракона. Он хочет избавиться от племянницы и завладеть
      королевством, но его злые заклинания не действуют
      на добрых жителей Ротундии. После того как остров
      начинает вращаться в правильную сторону, волшебник
      уменьшается вместе с животными, поскольку не успевает
      удержать себя руками, и становится добычей дракона.
    tags:
      - magician
      - mind-reading
      - evil-magic
  - id: center-of-gravity-giant
    name: "Великан Центр тяжести"
    type: creature
    description: >
      В начале истории мира гигант по имени Центр тяжести
      управляет устройством земной поверхности из недр
      Земли. Проснувшись, он велит отколовшемуся острову
      опуститься и перестать вращаться; остров становится
      Ротундией, где животные получают необычные размеры.
      В основном действии великан больше не появляется.
    tags:
      - giant
      - cosmic-order
  - id: rotundia-reversed-island
    name: "Ротундия"
    type: location
    description: >
      Островное королевство, первоначально вращавшееся
      при образовании мира не в ту сторону. Из-за этого
      морские свинки здесь величиной со слонов, слоны
      крошечные, а пищевые изделия растут на деревьях,
      тогда как овощи приходится изготовлять.
      Когда дракон раскручивает центральный столб
      в правильную сторону, животные возвращаются
      к обычным размерам.
    tags:
      - enchanted-island
      - altered-nature
      - size-change
  - id: pastry-trees
    name: "Деревья с булочками и пирожными"
    type: plant
    description: >
      В Ротундии булочки с изюмом растут на деревьях,
      а некоторые виды сдобы — на низких кустах.
      Мальчик Том собирает их для раненого пурпурного
      дракона. Эта необычная ботаника связана с
      перевёрнутым порядком природы на острове;
      текст не приписывает деревьям иных сил.
    tags:
      - miraculous-food
      - food-growing-tree
