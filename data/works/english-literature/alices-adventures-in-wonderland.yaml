id: alices-adventures-in-wonderland
title: "Алиса в Стране чудес"
original_title: "Alice's Adventures in Wonderland"
kind: novel
tradition:
  - english-literature
author: "Льюис Кэрролл"
source:
  title: "Alice's Adventures in Wonderland"
  url: "https://www.gutenberg.org/ebooks/11"
  note: >
    Открытый английский текст Project Gutenberg (eBook #11), основанный на
    оригинальном произведении Льюиса Кэрролла. Запись следует этому тексту и
    не смешивает детали экранизаций или позднейших адаптаций.

entities:
  - id: drink-me-potion
    name: "Напиток «Выпей меня»"
    type: substance
    description: >
      Необычный напиток из маленькой бутылочки с этикеткой «DRINK ME».
      Выпив его, Алиса уменьшается примерно до десяти дюймов ростом.
    tags:
      - size-change
      - shrinking
      - enchanted-food

  - id: eat-me-cake
    name: "Пирожок «Съешь меня»"
    type: substance
    description: >
      Маленький пирожок с надписью «EAT ME». После того как Алиса доедает его,
      её рост резко увеличивается, пока голова не упирается в потолок зала.
    tags:
      - size-change
      - growth
      - enchanted-food

  - id: white-rabbit-fan
    name: "Веер Белого Кролика"
    type: artifact
    description: >
      Веер, оброненный Белым Кроликом. Пока Алиса обмахивается им, она быстро
      уменьшается и успевает отбросить его прежде, чем исчезнуть совсем.
    tags:
      - size-change
      - shrinking
      - enchanted-object

  - id: white-rabbit
    name: "Белый Кролик"
    type: animal
    description: >
      Говорящий белый кролик в жилете, носящий карманные часы и ведущий себя
      как человек. Именно его появление побуждает Алису последовать в нору.
    tags:
      - talking-animal
      - anthropomorphic
      - guide

  - id: talking-mouse
    name: "Говорящая Мышь"
    type: animal
    description: >
      Мышь из Озера слёз, способная свободно разговаривать с Алисой, спорить
      с ней и рассказывать собственную историю.
    tags:
      - talking-animal
      - anthropomorphic

  - id: caucus-birds
    name: "Говорящие птицы Кавказской гонки"
    type: animal
    description: >
      Додо, Утка, Попугай Лори, Орлёнок и другие птицы, которые беседуют с
      Алисой как люди и вместе участвуют в Кавказской гонке.
    tags:
      - talking-animal
      - anthropomorphic
      - group

  - id: bill-the-lizard
    name: "Ящерка Билл"
    type: animal
    description: >
      Разговаривающая ящерка из свиты Белого Кролика. Её посылают в дымоход
      дома Кролика, после чего Алиса вышвыривает Билла наружу ударом ноги.
    tags:
      - talking-animal
      - anthropomorphic

  - id: pebble-cakes
    name: "Камешки-пирожки"
    type: substance
    description: >
      Камешки, брошенные в дом Белого Кролика, после падения на пол превращаются
      в маленькие пирожки. Съев один из них, Алиса немедленно уменьшается.
    tags:
      - transformation
      - size-change
      - enchanted-food

  - id: blue-caterpillar
    name: "Синяя Гусеница"
    type: animal
    description: >
      Большая синяя гусеница, курящая кальян и разговаривающая с Алисой.
      Именно она объясняет, что разные стороны гриба по-разному меняют рост.
    tags:
      - talking-animal
      - anthropomorphic
      - guide

  - id: caterpillars-mushroom
    name: "Гриб Синей Гусеницы"
    type: plant
    description: >
      Большой гриб, кусочки с разных сторон которого противоположно меняют рост
      Алисы: одна сторона делает её выше, другая — ниже.
    tags:
      - size-change
      - magical-plant
      - transformation

  - id: talking-pigeon
    name: "Говорящая Голубка"
    type: animal
    description: >
      Голубка, охраняющая гнездо и способная разговаривать с Алисой. Увидев её
      вытянутую грибом шею, птица принимает девочку за змею и вступает с ней в спор.
    tags:
      - talking-animal
      - anthropomorphic

  - id: fish-and-frog-footmen
    name: "Рыба-лакей и Лягушка-лакей"
    type: creature
    description: >
      Два антропоморфных лакея при доме Герцогини: один имеет рыбьи черты,
      другой — лягушачье лицо и глаза, при этом оба носят ливреи и разговаривают.
    tags:
      - hybrid
      - anthropomorphic
      - servant

  - id: baby-to-pig-transformation
    name: "Превращение ребёнка Герцогини в поросёнка"
    type: phenomenon
    description: >
      Постепенное превращение младенца Герцогини: его нос становится рыльцем,
      глаза уменьшаются, речь сменяется хрюканьем, и вскоре Алиса держит уже
      настоящего поросёнка, который убегает в лес.
    tags:
      - transformation
      - human-to-animal

  - id: cheshire-cat
    name: "Чеширский Кот"
    type: animal
    description: >
      Говорящий кот, способный появляться и исчезать по собственному желанию.
      Иногда он исчезает постепенно, оставляя после себя одну улыбку или голову
      без видимого тела.
    tags:
      - talking-animal
      - disappearance
      - supernatural-animal

  - id: march-hare
    name: "Мартовский Заяц"
    type: animal
    description: >
      Говорящий антропоморфный заяц, участвующий в бесконечном чаепитии вместе
      со Шляпником и Соней и рассуждающий как человек.
    tags:
      - talking-animal
      - anthropomorphic

  - id: dormouse
    name: "Соня"
    type: animal
    description: >
      Говорящая соня за столом безумного чаепития. Она разговаривает, рассказывает
      историю и даже продолжает петь и отвечать, находясь в полусне.
    tags:
      - talking-animal
      - anthropomorphic

  - id: animated-card-court
    name: "Живой карточный двор"
    type: creature
    description: >
      Король, Королева, Валет, солдаты, придворные, садовники и другие жители
      двора оказываются живыми игральными картами с руками, ногами, речью и
      человеческим общественным устройством.
    tags:
      - animated-object
      - playing-cards
      - anthropomorphic
      - group

  - id: tree-door-portal
    name: "Дверь-проход в дереве"
    type: artifact
    description: >
      Дверь, устроенная прямо в дереве в лесу. Войдя в неё, Алиса неожиданно
      возвращается в длинный зал с маленькой дверцей и стеклянным столиком,
      хотя перед этим находилась в другом месте Страны чудес.
    tags:
      - portal
      - spatial-magic
      - doorway

  - id: gryphon
    name: "Грифон"
    type: creature
    description: >
      Разумное говорящее мифическое существо, которое Королева посылает проводить
      Алису к Черепахе Квази и которое затем сопровождает её в дальнейших сценах.
    tags:
      - mythical-creature
      - talking-creature
      - guide

  - id: mock-turtle
    name: "Черепаха Квази"
    type: creature
    description: >
      Говорящее фантастическое существо, вспоминающее жизнь в подводной школе и
      утверждающее, что когда-то было настоящей черепахой.
    tags:
      - hybrid
      - talking-creature
      - sea-creature
