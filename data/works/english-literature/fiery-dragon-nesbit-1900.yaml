entities:
  - id: fiery-dragon
    name: "Огненный дракон"
    type: creature
    description: >
      Сверкающий дракон, который днём разрастается до размеров
      баржи, дышит огнём и пожирает животных, людей и сокровища.
      Ночью уменьшается до размера пальца и спит под корнем
      дерева. Даже заключённый в серебряную бутылку
      с печатью Соломона, с рассветом увеличивается
      и разрывает сосуд. Не может съесть принцессу
      с золотым сердцем и проникнуть в защищённую от
      драконов башню. В конце оказывается навечно
      заперт в морском водовороте и нагревает воду.
    tags:
      - dragon
      - fire-breathing
      - size-change
  - id: dragonproof-tower
    name: "Башня, защищённая от драконов"
    type: location
    description: >
      Башня, построенная святым Георгием для предков
      принцессы Сабринетты, не пропускает драконов.
      Дверь башни выдерживает нападение огненного
      дракона, а предметы из неё сохраняют
      драконоустойчивость. Поворот ключа девять раз
      в неправильном направлении открывает дверь.
    tags:
      - protective-magic
      - dragonproof
  - id: dragonproof-brass-bottle
    name: "Бутылка, защищённая от драконов"
    type: artifact
    description: >
      Латунная бутылка из башни Сабринетты, на которую
      распространяется защита от драконов. Ночью
      Эльфин помещает внутрь уменьшившегося дракона,
      закрывает горлышко пальцем и несёт сосуд
      к морскому обрыву. В отличие от серебряной
      охотничьей бутылки, латунная не лопается
      от жара чудовища, позволяя бросить его
      в водоворот.
    tags:
      - protective-artifact
      - dragonproof
  - id: sabrinettas-golden-heart
    name: "Золотое сердце Сабринетты"
    type: phenomenon
    description: >
      Нравственная чистота принцессы Сабринетты
      имеет в сказке буквальное сверхъестественное
      следствие: огненные драконы не могут съесть
      белую принцессу с золотым сердцем. Благодаря
      этой защите Сабринетта беспрепятственно
      проходит мимо чудовища, чтобы принести
      драконоустойчивую бутылку.
    tags:
      - moral-magic
      - dragon-immunity
  - id: princess-marriage-healing-charm
    name: "Исцеление ожогов дракона браком с принцессой"
    type: spell
    description: >
      Особое чудесное средство против ожогов
      драконьего огня: пострадавший мужчина
      исцеляется, женившись на принцессе.
      Когда Эльфин, обжёгший руки о бутылку
      с драконом, женится на Сабринетте,
      его руки мгновенно восстанавливаются.
      О другом способе — поцелуях семидесяти
      семи любящих людей — только рассказывают,
      но его не применяют.
    tags:
      - healing
      - marriage-magic
      - dragon-burn
