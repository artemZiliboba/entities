entities:
  - id: ice-dragon
    name: "Ледяной дракон"
    type: creature
    description: >
      Огромный крылатый дракон из прозрачного синего льда спит,
      обвившись вокруг Северного полюса. Мороз пробуждает
      его, а огонь ослабляет, вопреки ожиданиям гномов.
      Дракон говорит, движется по ледяной дороге, цепляясь
      хвостом за четвёртое измерение, и проглатывает
      двух охотников. Добравшись до более тёплых мест,
      полностью тает, оставив детей в луже воды.
    tags:
      - dragon
      - ice-creature
      - fourth-dimension
  - id: sealskin-dwarfs
    name: "Гномы из тюленьего меха"
    type: creature
    description: >
      Многочисленные маленькие существа, целиком состоящие
      из тюленьего меха, даже внутри. Разводят вокруг
      Северного полюса разноцветные огни и собираются
      пробудить дракона, чтобы он съел остальных людей.
      Хватают Джорджа и Джейн и привязывают их
      снежными жгутами к полюсу. Белые полярные моли
      поедают мех гномов, от чего те погибают.
    tags:
      - dwarf
      - sealskin
      - arctic
  - id: talking-white-grouse
    name: "Говорящий белый тетерев"
    type: animal
    description: >
      Белая полярная птица благодарит детей за спасение
      от охотника и разговаривает с ними человеческим
      языком. Позднее созывает множество белых птиц,
      которые укрывают замерзающих детей своими
      мягкими перьями и защищают их от гномов.
    tags:
      - talking-animal
      - grateful-helper
  - id: talking-arctic-moth
    name: "Говорящая арктическая моль"
    type: animal
    description: >
      Большая белая моль, которую дети выпускают из
      сачка коллекционера, умеет говорить. У Северного
      полюса она приводит несметное множество сородичей,
      которые съедают тюлений мех гномов и освобождают
      детей от их угрозы.
    tags:
      - talking-animal
      - grateful-helper
      - moth
  - id: north-pole-ice-slide
    name: "Ледяная дорога к Северному полюсу"
    type: location
    description: >
      Широкая гладкая ледяная дорога, освещённая звёздами,
      подвешенными на лунных лучах, тянется от зимних
      полей почти под Лондоном до Северного полюса.
      По ней Джордж и Джейн скользят с огромной скоростью
      на север; по тому же пути ледяной дракон
      доставляет их обратно на юг.
    tags:
      - enchanted-road
      - arctic
      - impossible-geography
