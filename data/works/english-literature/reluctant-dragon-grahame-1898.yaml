entities:
  - id: peaceful-blue-dragon
    name: "Миролюбивый синий дракон"
    type: creature
    description: >
      Огромный дракон с сине-зелёной чешуёй, когтями и шипастым
      хвостом живёт в пещере на холмах. Умеет говорить, сочинять
      стихи и рассказывать о давних временах, когда драконов
      было много. Хотя он способен выдыхать дым и пламя,
      предпочитает спокойную жизнь и не желает сражаться.
      По договорённости с мальчиком и святым Георгием
      изображает битву, в которой рыцарь поражает его
      копьём в заранее выбранное безболезненное место.
      После этого дракон мирно участвует в деревенском пире.
    tags:
      - dragon
      - fire-breathing
      - speech
      - peaceful-monster
