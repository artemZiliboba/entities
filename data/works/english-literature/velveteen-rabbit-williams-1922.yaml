entities:
  - id: velveteen-rabbit
    name: "Вельветовый кролик"
    type: character
    description: >
      Игрушечный кролик, умеющий думать, чувствовать и беседовать
      с другими игрушками и животными. Благодаря любви мальчика
      становится настоящим для него, но всё ещё остаётся
      набитой опилками игрушкой. Когда его собираются сжечь
      после болезни ребёнка, Фея детской комнаты переносит
      кролика в лес и превращает в живого зверька с мехом
      и настоящими задними лапами.
    tags:
      - living-toy
      - transformation
      - love
  - id: nursery-magic-fairy
    name: "Фея детской комнаты"
    type: creature
    description: >
      Фея появляется из необычного цветка, выросшего там,
      куда упала слеза Вельветового кролика. Она заботится
      об игрушках, которых любили дети, и когда те становятся
      старыми и больше не нужны, забирает их с собой.
      Поцелуем превращает кролика из плюшевой игрушки
      в настоящего живого зверька и переносит его в лес.
    tags:
      - fairy
      - transformation
      - toy-magic
  - id: skin-horse
    name: "Старый кожаный конь"
    type: character
    description: >
      Старая потрёпанная игрушечная лошадь, умеющая говорить
      и размышлять. Объясняет кролику, что любовь ребёнка
      постепенно делает игрушку настоящей, и рассказывает,
      что сам когда-то стал настоящим благодаря дяде мальчика.
      Не совершает превращений собственными силами.
    tags:
      - living-toy
      - nursery-magic
  - id: fairy-flower
    name: "Цветок, из которого появляется фея"
    type: plant
    description: >
      Неведомый цветок с изумрудно-зелёными листьями
      и золотистой чашечкой мгновенно вырастает из земли,
      куда падает слеза оставленного кролика.
      Его бутон раскрывается, и из него выходит
      Фея детской комнаты. Других свойств цветка
      в сказке не показано.
    tags:
      - miraculous-growth
      - fairy-appearance
