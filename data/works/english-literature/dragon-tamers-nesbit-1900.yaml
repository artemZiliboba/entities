entities:
  - id: iron-armored-dragon
    name: "Железнопанцирный дракон — предок кошек"
    type: creature
    description: >
      Огромный говорящий дракон с ржавыми железными пластинами
      на теле и крыльях, нуждающимися в починке кузнецом.
      Извергает огонь и дым, умеет громко мурлыкать и
      собирается съесть жителей города. Кузнец Джон
      запирает его в подземелье, а позднее дети Джонни
      и Тина дважды обманом убеждают дать себя приковать.
      Дракон побеждает пришедшего великана. Постепенно
      привыкнув к хлебу с молоком, становится ручным;
      его броня и крылья отпадают, появляется мех,
      и он превращается в огромного кота — первого
      представителя всех кошек по объяснению рассказчика.
    tags:
      - dragon
      - fire-breathing
      - talking-creature
      - transformation
      - origin-of-cats
  - id: lame-humped-giant
    name: "Хромой горбатый великан"
    type: creature
    description: >
      Огромный хромой горбатый великан приходит из болот
      к городским воротам, угрожая жителям. Он сражается
      с выпущенным из подземелья драконом и бьёт его
      громадной дубиной. Дракон побеждает, после чего
      великан отступает обратно в болота. Других
      сверхъестественных способностей, помимо
      великанского роста и силы, рассказ не показывает.
    tags:
      - giant
      - monster
      - great-strength
