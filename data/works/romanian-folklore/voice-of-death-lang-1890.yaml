id: voice-of-death-lang-1890
title: "Голос смерти"
original_title: "The Voice of Death"
kind: folktale
tradition:
  - romanian-folklore
collection: "The Red Fairy Book (Andrew Lang, 1890)"
source:
  title: "The Voice of Death, The Red Fairy Book, edited by Andrew Lang (1890)"
  url: "https://www.gutenberg.org/files/540/540-h/540-h.htm"
  note: "Полный текст отдельной сказки THE VOICE OF DEATH, от поисков страны без смерти до исчезновения пропасти. В примечании к сказке указано: Roumanian Tales from the German of Mite Thremnitz. Другие варианты не смешивались."
entities:
  - id: summons-of-death
    name: "Зов смерти"
    type: phenomenon
    description: >-
      Сверхъестественный зов в стране, жители которой не знают обычной смерти: время от времени он обращается к определённому человеку, и тот непреодолимо стремится последовать за ним, после чего исчезает. Местные жители утверждают, что слышат и видят зовущего, но рассказ не раскрывает его внешности и природы. Жена переселенца убегает на зов, несмотря на сопротивление мужа; позже сам муж слышит обращённый к нему голос и, пытаясь прогнать невидимого для окружающих зовущего, выбегает из города и падает в пропасть. Прямо названная сущность или самостоятельный бог смерти в тексте отсутствуют.
  - id: vanishing-death-chasm
    name: "Исчезающая пропасть"
    type: location
    description: >-
      Глубокая пропасть за городом, в которую падает мужчина, преследующий зов смерти. После этого люди узнают, что исчезавшие по зову жители, по-видимому, падали туда же, хотя пропасть никогда не наполнялась телами. Когда толпа приходит осмотреть её, на месте провала обнаруживается лишь обширная равнина, будто существовавшая здесь с начала мира. После исчезновения пропасти жители страны начинают умирать обычным образом.
