id: enchanted-pig-lang-red-1890
title: "Заколдованный свин"
original_title: "The Enchanted Pig"
kind: folktale
tradition:
  - romanian-folklore
collection: "The Red Fairy Book"
author: "Эндрю Лэнг (редактор); английский пересказ румынской сказки по Nite Kremnitz"
source:
  title: "Andrew Lang (ed.), The Red Fairy Book (1890), The Enchanted Pig; after Nite Kremnitz, Rumänische Märchen"
  url: "https://www.gutenberg.org/files/540/540-h/540-h.htm#chap09"
  note: "Полностью прочитана отдельная сказка The Enchanted Pig от заголовка до сноски о Rumänische Märchen Ните Кремниц в The Red Fairy Book (1890). Сюжетные детали иных румынских записей и пересказов не смешивались."
entities:
  - id: enchanted-prince
    name: "Заколдованный принц-свин"
    type: character
    description: >-
      Принц, которого мать убитого им дракона превратила в огромного говорящего свина. По ночам принимает человеческий облик, а днём вновь становится свином. Из-за уловки ведьмы его освобождение откладывается на три года. При встрече с женой в лесном доме сам превращается в голубя, чтобы избежать колдовства, а затем окончательно становится человеком.
  - id: dragon-mother-witch
    name: "Ведьма — мать дракона"
    type: character
    description: >-
      Мать младшего дракона, убитого принцем, мстит за сына и обращает его в свина. Позднее является жене принца под видом доброй старухи, обещает снять заклятие и даёт гнилую нить. Когда жена завязывает её на ноге мужа, нить рвётся и срок чар увеличивается на три года.
  - id: prophetic-book
    name: "Книга предсказанных браков"
    type: artifact
    description: >-
      Открытая книга в запретной дворцовой комнате точно предсказывает судьбу трёх королевских дочерей: старшая выйдет замуж за восточного принца, средняя — за западного, младшая — за свина с севера. Все три предсказания сбываются.
  - id: pig-transformation-curse
    name: "Заклятие свиного облика"
    type: spell
    description: >-
      Месть драконьей матери, превращающая принца в свина. Во время брака он может по ночам становиться человеком, но с рассветом вновь обретает звериный вид. Когда жена по совету ведьмы завязывает нить, освобождение откладывается ещё на три года. Чары прекращаются при воссоединении супругов.
  - id: moon
    name: "Одухотворённая Луна"
    type: character
    description: >-
      Небесное существо, живущее в отдельном доме и имеющее мать. Героиня приходит в дом Луны за сведениями о пропавшем муже, но Луна не может указать его местонахождение; её мать направляет путницу к Солнцу.
  - id: sun
    name: "Одухотворённое Солнце"
    type: character
    description: >-
      Небесное существо, проходящее от ворот рая утром к воротам смерти вечером. Его мать объясняет палящий дневной жар гневом Солнца из-за человеческих злодеяний. Оно замечает след чужого присутствия в своём доме, но не знает, где находится муж принцессы.
  - id: wind
    name: "Одухотворённый Ветер"
    type: character
    description: >-
      Небесное существо, обитающее в горной пещере со своей матерью. Его мать сообщает принцессе, что муж живёт в непроходимом лесу, и советует идти к нему по Млечному Пути. Сведения исходят от матери Ветра; самостоятельного появления самого Ветра в эпизоде не описано.
  - id: moon-mother
    name: "Мать Луны"
    type: character
    description: >-
      Сверхъестественная хозяйка дома Луны, которая приютит измождённую принцессу с новорождённым ребёнком. Не зная местонахождения мужа, советует искать помощи у Солнца и даёт жареную курицу, велев сохранить все косточки; впоследствии они пригодятся для чудесной лестницы.
  - id: sun-mother
    name: "Мать Солнца"
    type: character
    description: >-
      Сверхъестественная хозяйка солнечного дворца. Скрывает принцессу от сына, который не любит незваных гостей, расспрашивает Солнце о пропавшем муже и затем направляет героиню к Ветру. Даёт вторую жареную курицу с советом сохранить косточки.
  - id: wind-mother
    name: "Мать Ветра"
    type: character
    description: >-
      Сверхъестественная хозяйка пещеры Ветра, которая принимает изнурённую странницу и сообщает ей, где живёт заколдованный муж: в непроходимом лесу. Даёт третью жареную курицу и велит сохранить кости; позднее все собранные косточки образуют лестницу.
  - id: chicken-bone-ladder
    name: "Чудесная лестница из куриных косточек"
    type: artifact
    description: >-
      Кости трёх жареных кур, полученных от матерей Луны, Солнца и Ветра, соединяются сами собой, когда принцесса прикладывает их друг к другу. Из них она строит лестницу к двери под крышей дома мужа; недостающую последнюю перекладину заменяет отрезанным собственным мизинцем.
  - id: dragon-family
    name: "Драконы, разорявшие королевство"
    type: creature
    description: >-
      Семья драконов, с которыми воевал отец заколдованного принца. Принц убивает младшего дракона, после чего его мать-ведьма налагает на убийцу заклятие. Самостоятельные магические способности убитого дракона в сказке не описаны.
