id: ebony-horse-burton-1885
title: "Эбеновый конь"
original_title: "The Ebony Horse"
kind: folktale
tradition:
  - arabian-nights
collection: "The Book of the Thousand Nights and a Night, Volume V"
author: "Ричард Фрэнсис Бёртон (английский перевод, 1885)"
source:
  title: "Richard F. Burton, The Book of the Thousand Nights and a Night, vol. V (1885), tale 59, The Ebony Horse, nights 357–371"
  url: "https://www.gutenberg.org/files/3439/old/3439-h-2019-05.htm"
  note: "Полностью прочитан рассказ The Ebony Horse от заголовка до следующей истории Uns al-Wujud в переводе Бёртона (1885). Не смешивались отличающиеся пересказы Эндрю Лэнга и иные редакции."
entities:
  - id: golden-trumpeter
    name: "Золотой трубач — страж города"
    type: artifact
    description: >-
      Позолоченная фигура человека с золотой трубой, преподнесённая царю Сабуру индийским мастером. Если поставить её у городских ворот, при появлении неприятеля она трубит, после чего враг падает поражённым параличом и умирает. На испытании фигура действительно трубит; убийственное действие показано в рассказе как заявленное свойство, не проверенное на противнике.
  - id: golden-peacock-clock
    name: "Золотой павлин с двадцатью четырьмя птенцами"
    type: artifact
    description: >-
      Чудесный механизм греческого мастера: золотой павлин стоит в серебряной чаше среди двадцати четырёх золотых птенцов. Каждый час он клюёт очередного птенца, кричит и машет крыльями, а в конце месяца показывает в открытом клюве молодой месяц. На испытании павлин клюёт птенцов; показ месяца остаётся обещанным свойством.
  - id: ebony-flying-horse
    name: "Летающий эбеновый конь"
    type: artifact
    description: >-
      Деревянный конь персидского мастера, сделанный из чёрного эбенового дерева и украшенный золотом и камнями. С помощью винтов на плечах поднимается в воздух, опускается и переносит всадника на огромные расстояния; принц Камар аль-Акмар увозит на нём царевну Шамс ан-Нахар. В конце истории царь Сабур разбивает коня и уничтожает механизм его полёта.
