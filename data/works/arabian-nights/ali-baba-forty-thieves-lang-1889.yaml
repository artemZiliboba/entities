entities:
  - id: open-sesame-enchanted-cave-door
    name: "Волшебная дверь пещеры «Сезам, откройся!»"
    type: location
    description: >
      Скрытая в скалах дверь сокровищницы сорока разбойников.
      По произнесённым словам «Сезам, откройся!» она сама
      открывается, а по словам «Сезам, закройся!» закрывается.
      Али-Баба пользуется ею после того, как подслушивает
      атамана. Касим попадает внутрь, но не может выйти,
      потому что забывает нужное слово и безуспешно
      называет другие злаки. Сокровища внутри сами по себе
      не проявляют волшебных свойств.
    tags:
      - enchanted-door
      - spoken-password
      - hidden-treasury
