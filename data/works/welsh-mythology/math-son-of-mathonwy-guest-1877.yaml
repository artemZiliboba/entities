id: math-son-of-mathonwy-guest-1877
title: "Мат, сын Матонви"
original_title: "Math the Son of Mathonwy"
kind: myth
tradition:
  - welsh-mythology
collection: "The Mabinogion, Fourth Branch"
author: "Леди Шарлотта Гест (перевод; редакция 1877 года)"
source:
  title: "The Mabinogion (Guest 1877), Math the Son of Mathonwy, Fourth Branch"
  url: "https://en.wikisource.org/wiki/The_Mabinogion_(Guest_1877)/Math_the_Son_of_Mathonwy"
  note: "Полностью проверен текст четвёртой ветви в переводе Шарлотты Гест; параллельная доступная перепечатка: https://www.interfaith.org/ancient/celtic/mabinogion-4/ . Не смешивались события других ветвей и поздние варианты."
entities:
  - id: math
    name: "Мат, сын Матонви"
    type: character
    description: >-
      Правитель Гвинеда и могущественный чародей. Вне войны может жить лишь тогда, когда его ноги покоятся на коленях девы; слышит даже тихие разговоры, если их подхватывает ветер. Волшебным жезлом превращает Гвидиона и Гилвайтви в животных, а затем возвращает человеческий облик им и их детям. Вместе с Гвидионом создаёт Блодейвед из цветов.
  - id: gwydion
    name: "Гвидион, сын Дон"
    type: character
    description: >-
      Волшебник, создающий обманные подарки из грибов, изменяющий собственный облик и вызывающий иллюзию нападения кораблей. При помощи хитрости обходит запреты Арианрод для Ллеу; вместе с Матом создаёт цветочную деву. Находит Ллеу в облике орла, песнями приманивает его и ударом жезла возвращает человеческий вид. Превращает Блодейвед в сову.
  - id: gilfaethwy
    name: "Гилвайтви"
    type: character
    description: >-
      Брат Гвидиона, наказанный Матом за насилие над Гоэвин. Вместе с братом проводит по году в обликах оленя, дикого кабана и волка; каждый год у пары появляется детёныш. По окончании трёхлетнего наказания Мат возвращает братьям человеческий облик.
  - id: arianrhod
    name: "Арианрод"
    type: character
    description: >-
      Мать Дилана и Ллеу, которая после испытания волшебным жезлом Мата рождает двух детей. Налагает на Ллеу три действенных запрета: не получать имени иначе как от неё, не получать оружия иначе как от неё и не иметь жены из ныне живущих земных женщин. Гвидион обходит эти запреты с помощью уловок и волшебства.
  - id: dylan-son-of-the-wave
    name: "Дилан, сын Волны"
    type: character
    description: >-
      Сын Арианрод, который сразу после наречения погружается в море, обретает его природу и плавает лучше рыб; под ним никогда не разбивается волна. В тексте сообщается, что позднее его смертельно ранил дядя Гованнон.
  - id: lleu-llaw-gyffes
    name: "Ллеу Ллау Гифес"
    type: character
    description: >-
      Чудесно родившийся и необычайно быстро выросший сын Арианрод. Его можно поразить только специально изготовленным за год копьём, когда он стоит одной ногой на козле, а другой на краю котла под крышей у реки. После удара Грону превращается в орла; Гвидион возвращает ему человеческий облик. В конце Ллеу пронзает Грону дротиком сквозь каменную плиту.
  - id: blodeuwedd
    name: "Блодейвед"
    type: character
    description: >-
      Женщина, созданная Матом и Гвидионом из цветов дуба, ракитника и таволги как жена Ллеу. Позже сговаривается с Грону, узнаёт у мужа условия его уязвимости и устраивает нападение. Гвидион в наказание превращает её в сову, которой суждено избегать дневного света и преследования других птиц.
  - id: math-magic-wand
    name: "Волшебный жезл Мата"
    type: artifact
    description: >-
      Жезл, прикосновением которого Мат превращает Гвидиона и Гилвайтви в оленей, затем в диких кабанов и волков, а после возвращает человеческий облик им и их детям. Используется также для испытания Арианрод, после которого появляются её сыновья.
  - id: gwydion-magic-wand
    name: "Волшебный жезл Гвидиона"
    type: artifact
    description: >-
      Жезл Гвидиона, которым он касается раненого Ллеу в облике орла после трёх песен-призывов, возвращая ему человеческий облик. Текст не утверждает, что это тот же предмет, что жезл Мата.
  - id: gwydion-fungus-illusion
    name: "Обманные дары Гвидиона"
    type: spell
    description: >-
      Временное колдовство, при котором Гвидион создаёт из грибов видимость двенадцати богато снаряжённых коней, двенадцати борзых с золотыми поводками и двенадцати позолоченных щитов. Обменивает их у Придери на свиней из Аннуна; чары действуют лишь около суток.
  - id: math-animal-punishment
    name: "Трёхлетнее звериное наказание Мата"
    type: spell
    description: >-
      Наложенное Матом превращение братьев Гвидиона и Гилвайтви в пару оленей, затем кабанов и наконец волков. Они живут природой соответствующих зверей, каждый год возвращаются с детёнышем; Мат обращает детёнышей в людей и затем снимает наказание с братьев. Эффект моделируется отдельно как длительное последовательное заклятие.
  - id: arianrhod-three-destinies
    name: "Три запрета Арианрод"
    type: spell
    description: >-
      Три наложенных Арианрод условия судьбы её сына: он не получит имени, оружия и жены обычным путём. Гвидион добивается имени и оружия хитростью, а последнее ограничение обходит, создав вместе с Матом жену из цветов. Запреты представлены как один повторяющийся комплекс.
  - id: flower-wife-creation
    name: "Сотворение девы из цветов"
    type: spell
    description: >-
      Колдовство Мата и Гвидиона, при котором из цветков дуба, ракитника и таволги возникает девушка Блодейвед. Цветы служат материалом для сотворения, но не проявляют самостоятельных чудесных свойств.
  - id: gwydion-phantom-fleet
    name: "Призрачный флот Гвидиона"
    type: spell
    description: >-
      Иллюзия множества кораблей, воинских криков и звуков труб, созданная Гвидионом возле замка Арианрод. Из-за ложной угрозы она сама вооружает Ллеу, невольно нарушая свой запрет. Настоящей армии в эпизоде нет.
  - id: lleu-fatal-spear
    name: "Копьё для ранения Ллеу"
    type: artifact
    description: >-
      Особое копьё, которое Грону изготавливает целый год, работая над ним лишь во время воскресных жертвоприношений. Только таким оружием можно ранить почти неуязвимого Ллеу при строго определённом положении тела. Наконечник остаётся в ране, после чего Ллеу превращается в орла.
  - id: gwydion-eagle-songs
    name: "Три песни Гвидиона к орлу"
    type: spell
    description: >-
      Три последовательно исполненные Гвидионом строфы, обращённые к раненому Ллеу в облике орла на вершине дуба. После каждой птица спускается ниже, пока не садится на колено волшебника, позволяя ему вернуть Ллеу человеческий облик жезлом.
