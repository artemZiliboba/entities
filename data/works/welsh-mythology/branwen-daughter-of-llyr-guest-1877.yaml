id: branwen-daughter-of-llyr-guest-1877
title: "Бранвен, дочь Ллира"
original_title: "Branwen the Daughter of Llyr"
kind: myth
tradition:
  - welsh-mythology
collection: "The Mabinogion, Second Branch"
author: "Леди Шарлотта Гест (перевод)"
source:
  title: "Lady Charlotte Guest, The Mabinogion (1877), Branwen the Daughter of Llyr"
  url: "https://www.mysteriousbritain.co.uk/folklore/branwen-the-daughter-of-llyr/"
  note: "Полный английский текст второй ветви Мабиноги в переводе леди Шарлотты Гест (издание 1877 года); современная страница воспроизводит исторический перевод. Не смешивался с современными пересказами и редакторскими примечаниями."
entities:
  - id: bendigeid-vran
    name: "Бендигейд Вран"
    type: character
    description: >-
      Король Британии и великан столь огромного роста,
      что ни один дом или корабль не может его вместить.
      Во время похода в Ирландию переходит море пешком,
      а затем ложится поперёк реки и служит мостом
      своему войску. После смертельного ранения
      приказывает отсечь голову, которая ещё много
      лет остаётся нетленной и общается со спутниками.
    aliases:
      - "Бран Благословенный"
      - "Brân the Blessed"
    tags:
      - giant
      - king
  - id: cauldron-of-rebirth
    name: "Котёл возрождения"
    type: artifact
    description: >-
      Чудесный котёл, подаренный Браном королю
      Ирландии Матолуху. Если положить в него
      убитого воина, на следующий день тот
      оживёт и снова сможет сражаться,
      но навсегда утратит способность говорить.
      Во время битвы ирландцы возвращают
      павших с его помощью, пока Эвниссиен
      не разрывает котёл на четыре части,
      погибая при этом сам.
    aliases:
      - "Котёл обновления"
      - "Pair Dadeni"
    tags:
      - resurrection
      - enchanted-cauldron
  - id: llassar-llaesgyfnewid
    name: "Ллассар Ллаэсгивневид"
    type: character
    description: >-
      Великан с жёлтыми волосами, вышедший
      из Озера котла с чудесным сосудом
      на спине. Переживает попытку сжечь
      его семью в раскалённой железной
      палате: плечом проламывает
      раскалённую стену и бежит с женой.
      Позже передаёт котёл Брану.
    aliases:
      - "Llassar Llaesgyvnewid"
    tags:
      - giant
      - supernatural-survivor
  - id: kymideu-kymeinvoll
    name: "Кимидеу Кимейнволл"
    type: character
    description: >-
      Великанша, жена Ллассара, вдвое
      превосходящая мужа ростом.
      При появлении в Ирландии
      предсказывает рождение сына,
      который выйдет из утробы
      полностью вооружённым.
      Спасается вместе с мужем
      из раскалённой железной палаты.
    aliases:
      - "Kymideu Kymeinvoll"
    tags:
      - giantess
      - prophetic-birth
  - id: bran-living-head
    name: "Говорящая голова Брана"
    type: artifact
    description: >-
      Отсечённая голова Брана, которая
      после смерти великана остаётся
      нетленной и столь же приятной
      собеседницей, как при его жизни.
      Семь лет сопровождает спутников
      в Харлехе и ещё восемьдесят лет
      пребывает с ними на острове
      Гвалес. После захоронения
      на Белой горе, согласно рассказу,
      защищает Британию от вторжений
      с моря, пока её не откопают.
    tags:
      - speaking-head
      - incorruptibility
      - protective-relic
  - id: birds-of-rhiannon
    name: "Птицы Рианнон"
    type: creature
    description: >-
      Три чудесные птицы, поющие
      для спутников головы Брана
      в Харлехе. Их песня превосходит
      любую другую, а сами птицы,
      находясь далеко за морем,
      кажутся слышимыми так,
      словно сидят рядом.
    tags:
      - supernatural-birds
      - enchanted-song
  - id: caswallawn-veil-of-illusion
    name: "Покров невидимости Касваллауна"
    type: artifact
    description: >-
      Волшебный покров, которым
      Касваллаун закрывает себя
      во время убийства шести
      оставленных Браном правителей.
      Очевидцы видят меч, наносящий
      удары, но не видят человека,
      который держит оружие.
    aliases:
      - "Veil of Illusion"
    tags:
      - invisibility
      - enchanted-cloak
  - id: gwales-forgetting-hall
    name: "Зал забвения на Гвалесе"
    type: location
    description: >-
      Зал на острове Гвалес,
      где спутники головы Брана
      проводят восемьдесят лет
      в радости, не вспоминая
      утраты и почти не замечая
      течения времени. Когда
      открывают запрещённую дверь
      в сторону Корнуолла,
      память о горестях возвращается
      и чудесное пребывание
      заканчивается.
    tags:
      - enchanted-hall
      - forgetfulness
      - altered-time
