id: manawydan-son-of-llyr-guest
title: "Манавидан, сын Ллира"
original_title: "Manawyddan the Son of Llyr"
kind: myth
tradition:
  - welsh-mythology
collection: "The Mabinogion, Third Branch"
author: "Леди Шарлотта Гест (перевод)"
source:
  title: "The Mabinogion, Third Branch: Manawyddan the Son of Llyr, translated by Lady Charlotte Guest (1849)"
  url: "https://www.roman-britain.co.uk/classical-references/welsh-celtic-literature/four-branches-of-the-mabinogi/manawydan-son-of-llyr/"
  note: "Полный текст третьей ветви Мабиноги в историческом переводе леди Шарлотты Гест; от погребения головы Брана до снятия чар с Диведа. Персонажи и свойства из первой и второй ветвей не добавлены."
entities:
  - id: llwyd-son-of-kilcoed
    name: "Ллуид, сын Килкойда"
    type: character
    description: >-
      Могущественный чародей, наложивший заклятие
      на семь кантревов Диведа в отместку за
      унижение своего друга Гуаула. Он опустошает
      страну, заставляет исчезнуть крепость вместе
      с Рианнон и Придери, превращает придворных
      в мышей и сам является Манавидану под
      видом епископа. В конце снимает чары
      и возвращает пленников.
    aliases:
      - "Llwyd son of Kilcoed"
      - "Llwyd fab Cil Coed"
    tags:
      - sorcerer
      - shapeshifting
  - id: enchanted-dyfed
    name: "Заклятие семи кантревов Диведа"
    type: phenomenon
    description: >-
      Волшебное опустошение земли: после грома
      и густого тумана исчезают все люди,
      домашний скот и обитатели двора,
      кроме Манавидана, Рианнон, Придери
      и Кигвы. Состояние сохраняется
      годами, пока чародей Ллуид не
      отменяет заклятие по требованию
      Манавидана.
    tags:
      - enchanted-land
      - mass-disappearance
  - id: phantom-castle
    name: "Призрачная крепость в Диведе"
    type: location
    description: >-
      Огромная крепость, внезапно возникшая
      на месте, где прежде не было строений.
      В неё убегает белый вепрь, увлекая
      собак и Придери. Внутри находится
      зачарованная золотая чаша.
      Когда Рианнон тоже попадает
      в ловушку, с громом и туманом
      крепость исчезает вместе с обоими.
    tags:
      - illusion
      - vanishing-castle
  - id: golden-bowl-trap
    name: "Золотая чаша-ловушка"
    type: artifact
    description: >-
      Золотая чаша у фонтана
      внутри призрачной крепости.
      Когда Придери касается её,
      руки прилипают к чаше,
      ноги — к каменной плите,
      а речь пропадает. То же
      происходит с Рианнон,
      попытавшейся помочь сыну.
    tags:
      - enchanted-object
      - binding
      - muteness
  - id: transformed-mice-of-llwyd
    name: "Мыши — превращённые придворные Ллуида"
    type: creature
    description: >-
      Многочисленные придворные чародея,
      по его воле превращённые в мышей,
      чтобы уничтожать посевы Манавидана.
      Они дважды опустошают пшеничные поля,
      а на третью ночь приходят
      вместе с придворными дамами.
      Их истинная природа раскрывается
      лишь после поимки одной мыши.
    tags:
      - transformation
      - magical-swarm
  - id: llwyd-wife-mouse
    name: "Жена Ллуида в облике мыши"
    type: character
    description: >-
      Жена чародея Ллуида, превращённая
      им в мышь вместе с придворными
      дамами. Из-за беременности
      бежит медленнее остальных
      и попадает в руки Манавидана.
      Её освобождение становится
      предметом торга: за неё
      Ллуид снимает чары
      и возвращает пленников.
      После прикосновения жезла
      вновь принимает человеческий облик.
    tags:
      - shapeshifting
      - enchanted-hostage
  - id: llwyd-restoration-wand
    name: "Жезл возвращения облика"
    type: artifact
    description: >-
      Жезл чародея Ллуида,
      которым он касается
      освобождённой мыши.
      После прикосновения
      та немедленно становится
      прекрасной молодой женщиной,
      женой самого чародея.
      Других действий жезла
      рассказ не описывает.
    tags:
      - transformation
      - magic-wand
