id: gold-spinners-kreutzwald-lang-1889
title: "Кувшинка. Золотые пряхи"
original_title: "The Water-Lily. The Gold-Spinners"
kind: folktale
tradition:
  - estonian-folklore
author: "Фридрих Рейнхольд Крейцвальд; перевод Сильвии Хант"
collection: "The Blue Fairy Book (edited by Andrew Lang, 1889)"
source:
  title: "The Blue Fairy Book/The Gold-spinners, Wikisource"
  url: "https://en.wikisource.org/wiki/The_Blue_Fairy_Book/The_Gold-spinners"
  note: "Полный самостоятельный текст строк 123–191 Wikisource, The Water-Lily. The Gold-Spinners из The Blue Fairy Book (1889), Ф. Р. Крейцвальд, перевод Сильвии Хант. Другие эстонские варианты не смешивались."
entities:
  - id: gold-spinners-witch
    name: "Ведьма — хозяйка золотых прях"
    type: character
    description: >
      Похитив трёх принцесс в детстве, держит их в лесной хижине и заставляет прясть золотой лён, который сама получила превращением украденной серебряной утвари. Умеет заколдовывать соль и посылать с ветром губительный шар, превращающий младшую пленницу в кувшинку.
    tags:
      - witch
      - enchantment
  - id: witchs-magic-ball
    name: "Заколдованный шар ведьмы"
    type: artifact
    description: >
      Ведьма делает пушистый шар из девяти разновидностей паслёна и предварительно заколдованной соли, заворачивает в ткань и отправляет ветром вслед за беглецами. На мосту шар пугает коня, отчего девушка падает в реку и оказывается превращена в жёлтую кувшинку.
    tags:
      - curse
      - transformation
  - id: enchanted-water-lily-princess
    name: "Принцесса, превращённая в кувшинку"
    type: character
    description: >
      Младшая из трёх похищенных принцесс после нападения ведьминого шара живёт в реке в облике жёлтой кувшинки и поёт о своём заклятии. Остаётся в сознании и возвращается в человеческий облик, когда принц освобождает её корни и произносит слова финского волшебника.
    tags:
      - enchanted-person
      - plant-transformation
  - id: bird-speech-herb-cake
    name: "Лепёшка из волшебных трав"
    type: substance
    description: >
      Старшая из оставшихся сестёр готовит принцу лепёшку из волшебных трав. После того как он её съедает, ему снится, будто он понимает птиц, а наяву он действительно начинает разбирать их речь. Благодаря этому узнаёт о заклятии и получает помощь птиц.
    tags:
      - animal-language
      - enchanted-food
  - id: finnish-wizard
    name: "Старый финский волшебник"
    type: character
    description: >
      Знающий чары волшебник, который по просьбе короля прилетает на крыльях ветра и помогает больному принцу оправиться, советуя выйти на ветер. Позднее через орла передаёт точные слова превращения принца в краба и обратного превращения его и девушки-кувшинки.
    tags:
      - wizard
      - healing
      - spell-knowledge
  - id: crab-and-lily-restoration-words
    name: "Слова превращения в краба и освобождения кувшинки"
    type: spell
    description: >
      Переданные финским волшебником слова позволяют принцу, предварительно измазавшись илом, стать крабом, чтобы освободить корни заколдованной кувшинки. Возле рябины и большого камня другая формула возвращает крабу человеческий облик и превращает кувшинку обратно в девушку.
    tags:
      - transformation
      - counterspell
  - id: wind-wizards-son
    name: "Сын повелителя ветров"
    type: character
    description: >
      Живущий при королевском дворе сын волшебника ветра понимает язык птиц. Ворон передаёт ему сообщение похищенной девушки, и он сообщает его принцу, а затем передаёт птице ответ. Собственного управления ветром текст ему не приписывает.
    tags:
      - bird-language
      - magical-lineage
